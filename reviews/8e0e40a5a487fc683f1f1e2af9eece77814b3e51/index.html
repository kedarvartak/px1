/* Dark by default (neutral charcoal), light on request. Colour is spent only on what needs a person; everything else is neutral.
   Layout: top bar with verdict, left rail (queue + files), diff column with inline annotations, thin spine at the right edge. */
:root{
  --sans:'Report Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Report Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --canvas:#212121; --surface:#2a2a2a; --well:#303030; --line:#3a3a3a; --edge:#565656;
  --ink:#ececec; --dim:#b4b4b4; --faint:#8e8e8e;
  --brand:#ececec;
  --ok:#6fcf9d; --attention:#e6b05a; --attention-tint:#3a3122; --danger:#f08a80; --danger-tint:#3c2626;
  --add:#233229; --del:#3a2626;
  --note:#a3b4f7; --note-tint:#262b44;
  --ann:#191919;
  --fs-body:14px; --fs-small:12.5px; --fs-fine:11.5px; --fs-eyebrow:11px;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  color-scheme:dark;
}
/* Light is the alternate theme; dark is the default. */
:root[data-theme="light"]{
  --canvas:#e9e9e7; --surface:#f4f4f2; --well:#deded9; --line:#d2d2cd; --edge:#b4b4ae;
  --ink:#1c1c1b; --dim:#545450; --faint:#82827c;
  --brand:#2f2f2d;
  --ok:#2f6b4f; --attention:#8a5a14; --attention-tint:#efe3cb; --danger:#a1322c; --danger-tint:#f1d9d6;
  --add:#e3ebe4; --del:#ecdcd9;
  --note:#4658b5; --note-tint:#e4e8f8;
  --ann:#e2e2de;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:var(--fs-body)/1.5 var(--sans);margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
code,.mono{font-family:var(--mono);font-size:var(--fs-small)}
.eyebrow{font-size:var(--fs-eyebrow);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--dim)}

/* Slim scrollbar: floating pill thumb, no track, darkens on hover. */
*{scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:999px;border:3px solid transparent;background-clip:content-box;min-height:32px}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}
.fbody::-webkit-scrollbar{height:12px}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding:14px 16px;display:grid;gap:8px}
.brand{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--dim);font-size:var(--fs-small)}
.range{font-family:var(--mono);font-size:var(--fs-small)}
.range b{font-weight:500;color:var(--ink)}
.headline{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
h1{font:600 20px/1.3 var(--sans);margin:0;text-wrap:balance}
.verdict{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1.5px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap;background:var(--well);color:var(--dim);border:0}
.chip-note{background:var(--note-tint);color:var(--note)}
.chip-attention{background:var(--attention-tint);color:var(--attention)}
.chip-danger{background:var(--danger-tint);color:var(--danger)}
button.chip:hover{filter:brightness(1.12)}
.theme-btn{margin-left:auto;background:var(--well);border:1px solid var(--line);border-radius:999px;padding:1.5px 10px;font-size:12px;font-weight:500;color:var(--dim)}
.theme-btn:hover{border-color:var(--edge);color:var(--ink)}

.checks{border-top:1px solid var(--line);background:var(--canvas)}
.checks-in{max-width:1480px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px}
.checks-note{max-width:1480px;margin:0 auto;padding:10px 16px;color:var(--dim);font-size:var(--fs-small)}
.check{display:flex;gap:8px;align-items:baseline;font-size:var(--fs-small);min-width:0;color:inherit;text-decoration:none}
a.check:hover .name{text-decoration:underline}
.check .dot{flex:none;width:7px;height:7px;border-radius:50%;transform:translateY(-1px);background:var(--edge)}
.check .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check .st{margin-left:auto;color:var(--faint);flex:none}
.check.failed .dot{background:var(--danger)}.check.failed .st{color:var(--danger)}
.check.running .dot,.check.queued .dot{background:var(--attention)}

.wrap{position:relative;max-width:1480px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:var(--rail-w,288px) minmax(0,1fr) 10px;gap:24px;align-items:start}
.resize-handle{position:absolute;z-index:6;top:0;bottom:0;left:calc(16px + var(--rail-w,288px) + 4px);width:16px;cursor:col-resize;touch-action:none;display:flex;justify-content:center}
.resize-handle .grip{width:2px;height:100%;border-radius:2px;background:transparent;transition:background .15s}
.resize-handle:hover .grip,.resize-handle.active .grip,.resize-handle:focus-visible .grip{background:var(--edge)}
.resize-handle.active .grip{background:var(--faint)}
.resize-handle:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
.rail{position:sticky;top:var(--top-h,140px);max-height:calc(100vh - var(--top-h,140px) - 20px);overflow:auto;display:flex;flex-direction:column;gap:18px;padding-right:4px}
.rail section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.rail h2{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.rail h2 .count{font:400 var(--fs-fine) var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
.rail .empty{margin:0;color:var(--faint);font-size:var(--fs-small)}
.queue{list-style:none;margin:0;padding:0}
.qitem{display:grid;gap:2px;text-decoration:none;color:inherit;padding:8px 0;border-top:1px solid var(--line)}
.queue li:first-child .qitem{border-top:0;padding-top:2px}
.qitem .row{display:flex;gap:8px;align-items:center}
.qitem .t{font-size:13px;line-height:1.35;font-weight:500}
.qitem:hover .t{text-decoration:underline}
.qitem .w{font-family:var(--mono);font-size:var(--fs-fine);color:var(--faint);overflow-wrap:anywhere}
.qitem.done{opacity:.5}.qitem.done .t{text-decoration:line-through}
.seg{display:inline-flex;gap:10px;letter-spacing:0;text-transform:none}
.seg button{background:none;border:0;padding:0;font-size:var(--fs-small);font-weight:500;color:var(--faint)}
.seg button[aria-pressed="true"]{color:var(--brand)}
.files{list-style:none;margin:0;padding:0}
.file{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:6px 8px;margin:0 -8px;border-radius:var(--r-md);text-decoration:none;color:inherit;align-items:center}
.file:hover{background:var(--well)}
.file .p{font-family:var(--mono);font-size:var(--fs-small);overflow-wrap:anywhere}
.file .p b{font-weight:500}.file .p span{color:var(--faint)}
.file .m{display:flex;gap:4px}
.file .delta{grid-column:1/-1;font:var(--fs-fine) var(--mono);color:var(--faint)}
.mark{font:500 var(--fs-fine) var(--mono);padding:0 6px;border-radius:999px;background:var(--well);color:var(--dim)}
.mark.n{background:var(--note-tint);color:var(--note)}
.mark.r{background:var(--danger-tint);color:var(--danger)}.mark.a{background:var(--attention-tint);color:var(--attention)}

.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.fsec{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);scroll-margin-top:calc(var(--top-h,140px) + 56px);overflow:clip}
.fhead{position:sticky;top:var(--top-h,140px);z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.fhead .path{font:500 13px var(--mono);overflow-wrap:anywhere}
.fhead .spacer{flex:1}
.fbody{overflow-x:auto}
.fbody pre{margin:0;padding:12px 16px;font:var(--fs-small)/1.6 var(--mono)}
.fbody .none{margin:0;padding:12px 16px;color:var(--faint)}
.hunk{min-width:max-content}
.hh{padding:4px 16px;font:var(--fs-small) var(--mono);color:var(--faint);background:var(--canvas);border-bottom:1px solid var(--line)}
.ln{display:grid;grid-template-columns:46px 46px 20px 1fr;font:var(--fs-small)/1.6 var(--mono)}
.ln .g{padding:0 8px;text-align:right;color:var(--faint);user-select:none}
.ln .mk{text-align:center;color:var(--faint);user-select:none}
.ln .c{padding:0 16px 0 4px;white-space:pre}
.ln.added{background:var(--add)}.ln.removed{background:var(--del)}

.ann{margin:0;padding:10px 16px 12px calc(46px + 46px + 20px + 4px);border-block:1px solid var(--line);background:var(--ann);position:sticky;left:0;width:100%;min-width:0;scroll-margin-top:calc(var(--top-h,140px) + 76px);font-family:var(--sans);white-space:normal}
.ann.note{padding-top:0;padding-bottom:0}
.ann.note.filelevel{padding-block:10px}
.note-head{display:flex;gap:10px;align-items:center;width:100%;margin:0;padding:7px 0;background:none;border:0;text-align:left;color:var(--ink)}
.note-head:hover .note-title{text-decoration:underline}
.note-glyph{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;background:var(--note-tint);color:var(--note);font-size:11px;line-height:1}
.note-title{font-weight:500;min-width:0;overflow-wrap:anywhere}
.note-range{margin-left:auto;flex:none;font:var(--fs-fine) var(--mono);color:var(--faint)}
.note-caret{flex:none;width:7px;height:7px;border:solid var(--faint);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.note-head[aria-expanded="true"] .note-caret{transform:rotate(-135deg)}
.note-body{padding:0 0 12px 30px}
.note-body p{margin:0 0 6px;max-width:68ch;color:var(--dim)}
.ann.filelevel{padding-left:16px;border-top:0}
.ann-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ann-title{font-weight:600}
.ann p{margin:4px 0 0;max-width:68ch;color:var(--dim)}
.ann .ev{display:block;margin-top:7px;padding:4px 9px;background:var(--well);border-radius:var(--r-sm);width:fit-content;max-width:100%;overflow-x:auto;white-space:pre}
.ann .src{color:var(--faint);font-size:var(--fs-small)}
.ann .act{margin-left:auto}
.ann.done{opacity:.6}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:2px 10px;font-size:var(--fs-small);font-weight:500}
.btn:hover{border-color:var(--edge)}
.btn[aria-pressed="true"]{color:var(--ok)}

.spine{position:sticky;top:var(--top-h,140px);height:calc(100vh - var(--top-h,140px) - 20px);border-radius:var(--r-sm);background:var(--well);overflow:hidden}
.spine a{position:absolute;left:0;right:0;height:4px}
.spine a{background:var(--edge)}
.spine .thumb{position:absolute;left:0;right:0;border-block:1px solid var(--dim);pointer-events:none}

.foot{max-width:1480px;margin:0 auto;padding:6px 16px 40px;color:var(--faint);font-size:var(--fs-small)}
.noscript{padding:24px 16px}

@media (max-width:1000px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .resize-handle{display:none}
  .spine{display:none}
  .rail{position:static;max-height:none;padding:0}
  .fhead{top:auto;position:static}
  .top{position:static}
  .ann{padding-left:16px;width:100%}
  .ln{grid-template-columns:36px 36px 18px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

 b/AGENT.md\nindex 5cca5e9..ad286f4 100644\n--- a/AGENT.md\n+++ b/AGENT.md\n@@ -1,13 +1,15 @@\n-# Operational Guidelines for AI Agents\n+# Agent guidance\n \n-All operational instructions, architectural tenets, documentation maintenance requirements, and codebase mappings for AI coding agents have been consolidated under the [`docs/agents/`](docs/agents/README.md) directory.\n+px1 has one product flow: GitHub Actions generates a commit-pinned static\n+review artifact, GitHub Pages serves it, and a PR comment links to it.\n \n-## Quick Reference\n+Keep changes inside that boundary. Do not reintroduce a local server, workspace\n+browser, mutable review sessions, agent editing, self-hosted imports, accounts,\n+or hosted application state.\n \n-- Comprehensive Guidelines: See [`docs/agents/README.md`](docs/agents/README.md) for:\n-  1. Product direction: PR review reports with diffs, concise explanations beside code blocks, and repository-defined team rules. See [the product vision](docs/PRODUCT_VISION.md).\n-  1. Mandatory Documentation Maintenance Matrix: Protocols for keeping documentation in sync whenever code is changed.\n-  1. Pre-Commit Verification Checklist: Test suites, web bundling, and architecture synchronization.\n-  1. Frontend Architecture \u0026 Code Map: Section index of `web/index.html` and ES module catalog of `web/src/`.\n-- Internal Architecture Documentation: See [`docs/internals/README.md`](docs/internals/README.md) for deep-dive technical write-ups covering server lifecycle, indexing, fuzzy matching, search, syntax highlighting, DOM virtualization, and LSP.\n-- Pull requests: Every agent-authored PR must use the repository template in [`.github/pull_request_template.md`](.github/pull_request_template.md).\n+Every product change should preserve explicit base/head identity, avoid\n+executing PR code, and keep approval in GitHub. Update the README, product\n+vision, roadmap, contracts, and fixture tests when behavior changes.\n+\n+Before opening a ld the binary\n-\n-```bash\n-go build -o px1 .\n-```\n-\n-### 2. Fetch the standard corpus\n-\n-Clones shallow copies (`--depth 1`) of seven diverse open-source repositories:\n-\n-```bash\n-./benchmark.sh --clone\n-```\n-\n-### 3. Execute benchmark suite\n-\n-Spawns an isolated px1 server process per repository, records metrics, and terminates the instance:\n-\n-```bash\n-./benchmark.sh\n-```\n-\n-## 3. Benchmark Corpus\n-\n-The seven repositories were chosen to span two orders of magnitude in size and represent diverse language ecosystems:\n-\n-| Repository                                            | Primary Language | Character / Role in Benchmark                                  |\n-| ----------------------------------------------------- | ---------------- | -------------------------------------------------------------- |\n-| [flask](https://github.com/pallets/flask)             | Python           | Compact library: tests instant sub-millisecond path.           |\n-| [redis](https://github.com/redis/redis)               | C                | Medium-sized C codebase with large monolithic source files.    |\n-| [react](https://github.com/facebook/react)             | JavaScript       | Deep directory nesting and many nested `.gitignore` files.     |\n-| [django](https://github.com/django/django)           | Python           | Large framework with thousands of modules and test suites.     |\n-| [TypeScript](https://github.com/microsoft/TypeScript) | TypeScript       | Very large source files with a massive generated baseline tree.|\n-| [kubernetes](https://github.com/kubernetes/kubernetes)| Go               | Large Go monorepo with extensive vendored code.                |\n-| [linux](https://github.com/torvalds/linux)            | C                | The extreme case: ~95,000 files and 1.8 GB of source text.     |\n-\n-## 4. Benchmark Results\n-\n-Measured on Linux x86_64 with language servers disabled (`-no-lsp`):\n-\n-| Repo       | Source Size | Files  | Index  | Fuzzy   | Full Scan | Open Big | Reopen | Base Mem | Peak Mem |\n-| ---------- | ----------- | ------ | ------ | ------- | --------- | -------- | ------ | -------- | -------- |\n-| django     | 74 MB       | 7,014  | 39 ms  | 1.3 ms  | 26.8 ms   | 166.8 ms | 1.0 ms | 20 MB    | 29 MB    |\n-| flask      | 3 MB        | 235    | 1 ms   | 0.8 ms  | 2.3 ms    | n/a      | n/a    | 16 MB    | 18 MB    |\n-| kubernetes | 370 MB      | 25,926 | 150 ms | 13.5 ms | 84.6 ms   | 199.0 ms | 0.9 ms | 30 MB    | 44 MB    |\n-| linux      | 1,809 MB    | 95,710 | 370 ms | 6.0 ms  | 451.8 ms  | 26.7 ms  | 0.6 ms | 55 MB    | 73 MB    |\n-| react      | 63 MB       | 7,178  | 52 ms  | 2.7 ms  | 32.2 ms   | 57.7 ms  | 0.7 ms | 21 MB    | 28 MB    |\n-| redis      | 26 MB       | 1,855  | 13 ms  | 1.0 ms  | 18.2 ms   | 80.8 ms  | 1.2 ms | 17 MB    | 27 MB    |\n-| typescript | 414 MB      | 66,533 | 566 ms | 6.2 ms  | 150.3 ms  | 40.9 ms  | 6.5 ms | 69 MB    | 105 MB   |\n-\n-### Metric Descriptions\n-\n-- `Source`: Total working tree size (excluding `.git`).\n-- `Files`: Number of indexed files after applying `.gitignore` and built-in rules.\n-- `Index`: Cold startup directory walk and ignore set construction time.\n-- `Fuzzy`: Time to fuzzy-match a query across every indexed path.\n-- `Full Scan`: Literal search for a term that matches nothing (worst-case full codebase scan reading every byte).\n-- `Open Big`: Cold open of the largest source file: read, tokenize viewport window, return HTML.\n-- `Reopen`: Opening the same file once cached in memory.\n-- `Base Mem`: Resident memory (RSS) after indexing.\n-- `Peak Mem`: Peak memory during aggressive search and navigation prior to idle scavenging.\n-\n-## 5. px1 vs. Editors Comparison\n-\n-Side-by-side comparison on identical Linux hardware across px1 and several other IDE/Editors, focusing on architectural weight and responsiveness constraints:\n-\n-### Multi-Editor Benchmark Matrix\n-\n-| Editor / Configuration | Memory (RSS) | Time to Open | Time to First Interaction | Process Architecture |\n-| :--- | :--- | :--- | :--- | :--- |\n-| **px1** | **~15 - 18 MB** | **~10 ms** | **~15 ms** | 1 process (native Go) |\n-| **Vim** (clean terminal) | ~10 - 15 MB | ~15 ms | ~15 ms | 1 process |\n-| **Neovim** (clean terminal) | ~10 - 20 MB | ~150 ms | ~150 ms | 1 process |\n-| **Zed** (running workspace) | ~200 - 450 MB | *GUI dependent* | ~300 - 600 ms | 1-3 processes (Rust) |\n-| **Sublime Text** (running) | ~100 - 250 MB | *GUI dependent* | ~250 - 500 ms | 2-4 processes (C++) |\n-| **VS Code** (active extensions) | ~1,100 - 1,440 MB| ~3.0 - 5.0 s | ~6.0 - 10.0 s | 12 - 15+ processes |\n-\n-*Note: CLI editors (Vim/Neovim) do not provide inline LSP out-of-the-box (like px1 does) without extra processes. Zed and Sublime Text were evaluated as active running GUI configurations. px1 serves a full workspace complete with instantaneous indexing natively in sub-20 Megabytes.*\n-\n-### Measured VS Code Process Tree Breakdown (Baseline Contrast)\n-\n-VS Code's Electron-based standard serves as a useful baseline for modern IDE abstraction costs. Measuring its process footprint highlights how heavy typical environments become:\n-\n-```text\n-PID     Role / Component                 RSS (MB)   CPU %\n-388357  Extension Host                   345.5 MB   4.0%\n-388724  Language Server (Pyrefly)        288.4 MB   0.0%\n-388075  VS Code Server Main              146.1 MB   0.0%\n-388113  File Watcher                     67.9 MB    0.0%\n-388089  IPC / Socket Proxy               64.7 MB    0.0%\n-388715  LSP: JSON Language Server        63.0 MB    0.0%\n-388697  PTY Host (Terminal)              62.8 MB    0.0%\n-...\n-```\n-\n-In contrast, px1 embeds real-time indexing, fuzzy search, syntax highlighting, language-routing, and server endpoints inside a single, zero-dependency native process.\n-\n-## 6. Memory Scavenging Verification\n-\n-To observe resident memory scavenging in real time, run:\n-\n-```bash\n-./benchmark.sh --memory bench-repos/linux\n-```\n-\n-```text\n-### linux\n-  after indexing                     59 MB\n-  after a fuzzy find                 59 MB\n-  after 5 full-tree searches         85 MB\n-  after opening the largest file     88 MB\n-  after scrolling through it         94 MB\n-  8 seconds idle                     94 MB\n-  30 seconds idle                    57 MB\n-```\n-\n-After 15 seconds of inactivity, px1 triggers `debug.FreeOSMemory()`, returning unused heap pages back to the Linux kernel and settling back to baseline.\n","hunks":[{"id":"diff-6997905f3b657915","header":"@@ -1,130 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Performance Benchmarks \u0026 Methodology"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document outlines how px1 measures performance, documents its scores across real-world repositories, and breaks down comparative resource consumption against VS Code."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. Requirements"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"- Go 1.24+: To build the target binary."},{"oldLine":8,"kind":"removed","text":"- Git: Required only for `--clone`."},{"oldLine":9,"kind":"removed","text":"- System Utilities: `curl`, `awk`, `find`, `du` (standard on Linux and macOS)."},{"oldLine":10,"kind":"removed","text":"- Disk Space: ~3 GB for the standard multi-repository corpus."},{"oldLine":11,"kind":"removed","text":"- Memory Measurements: Read via `/proc`, supported natively on Linux (other metrics function cross-platform)."},{"oldLine":12,"kind":"removed","text":""},{"oldLine":13,"kind":"removed","text":"## 2. Running Benchmarks"},{"oldLine":14,"kind":"removed","text":"### 1. Build the binary"},{"oldLine":15,"kind":"removed","text":""},{"oldLine":16,"kind":"removed","text":"```bash"},{"oldLine":17,"kind":"removed","text":"go build -o px1 ."},{"oldLine":18,"kind":"removed","text":"```"},{"o e with large monolithic source files.    |"},{"oldLine":44,"kind":"removed","text":"| [react](https://github.com/facebook/react)             | JavaScript       | Deep directory nesting and many nested `.gitignore` files.     |"},{"oldLine":45,"kind":"removed","text":"| [django](https://github.com/django/django)           | Python           | Large framework with thousands of modules and test suites.     |"},{"oldLine":46,"kind":"removed","text":"| [TypeScript](https://github.com/microsoft/TypeScript) | TypeScript       | Very large source files with a massive generated baseline tree.|"},{"oldLine":47,"kind":"removed","text":"| [kubernetes](https://github.com/kubernetes/kubernetes)| Go               | Large Go monorepo with extensive vendored code.                |"},{"oldLine":48,"kind":"removed","text":"| [linux](https://github.com/torvalds/linux)            | C                | The extreme case: ~95,000 files and 1.8 GB of source text.     |"},{"oldLine":49,"kind":"removed","text":""},{"oldLine":50,"kind":"removed","text":"## 4. Benchmark Results"},{"oldLine":51,"kind":"removed","text":""},{"oldLine":52,"kind":"removed","text":"Measured on Linux x86_64 with language servers disabled (`-no-lsp`):"},{"oldLine":53,"kind":"removed","text":""},{"oldLine":54,"kind":"removed","text":"| Repo       | Source Size | Files  | Index  | Fuzzy   | Full Scan | Open Big | Reopen | Base Mem | Peak Mem |"},{"oldLine":55,"kind":"removed","text":"| ---------- | ----------- | ------ | ------ | ------- | --------- | -------- | ------ | -------- | -------- |"},{"oldLine":56,"kind":"removed","text":"| django     | 74 MB       | 7,014  | 39 ms  | 1.3 ms  | 26.8 ms   | 166.8 ms | 1.0 ms | 20 MB    | 29 MB    |"},{"oldLine":57,"kind":"removed","text":"| flask      | 3 MB        | 235    | 1 ms   | 0.8 ms  | 2.3 ms    | n/a      | n/a    | 16 MB    | 18 MB    |"},{"oldLine":58,"kind":"removed","text":"| kubernetes | 370 MB      | 25,926 | 150 ms | 13.5 ms | 84.6 ms   | 199.0 ms | 0.9 ms | 30 nux"},{"oldLine":121,"kind":"removed","text":"  after indexing                     59 MB"},{"oldLine":122,"kind":"removed","text":"  after a fuzzy find                 59 MB"},{"oldLine":123,"kind":"removed","text":"  after 5 full-tree searches         85 MB"},{"oldLine":124,"kind":"removed","text":"  after opening the largest file     88 MB"},{"oldLine":125,"kind":"removed","text":"  after scrolling through it         94 MB"},{"oldLine":126,"kind":"removed","text":"  8 seconds idle                     94 MB"},{"oldLine":127,"kind":"removed","text":"  30 seconds idle                    57 MB"},{"oldLine":128,"kind":"removed","text":"```"},{"oldLine":129,"kind":"removed","text":""},{"oldLine":130,"kind":"removed","text":"After 15 seconds of inactivity, px1 triggers `debug.FreeOSMemory()`, returning unused heap pages back to the Linux kernel and settling back to baseline."}]}]},{"path":"CONTRIBUTING.md","status":"M","diff":"diff --git a/CONTRIBUTING.md b/CONTRIBUTING.md\nindex 276423c..38d5781 100644\n--- a/CONTRIBUTING.md\n+++ b/CONTRIBUTING.md\n@@ -1,40 +1,38 @@\n # Contributing to px1\n \n-px1 helps reviewers understand agent-written PRs through an attached report.\n-The goal is clear diffs, short AI explanations beside highlighted code blocks,\n-and findings for team rules stored in the repository. See the\n-[product vision](docs/PRODUCT_VISION.md) for status and priorities.\n+px1 generates a static review artifact for GitHub pull requests. Changes should\n+help a reviewer understand a diff, verify a team rule, or trust the artifact's\n+identity and delivery.\n \n-## AI-Driven Development and Contributions\n+Before proposing work, read [the product vision](docs/PRODUCT_VISION.md). Local\n+editors, local review sessions, self-hosted services, and SaaS features are out\n+of scope.\n \n-px1 is built and maintained entirely using AI coding agents.\n+## Report a bug\n \n-Implementation is written by AI agents guided by the PR report workflow and\n-our engineering constraints. We generally do not accept unsolicited pull\n-requests containing manual or disparate code patches.\n+Use the bug template and include:\n \n-Instead, the most valuable contribution you can provide is a clear, detailed bug report or a well-reasoned feature idea.\n+- the affected PR or a minimal reproduction repository;\n+- the report head SHA;\n+- the relevant GitHub Actions run;\n+- expected and actual report behavior; and\n+- screenshots for visual issues.\n \n-## How to Contribute\n-### Report a Bug\n+Do not include repository secrets or private source in a public issue.\n \n-If you encounter unexpected behavior, memory leaks, navigation bugs, or performance issues:\n+## Propose an improvement\n \n-- Check existing [GitHub Issues](https://github.com/kedarvartak/px1/issues) first to avoid duplicates.\n-- Open a new issue using our [Bug Report Template](.github/ISSUE_TEMPLATE/bug_report.md).\n-- Provide comprehensive context: operating system, browser, workspace size, steps to reproduce, expected vs. observed behavior, logs, and screenshots if applicable.\n+Explain which review question becomes easier to answer and what evidence the\n+report should display. Prefer focused, testable behavior over a broad new\n+platform surface.\n \n-### Suggest a Feature or Improvement\n+## Validate a change\n \n-Have an idea that makes a PR easier to understand or a team-rule finding easier to verify?\n+```bash\n+go test ./...\n+go test -race ./...\n+go vet ./...\n+```\n \n-- Open a new issue using our [Feature Request Template](.github/ISSUE_TEMPLATE/feature_request.md).\n-- Explain how it helps a reviewer understand a change, check a rule, or reach a review decision.\n-\n-## Review and Implementation Process\n-\n-1. Review: Maintainers evaluate how the change improves the PR report and whether it stays simple and fast.\n-1. Assessment: We determine whether the proposal is apt, feasible, and aligned with the project roadmap.\n-1. Execution: If approved, we formulate prompt specifications and task plans, and our AI agents implement, test, benchmark, and release the changes.\n-\n-Thank you for helping make px1 better.\n+For renderer changes, also generate a report from a fixture repository and\n+inspect the resulting self-contained HTML.\n","hunks":[{"id":"diff-2865446d9b3e78f1","header":"@@ -1,40 +1,38 @@","lines":[{"oldLine":1,"newLine":1,"kind":"context","text":"# Contributing to px1"},{"oldLine":2,"newLine":2,"kind":"context","text":""},{"oldLine":3,"kind":"removed","text":"px1 helps reviewers understand agent-written PRs through an attached report."},{"oldLine":4,"kind":"removed","text":"The goal is clear diffs, short AI explanations beside highlighted code blocks,"},{"oldLine":5,"kind":"removed","text":"and findings for team rules stored in the repository. See the"},{"oldLine":6,"kind":"removed","text":"[product vision](docs/PRODUCT_VISION.md) for status and priorities."},{"newLine":3,"kind":"added","text":"px1 generates a static review artifact for GitHub pull requests. Changes should"},{"newLine":4,"kind":"added","text":"help a reviewer understand a diff, verify a team rule, or trust the artifact's"},{"newLine":5,"kind":"added","text":"identity and delivery."},{"oldLine":7,"newLine":6,"kind":"context","text":""},{"oldLine":8,"kind":"removed","text":"## AI-Driven Development and Contributions"},{"newLine":7,"kind":"added","text":"Before proposing work, read [the product vision](docs/PRODUCT_VISION.md). Local"},{"newLine":8,"kind":"added","text":"editors, local review sessions, self-hosted services, and SaaS features are out"},{"newLine":9,"kind":"added","text":"of scope."},{"oldLine":9,"newLine":10,"kind":"context","text":""},{"oldLine":10,"kind":"removed","text":"px1 is built and maintained entirely using AI coding agents."},{"newLine":11,"kind":"added","text":"## Report a bug"},{"oldLine":11,"newLine":12,"kind":"context","text":""},{"oldLine":12,"kind":"removed","text":"Implementation is written by AI agents guided by the PR re bash\n-# 1. Update VERSION file\n-echo \"0.2.0\" \u003e VERSION\n-\n-# 2. Bundle frontend assets and compile release binaries\n-make dist\n-\n-# 3. Commit version bump\n-git add VERSION\n-git commit -m \"Release v0.2.0\"\n-\n-# 4. Tag the release\n-git tag -fa v0.2.0 -m \"Release v0.2.0\"\n-\n-# 5. Push to GitHub\n-git push origin master\n-git push origin v0.2.0\n-```\n-\n-### Method 3: GitHub Actions Workflow Dispatch\n-\n-1. Navigate to Actions -\u003e Release on GitHub: `https://github.com/kedarvartak/px1/actions/workflows/release.yml`\n-1. Click Run workflow.\n-1. Enter the version tag (e.g. `v0.2.0`).\n-1. Trigger the workflow.\n-\n-## 4. npm Packages\n-\n-The release workflow publishes px1 to npm as well, so `npx px1-cli` runs the\n-version that was just tagged.\n-\n-The layout is the one esbuild uses: a wrapper package, `px1-cli`, that carries\n-the `px1` command, plus one package per platform (`px1-cli-linux-x64`,\n-`px1-cli-darwin-arm64`, …) holding nothing but the binary. Each platform package\n-declares its own `os` and `cpu`, so npm installs only the matching one and skips\n-the rest. Nothing is downloaded after install, which is what keeps px1 working\n-behind a proxy, from an offline cache, and under `npm ci --ignore-scripts`.\n-\n-- `scripts/build-npm.js` lays the packages out in `dist-npm/` from the binaries\n-  in `dist/`. `make npm` runs both steps.\n-- The workflow publishes the platform packages first, then the wrapper: npm\n-  rejects a version whose optional dependencies do not exist yet.\n-- A version already on the registry is skipped rather than failing, so a release\n-  can be re-run.\n-- `--provenance` links each package to the workflow run, which is why the job\n-  asks for `id-token: write`.\n-\n-To rehearse locally without publishing:\n-\n-```bash\n-make npm\n-cd dist-npm/px1-cli \u0026\u0026 npm pack            # inspect the tarball\n-npm install -g ./dist-npm/px1-cli-linux-x64 ./dist-npm/px1-cli\n-px1 --version\n-```\n-\n-## 5. Post-Release Verification\n-\n-1. Verify GitHub Actions workflow completion on the Actions tab.\n-1. Confirm artifacts on the [Releases](https://github.com/kedarvartak/px1/releases) page (cross-platform binaries and `checksums.txt`). The self-updater requires this file and verifies the selected binary against it before execution.\n-1. Verify the installer script:\n-  ```bash\n-  curl -fsSL https://raw.githubusercontent.com/kedarvartak/px1/master/install.sh | sh\n-  ```\n-1. Verify self-update functionality:\n-  ```bash\n-  px1 --update\n-  ```\n-1. Verify the npm packages:\n-  ```bash\n-  npx px1-cli@latest --version\n-  ```\n","hunks":[{"id":"diff-1f97e688b8e1c6ca","header":"@@ -1,127 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Publishing \u0026 Release Guide"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document outlines the step-by-step instructions for preparing, testing, and publishing a new release of `px1`."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. Prerequisites"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"Before cutting a new release, ensure you have:"},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"- Git with push and tag permissions for `kedarvartak/px1`."},{"oldLine":10,"kind":"removed","text":"- Go (version 1.24+)."},{"oldLine":11,"kind":"removed","text":"- Node.js (v18+ or v20+) or Bun for bundling frontend assets."},{"oldLine":12,"kind":"removed","text":"- A clean working tree with all tests passing."},{"oldLine":13,"kind":"removed","text":"- For npm publishing: an `NPM_TOKEN` repository secret (an npm automation token for"},{"oldLine":14,"kind":"removed","text":"  an account that owns `px1-cli` and the `px1-cli-*` platform packages). Without it"},{"oldLine":15,"kind":"removed","text":"  the release still publishes binaries; the npm step logs that it is skipping."},{"oldLine":16,"kind":"removed ":""},{"oldLine":103,"kind":"removed","text":"To rehearse locally without publishing:"},{"oldLine":104,"kind":"removed","text":""},{"oldLine":105,"kind":"removed","text":"```bash"},{"oldLine":106,"kind":"removed","text":"make npm"},{"oldLine":107,"kind":"removed","text":"cd dist-npm/px1-cli \u0026\u0026 npm pack            # inspect the tarball"},{"oldLine":108,"kind":"removed","text":"npm install -g ./dist-npm/px1-cli-linux-x64 ./dist-npm/px1-cli"},{"oldLine":109,"kind":"removed","text":"px1 --version"},{"oldLine":110,"kind":"removed","text":"```"},{"oldLine":111,"kind":"removed","text":""},{"oldLine":112,"kind":"removed","text":"## 5. Post-Release Verification"},{"oldLine":113,"kind":"removed","text":""},{"oldLine":114,"kind":"removed","text":"1. Verify GitHub Actions workflow completion on the Actions tab."},{"oldLine":115,"kind":"removed","text":"1. Confirm artifacts on the [Releases](https://github.com/kedarvartak/px1/releases) page (cross-platform binaries and `checksums.txt`). The self-updater requires this file and verifies the selected binary against it before execution."},{"oldLine":116,"kind":"removed","text":"1. Verify the installer script:"},{"oldLine":117,"kind":"removed","text":"  ```bash"},{"oldLine":118,"kind":"removed","text":"  curl -fsSL https://raw.githubusercontent.com/kedarvartak/px1/master/install.sh | sh"},{"oldLine":119,"kind":"removed","text":"  ```"},{"oldLine":120,"kind":"removed","text":"1. Verify self-update functionality:"},{"oldLine":121,"kind":"removed","text":"  ```bash"},{"oldLine":122,"kind":"removed","text":"  px1 --update"},{"oldLine":123,"kind":"removed","text":"  ```"},{"oldLine":124,"kind":"removed","text":"1. Verify the npm packages:"},{"oldLine":125,"kind":"removed","text":"  ```bash"},{"oldLine":126,"kind":"removed","text":"  npx px1-cli@latest --version"},{"oldLine":127,"kind":"removed","text":"  ```"}]}]},{"path":"README.md","status":"M","diff":"diff --git a/README.md b/README.md\nindex 2af8ed0..95d9a97 100644\n--- a/README.md\n+++ b/README.md\n@@ -1,191 +1,117 @@\n \u003cdiv align=\"center\"\u003e\n-  \u003cimg src=\"assets/px1-eclipse-orbital-banner.png\" alt=\"PX1 eclipse orbital banner\" width=\"100%\"\u003e\n-\u003c/div\u003e\n-\n-\u003cdiv align=\"center\"\u003e\n+  \u003cimg src=\"assets/px1-eclipse-orbital-banner.png\" alt=\"px1\" width=\"100%\"\u003e\n   \u003ch1\u003eUnderstand the PR before you approve it\u003c/h1\u003e\n \u003c/div\u003e\n \n-Agents write the PR. px1 helps reviewers understand it.\n-\n-px1 produces a commit-pinned HTML review report that can be attached to a\n-GitHub pull request. Reviewers get readable diffs, short explanations beside\n-changed code, trusted CI evidence, and highlights where changes break rules\n-stored in the repository.\n-\n-The core stays self-hosted and useful without an account, SaaS backend, or LLM\n-API key. Optional AI explanations help with understanding; reviewers still\n-make the decision.\n-\n-## How the review works\n-\n-1. **An agent opens or updates a PR.** Team rules live in `.px1/rules.json`.\n-2. **px1 generates a report.** The included GitHub Action publishes it through\n-   GitHub Pages and posts one sticky link on the PR.\n-3. **The reviewer opens the link.** Structured, line-numbered diff blocks show\n-   exactly what changed.\n-4. **Important context stands out.** Rule findings include nearby code, CI\n-   results are tied to the exact commit, and optional explanation chips clarify\n-   unfamiliar changes.\n-5. **The reviewer decides.** Findings can be acknowledged while reviewing;\n-   approval and change requests remain in GitHub.\n-\n-Every report belongs to an exact head commit, and older report links remain\n-available after a PR receives newer commits.\n-\n-## Team rules\n-\n-Teams keep review policy in `.px1/rules.json`. Current rules use file globs and\n-regular-expression patterns with readable messages. For example, a team can\n-flag direct `fetch` calls and explain that its shared API client must be used.\n-\n-This makes expectations versioned, visible, and repeatable. Broader semantic\n-understanding of arbitrary natural-language rules is planned; a pattern match\n-alone does not prove a semantic violation.\n-\n-## What is included\n-\n-- Commit-pinned static review export\n-- GitHub Pages publishing and a sticky PR link\n-- Structured highlighted diffs with old/new line numbers\n-- Contextual team-rule findings on added lines\n-- Exact-revision GitHub check summaries\n-- Explainable, model-free attention flags for high-review-risk changes\n-- Optional, provider-neutral AI explanation chips\n-- Browser-local finding acknowledgement scoped to the exact revision\n-- Historical SHA report retention\n-- Local task-baseline review, comments, patches, and hunk reverts\n-- File, symbol, and workspace search with Git-aware navigation\n-- Optional LSP navigation and review-provider handoff\n-- One local binary, no account, and no required code upload\n-\n-## Install\n-\n-The quickest install is through npm (Node 16+):\n-\n-```bash\n-npx px1-cli\n-npm install -g px1-cli\n+px1 turns every GitHub pull request into a commit-pinned review artifact.\n+\n+Push a PR. GitHub Actions generates a static report, publishes it through\n+GitHub Pages, and adds one link to the PR. The reviewer opens that link to see\n+readable diffs, concise explanations, CI context, risk signals, and violations\n+of rules stored in the repository.\n+\n+px1 does not host a SaaS, start a local application, edit code, or replace\n+GitHub review decisions. It creates context; approval and change requests stay\n+in GitHub.\n+\n+## What reviewers get\n+\n+- Structured, line-numbered diffs grouped into reviewable blocks\n+- Repository-specific findings from `.px1/rules.json`\n+- Exact-commit GitHub check results\n+- Deterministic attention signals for dependencies, authentication, schemas,\n+  configuration, generated code, deleted tests, permissions, large diffs, and\n+  public APIs\n+- Optional AI explanation chips generated in CI\n+- A report URL pinned to the PR head SHA\n+- Historical report links that remain valid after the PR changes\n+\n+## How it works\n+\n+```text\n+PR opened or updated\n+        ↓\n+GitHub Action reads the base and head commits\n+        ↓\n+px1 generates reviews/\u003chead-sha\u003e/index.html\n+        ↓\n+GitHub Pages publishes the report\n+        ↓\n+A sticky PR comment links the reviewer to it\n ```\n \n-The command is `px1`; the package downloads the platform binary and has no\n-runtime dependencies beyond Node. For a source build, use Go 1.25+ and Node for\n-the bundled web assets:\n+The workflow checks out trusted base-branch code and fetches the PR head only\n+as Git objects. px1 inspects the diff; it does not execute code from the PR.\n \n-```bash\n-git clone https://github.com/kedarvartak/px1.git\n-cd px1\n-make build\n-install -d ~/.local/bin \u0026\u0026 install px1 ~/.local/bin/\n-```\n+## Set up px1\n \n-## Use\n+1. Enable GitHub Pages with **GitHub Actions** as the source.\n+2. Copy [`examples/px1-review.yml`](examples/px1-review.yml) to\n+   `.github/workflows/px1-review.yml` in the repository you want reviewed.\n+3. Pin both px1 Action references in that file to a released major version.\n+4. Open or update a non-draft pull request.\n \n-```bash\n-px1                    # current workspace\n-px1 ~/src/project      # another workspace\n-px1 main.go:42         # open a file at a line\n-px1 -no-open -port 8080 /workspace\n+The workflow publishes:\n+\n+```text\n+https://\u003cowner\u003e.github.io/\u003crepository\u003e/reviews/\u003chead-sha\u003e/\n ```\n \n-### Export a static review report\n+and creates or updates one marked px1 comment on the PR.\n \n-Export a self-contained report from exact Git commits:\n+## Team rules\n \n-```bash\n-px1 export-review --base \"$BASE_SHA\" --head \"$HEAD_SHA\" --out ./site\n+Rules live at `.px1/rules.json` and change through normal code review:\n+\n+```json\n+{\n+  \"rules\": [\n+    {\n+      \"pattern\": \"\\\\bfetch\\\\(\",\n+      \"glob\": \"src/**/*.ts\",\n+      \"message\": \"Use the shared API client instead of fetch\"\n+    }\n+  ]\n+}\n ```\n \n-The exporter reads committed team rules and verification evidence, evaluates\n-added lines, runs the same attention rules as the local review on the two\n-commits, and writes `./site/index.html`. The page inlines its styles, script and\n-IBM Plex fonts (SIL OFL, see `static_report/fonts/OFL.txt`), so it makes no\n-network requests. It does not execute PR code, call\n-an LLM, require GitHub credentials, or start a server.\n-\n-Add `--snapshot-out ./snapshot.json` when CI also needs the versioned JSON\n-payload for a self-hosted import.\n-\n-CI may pass `--verification-file` with an exact-revision GitHub Actions report.\n-A local script or CI job may pass\n-`--explanations-file ./px1-explanations.json` to add expandable explanation\n-chips. See the [explanation JSON contract](docs/STATIC_REVIEW_EXPLANATIONS.md).\n-\n-The included workflow publishes reports at\n-`reviews/\u003chead-sha\u003e/index.html`, retains older revisions on the generated-only\n-`px1-review-reports` branch, and updates one PR comment with the current link.\n-\n-### Import into a self-hosted px1 server\n-\n-A self-hosted server can accept the same versioned report snapshot from CI.\n-Set `PX1_IMPORT_TOKEN` on the server, then send an authenticated JSON payload\n-to `POST /api/review/import`. Successful imports are available at the\n-commit-pinned `/github/\u003cowner\u003e/\u003crepo\u003e/pull/\u003cnumber\u003e?sha=\u003chead-sha\u003e` route.\n-\n-Imports are size-limited, strictly validated, stored outside the repository,\n-and immutable for a repository, PR, and head SHA. Set\n-`PX1_REVIEW_LINK_SECRET` as a separate server-side secret to make the returned\n-self-hosted review link HMAC-signed and reject unsigned links. See the\n-[self-hosted import contract](docs/SELF_HOSTED_REVIEW_IMPORT.md) for the JSON\n-shape and CI example. GitHub Pages links remain public static artifacts.\n-\n-## Local review loop\n-\n-Start a review from the Review panel before assigning an agent. px1 records the\n-task baseline, notices later edits, and includes files created or deleted after\n-the task starts. Reviewers can inspect changes, leave comments, ask a configured\n-provider to follow up, revert a hunk, and verify imported CI results. A bounded\n-local pass also calls out dependency, authentication, schema, configuration,\n-test deletion, generated-code, permission, large-diff, and public-API changes.\n-Every flag states the matching evidence, opens the diff, and can be dismissed\n-for the current session; it never blocks approval or claims a change is unsafe.\n-\n-For remote use, keep px1 on a private network such as Tailscale or WireGuard.\n-A request is local only when its connected peer and HTTP host are both\n-loopback. Everything else is read-only: it cannot change review state or\n-settings, patch files, run an agent, or start a language server. Patch, agent,\n-and check access are separate flags, and a remote flag does nothing\n-until `-remote-token` or `PX1_REMOTE_TOKEN` is set. The browser asks for that\n-token only when a remote capability is on. Loopback (`localhost` or `127.0.0.1`)\n-keeps local patch and agent access without the token.\n+Current rules match added lines using Go regular expressions and optional file\n+globs. A finding shows the rule, matching line, and nearby diff context. It is\n+a team convention, not a claim that the code is unsafe.\n \n-```bash\n-# Private network, read-only. A LAN IP or hostname cannot mutate state or start processes.\n-px1 -host 0.0.0.0 -port 7777 ~/work/repo\n-\n-# SSH tunnel. The browser talks to loopback, so this session has local write access.\n-ssh -L 7777:127.0.0.1:7777 user@host\n-px1 -host 127.0.0.1 -port 7777 ~/work/repo\n+## Optional explanations\n \n-# Remote patch only. Agent execution and checks stay off.\n-PX1_REMOTE_TOKEN='replace-with-a-random-secret' px1 -host 0.0.0.0 -allow-patch -port 7777 ~/work/repo\n-```\n+The generator accepts commit-pinned explanation JSON through\n+`explanations-file`. This keeps model credentials and generation inside CI;\n+the published page receives only validated explanation text. Reports remain\n+useful when no model or API key is configured.\n \n-Anyone who can open the URL can still read the workspace and imported reports.\n-The token authorizes only the capabilities you enabled, for that browser\n-session. Do not expose the server publicly. px1 does not execute verification\n-commands; `-allow-checks` only permits an attempt, which is refused because CI\n-results are imported instead.\n+See [the explanation contract](docs/STATIC_REVIEW_EXPLANATIONS.md) and\n+[verification contract](docs/VERIFICATION_REPORT.md).\n \n-## Performance\n+## Security model\n \n-px1 is built for large repositories. The included benchmark indexes the Linux\n-kernel corpus (95,710 files / 1.8 GB) in 370 ms with 55 MB RSS. See\n-[BENCHMARKS.md](BENCHMARKS.md) for methodology.\n+- Every report identifies full base and head commit SHAs.\n+- The supplied workflow never checks out or executes the PR head.\n+- Verification and explanation inputs must match the report head SHA.\n+- Historical storage accepts only regular\n+  `reviews/\u003c40-character-sha\u003e/index.html` files.\n+- The report is one static HTML file and makes no network requests.\n+- GitHub Pages reports are public unless the repository's Pages configuration\n+  provides access control. Do not publish sensitive private code publicly.\n \n ## Development\n \n ```bash\n-make test\n-go run . -dev . .\n-make dist\n+go test ./...\n+go test -race ./...\n+go run . export-review --base \u003cbase-sha\u003e --head \u003chead-sha\u003e --out ./site\n ```\n \n-See [CONTRIBUTING.md](CONTRIBUTING.md), the\n-[engineering documentation](docs/internals/README.md), the\n-[roadmap](ROADMAP.md), and [release instructions](PUBLISHING.md).\n+The product boundary and next work are documented in\n+[PRODUCT_VISION.md](docs/PRODUCT_VISION.md) and [ROADMAP.md](ROADMAP.md).\n \n ## License\n \n-[MIT](LICENSE) © 2026 Arpit Bhayani. px1 is a fork of\n+[MIT](LICENSE) © 2026 Arpit Bhayani. px1 began as a fork of\n [px0](https://github.com/px0-ai/px0); upstream notices are retained.\n","hunks":[{"id":"diff-2501d848b2e44af0","header":"@@ -1,191 +1,117 @@","lines":[{"oldLine":1,"newLine":1,"kind":"context","text":"\u003cdiv align=\"center\"\u003e"},{"oldLine":2,"kind":"removed","text":"  \u003cimg src=\"assets/px1-eclipse-orbital-banner.png\" alt=\"PX1 eclipse orbital banner\" width=\"100%\"\u003e"},{"oldLine":3,"kind":"removed","text":"\u003c/div\u003e"},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"\u003cdiv align=\"center\"\u003e"},{"newLine":2,"kind":"added","text":"  \u003cimg src=\"assets/px1-eclipse-orbital-banner.png\" alt=\"px1\" width=\"100%\"\u003e"},{"oldLine":6,"newLine":3,"kind":"context","text":"  \u003ch1\u003eUnderstand the PR before you approve it\u003c/h1\u003e"},{"oldLine":7,"newLine":4,"kind":"context","text":"\u003c/div\u003e"},{"oldLine":8,"newLine":5,"kind":"context","text":""},{"oldLine":9,"kind":"removed","text":"Agents write the PR. px1 helps reviewers understand it."},{"oldLine":10,"kind":"removed","text":""},{"oldLine":11,"kind":"removed","text":"px1 produces a commit-pinned HTML review report that can be attached to a"},{"oldLine":12,"kind":"removed","text":"GitHub pull request. Reviewers get readable diffs, short explanations beside"},{"oldLine":13,"kind":"removed","text":"changed code, trusted CI evidence, and highlights where changes break rules"},{"oldLine":14,"kind":"removed","text":"stored in the repository."},{"oldLine":15,"kind":"removed","text":""},{"oldLine":16,"kind":"removed","text":"The core stays self-hosted and useful without an account, SaaS backend, or LLM"},{"oldLine":17,"kind":"removed","text":"API key. Optional AI explanations help w st be used."},{"oldLine":41,"kind":"removed","text":""},{"oldLine":42,"kind":"removed","text":"This makes expectations versioned, visible, and repeatable. Broader semantic"},{"oldLine":43,"kind":"removed","text":"understanding of arbitrary natural-language rules is planned; a pattern match"},{"oldLine":44,"kind":"removed","text":"alone does not prove a semantic violation."},{"oldLine":45,"kind":"removed","text":""},{"oldLine":46,"kind":"removed","text":"## What is included"},{"oldLine":47,"kind":"removed","text":""},{"oldLine":48,"kind":"removed","text":"- Commit-pinned static review export"},{"oldLine":49,"kind":"removed","text":"- GitHub Pages publishing and a sticky PR link"},{"oldLine":50,"kind":"removed","text":"- Structured highlighted diffs with old/new line numbers"},{"oldLine":51,"kind":"removed","text":"- Contextual team-rule findings on added lines"},{"oldLine":52,"kind":"removed","text":"- Exact-revision GitHub check summaries"},{"oldLine":53,"kind":"removed","text":"- Explainable, model-free attention flags for high-review-risk changes"},{"oldLine":54,"kind":"removed","text":"- Optional, provider-neutral AI explanation chips"},{"oldLine":55,"kind":"removed","text":"- Browser-local finding acknowledgement scoped to the exact revision"},{"oldLine":56,"kind":"removed","text":"- Historical SHA report retention"},{"oldLine":57,"kind":"removed","text":"- Local task-baseline review, comments, patches, and hunk reverts"},{"oldLine":58,"kind":"removed","text":"- File, symbol, and workspace search with Git-aware navigation"},{"oldLine":59,"kind":"removed","text":"- Optional LSP navigation and review-provider handoff"},{"oldLine":60,"kind":"removed","text":"- One local binary, no account, and no required code upload"},{"oldLine":61,"kind":"removed","text":""},{"oldLine":62,"kind":"removed","text":"## Install"},{"oldLine":63,"kind":"removed","text":""},{"oldLine":64,"kind":"removed","text":"The quickest install is through npm (Node 16+):"},{"oldLine":65,"kind":"rem
