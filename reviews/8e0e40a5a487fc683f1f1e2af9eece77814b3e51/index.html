               | `$PATH`                    |\n-| Ruby              | `.rb`                        | `solargraph`                 | -               | `$PATH`, Gem bin           |\n-| Java              | `.java`                      | `jdtls`                      | -               | `$PATH`                    |\n-| C#                | `.cs`                        | `omnisharp`                  | -               | `$PATH`                    |\n-\n-## 3. Communication \u0026 Lifecycle Management\n-\n-Each active language server is managed by an `lspClient` struct:\n-\n-### Stdio JSON-RPC Transport\n-\n-- Communication occurs via standard input/output (`os/exec.Cmd.StdinPipe` and `StdoutPipe`).\n-- Messages conform to the Language Server Protocol (Content-Length delimited JSON-RPC).\n-- Responses are correlated using atomic sequence IDs.\n-\n-### Concurrency \u0026 Serialization\n-\n-- Requests are serialized through thread-safe channels.\n-- Operations that exceed time budgets (e.g., hanging server queries) are bounded by contexts (`context.WithTimeout`).\n-- Server initialization enforces a strict 30-second timeout.\n-\n-## 4. External Path Boundary Sandboxing (`extAllowed`)\n-\n-When a developer navigates code using Go-to-Definition (`F12`), the target definition often resides outside the workspace directory (e.g., standard library packages in `/usr/lib/go/src` or third-party dependencies in `~/.cargo/registry`).\n-\n-Allowing arbitrary filesystem reads would introduce path traversal vulnerabilities. px1 solves this with an In-Memory Target Allowlist:\n-\n-```mermaid\n-sequenceDiagram\n-    autonumber\n-    participant UI as Browser Client\n-    participant Server as px1 /api/lsp/def\n-    participant LSP as Language Server (gopls)\n-    participant FS as Host Filesystem\n-\n-    UI-\u003e\u003eServer: GET /api/lsp/def?path=main.go\u0026line=10\u0026col=15\n-    Server-\u003e\u003eLSP: textDocument/definition\n-    LSP--\u003e\u003eServer: file:///usr/lib/go/src/fmt/print.go:200\n-    Note over Server: Canonicalize path \u0026 verify it exists on disk\n-    Server-\u003e\u003eServer: extAllowed[\"/usr/lib/go/src/fmt/print.go\"] = true\n-    Server--\u003e\u003eUI: Return external target path\n-    UI-\u003e\u003eServer: GET /api/file?path=/usr/lib/go/src/fmt/print.go\n-    Server-\u003e\u003eServer: Check if path in extAllowed\n-    alt Allowed\n-        Server-\u003e\u003eFS: Read file \u0026 serve highlighted lines\n-    else Not in Allowlist\n-        Server--\u003e\u003eUI: 403 Forbidden (Path outside workspace)\n-    end\n-```\n-\n-- Target paths returned by the server are normalized and admitted into `extAllowed`.\n-- External files can be opened and inspected, but cannot be enumerated, searched, listed in the sidebar explorer tree, or edited with an agent.\n-\n-## 5. Stateless Call Hierarchy Trails ([`calls.go`](../../calls.go))\n-\n-px1 provides full incoming and outgoing call hierarchy navigation (`Calls` tab in the right inspector) without holding complex graph state in server memory.\n-\n-### Opaque Item Round-Tripping\n-\n-- The LSP specification identifies call hierarchy items with an implementation-specific `CallHierarchyItem` object.\n-- When expanding a function, the server sends this JSON object to the client browser.\n-- When the user clicks to expand a caller or callee, the browser sends the exact `CallHierarchyItem` back to `/api/lsp/calls`.\n-- Zero Server State: px1 maintains no in-memory graph trees; cost scales strictly with the nodes the user expands.\n-- Client-Side Cycle Detection: Recursive call loops are detected in JavaScript by checking ancestor node identifiers in the tree path.\n-\n-## 6. In-App Setup \u0026 One-Click Installers\n-\n-When reading a codebase without an installed language server, the status bar displays `LSP: set up`. Clicking it opens the interactive setup panel (`web/src/lspsetup.js`).\n-\n-### Security Validation (DNS-Rebinding Defense)\n-\n-Executing installation commands (e.g., `go install` or `npm install`) requires robust security precautions:\n-\n-1. `/api/lsp/install` accepts only `POST` requests.\n-1. The `Origin` header must exactly match the `Host` header.\n-1. The `Host` header must resolve strictly to `127.0.0.1`, `[::1]`, or `localhost`.\n-1. Commands are pulled strictly from the internal `lspRegistry`, and the client request cannot provide or modify the command string.\n","hunks":[{"id":"diff-2102145912758af9","header":"@@ -1,117 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Language Server Protocol (LSP) Architecture \u0026 Intelligence"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document details the architecture, lifecycle management, and security boundaries of px1's Language Server Protocol subsystem ([`lsp.go`](../../lsp.go), [`lspnav.go`](../../lspnav.go), [`lspservers.go`](../../lspservers.go), [`lspsetup.go`](../../lspsetup.go), and [`calls.go`](../../calls.go))."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. Zero-Cost Lazy Architecture"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"Traditional IDEs start multiple language server processes during project initialization, consuming hundreds of megabytes of RAM before the developer opens a single file."},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"px1 adopts a strictly Zero-Cost Lazy Architecture:"},{"oldLine":10,"kind":"removed","text":""},{"oldLine":11,"kind":"removed","text":"```mermaid"},{"oldLine":12,"kind":"removed","text":"stateDiagram-v2"},{"oldLine":13,"kind":"removed","text":"    [*] --\u003e Idle: Server Boot"},{"oldLine":14,"kind":"removed","text":"    Idle --\u003e Discovery: Background exec.LookPath across $PATH"},{"oldLine":15,"kind":"removed","text":"    Discovery --\u003e Registered: Servers detected (No processes spawned)"},{"oldLine":16,"kind":"removed","text":"    Registered --\u003e Spawning: First file request (e.g. open main.go)"},{"oldLine":17,"kind":"removed","text":"    Spawning --\u003e Ready: JSON-RPC Initialize \u0026 Initialized handshake (\u003c=30s)"},{"oldLine":18,"kind":"removed","text":"    Ready --\u003e Serving: Handle textDocument/definition, hover, refs"},{"oldLine":19,"kind":"removed","text":"    Serving --\u003e Serving: Subsequent requests reuse existing process"},{"oldLine":20,"kind":"removed","text":"    Serving --\u003e Stopped: Application Shutdown (Clean exit)"},{"oldLine":21,"kind":"removed","text":"```"},{"oldLine":22,"kind":"removed","text":""},{"oldLine":23,"kind":"removed","text":"### Key Principles"},{"oldLine":24,"kind":"removed","text":""},{"oldLine":25,"kind":"removed","text":"1. Zero Boot Overhead: During startup, px1 does not launch any language servers. It scans `$PATH` concurrently via `exec.LookPath` to identify which server binaries exist on the host system."},{"oldLine":26,"kind":"removed","text":"1. On-Demand Spawning: A language server process is launched only when the user opens or queries a file matching its registered file extensions."},{"oldLine":27,"kind":"removed","text":"1. Graceful Fallback: If a server is missing, crashes, or fails initialization, the system falls back to instant regex-based symbol definitions without displaying error dialogs."},{"oldLine":28,"kind":"removed","text":""},{"oldLine":29,"kind":"removed","text":"## 2. Server Registry \u0026 Extension Precedence"},{"oldLine":30,"kind":"removed","text":""},{"oldLine":31,"kind":"removed","text":"Language server definitions reside in [`lspservers.go`](../../lspservers.go). Multiple language servers can be registered for a given extension, evaluated in order of precedence:"},{"oldLine":32,"kind":"removed","text":""},{"oldLine":33,"kind":"removed","text":"| Language          | Extensions                   | Primary Server               | Fallback Server | Discovery Search Paths     |"},{"oldLine":34,"kind":"removed","text":"| ----------------- | ---------------------------- | ---------------------------- | --------------- | -------------------------- |"},{"oldLine":35,"kind":"removed","text":"| Go                | `.go`                        | `gopls`                      | -               | `$PATH`, `~/go/bin`        |"},{"oldLine":36,"kind":"removed","text":"| Rust              | `.rs`                        | `rust-analyzer`              | -               | `$PATH`, `~/.cargo/bin`    |"},{"oldLine":37,"kind":"removed","text":"| TypeScript / JS   | `.ts`, `.tsx`, `.js`, `.jsx` | `typescript-language-server` | -               | `$PATH`, npm global prefix |"},{"oldLine":38,"kind":"removed","text":"| Python            | `.py`                        | `pyright`                    | `pylsp`, `ruff` | `$PATH`, `~/.local/bin`    |"},{"oldLine":39,"kind":"removed","text":"| C / C++           | `.c`, `.cpp`, `.h`, `.hpp`   | `clangd`                     | -               | `$PATH`, Homebrew LLVM     |"},{"oldLine":40,"kind":"removed","text":"| Zig               | `.zig`                       | `zls`                        | -               | `$PATH`                    |"},{"oldLine":41,"kind":"removed","text":"| Lua               | `.lua`                       | `lua-language-server`        | -               | `$PATH`                    |"},{"oldLine":42,"kind":"removed","text":"| Ruby              | `.rb`                        | `solargraph`                 | -               | `$PATH`, Gem bin           |"},{"oldLine":43,"kind":"removed","text":"| Java              | `.java`                      | `jdtls`                      | -               | `$PATH`                    |"},{"oldLine":44,"kind":"removed","text":"| C#                | `.cs`                        | `omnisharp`                  | -               | `$PATH`                    |"},{"oldLine":45,"kind":"removed","text":""},{"oldLine":46,"kind":"removed","text":"## 3. Communication \u0026 Lifecycle Management"},{"oldLine":47,"kind":"removed","text":""},{"oldLine":48,"kind":"removed","text":"Each active language server is managed by an `lspClient` struct:"},{"oldLine":49,"kind":"removed","text":""},{"oldLine":50,"kind":"removed","text":"### Stdio JSON-RPC Transport"},{"oldLine":51,"kind":"removed","text":""},{"oldLine":52,"kind":"removed","text":"- Communication occurs via standard input/output (`os/exec.Cmd.StdinPipe` and `StdoutPipe`)."},{"oldLine":53,"kind":"removed","text":"- Messages conform to the Language Server Protocol (Content-Length delimited JSON-RPC)."},{"oldLine":54,"kind":"removed","text":"- Responses are correlated using atomic sequence IDs."},{"oldLine":55,"kind":"removed","text":""},{"oldLine":56,"kind":"removed","text":"### Concurrency \u0026 Serialization"},{"oldLine":57,"kind":"removed","text":""},{"oldLine":58,"kind":"removed","text":"- Requests are serialized through thread-safe channels."},{"oldLine":59,"kind":"removed","text":"- Operations that exceed time budgets (e.g., hanging server queries) are bounded by contexts (`context.WithTimeout`)."},{"oldLine":60,"kind":"removed","text":"- Server initialization enforces a strict 30-second timeout."},{"oldLine":61,"kind":"removed","text":""},{"oldLine":62,"kind":"removed","text":"## 4. External Path Boundary Sandboxing (`extAllowed`)"},{"oldLine":63,"kind":"removed","text":""},{"oldLine":64,"kind":"removed","text":"When a developer navigates code using Go-to-Definition (`F12`), the target definition often resides outside the workspace directory (e.g., standard library packages in `/usr/lib/go/src` or third-party dependencies in `~/.cargo/registry`)."},{"oldLine":65,"kind":"removed","text":""},{"oldLine":66,"kind":"removed","text":"Allowing arbitrary filesystem reads would introduce path traversal vulnerabilities. px1 solves this with an In-Memory Target Allowlist:"},{"oldLine":67,"kind":"removed","text":""},{"oldLine":68,"kind":"removed","text":"```mermaid"},{"oldLine":69,"kind":"removed","text":"sequenceDiagram"},{"oldLine":70,"kind":"removed","text":"    autonumber"},{"oldLine":71,"kind":"removed","text":"    participant UI as Browser Client"},{"oldLine":72,"kind":"removed","text":"    participant Server as px1 /api/lsp/def"},{"oldLine":73,"kind":"removed","text":"    participant LSP as Language Server (gopls)"},{"oldLine":74,"kind":"removed","text":"    participant FS as Host Filesystem"},{"oldLine":75,"kind":"removed","text":""},{"oldLine":76,"kind":"removed","text":"    UI-\u003e\u003eServer: GET /api/lsp/def?path=main.go\u0026line=10\u0026col=15"},{"oldLine":77,"kind":"removed","text":"    Server-\u003e\u003eLSP: textDocument/definition"},{"oldLine":78,"kind":"removed","text":"    LSP--\u003e\u003eServer: file:///usr/lib/go/src/fmt/print.go:200"},{"oldLine":79,"kind":"removed","text":"    Note over Server: Canonicalize path \u0026 verify it exists on disk"},{"oldLine":80,"kind":"removed","text":"    Server-\u003e\u003eServer: extAllowed[\"/usr/lib/go/src/fmt/print.go\"] = true"},{"oldLine":81,"kind":"removed","text":"    Server--\u003e\u003eUI: Return external target path"},{"oldLine":82,"kind":"removed","text":"    UI-\u003e\u003eServer: GET /api/file?path=/usr/lib/go/src/fmt/print.go"},{"oldLine":83,"kind":"removed","text":"    Server-\u003e\u003eServer: Check if path in extAllowed"},{"oldLine":84,"kind":"removed","text":"    alt Allowed"},{"oldLine":85,"kind":"removed","text":"        Server-\u003e\u003eFS: Read file \u0026 serve highlighted lines"},{"oldLine":86,"kind":"removed","text":"    else Not in Allowlist"},{"oldLine":87,"kind":"removed","text":"        Server--\u003e\u003eUI: 403 Forbidden (Path outside workspace)"},{"oldLine":88,"kind":"removed","text":"    end"},{"oldLine":89,"kind":"removed","text":"```"},{"oldLine":90,"kind":"removed","text":""},{"oldLine":91,"kind":"removed","text":"- Target paths returned by the server are normalized and admitted into `extAllowed`."},{"oldLine":92,"kind":"removed","text":"- External files can be opened and inspected, but cannot be enumerated, searched, listed in the sidebar explorer tree, or edited with an agent."},{"oldLine":93,"kind":"removed","text":""},{"oldLine":94,"kind":"removed","text":"## 5. Stateless Call Hierarchy Trails ([`calls.go`](../../calls.go))"},{"oldLine":95,"kind":"removed","text":""},{"oldLine":96,"kind":"removed","text":"px1 provides full incoming and outgoing call hierarchy navigation (`Calls` tab in the right inspector) without holding complex graph state in server memory."},{"oldLine":97,"kind":"removed","text":""},{"oldLine":98,"kind":"removed","text":"### Opaque Item Round-Tripping"},{"oldLine":99,"kind":"removed","text":""},{"oldLine":100,"kind":"removed","text":"- The LSP specification identifies call hierarchy items with an implementation-specific `CallHierarchyItem` object."},{"oldLine":101,"kind":"removed","text":"- When expanding a function, the server sends this JSON object to the client browser."},{"oldLine":102,"kind":"removed","text":"- When the user clicks to expand a caller or callee, the browser sends the exact `CallHierarchyItem` back to `/api/lsp/calls`."},{"oldLine":103,"kind":"removed","text":"- Zero Server State: px1 maintains no in-memory graph trees; cost scales strictly with the nodes the user expands."},{"oldLine":104,"kind":"removed","text":"- Client-Side Cycle Detection: Recursive call loops are detected in JavaScript by checking ancestor node identifiers in the tree path."},{"oldLine":105,"kind":"removed","text":""},{"oldLine":106,"kind":"removed","text":"## 6. In-App Setup \u0026 One-Click Installers"},{"oldLine":107,"kind":"removed","text":""},{"oldLine":108,"kind":"removed","text":"When reading a codebase without an installed language server, the status bar displays `LSP: set up`. Clicking it opens the interactive setup panel (`web/src/lspsetup.js`)."},{"oldLine":109,"kind":"removed","text":""},{"oldLine":110,"kind":"removed","text":"### Security Validation (DNS-Rebinding Defense)"},{"oldLine":111,"kind":"removed","text":""},{"oldLine":112,"kind":"removed","text":"Executing installation commands (e.g., `go install` or `npm install`) requires robust security precautions:"},{"oldLine":113,"kind":"removed","text":""},{"oldLine":114,"kind":"removed","text":"1. `/api/lsp/install` accepts only `POST` requests."},{"oldLine":115,"kind":"removed","text":"1. The `Origin` header must exactly match the `Host` header."},{"oldLine":116,"kind":"removed","text":"1. The `Host` header must resolve strictly to `127.0.0.1`, `[::1]`, or `localhost`."},{"oldLine":117,"kind":"removed","text":"1. Commands are pulled strictly from the internal `lspRegistry`, and the client request cannot provide or modify the command string."}]}]},{"path":"docs/internals/styling-and-themes.md","status":"D","diff":"diff --git a/docs/internals/styling-and-themes.md b/docs/internals/styling-and-themes.md\ndeleted file mode 100644\nindex 76c2f42..0000000\n--- a/docs/internals/styling-and-themes.md\n+++ /dev/null\n@@ -1,29 +0,0 @@\n-# Styling \u0026 CSS Tokens\n-\n-px1 uses one fixed GitHub Dark palette so the review surface stays predictable\n-across machines. The palette is embedded in\n-[`web/themes/github-dark.css`](../../web/themes/github-dark.css) and linked\n-directly by [`web/index.html`](../../web/index.html); there is no runtime theme\n-discovery, preference, or switching path.\n-\n-`web/style.css` owns layout and component styling. Components consume CSS\n-custom properties rather than repeating colors, which keeps review states\n-consistent without carrying a theme system through the application.\n-\n-## Token contract\n-\n-The palette supplies the tokens used by the editor, diff viewer, review queue,\n-and overlays.\n-\n-| Group | Tokens |\n-| --- | --- |\n-| Surfaces | `--bg`, `--bg2`, `--bg3`, `--bg4` |\n-| Text | `--fg`, `--dim`, `--faint` |\n-| Borders and accents | `--line`, `--accent`, `--accent-fg` |\n-| Selection and search | `--sel`, `--mark`, `--mark-active`, `--cur` |\n-| Syntax | `--k`, `--nf`, `--nc`, `--nb`, `--nv`, `--no`, `--nt`, `--nd`, `--np`, `--s`, `--m`, `--o`, `--p`, `--c`, `--err` |\n-| Review and status | `--gi`, `--gd`, `--gi-bg`, `--gd-bg`, `--shadow` |\n-\n-The palette is deliberately kept separate from structural CSS so a future\n-product-level visual refresh can replace one asset without restoring a user\n-preference subsystem.\n","hunks":[{"id":"diff-8d47bf81bb1ae686","header":"@@ -1,29 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Styling \u0026 CSS Tokens"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"px1 uses one fixed GitHub Dark palette so the review surface stays predictable"},{"oldLine":4,"kind":"removed","text":"across machines. The palette is embedded in"},{"oldLine":5,"kind":"removed","text":"[`web/themes/github-dark.css`](../../web/themes/github-dark.css) and linked"},{"oldLine":6,"kind":"removed","text":"directly by [`web/index.html`](../../web/index.html); there is no runtime theme"},{"oldLine":7,"kind":"removed","text":"discovery, preference, or switching path."},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"`web/style.css` owns layout and component styling. Components consume CSS"},{"oldLine":10,"kind":"removed","text":"custom properties rather than repeating colors, which keeps review states"},{"oldLine":11,"kind":"removed","text":"consistent without carrying a theme system through the application."},{"oldLine":12,"kind":"removed","text":""},{"oldLine":13,"kind":"removed","text":"## Token contract"},{"oldLine":14,"kind":"removed","text":""},{"oldLine":15,"kind":"removed","text":"The palette supplies the tokens used by the editor, diff viewer, review queue,"},{"oldLine":16,"kind":"removed","text":"and overlays."},{"oldLine":17,"kind":"removed","text":""},{"oldLine":18,"kind":"removed","text":"| Group | Tokens |"},{"oldLine":19,"kind":"removed","text":"| --- | --- |"},{"oldLine":20,"kind":"removed","text":"| Surfaces | `--bg`, `--bg2`, `--bg3`, `--bg4` |"},{"oldLine":21,"kind":"removed","text":"| Text | `--fg`, `--dim`, `--faint` |"},{"oldLine":22,"kind":"removed","text":"| Borders and accents | `--line`, `--accent`, `--accent-fg` |"},{"oldLine":23,"kind":"removed","text":"| Selection and search | `--sel`, `--mark`, `--mark-active`, `--cur` |"},{"oldLine":24,"kind":"removed","text":"| Syntax | `--k`, `--nf`, `--nc`, `--nb`, `--nv`, `--no`, `--nt`, `--nd`, `--np`, `--s`, `--m`, `--o`, `--p`, `--c`, `--err` |"},{"oldLine":25,"kind":"removed","text":"| Review and status | `--gi`, `--gd`, `--gi-bg`, `--gd-bg`, `--shadow` |"},{"oldLine":26,"kind":"removed","text":""},{"oldLine":27,"kind":"removed","text":"The palette is deliberately kept separate from structural CSS so a future"},{"oldLine":28,"kind":"removed","text":"product-level visual refresh can replace one asset without restoring a user"},{"oldLine":29,"kind":"removed","text":"preference subsystem."}]}]},{"path":"docs/internals/syntax-highlighting.md","status":"D","diff":"diff --git a/docs/internals/syntax-highlighting.md b/docs/internals/syntax-highlighting.md\ndeleted file mode 100644\nindex 8ae3839..0000000\n--- a/docs/internals/syntax-highlighting.md\n+++ /dev/null\n@@ -1,111 +0,0 @@\n-# Windowed Syntax Highlighting Engine\n-\n-This document details the architecture and performance strategies of px1's windowed syntax highlighting engine ([`highlight.go`](../../highlight.go)).\n-\n-## 1. The Syntax Highlighting Bottleneck\n-\n-px1 utilizes [Chroma](https://github.com/alecthomas/chroma) (a pure Go syntax highlighter modeled after Pygments) to tokenize ~280 programming languages without external dependencies or CGO.\n-\n-However, full-AST lexical analysis is computationally intensive:\n-\n-- Chroma lexers typically process source text at roughly 500 KB to 1.5 MB per second.\n-- Highlighting a 100,000-line file (several megabytes of code) upfront would introduce a 3-to-8 second freeze before displaying the first line.\n-- Naive lexing of an entire file requires holding millions of syntax token structs on the heap.\n-\n-To deliver instantaneous file opening (under 5 milliseconds), px1 implements Viewport-Based Windowed Highlighting with Dual-Tier Background Refinement.\n-\n-## 2. Windowed Highlighting Architecture\n-\n-Rather than tokenizing the entire file, px1 tokenizes only the slice of lines needed by the user's current scroll viewport, padded with leading and trailing context:\n-\n-```mermaid\n-flowchart LR\n-    subgraph FullFile [\"Complete Source File (e.g. 50,000 lines)\"]\n-        LeadIgnored[\"Preceding Lines (Skipped)\"]\n-        ContextBefore[\"Leading Context (400 lines)\"]\n-        Viewport[\"Viewport Chunk (1,000 lines)\"]\n-        ContextAfter[\"Trailing Context (400 lines)\"]\n-        TailIgnored[\"Remaining Lines (Skipped)\"]\n-    end\n-\n-    ContextBefore --\u003e Lexer[\"Chroma Lexer (Bound Window)\"]\n-    Viewport --\u003e Lexer\n-    ContextAfter --\u003e Lexer\n-    Lexer --\u003e WindowEmit[\"Slice Out Exact Viewport HTML\u003cbr/\u003eDiscard Context Markup\"]\n-```\n-\n-### Highlighting Parameters\n-\n-- `hlChunk = 1000`: Number of active lines tokenized for the current request.\n-- `hlContext = 400`: Number of preceding lines fed into the lexer.\n-  - Leading Context Purpose: Resets the lexer into the correct multi-line state (e.g., inside a multi-line docstring, backtick template literal, or block comment).\n-  - Trailing Context Purpose: Ensures open tokens are properly closed without trailing syntax anomalies.\n-- `hlWindowBytes = 512 KB`: Maximum byte size for any tokenization window.\n-\n-### Byte-Cap Protection (`hlWindowBytes`)\n-\n-In minified JavaScript or massive one-line JSON documents, 1,000 lines could equal 20+ megabytes of text. If a window slice exceeds `512 KB`, context lines are automatically dropped to prevent CPU hangs.\n-\n-## 3. Dual-Tier Refinement Architecture\n-\n-While 400 lines of context correctly identifies \u003e99.5% of syntax states, extreme cases exist where a raw string literal or comment block opens 2,000 lines earlier.\n-\n-px1 handles this with a Dual-Tier Processing Strategy:\n-\n-```mermaid\n-sequenceDiagram\n-    autonumber\n-    participant UI as Browser Virtual DOM\n-    participant Server as /api/file Endpoint\n-    participant FastHl as Fast Window Highlighter\n-    participant BgHl as Background Full-File Lexer\n-    participant Cache as LRU Highlight Cache\n-\n-    UI-\u003e\u003eServer: GET /api/file?path=main.go\u0026start=1000\u0026count=500\n-    Server-\u003e\u003eCache: Check Cache\n-    alt Cache Miss\n-        Server-\u003e\u003eFastHl: Lex lines 600-2400 (Window + Context)\n-        FastHl--\u003e\u003eServer: Return HTML + Flag (refine: true)\n-        Server--\u003e\u003eUI: Serve inexact lines immediately (\u003c2ms)\n-        Note over UI: UI paints lines with 0ms scroll hitching\n-        Server-\u003e\u003eBgHl: Spawn background exact pass (if file \u003c 2 MB)\n-        BgHl-\u003e\u003eCache: Populate exact token lines in background\n-        UI-\u003e\u003eServer: Poll /api/file (or chunk refinement swap)\n-        Server--\u003e\u003eUI: Deliver exact tokenized HTML (refine: false)\n-        Note over UI: Non-destructive DOM line swap (refineChunk)\n-    end\n-```\n-\n-1. Tier 1 (Instant Viewport Pass): Evaluates the bounded window (`start - hlContext` to `start + count + hlContext`). Slices out and returns the target lines in 1-2 ms. If the window contains potential multi-line ambiguities, the payload includes `refine: true`.\n-1. Tier 2 (Background Exact Pass): If the file is under `bgLimit = 2 MB`, a background goroutine performs an exact full-file tokenization pass. The exact result is stored in the LRU cache. The frontend's `refineChunk()` updates the rendered rows in-place without disturbing the user's scroll position or selection.\n-\n-## 4. Short-Class CSS Tokenization\n-\n-Chroma's default HTML formatter outputs lengthy inline CSS or verbose class names (e.g. `\u003cspan class=\"chroma-keyword-declaration\"\u003efunc\u003c/span\u003e`), which bloats the DOM and increases network payload size.\n-\n-px1 maps token types to minimal 1-to-2 character CSS classes:\n-\n-| Class  | Chroma Token Type    | Semantic Role                                 |\n-| ------ | -------------------- | --------------------------------------------- |\n-| `.k`   | `Keyword`            | Language keywords (`func`, `return`, `class`) |\n-| `.nf`  | `NameFunction`       | Function declarations and calls               |\n-| `.s`   | `LiteralString`      | String literals                               |\n-| `.m`   | `LiteralNumber`      | Numeric constants                             |\n-| `.c`   | `Comment`            | Single and multi-line comments                |\n-| `.kd`  | `KeywordDeclaration` | Type declarations                             |\n-| `.kt`  | `KeywordType`        | Primitive types (`int`, `string`, `bool`)     |\n-| `.err` | `Error`              | Syntax errors                                 |\n-\n-This keeps network payloads minimal and guarantees that CSS stylesheets define colors cleanly through CSS custom properties (`--k`, `--nf`, `--s`, `--c`).\n-\n-## 5. Byte-Budgeted LRU Memory Cache\n-\n-Generated HTML fragments are cached in memory using a Least Recently Used (LRU) eviction policy backed by Go's `container/list`.\n-\n-```go\n-const cacheBudget = 512 * 1024 * 1024 // 512 MB memory budget\n-```\n-\n-- Every cached line entry tracks its raw string byte footprint.\n-- When total cached line data exceeds `cacheBudget`, oldest entries are evicted from the tail of the LRU list until memory drops below the threshold.\n-- Switching between tabs and scrolling backward reuses cached HTML strings instantly without hitting Chroma.\n","hunks":[{"id":"diff-7179be1de743074f","header":"@@ -1,111 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Windowed Syntax Highlighting Engine"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document details the architecture and performance strategies of px1's windowed syntax highlighting engine ([`highlight.go`](../../highlight.go))."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. The Syntax Highlighting Bottleneck"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"px1 utilizes [Chroma](https://github.com/alecthomas/chroma) (a pure Go syntax highlighter modeled after Pygments) to tokenize ~280 programming languages without external dependencies or CGO."},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"However, full-AST lexical analysis is computationally intensive:"},{"oldLine":10,"kind":"removed","text":""},{"oldLine":11,"kind":"removed","text":"- Chroma lexers typically process source text at roughly 500 KB to 1.5 MB per second."},{"oldLine":12,"kind":"removed","text":"- Highlighting a 100,000-line file (several megabytes of code) upfront would introduce a 3-to-8 second freeze before displaying the first line."},{"oldLine":13,"kind":"removed","text":"- Naive lexing of an entire file requires holding millions of syntax token structs on the heap."},{"oldLine":14,"kind":"removed","text":""},{"oldLine":15,"kind":"removed","text":"To deliver instantaneous file opening (under 5 milliseconds), px1 implements Viewport-Based Windowed Highlighting with Dual-Tier Background Refinement."},{"oldLine":16,"kind":"removed","text":""},{"oldLine":17,"kind":"removed","text":"## 2. Windowed Highlighting Architecture"},{"oldLine":18,"kind":"removed","text":""},{"oldLine":19,"kind":"removed","text":"Rather than tokenizing the entire file, px1 tokenizes only the slice of lines needed by the user's current scroll viewport, padded with leading and trailing context:"},{"oldLine":20,"kind":"removed","text":""},{"oldLine":21,"kind":"removed","text":"```mermaid"},{"oldLine":22,"kind":"removed","text":"flowchart LR"},{"oldLine":23,"kind":"removed","text":"    subgraph FullFile [\"Complete Source File (e.g. 50,000 lines)\"]"},{"oldLine":24,"kind":"removed","text":"        LeadIgnored[\"Preceding Lines (Skipped)\"]"},{"oldLine":25,"kind":"removed","text":"        ContextBefore[\"Leading Context (400 lines)\"]"},{"oldLine":26,"kind":"removed","text":"        Viewport[\"Viewport Chunk (1,000 lines)\"]"},{"oldLine":27,"kind":"removed","text":"        ContextAfter[\"Trailing Context (400 lines)\"]"},{"oldLine":28,"kind":"removed","text":"        TailIgnored[\"Remaining Lines (Skipped)\"]"},{"oldLine":29,"kind":"removed","text":"    end"},{"oldLine":30,"kind":"removed","text":""},{"oldLine":31,"kind":"removed","text":"    ContextBefore --\u003e Lexer[\"Chroma Lexer (Bound Window)\"]"},{"oldLine":32,"kind":"removed","text":"    Viewport --\u003e Lexer"},{"oldLine":33,"kind":"removed","text":"    ContextAfter --\u003e Lexer"},{"oldLine":34,"kind":"removed","text":"    Lexer --\u003e WindowEmit[\"Slice Out Exact Viewport HTML\u003cbr/\u003eDiscard Context Markup\"]"},{"oldLine":35,"kind":"removed","text":"```"},{"oldLine":36,"kind":"removed","text":""},{"oldLine":37,"kind":"removed","text":"### Highlighting Parameters"},{"oldLine":38,"kind":"removed","text":""},{"oldLine":39,"kind":"removed","text":"- `hlChunk = 1000`: Number of active lines tokenized for the current request."},{"oldLine":40,"kind":"removed","text":"- `hlContext = 400`: Number of preceding lines fed into the lexer."},{"oldLine":41,"kind":"removed","text":"  - Leading Context Purpose: Resets the lexer into the correct multi-line state (e.g., inside a multi-line docstring, backtick template literal, or block comment)."},{"oldLine":42,"kind":"removed","text":"  - Trailing Context Purpose: Ensures open tokens are properly closed without trailing syntax anomalies."},{"oldLine":43,"kind":"removed","text":"- `hlWindowBytes = 512 KB`: Maximum byte size for any tokenization window."},{"oldLine":44,"kind":"removed","text":""},{"oldLine":45,"kind":"removed","text":"### Byte-Cap Protection (`hlWindowBytes`)"},{"oldLine":46,"kind":"removed","text":""},{"oldLine":47,"kind":"removed","text":"In minified JavaScript or massive one-line JSON documents, 1,000 lines could equal 20+ megabytes of text. If a window slice exceeds `512 KB`, context lines are automatically dropped to prevent CPU hangs."},{"oldLine":48,"kind":"removed","text":""},{"oldLine":49,"kind":"removed","text":"## 3. Dual-Tier Refinement Architecture"},{"oldLine":50,"kind":"removed","text":""},{"oldLine":51,"kind":"removed","text":"While 400 lines of context correctly identifies \u003e99.5% of syntax states, extreme cases exist where a raw string literal or comment block opens 2,000 lines earlier."},{"oldLine":52,"kind":"removed","text":""},{"oldLine":53,"kind":"removed","text":"px1 handles this with a Dual-Tier Processing Strategy:"},{"oldLine":54,"kind":"removed","text":""},{"oldLine":55,"kind":"removed","text":"```mermaid"},{"oldLine":56,"kind":"removed","text":"sequenceDiagram"},{"oldLine":57,"kind":"removed","text":"    autonumber"},{"oldLine":58,"kind":"removed","text":"    participant UI as Browser Virtual DOM"},{"oldLine":59,"kind":"removed","text":"    participant Server as /api/file Endpoint"},{"oldLine":60,"kind":"removed","text":"    participant FastHl as Fast Window Highlighter"},{"oldLine":61,"kind":"removed","text":"    participant BgHl as Background Full-File Lexer"},{"oldLine":62,"kind":"removed","text":"    participant Cache as LRU Highlight Cache"},{"oldLine":63,"kind":"removed","text":""},{"oldLine":64,"kind":"removed","text":"    UI-\u003e\u003eServer: GET /api/file?path=main.go\u0026start=1000\u0026count=500"},{"oldLine":65,"kind":"removed","text":"    Server-\u003e\u003eCache: Check Cache"},{"oldLine":66,"kind":"removed","text":"    alt Cache Miss"},{"oldLine":67,"kind":"removed","text":"        Server-\u003e\u003eFastHl: Lex lines 600-2400 (Window + Context)"},{"oldLine":68,"kind":"removed","text":"        FastHl--\u003e\u003eServer: Return HTML + Flag (refine: true)"},{"oldLine":69,"kind":"removed","text":"        Server--\u003e\u003eUI: Serve inexact lines immediately (\u003c2ms)"},{"oldLine":70,"kind":"removed","text":"        Note over UI: UI paints lines with 0ms scroll hitching"},{"oldLine":71,"kind":"removed","text":"        Server-\u003e\u003eBgHl: Spawn background exact pass (if file \u003c 2 MB)"},{"oldLine":72,"kind":"removed","text":"        BgHl-\u003e\u003eCache: Populate exact token lines in background"},{"oldLine":73,"kind":"removed","text":"        UI-\u003e\u003eServer: Poll /api/file (or chunk refinement swap)"},{"oldLine":74,"kind":"removed","text":"        Server--\u003e\u003eUI: Deliver exact tokenized HTML (refine: false)"},{"oldLine":75,"kind":"removed","text":"        Note over UI: Non-destructive DOM line swap (refineChunk)"},{"oldLine":76,"kind":"removed","text":"    end"},{"oldLine":77,"kind":"removed","text":"```"},{"oldLine":78,"kind":"removed","text":""},{"oldLine":79,"kind":"removed","text":"1. Tier 1 (Instant Viewport Pass): Evaluates the bounded window (`start - hlContext` to `start + count + hlContext`). Slices out and returns the target lines in 1-2 ms. If the window contains potential multi-line ambiguities, the payload includes `refine: true`."},{"oldLine":80,"kind":"removed","text":"1. Tier 2 (Background Exact Pass): If the file is under `bgLimit = 2 MB`, a background goroutine performs an exact full-file tokenization pass. The exact result is stored in the LRU cache. The frontend's `refineChunk()` updates the rendered rows in-place without disturbing the user's scroll position or selection."},{"oldLine":81,"kind":"removed","text":""},{"oldLine":82,"kind":"removed","text":"## 4. Short-Class CSS Tokenization"},{"oldLine":83,"kind":"removed","text":""},{"oldLine":84,"kind":"removed","text":"Chroma's default HTML formatter outputs lengthy inline CSS or verbose class names (e.g. `\u003cspan class=\"chroma-keyword-declaration\"\u003efunc\u003c/span\u003e`), which bloats the DOM and increases network payload size."},{"oldLine":85,"kind":"removed","text":""},{"oldLine":86,"kind":"removed","text":"px1 maps token types to minimal 1-to-2 character CSS classes:"},{"oldLine":87,"kind":"removed","text":""},{"oldLine":88,"kind":"removed","text":"| Class  | Chroma Token Type    | Semantic Role                                 |"},{"oldLine":89,"kind":"removed","text":"| ------ | -------------------- | --------------------------------------------- |"},{"oldLine":90,"kind":"removed","text":"| `.k`   | `Keyword`            | Language keywords (`func`, `return`, `class`) |"},{"oldLine":91,"kind":"removed","text":"| `.nf`  | `NameFunction`       | Function declarations and calls               |"},{"oldLine":92,"kind":"removed","text":"| `.s`   | `LiteralString`      | String literals                               |"},{"oldLine":93,"kind":"removed","text":"| `.m`   | `LiteralNumber`      | Numeric constants                             |"},{"oldLine":94,"kind":"removed","text":"| `.c`   | `Comment`            | Single and multi-line comments                |"},{"oldLine":95,"kind":"removed","text":"| `.kd`  | `KeywordDeclaration` | Type declarations                             |"},{"oldLine":96,"kind":"removed","text":"| `.kt`  | `KeywordType`        | Primitive types (`int`, `string`, `bool`)     |"},{"oldLine":97,"kind":"removed","text":"| `.err` | `Error`              | Syntax errors                                 |"},{"oldLine":98,"kind":"removed","text":""},{"oldLine":99,"kind":"removed","text":"This keeps network payloads minimal and guarantees that CSS stylesheets define colors cleanly through CSS custom properties (`--k`, `--nf`, `--s`, `--c`)."},{"oldLine":100,"kind":"removed","text":""},{"oldLine":101,"kind":"removed","text":"## 5. Byte-Budgeted LRU Memory Cache"},{"oldLine":102,"kind":"removed","text":""},{"oldLine":103,"kind":"removed","text":"Generated HTML fragments are cached in memory using a Least Recently Used (LRU) eviction policy backed by Go's `container/list`."},{"oldLine":104,"kind":"removed","text":""},{"oldLine":105,"kind":"removed","text":"```go"},{"oldLine":106,"kind":"removed","text":"const cacheBudget = 512 * 1024 * 1024 // 512 MB memory budget"},{"oldLine":107,"kind":"removed","text":"```"},{"oldLine":108,"kind":"removed","text":""},{"oldLine":109,"kind":"removed","text":"- Every cached line entry tracks its raw string byte footprint."},{"oldLine":110,"kind":"removed","text":"- When total cached line data exceeds `cacheBudget`, oldest entries are evicted from the tail of the LRU list until memory drops below the threshold."},{"oldLine":111,"kind":"removed","text":"- Switching between tabs and scrolling backward reuses cached HTML strings instantly without hitting Chroma."}]}]},{"path":"docs/internals/workspace-search.md","status":"D","diff":"diff --git a/docs/internals/workspace-search.md b/docs/internals/workspace-search.md\ndeleted file mode 100644\nindex 8d2c75d..0000000\n--- a/docs/internals/workspace-search.md\n+++ /dev/null\n@@ -1,126 +0,0 @@\n-# Workspace Search \u0026 Symbol Extraction\n-\n-This document explains px1's high-throughput parallel search engine ([`search.go`](../../search.go)) and fast regex symbol extractor ([`symbols.go`](../../symbols.go)).\n-\n-## 1. Search Engine Architecture\n-\n-Full-text search in px1 is built to scan hundreds of megabytes of source code in milliseconds without spawning external processes (like `grep` or `ripgrep`) and without thrashing the Go heap.\n-\n-```mermaid\n-flowchart TD\n-    Req[\"Search Request /api/search?q=...\"] --\u003e Parse[\"Compile Literal or Regexp Pattern\"]\n-    Parse --\u003e Dispatch[\"Partition Indexed Files to Worker Pool (NumCPU)\"]\n-\n-    subgraph Pool [\"Worker Pool (sync.Pool Buffer Reuse)\"]\n-        W1[\"Worker 1: Acquire workBuf\"]\n-        W2[\"Worker 2: Acquire workBuf\"]\n-    end\n-\n-    Dispatch --\u003e Pool\n-\n-    subgraph FilePipeline [\"Per-File Processing Pipeline\"]\n-        Read[\"Read File into workBuf.readInto\"]\n-        FastReject{\"Literal Match?\u003cbr/\u003ebytes.Contains(data, lit)\"}\n-        LineScan[\"Split Lines \u0026 Identify Byte Offsets\"]\n-        DefCheck[\"Concurrent Symbol Def Detection\"]\n-        Snip[\"Snip Elision: Generate Pre, Mid, Post\"]\n-    end\n-\n-    Pool --\u003e Read\n-    Read --\u003e FastReject\n-    FastReject --\u003e|False| Skip[\"Skip File Immediately (No Line Splitting)\"]\n-    FastReject --\u003e|True| LineScan\n-    LineScan --\u003e DefCheck\n-    DefCheck --\u003e Snip\n-    Snip --\u003e Merge[\"Merge Results into Capped Output Slice\"]\n-```\n-\n-## 2. Memory Optimization: `workBuf` Pooling\n-\n-Reading thousands of files off disk can overwhelm Go's memory allocator if buffers are created per file. px1 eliminates per-file allocations using a `sync.Pool` of reusable worker buffers:\n-\n-```go\n-type workBuf struct {\n-    readInto   []byte // Reusable disk read buffer\n-    asciiLower []byte // In-place ASCII lowercase buffer\n-}\n-\n-var workPool = sync.Pool{\n-    New: func() any {\n-        return \u0026workBuf{\n-            readInto:   make([]byte, 0, 64*1024),\n-            asciiLower: make([]byte, 0, 64*1024),\n-        }\n-    },\n-}\n-```\n-\n-### In-Place ASCII Lowercasing\n-\n-For case-insensitive literal searches, converting full UTF-8 strings with `strings.ToLower()` allocates new heap memory for every line. Instead, `search.go` performs in-place byte lowercasing directly into `workBuf.asciiLower`:\n-\n-- ASCII characters A-Z are mapped to a-z via single-byte manipulation (`b + 32`).\n-- UTF-8 multibyte characters are preserved untouched.\n-- Literal matching executes via SIMD-accelerated `bytes.Contains()` and `bytes.Index()` with zero heap allocations.\n-\n-## 3. Fast Rejection Fast Path\n-\n-The vast majority of files in any repository do not contain the search term. Splitting file contents into lines and iterating line-by-line is expensive.\n-\n-px1 applies an instant rejection test before doing any line parsing:\n-\n-```go\n-if !isRegex \u0026\u0026 !caseSensitive {\n-    if !bytes.Contains(lowerData, queryLower) {\n-        return // Term does not exist anywhere in file: skip immediately\n-    }\n-}\n-```\n-\n-If `bytes.Contains()` returns `false`, the entire file is discarded in a few microseconds without examining a single newline.\n-\n-## 4. Structured Snippet Elision (`{Pre, Mid, Post}`)\n-\n-Long source lines (such as minified code, long strings, or complex expressions) cannot be displayed in full inside a compact sidebar search panel. \n-\n-Instead of returning raw byte offsets or forcing the JavaScript client to calculate UTF-16 string offsets, `search.go` performs line elision server-side:\n-\n-```go\n-type Match struct {\n-    Line int    `json:\"line\"` // 1-based line number\n-    Pre  string `json:\"pre\"`  // Text before the match\n-    Mid  string `json:\"mid\"`  // Matched query text\n-    Post string `json:\"post\"` // Text after the match\n-    Def  bool   `json:\"def,omitempty\"` // True if line declares a symbol\n-}\n-```\n-\n-### Snippet Constants\n-\n-- `snipLead = 32`: Match offset threshold before leading text is elided.\n-- `snipKeep = 16`: Number of leading runes retained when truncating (e.g., `...getComponent()`).\n-- `snipMax = 240`: Maximum total rune budget for the entire rendered snippet.\n-\n-### Why Structured Slices?\n-\n-1. Zero Client Discrepancies: JavaScript uses UTF-16 code units, whereas Go uses UTF-8 byte sequences. Sending offsets requires complex client-side reconciliation. Sending pre-split strings completely eliminates boundary alignment bugs.\n-1. Bandwidth Savings: Discarding massive leading and trailing line segments shrinks JSON payloads significantly.\n-\n-## 5. Regex Symbol Extraction ([`symbols.go`](../../symbols.go))\n-\n-When language servers are disabled or unavailable, px1 provides instantaneous symbol outlines and declaration jump navigation via heuristic regular expressions.\n-\n-### Parallel Symbol Flagging\n-\n-During full-text searches, lines that look like function, class, struct, or type declarations are automatically flagged (`Match.Def = true`). This allows the frontend to visually highlight definition matches in search results without running a secondary query.\n-\n-### Supported Language Grammars\n-\n-`symbols.go` maintains high-performance compiled regular expressions for:\n-\n-- Go: `func (r *Receiver) Name(...)`, `type Name struct/interface`\n-- TypeScript / JavaScript: `function name()`, `class Name`, `const name = () =\u003e`, `interface Name`\n-- Python: `def name(...)`, `class Name(...)`\n-- Rust: `fn name(...)`, `struct Name`, `enum Name`, `trait Name`, `impl Name`\n-- C / C++: Return types, class declarations, structs, functions\n-- Java / C# / PHP / Ruby: Methods, properties, classes, modules\n","hunks":[{"id":"diff-3f7c7ec8351a2c6f","header":"@@ -1,126 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Workspace Search \u0026 Symbol Extraction"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document explains px1's high-throughput parallel search engine ([`search.go`](../../search.go)) and fast regex symbol extractor ([`symbols.go`](../../symbols.go))."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. Search Engine Architecture"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"Full-text search in px1 is built to scan hundreds of megabytes of source code in milliseconds without spawning external processes (like `grep` or `ripgrep`) and without thrashing the Go heap."},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"```mermaid"},{"oldLine":10,"kind":"removed","text":"flowchart TD"},{"oldLine":11,"kind":"removed","text":"    Req[\"Search Request /api/search?q=...\"] --\u003e Parse[\"Compile Literal or Regexp Pattern\"]"},{"oldLine":12,"kind":"removed","text":"    Parse --\u003e Dispatch[\"Partition Indexed Files to Worker Pool (NumCPU)\"]"},{"oldLine":13,"kind":"removed","text":""},{"oldLine":14,"kind":"removed","text":"    subgraph Pool [\"Worker Pool (sync.Pool Buffer Reuse)\"]"},{"oldLine":15,"kind":"removed","text":"        W1[\"Worker 1: Acquire workBuf\"]"},{"oldLine":16,"kind":"removed","text":"        W2[\"Worker 2: Acquire workBuf\"]"},{"oldLine":17,"kind":"removed","text":"    end"},{"oldLine":18,"kind":"removed","text":""},{"oldLine":19,"kind":"removed","text":"    Dispatch --\u003e Pool"},{"oldLine":20,"kind":"removed","text":""},{"oldLine":21,"kind":"removed","text":"    subgraph FilePipeline [\"Per-File Processing Pipeline\"]"},{"oldLine":22,"kind":"removed","text":"        Read[\"Read File into workBuf.readInto\"]"},{"oldLine":23,"kind":"removed","text":"        FastReject{\"Literal Match?\u003cbr/\u003ebytes.Contains(data, lit)\"}"},{"oldLine":24,"kind":"removed","text":"        LineScan[\"Split Lines \u0026 Identify Byte Offsets\"]"},{"oldLine":25,"kind":"removed","text":"        DefCheck[\"Concurrent Symbol Def Detection\"]"},{"oldLine":26,"kind":"removed","text":"        Snip[\"Snip Elision: Generate Pre, Mid, Post\"]"},{"oldLine":27,"kind":"removed","text":"    end"},{"oldLine":28,"kind":"removed","text":""},{"oldLine":29,"kind":"removed","text":"    Pool --\u003e Read"},{"oldLine":30,"kind":"removed","text":"    Read --\u003e FastReject"},{"oldLine":31,"kind":"removed","text":"    FastReject --\u003e|False| Skip[\"Skip File Immediately (No Line Splitting)\"]"},{"oldLine":32,"kind":"removed","text":"    FastReject --\u003e|True| LineScan"},{"oldLine":33,"kind":"removed","text":"    LineScan --\u003e DefCheck"},{"oldLine":34,"kind":"removed","text":"    DefCheck --\u003e Snip"},{"oldLine":35,"kind":"removed","text":"    Snip --\u003e Merge[\"Merge Results into Capped Output Slice\"]"},{"oldLine":36,"kind":"removed","text":"```"},{"oldLine":37,"kind":"removed","text":""},{"oldLine":38,"kind":"removed","text":"## 2. Memory Optimization: `workBuf` Pooling"},{"oldLine":39,"kind":"removed","text":""},{"oldLine":40,"kind":"removed","text":"Reading thousands of files off disk can overwhelm Go's memory allocator if buffers are created per file. px1 eliminates per-file allocations using a `sync.Pool` of reusable worker buffers:"},{"oldLine":41,"kind":"removed","text":""},{"oldLine":42,"kind":"removed","text":"```go"},{"oldLine":43,"kind":"removed","text":"type workBuf struct {"},{"oldLine":44,"kind":"removed","text":"    readInto   []byte // Reusable disk read buffer"},{"oldLine":45,"kind":"removed","text":"    asciiLower []byte // In-place ASCII lowercase buffer"},{"oldLine":46,"kind":"removed","text":"}"},{"oldLine":47,"kind":"removed","text":""},{"oldLine":48,"kind":"removed","text":"var workPool = sync.Pool{"},{"oldLine":49,"kind":"removed","text":"    New: func() any {"},{"oldLine":50,"kind":"removed","text":"        return \u0026workBuf{"},{"oldLine":51,"kind":"removed","text":"            readInto:   make([]byte, 0, 64*1024),"},{"oldLine":52,"kind":"removed","text":"            asciiLower: make([]byte, 0, 64*1024),"},{"oldLine":53,"kind":"removed","text":"        }"},{"oldLine":54,"kind":"removed","text":"    },"},{"oldLine":55,"kind":"removed","text":"}"},{"oldLine":56,"kind":"removed","text":"```"},{"oldLine":57,"kind":"removed","text":""},{"oldLine":58,"kind":"removed","text":"### In-Place ASCII Lowercasing"},{"oldLine":59,"kind":"removed","text":""},{"oldLine":60,"kind":"removed","text":"For case-insensitive literal searches, converting full UTF-8 strings with `strings.ToLower()` allocates new heap memory for every line. Instead, `search.go` performs in-place byte lowercasing directly into `workBuf.asciiLower`:"},{"oldLine":61,"kind":"removed","text":""},{"oldLine":62,"kind":"removed","text":"- ASCII characters A-Z are mapped to a-z via single-byte manipulation (`b + 32`)."},{"oldLine":63,"kind":"removed","text":"- UTF-8 multibyte characters are preserved untouched."},{"oldLine":64,"kind":"removed","text":"- Literal matching executes via SIMD-accelerated `bytes.Contains()` and `bytes.Index()` with zero heap allocations."},{"oldLine":65,"kind":"removed","text":""},{"oldLine":66,"kind":"removed","text":"## 3. Fast Rejection Fast Path"},{"oldLine":67,"kind":"removed","text":""},{"oldLine":68,"kind":"removed","text":"The vast majority of files in any repository do not contain the search term. Splitting file contents into lines and iterating line-by-line is expensive."},{"oldLine":69,"kind":"removed","text":""},{"oldLine":70,"kind":"removed","text":"px1 applies an instant rejection test before doing any line parsing:"},{"oldLine":71,"kind":"removed","text":""},{"oldLine":72,"kind":"removed","text":"```go"},{"oldLine":73,"kind":"removed","text":"if !isRegex \u0026\u0026 !caseSensitive {"},{"oldLine":74,"kind":"removed","text":"    if !bytes.Contains(lowerData, queryLower) {"},{"oldLine":75,"kind":"removed","text":"        return // Term does not exist anywhere in file: skip immediately"},{"oldLine":76,"kind":"removed","text":"    }"},{"oldLine":77,"kind":"removed","text":"}"},{"oldLine":78,"kind":"removed","text":"```"},{"oldLine":79,"kind":"removed","text":""},{"oldLine":80,"kind":"removed","text":"If `bytes.Contains()` returns `false`, the entire file is discarded in a few microseconds without examining a single newline."},{"oldLine":81,"kind":"removed","text":""},{"oldLine":82,"kind":"removed","text":"## 4. Structured Snippet Elision (`{Pre, Mid, Post}`)"},{"oldLine":83,"kind":"removed","text":""},{"oldLine":84,"kind":"removed","text":"Long source lines (such as minified code, long strings, or complex expressions) cannot be displayed in full inside a compact sidebar search panel. "},{"oldLine":85,"kind":"removed","text":""},{"oldLine":86,"kind":"removed","text":"Instead of returning raw byte offsets or forcing the JavaScript client to calculate UTF-16 string offsets, `search.go` performs line elision server-side:"},{"oldLine":87,"kind":"removed","text":""},{"oldLine":88,"kind":"removed","text":"```go"},{"oldLine":89,"kind":"removed","text":"type Match struct {"},{"oldLine":90,"kind":"removed","text":"    Line int    `json:\"line\"` // 1-based line number"},{"oldLine":91,"kind":"removed","text":"    Pre  string `json:\"pre\"`  // Text before the match"},{"oldLine":92,"kind":"removed","text":"    Mid  string `json:\"mid\"`  // Matched query text"},{"oldLine":93,"kind":"removed","text":"    Post string `json:\"post\"` // Text after the match"},{"oldLine":94,"kind":"removed","text":"    Def  bool   `json:\"def,omitempty\"` // True if line declares a symbol"},{"oldLine":95,"kind":"removed","text":"}"},{"oldLine":96,"kind":"removed","text":"```"},{"oldLine":97,"kind":"removed","text":""},{"oldLine":98,"kind":"removed","text":"### Snippet Constants"},{"oldLine":99,"kind":"removed","text":""},{"oldLine":100,"kind":"removed","text":"- `snipLead = 32`: Match offset threshold before leading text is elided."},{"oldLine":101,"kind":"removed","text":"- `snipKeep = 16`: Number of leading runes retained when truncating (e.g., `...getComponent()`)."},{"oldLine":102,"kind":"removed","text":"- `snipMax = 240`: Maximum total rune budget for the entire rendered snippet."},{"oldLine":103,"kind":"removed","text":""},{"oldLine":104,"kind":"removed","text":"### Why Structured Slices?"},{"oldLine":105,"kind":"removed","text":""},{"oldLine":106,"kind":"removed","text":"1. Zero Client Discrepancies: JavaScript uses UTF-16 code units, whereas Go uses UTF-8 byte sequences. Sending offsets requires complex client-side reconciliation. Sending pre-split strings completely eliminates boundary alignment bugs."},{"oldLine":107,"kind":"removed","text":"1. Bandwidth Savings: Discarding massive leading and trailing line segments shrinks JSON payloads significantly."},{"oldLine":108,"kind":"removed","text":""},{"oldLine":109,"kind":"removed","text":"## 5. Regex Symbol Extraction ([`symbols.go`](../../symbols.go))"},{"oldLine":110,"kind":"removed","text":""},{"oldLine":111,"kind":"removed","text":"When language servers are disabled or unavailable, px1 provides instantaneous symbol outlines and declaration jump navigation via heuristic regular expressions."},{"oldLine":112,"kind":"removed","text":""},{"oldLine":113,"kind":"removed","text":"### Parallel Symbol Flagging"},{"oldLine":114,"kind":"removed","text":""},{"oldLine":115,"kind":"removed","text":"During full-text searches, lines that look like function, class, struct, or type declarations are automatically flagged (`Match.Def = true`). This allows the frontend to visually highlight definition matches in search results without running a secondary query."},{"oldLine":116,"kind":"removed","text":""},{"oldLine":117,"kind":"removed","text":"### Supported Language Grammars"},{"oldLine":118,"kind":"removed","text":""},{"oldLine":119,"kind":"removed","text":"`symbols.go` maintains high-performance compiled regular expressions for:"},{"oldLine":120,"kind":"removed","text":""},{"oldLine":121,"kind":"removed","text":"- Go: `func (r *Receiver) Name(...)`, `type Name struct/interface`"},{"oldLine":122,"kind":"removed","text":"- TypeScript / JavaScript: `function name()`, `class Name`, `const name = () =\u003e`, `interface Name`"},{"oldLine":123,"kind":"removed","text":"- Python: `def name(...)`, `class Name(...)`"},{"oldLine":124,"kind":"removed","text":"- Rust: `fn name(...)`, `struct Name`, `enum Name`, `trait Name`, `impl Name`"},{"oldLine":125,"kind":"removed","text":"- C / C++: Return types, class declarations, structs, functions"},{"oldLine":126,"kind":"removed","text":"- Java / C# / PHP / Ruby: Methods, properties, classes, modules"}]}]},{"path":"examples/px1-review.yml","status":"A","diff":"diff --git a/examples/px1-review.yml b/examples/px1-review.yml\nnew file mode 100644\nindex 0000000..70e3066\n--- /dev/null\n+++ b/examples/px1-review.yml\n@@ -0,0 +1,156 @@\n+name: px1 review artifact\n+\n+on:\n+  pull_request_target:\n+    types: [opened, synchronize, reopened]\n+\n+permissions:\n+  contents: write\n+  checks: read\n+  pages: write\n+  id-token: write\n+  pull-requests: write\n+\n+concurrency:\n+  group: px1-pages\n+  cancel-in-progress: false\n+\n+jobs:\n+  publish:\n+    if: ${{ !github.event.pull_request.draft }}\n+    runs-on: ubuntu-latest\n+    environment:\n+      name: github-pages\n+      url: ${{ steps.deployment.outputs.page_url }}\n+    env:\n+      BASE_SHA: ${{ github.event.pull_request.base.sha }}\n+      HEAD_SHA: ${{ github.event.pull_request.head.sha }}\n+      PR_NUMBER: ${{ github.event.pull_request.number }}\n+\n+    steps:\n+      - name: Checkout trusted base\n+        uses: actions/checkout@v4\n+        with:\n+          ref: ${{ github.event.pull_request.base.sha }}\n+          fetch-depth: 0\n+\n+      - name: Fetch PR head as data\n+        shell: bash\n+        run: |\n+          set -euo pipefail\n+          git fetch --no-tags origin \\\n+            \"refs/pull/${PR_NUMBER}/head:refs/remotes/origin/px1-pr-head\"\n+          test \"$(git rev-parse refs/remotes/origin/px1-pr-head)\" = \"$HEAD_SHA\"\n+\n+      - name: Collect exact-head GitHub checks\n+        uses: actions/github-script@v7\n+        env:\n+          VERIFICATION_FILE: .px1/verification.json\n+        with:\n+          script: |\n+            const fs = require('fs');\n+            const runs = await github.paginate(github.rest.checks.listForRef, {\n+              owner: context.repo.owner,\n+              repo: context.repo.repo,\n+              ref: process.env.HEAD_SHA,\n+              per_page: 100,\n+            });\n+            const names = new Map();\n+            const checks = runs.map((run) =\u003e {\n+              const baseName = run.name || run.app?.name || 'GitHub check';\n+              const count = (names.get(baseName) || 0) + 1;\n+              names.set(baseName, count);\n+              const name = count === 1 ? baseName : `${baseName} (${count})`;\n+              let status = 'cancelled';\n+              if (run.status === 'queued') status = 'queued';\n+              else if (run.status !== 'completed') status = 'running';\n+              else if (run.conclusion === 'success' || run.conclusion === 'neutral') status = 'passed';\n+              else if (['failure', 'timed_out', 'action_required'].includes(run.conclusion)) status = 'failed';\n+              return {\n+                name,\n+                status,\n+                summary: run.output?.summary || '',\n+                url: run.html_url || '',\n+                startedAt: run.started_at || undefined,\n+                finishedAt: run.completed_at || undefined,\n+              };\n+            });\n+            fs.mkdirSync('.px1', { recursive: true });\n+            fs.writeFileSync(process.env.VERIFICATION_FILE, `${JSON.stringify({\n+              source: 'github-actions',\n+              revision: process.env.HEAD_SHA,\n+              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,\n+              checks,\n+            }, null, 2)}\\n`);\n+\n+      - name: Restore immutable report history\n+        uses: kedarvartak/px1/history@v1\n+        with:\n+          mode: restore\n+          site: site\n+\n+      - name: Generate commit-pinned report\n+        uses: kedarvartak/px1@v1\n+        with:\n+          base: ${{ env.BASE_SHA }}\n+          head: ${{ env.HEAD_SHA }}\n+          root: ${{ github.workspace }}\n+          verification-file: .px1/verification.json\n+          out: site/reviews/${{ env.HEAD_SHA }}\n+\n+      - name: Preserve immutable report history\n+        uses: kedarvartak/px1/history@v1\n+        with:\n+          mode: publish\n+          site: site\n+\n+      - name: Configure GitHub Pages\n+        uses: actions/configure-pages@v5\n+\n+      - name: Upload Pages artifact\n+        uses: actions/upload-pages-artifact@v3\n+        with:\n+          path: site\n+\n+      - name: Deploy GitHub Pages\n+        id: deployment\n+        uses: actions/deploy-pages@v4\n+\n+      - name: Update sticky PR comment\n+        uses: actions/github-script@v7\n+        env:\n+          PAGES_URL: ${{ steps.deployment.outputs.page_url }}\n+        with:\n+          script: |\n+            const marker = '\u003c!-- px1-static-review --\u003e';\n+            const base = process.env.PAGES_URL.endsWith('/')\n+              ? process.env.PAGES_URL\n+              : `${process.env.PAGES_URL}/`;\n+            const report = `${base}reviews/${process.env.HEAD_SHA}/`;\n+            const body = [\n+              marker,\n+              '## px1 review artifact',\n+              '',\n+              `Review for commit \\`${process.env.HEAD_SHA}\\`.`,\n+              '',\n+              `[Open the commit-pinned report](${report})`,\n+            ].join('\\n');\n+            const issue = {\n+              owner: context.repo.owner,\n+              repo: context.repo.repo,\n+              issue_number: context.issue.number,\n+              per_page: 100,\n+            };\n+            const comments = await github.paginate(github.rest.issues.listComments, issue);\n+            const existing = comments.find((comment) =\u003e\n+              comment.user?.type === 'Bot' \u0026\u0026 comment.body?.includes(marker));\n+            if (existing) {\n+              await github.rest.issues.updateComment({\n+                owner: issue.owner,\n+                repo: issue.repo,\n+                comment_id: existing.id,\n+                body,\n+              });\n+            } else {\n+              await github.rest.issues.createComment({ ...issue, body });\n+            }\n","hunks":[{"id":"diff-b72409012152a407","header":"@@ -0,0 +1,156 @@","lines":[{"newLine":1,"kind":"added","text":"name: px1 review artifact"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"on:"},{"newLine":4,"kind":"added","text":"  pull_request_target:"},{"newLine":5,"kind":"added","text":"    types: [opened, synchronize, reopened]"},{"newLine":6,"kind":" (()=>{
const report=JSON.parse(document.getElementById('report-data').textContent);
const app=document.getElementById('app');
const files=Array.isArray(report.files)?report.files:[];

/* Acknowledgements live in this browser only. The key predates the redesign;
   keeping it means earlier acknowledgements still apply. */
const ackKey='px1:ack:'+report.repository+':'+report.head;
let ack=new Set();
try{const saved=JSON.parse(localStorage.getItem(ackKey)||'[]');if(Array.isArray(saved))ack=new Set(saved.filter((k)=>typeof k==='string'))}catch{}

/* One list of everything worth a reader's attention, anchored to a file. */
const items=[];
const fileIndex=new Map(files.map((f,i)=>[f.path,i]));
const add=(it)=>{if(fileIndex.has(it.path)){it.fi=fileIndex.get(it.path);it.id='ann-'+items.length;items.push(it)}};
for(const hit of ruleHits)add({k:'rule',ackId:hit.key,path:hit.path,line:hit.line,title:hit.message,why:'Team rule '+hit.ruleId+(hit.origin?' ('+hit.origin+')':'')+'.',ev:hit.text,src:hit.source});
for(const flag of attention)add({k:'attn',ackId:flag.id,path:flag.path,line:flag.line||0,title:flag.title,why:flag.reason,ev:flag.evidence,src:'rule '+flag.rule});
for(const ex of explanations)add({k:'note',path:ex.path,line:ex.lineStart,lineEnd:Math.max(ex.lineEnd||0,ex.lineStart),title:ex.title,why:ex.summary,src:'AI explanation'});
const needsDecision=(it)=>it.k!=='note'&&!ack.has(it.ackId);
const open=()=>items.filter(needsDecision);

/* ---- top bar ---- */
const top=h('header','top');
const topIn=h('div','top-in');
const brand=h('div','brand');
brand.append(h('span',null,'Review report'),h('span',null,report.repository||''));
const range=h('span','range');
range.append(h('b',null,short(report.head)),document.createTextNode(' ← '),h('b',null,short(report.base)),document.createTextNode(report.generatedAt?' · generated '+new Date(report.generatedAt).toISOString().replace('T',' ').slice(0,16)+' UTC':''));
brand.append(range);
const root=document.documentElement;
const themeBtn=h('button','theme-btn');themeBtn.type='button';
const paintTheme=()=>{const light=root.dataset.theme==='light';themeBtn.textContent=light?'Dark theme':'Light theme';themeBtn.setAttribute('aria-label','Switch to '+(light?'dark':'light')+' theme')};
themeBtn.onclick=()=>{const next=root.dataset.theme==='light'?'dark':'light';root.dataset.theme=next;try{localStorage.setItem('px1:theme',next)}catch{}paintTheme()};
paintTheme();
brand.append(themeBtn);
const headline=h('div','headline');
const h1=h('h1');const verdict=h('div','verdict');
headline.append(h1,verdict);
topIn.append(brand,headline);
const checksPanel=h('div','checks');checksPanel.hidden=true;
top.append(topIn,checksPanel);

if(verification.available&&checks.length){
  const inner=h('div','checks-in');
  for(const c of checks){
    const row=h(c.url?'a':'div','check '+c.status);
    if(c.url){row.href=c.url;row.rel='noopener noreferrer'}
    row.append(h('span','dot'),h('span','name',c.name),h('span','st',c.status));
    inner.append(row);
  }
  checksPanel.append(inner);
}else{
  checksPanel.append(h('div','checks-note',verification.error||'No CI verification is attached to this report.'));
}

const plural=(n,w)=>n+' '+w+(n===1?'':'s');
function paintTop(){
  const o=open(),rules=o.filter((i)=>i.k==='rule').length,attn=o.filter((i)=>i.k==='attn').length;
  const failing=checks.filter((c)=>c.status==='failed').length;
  const pending=checks.filter((c)=>c.status==='running'||c.status==='queued').length;
  const parts=[];
  h1.textContent='';
  if(o.length)h1.textContent=plural(o.length,'place')+(o.length===1?' needs':' need')+' a decision';
  else h1.textContent='Nothing open';
  if(failing)h1.textContent+=(o.length?', and ':', but ')+plural(failing,'check')+(failing===1?' is':' are')+' failing';
  verdict.textContent='';
  verdict.append(h('span','chip '+(rules?'chip-danger':''),plural(rules,'rule finding')));
  verdict.append(h('span','chip '+(attn?'chip-attention':''),plural(attn,'attention flag')));
  const ci=h('button','chip '+(failing?'chip-danger':pending?'chip-attention':''));
  ci.type='button';
  ci.setAttribute('aria-expanded',String(!checksPanel.hidden));
  ci.textContent=verification.available&&checks.length?'CI '+checks.filter((c)=>c.status==='passed').length+'/'+checks.length+' passed':'CI not attached';
  ci.onclick=()=>{checksPanel.hidden=!checksPanel.hidden;ci.setAttribute('aria-expanded',String(!checksPanel.hidden));syncTop()};
  verdict.append(ci);
  {const n=items.filter((i)=>i.k==='note').length;verdict.append(h('span','chip'+(n?' chip-note':''),plural(n,'AI note')))}
}

/* ---- rail ---- */
const rail=h('aside','rail');rail.setAttribute('aria-label','Review navigation');
const queueSec=h('section');const queueHead=h('h2','eyebrow','Review queue ');const queueCount=h('span','count');queueHead.append(queueCount);
const queue=h('ul','queue');queueSec.append(queueHead,queue);
const filesSec=h('section');const filesHead=h('h2','eyebrow','Files ');
const seg=h('span','seg');seg.setAttribute('role','group');seg.setAttribute('aria-label','File filter');
const fAll=h('button',null,'All '+files.length),fFlag=h('button',null,'Flagged');

let flaggedOnly=false;

const order={rule:0,attn:1,note:2};

  queue.textContent='';
  queueCount.textContent=open().length+' open';
  if(!items.length){queue.append(h('p','empty','Nothing to review beyond the diff.'));return}
  [...items].sort((a,b)=>order[a.k]-order[b.k]).forEach((it)=>{
    const a=h('a','qitem'+(it.k!=='note'&&ack.has(it.ackId)?' done':''));a.href='#'+it.id;
    const row=h('div','row');row.append(chipFor(it.k),h('span','t',it.title));
    a.append(row,h('span','w',it.path+(it.line?':'+it.line:'')));
    const li=h('li');li.append(a);queue.append(li);
  });
}
const stats=files.map((f)=>{let a=0,d=0;for(const hk of f.hunks||[])for(const l of hk.lines||[]){if(l.kind==='added')a++;else if(l.kind==='removed')d++}return{a,d}});
function paintFiles(){
  fileList.textContent='';
  fAll.setAttribute('aria-pressed',String(!flaggedOnly));fFlag.setAttribute('aria-pressed',String(flaggedOnly));
  const flaggedCount=files.filter((f,i)=>items.some((x)=>x.fi===i)).length;
  fFlag.textContent='Flagged '+flaggedCount;
  files.forEach((f,i)=>{
    const mine=items.filter((x)=>x.fi===i);
    if(flaggedOnly&&!mine.length)return;
    const li=h('li'),link=h('a','file');link.href='#f'+i;
    const parts=f.path.split('/'),base=parts.pop(),p=h('span','p');
    if(parts.length)p.append(h('span',null,parts.join('/')+'/'));
    p.append(h('b',null,base));
    const m=h('span','m');
    for(const [kind,cls] of [['rule','r'],['attn','a'],['note','n']]){const n=mine.filter((x)=>x.k===kind).length;if(n)m.append(h('i','mark '+cls,n))}
    link.append(p,m,h('span','delta','+'+stats[i].a+' −'+stats[i].d+' · '+(STATUS[f.status]||f.status)));
    li.append(link);fileList.append(li);
  });
}
fAll.onclick=()=>{flaggedOnly=false;paintFiles()};
fFlag.onclick=()=>{flaggedOnly=true;paintFiles()};

/* ---- diff ---- */
function annotation(it,fileLevel){
  const a=h('div','ann '+it.k+(fileLevel?' filelevel':''));a.id=it.id;
  const head=h('div','ann-top');
  head.append(chipFor(it.k),h('span','ann-title',it.title));
  if(fileLevel&&it.line)head.append(h('span','src','line '+it.line));
  if(it.src)head.append(h('span','src',it.src));
  if(it.k!=='note'){
    const b=h('button','btn act');b.type='button';
    const paint=()=>{const on=ack.has(it.ackId);b.textContent=on?'Acknowledged':'Acknowledge';b.setAttribute('aria-pressed',String(on));a.classList.toggle('done',on)};
    b.onclick=()=>{ack.has(it.ackId)?ack.delete(it.ackId):ack.add(it.ackId);persist();paint();paintTop();paintQueue()};
    paint();head.append(b);
  }
  a.append(head);
  if(it.why)a.append(h('p',null,it.why));
  if(it.ev)a.append(h('code','ev',it.ev));
  return a;
}
/* An AI note is a slim strip under the last line it explains, collapsed until opened. */
const rangeLabel=(it)=>it.lineEnd>it.line?'Lines '+it.line+'–'+it.lineEnd:'Line '+it.line;
function noteStrip(it){
  const a=h('div','ann note');a.id=it.id;
  const head=h('button','note-head');head.type='button';head.setAttribute('aria-expanded','false');
  const glyph=h('span','note-glyph','✦');glyph.setAttribute('aria-hidden','true');
  head.append(glyph,h('span','note-title',it.title),h('span','note-range',rangeLabel(it)),h('span','note-caret'));
  const body=h('div','note-body');body.hidden=true;
  body.append(h('p',null,it.why),h('span','src','AI explanation · generated for this commit'));
  const set=(on)=>{head.setAttribute('aria-expanded',String(on));body.hidden=!on;a.classList.toggle('open',on)};
  head.onclick=()=>set(body.hidden);
  a.open=()=>set(true);
  a.append(head,body);
  return a;
}
const openNoteFromHash=()=>{const el=location.hash.length>1?document.getElementById(location.hash.slice(1)):null;if(el&&el.open)el.open()};
addEventListener('hashchange',openNoteFromHash);

const main=h('main','main');
files.forEach((f,i)=>{
  const sec=h('section','fsec');sec.id='f'+i;
  const head=h('div','fhead');
  head.append(h('span','path',f.path),h('span','eyebrow',STATUS[f.status]||f.status),h('span','spacer'),h('span','mono muted','+'+stats[i].a+' −'+stats[i].d));
  sec.append(head);
  const body=h('div','fbody');
  const mine=items.filter((x)=>x.fi===i);
  const placed=new Set();
  const hunks=Array.isArray(f.hunks)?f.hunks:[];
  /* An annotation sits under its line when that line is in the diff; otherwise it leads the file. */
  const lineOf=(it)=>{if(!it.line)return null;for(const hk of hunks)for(const l of hk.lines||[])if(l.newLine===it.line&&l.kind!=='removed')return l;return null};
  const spanOf=(it)=>{const out=[];for(const hk of hunks)for(const l of hk.lines||[])if(l.newLine>=it.line&&l.newLine<=it.lineEnd&&l.kind!=='removed')out.push(l);return out};
  const byLine=new Map(),noteAfter=new Map(),noteSpans=new Map();
  for(const it of mine){
    if(it.k==='note'){const span=spanOf(it);if(span.length){noteSpans.set(it,span);const last=span[span.length-1];if(!noteAfter.has(last))noteAfter.set(last,[]);noteAfter.get(last).push(it);placed.add(it)}continue}
    const l=lineOf(it);if(l){if(!byLine.has(l))byLine.set(l,[]);byLine.get(l).push(it);placed.add(it)}
  }
  for(const it of mine)if(!placed.has(it)){const card=annotation(it,true);if(it.k==='note'){card.querySelector('.ann-top').append(h('span','src',rangeLabel(it)))}body.append(card)}
  const rowOf=new Map(),strips=[];
  if(hunks.length){
    for(const hk of hunks){
      const hunk=h('div','hunk');hunk.id=hk.id||'';hunk.append(h('div','hh',hk.header));
      for(const l of hk.lines||[]){
        const marks=byLine.get(l)||[];
        const row=h('div','ln '+l.kind);
        row.append(h('span','g',l.oldLine||''),h('span','g',l.newLine||''),h('span','mk',l.kind==='added'?'+':l.kind==='removed'?'−':' '),h('span','c',l.text));
        rowOf.set(l,row);hunk.append(row);
        for(const it of marks)hunk.append(annotation(it,false));
        for(const it of noteAfter.get(l)||[])strips.push([it,hunk]);
      }
      body.append(hunk);
    }
    /* Strips are placed after their last explained line once every row exists. */
    for(const [it,hunk] of strips){
      const span=noteSpans.get(it);
      rowOf.get(span[span.length-1]).after(noteStrip(it));
    }
  }else if(f.diff){body.append(h('pre',null,f.diff))}
  else body.append(h('p','none','No textual diff available.'));
  sec.append(body);main.append(sec);
});
if(!files.length)main.append(h('p','muted','No changed files.'));

/* ---- spine: every annotation at its position on the page ---- */
const spine=h('div','spine');spine.setAttribute('aria-hidden','true');
const thumb=h('div','thumb');spine.append(thumb);
function paintSpine(){
  spine.querySelectorAll('a').forEach((a)=>a.remove());
  const total=document.documentElement.scrollHeight;
  for(const it of items){
    const el=document.getElementById(it.id);if(!el)continue;
    const a=h('a',it.k);a.href='#'+it.id;a.tabIndex=-1;
    a.style.top=((el.getBoundingClientRect().top+scrollY)/total*100)+'%';
    spine.append(a);
  }
  paintThumb();
}
function paintThumb(){const total=document.documentElement.scrollHeight;thumb.style.top=(scrollY/total*100)+'%';thumb.style.height=(innerHeight/total*100)+'%'}
function syncTop(){document.documentElement.style.setProperty('--top-h',top.offsetHeight+'px');paintSpine()}

const wrap=h('div','wrap');wrap.append(rail,main,spine);
/* The divider between the side panel and the diff is a drag handle. Width is remembered;
   double-click or Home resets it. Narrow screens stack the panel and hide the handle. */
const RAIL_DEFAULT=288,RAIL_MIN=200,RAIL_MAX=520,railKey='px1:rail-width';
const handle=h('div','resize-handle');
handle.setAttribute('role','separator');handle.setAttribute('aria-orientation','vertical');
handle.setAttribute('aria-label','Resize side panel');handle.tabIndex=0;
handle.append(h('span','grip'));
wrap.append(handle);
const clampRail=(w)=>Math.round(Math.min(RAIL_MAX,Math.max(RAIL_MIN,Math.min(w,wrap.clientWidth*0.45))));
function setRailWidth(w,remember){
  w=clampRail(w);
  wrap.style.setProperty('--rail-w',w+'px');
  handle.setAttribute('aria-valuenow',String(w));handle.setAttribute('aria-valuemin',String(RAIL_MIN));handle.setAttribute('aria-valuemax',String(RAIL_MAX));
  if(remember){try{localStorage.setItem(railKey,String(w))}catch{}}
  return w;
}
let savedWidth=RAIL_DEFAULT;
try{const n=parseInt(localStorage.getItem(railKey),10);if(n>0)savedWidth=n}catch{}
let frame=0;const settle=()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(syncTop)};
handle.addEventListener('pointerdown',(e)=>{
  if(e.button!==0)return;
  e.preventDefault();handle.setPointerCapture(e.pointerId);
  document.body.classList.add('resizing');handle.classList.add('active');
  const left=wrap.getBoundingClientRect().left+parseFloat(getComputedStyle(wrap).paddingLeft);
  const move=(ev)=>{setRailWidth(ev.clientX-left,false);settle()};
  const done=()=>{
    handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',done);handle.removeEventListener('pointercancel',done);
    document.body.classList.remove('resizing');handle.classList.remove('active');
    setRailWidth(parseFloat(wrap.style.getPropertyValue('--rail-w')),true);settle();
  };
  handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',done);handle.addEventListener('pointercancel',done);
});
handle.addEventListener('dblclick',()=>{setRailWidth(RAIL_DEFAULT,true);settle()});
handle.addEventListener('keydown',(e)=>{
  const now=parseFloat(wrap.style.getPropertyValue('--rail-w'))||RAIL_DEFAULT;
  let next=null;
  if(e.key==='ArrowLeft')next=now-16;else if(e.key==='ArrowRight')next=now+16;
  else if(e.key==='Home')next=RAIL_DEFAULT;
  if(next===null)return;
  e.preventDefault();setRailWidth(next,true);settle();
});
addEventListener('resize',()=>setRailWidth(parseFloat(wrap.style.getPropertyValue('--rail-w'))||savedWidth,false));
const foot=h('div','foot','Acknowledgements are saved in this browser only and apply to commit '+short(report.head)+'.');
app.textContent='';
app.append(top,wrap,foot);
setRailWidth(savedWidth,false);
paintTop();paintQueue();paintFiles();syncTop();
/* A deep link such as #ann-3 opens its note and scrolls to it once the page is built. */
openNoteFromHash();
if(location.hash.length>1)document.getElementById(location.hash.slice(1))?.scrollIntoView();
addEventListener('scroll',paintThumb,{passive:true});
addEventListener('resize',syncTop);
document.fonts?.ready.then(syncTop);
})();
</script></body></html>
