ng to a different revision. Remove the report and confirm Review remains usable with an empty CI state.\n-1. Open px1 through a hostname or LAN IP and confirm patch, agent, and check attempts are refused. Repeat with only `-allow-patch` and `PX1_REMOTE_TOKEN`, and confirm agent execution is still refused while an authenticated patch reaches path checks. Loopback keeps local patch and agent access.\n-1. Run `go test ./...`, `node ./scripts/build-web.js`, and `git diff --check` with Go 1.25+. Record exact versions and results in the release notes.\n","hunks":[{"id":"diff-26d549b44aeb5589","header":"@@ -1,24 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# px1 P1 MVP manual test checklist"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"Run this checklist on Go 1.25+ before tagging the P1 MVP. Use a disposable Git worktree with a configured local coding harness and a GitHub Actions verification fixture."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## Review flow"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"1. Start px1, open **Review**, and start a review session. Confirm it reports no changes."},{"oldLine":8,"kind":"removed","text":"1. Modify two files outside px1 (or through the agent). Confirm only those files appear in the queue and **Next change** opens the task-baseline diff."},{"oldLine":9,"kind":"removed","text":"1. Mark one file reviewed, modify it again, refresh the queue, and confirm its state becomes **stale** rather than remaining reviewed."},{"oldLine":10,"kind":"removed","text":"1. Use the review search field and status filters to narrow the queue; confirm **Previous change** and **Next change** follow only the visible pending results. Confirm `Alt+Shift+↑/↓` performs the same navigation when focus is outside a text field."},{"oldLine":11,"kind":"removed","text":"1. Select changed code and add a comment. Confirm it persists after closing and reopening the review pane."},{"oldLine":12,"kind":"removed","text":"1. Add two current comments, choose **Ask agent**, and confirm the agent receives both file/line anchors; inspect the refreshed queue afterward."},{"oldLine":13,"kind":"removed","text":""},{"oldLine":14,"kind":"removed","text":"## Human interventions"},{"oldLine":15,"kind":"removed","text":""},{"oldLine":16,"kind":"removed","text":"1. Select a changed range, add a review comment, and confirm the comment appears on the review diff."},{"oldLine":17,"kind":"removed","text":"1. From a task-baseline diff, use **Revert hunk** on a normal replacement hunk. Confirm the hunk matches the task-start snapshot and that a subsequent external edit causes a stale-write rejection."},{"oldLine":18,"kind":"removed","text":""},{"oldLine":19,"kind":"removed","text":"## Verification and safety"},{"oldLine":20,"kind":"removed","text":""},{"oldLine":21,"kind":"removed","text":"1. Start a review and place a `.px1/verification.json` report in the workspace with `source: \"github-actions\"`, the active commit SHA, one passing check, and one failing check. Confirm both results appear in Review and link clicks open HTTPS CI URLs."},{"oldLine":22,"kind":"removed","text":"1. Change the report revision to another SHA and confirm the results are rejected as belonging to a different revision. Remove the report and confirm Review remains usable with an empty CI state."},{"oldLine":23,"kind":"removed","text":"1. Open px1 through a hostname or LAN IP and confirm patch, agent, and check attempts are refused. Repeat with only `-allow-patch` and `PX1_REMOTE_TOKEN`, and confirm agent execution is still refused while an authenticated patch reaches path checks. Loopback keeps local patch and agent access."},{"oldLine":24,"kind":"removed","text":"1. Run `go test ./...`, `node ./scripts/build-web.js`, and `git diff --check` with Go 1.25+. Record exact versions and results in the release notes."}]}]},{"path":"docs/PRODUCT_VISION.md","status":"M","diff":"diff --git a/docs/PRODUCT_VISION.md b/docs/PRODUCT_VISION.md\nindex 0824d40..704bdf3 100644\n--- a/docs/PRODUCT_VISION.md\n+++ b/docs/PRODUCT_VISION.md\n@@ -1,63 +1,51 @@\n-# px1: a clearer way to review a PR\n+# Product vision\n \n-Agents can produce code faster than people can review it. px1 helps the reviewer\n-understand a PR and check it against the team's expectations. The main product\n-is an HTML review report linked from the GitHub PR.\n+Agents can write pull requests faster than people can confidently review them.\n+px1 gives the reviewer a compact artifact that explains what changed and where\n+the team should pay attention.\n \n-## The experience we are building\n+## The product\n \n-An agent opens a PR. A GitHub Action reads the changes and repository rules,\n-generates a report, and adds a link to the PR. The reviewer sees:\n+When a pull request opens or changes, GitHub Actions generates a static report\n+for that exact head commit. GitHub Pages hosts it and a sticky PR comment links\n+to it. The report combines:\n \n-- **Diffs:** what was added, removed, or changed.\n-- **Highlighted blocks:** related changes grouped into readable pieces.\n-- **AI explanation chips:** small labels beside blocks that open concise\n-  explanations of what changed and why it matters. They should identify\n-  uncertainty rather than invent the author's intent.\n-- **Rule findings:** the team rule, the offending code, and a short explanation.\n-- **CI results:** available tests and checks for the reviewed commit.\n+- readable, structured diffs;\n+- concise explanation chips beside changed blocks;\n+- repository-defined team-rule findings with evidence;\n+- exact-revision CI results; and\n+- transparent attention signals for changes with wider impact.\n \n-Approval and requests for changes remain in GitHub. Generating a report does\n-not mean the code is correct or approved.\n+The reviewer uses that context and then approves or requests changes in GitHub.\n+px1 does not make the decision for them.\n \n-## Example\n+## Team policy belongs in the repository\n \n-A team says, “Use ternaries for simple conditional assignments.” A PR adds an\n-if/else that assigns one of two values. The intended report highlights that\n-block and explains: “This assigns a value based on a condition. Your team asks\n-for a ternary in this case.” A separate AI chip explains what the value affects.\n+Teams store rules in `.px1/rules.json`. Rules are versioned and reviewed with\n+the code, so a finding can always show which policy produced it. The current\n+implementation uses patterns and file globs. The longer-term goal is narrowly\n+scoped semantic rules written in ordinary language, with evidence and explicit\n+uncertainty.\n \n-The rule belongs to the team. px1 should distinguish that convention from a\n-bug, and avoid flagging unrelated uses of `if` under this example rule.\n+## AI is optional context\n \n-## Rules live with the code\n+Model-generated explanations should clarify mechanics, dependencies, and\n+review impact. They must not invent author intent or label code safe. Provider\n+keys stay in GitHub Actions secrets; only validated, commit-pinned output enters\n+the static report.\n \n-The file is `.px1/rules.json` at the repository root. Keeping it in Git makes\n-rule changes reviewable alongside code changes. The goal is to support rules\n-expressed in the team's own words.\n+Without a model, px1 still provides diffs, rules, CI evidence, and deterministic\n+attention signals.\n \n-The current report implementation requires regex patterns and optional file\n-globs alongside readable messages. It checks added lines. Arbitrary\n-plain-language rules, multi-line reasoning, and semantic checks need more work.\n+## Product boundary\n \n-## Delivery and status\n+px1 is not:\n \n-The first path uses GitHub Actions to generate a static report, GitHub Pages\n-to serve it, and a PR comment to link to it. No px1 SaaS is required. AI\n-explanations need a configured provider; diffs and pattern matching do not.\n+- a local IDE or code browser;\n+- an agent editor or task runner;\n+- a mutable review-session service;\n+- a self-hosted web application;\n+- a replacement for GitHub comments or approvals; or\n+- a px1-operated SaaS.\n \n-Report export, contextual findings, explanation chips, structured highlighted\n-diffs, exact-revision CI evidence, GitHub Pages publishing, sticky PR links,\n-and historical SHA retention are implemented on the default branch. A\n-self-hosted server can also accept a bearer-authenticated, immutable snapshot\n-and serve it from a commit-pinned GitHub review route. Authenticated reviewer\n-links and automated explanation generation remain planned.\n-\n-## Priorities\n-\n-Make the report easy to open, the changes easy to understand, and the findings\n-easy to verify against the code. Measure progress by whether reviewers can\n-understand the PR and spot rule violations with less back-and-forth.\n-\n-Local navigation and the CLI support development and testing. The main product\n-promise is a useful review artifact attached to the PR.\n+The product is the artifact attached to the PR.\n","hunks":[{"id":"diff-afb81f70b49faefe","header":"@@ -1,63 +1,51 @@","lines":[{"oldLine":1,"kind":"removed","text":"# px1: a clearer way to review a PR"},{"newLine":1,"kind":"added","text":"# Product vision"},{"oldLine":2,"newLine":2,"kind":"context","text":""},{"oldLine":3,"kind":"removed","text":"Agents can produce code faster than people can review it. px1 helps the reviewer"},{"oldLine":4,"kind":"removed","text":"understand a PR and check it against the team's expectations. The main product"},{"oldLine":5,"kind":"removed","text":"is an HTML review report linked from the GitHub PR."},{"newLine":3,"kind":"added","text":"Agents can write pull requests faster than people can confidently review them."},{"newLine":4,"kind":"added","text":"px1 gives the reviewer a compact artifact that explains what change elow, then POST that envelope to the import endpoint.\n-\n-The request body is limited to 16 MiB and uses this versioned shape:\n-\n-```json\n-{\n-  \"version\": 1,\n-  \"provider\": \"github\",\n-  \"owner\": \"acme\",\n-  \"repository\": \"widgets\",\n-  \"pullRequest\": 42,\n-  \"base\": \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\",\n-  \"head\": \"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\",\n-  \"snapshot\": {\n-    \"version\": 1,\n-    \"repository\": \"widgets\",\n-    \"base\": \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\",\n-    \"head\": \"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\",\n-    \"generatedAt\": \"2026-10-03T12:00:00Z\",\n-    \"files\": [],\n-    \"ruleHits\": [],\n-    \"explanations\": [],\n-    \"verification\": {\n-      \"available\": false,\n-      \"checks\": []\n-    }\n-  }\n-}\n-```\n-\n-The top-level repository and commit identity must exactly match the embedded\n-snapshot. Owners, repository names, PR numbers, changed-file paths, findings,\n-explanations, and verification evidence are validated before anything is\n-stored. Unknown JSON fields are rejected.\n-\n-An initial import returns HTTP `201`; retrying identical content returns HTTP\n-`200`. Different content for the same repository, PR, and head SHA returns\n-HTTP `409`, preserving the immutable-link contract. Snapshots are stored with\n-user-only permissions under the px1 state directory, not in the checkout.\n-\n-The response contains the review path:\n-\n-```text\n-/github/acme/widgets/pull/42?sha=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\u0026sig=\u003chmac\u003e\n-```\n-\n-When `PX1_REVIEW_LINK_SECRET` is configured, the `sig` value is an HMAC-SHA256\n-signature over the provider, owner, repository, pull-request number, and head\n-SHA. Missing or invalid signatures are rejected before a stored report is\n-read. GitHub Pages links remain public static artifacts and do not use this\n-self-hosted signature.\n-\n-Use an HTTPS reverse proxy and keep the service behind a VPN or private\n-network. The import endpoint and self-hosted read links are independently\n-authenticated; possessing a valid signed URL is sufficient to read that\n-immutable report.\n","hunks":[{"id":"diff-e7359aff8107ab8b","header":"@@ -1,92 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Self-hosted review snapshot import"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"The live px1 server accepts a commit-pinned review snapshot from trusted CI:"},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"```text"},{"oldLine":6,"kind":"removed","text":"POST /api/review/import"},{"oldLine":7,"kind":"removed","text":"Authorization: Bearer \u003cPX1_IMPORT_TOKEN\u003e"},{"oldLine":8,"kind":"removed","text":"Content-Type: application/json"},{"oldLine":9,"kind":"removed","text":"```"},{"oldLine":10,"kind":"removed","text":""},{"oldLine":11,"kind":"removed","text":"Configure a high-entropy token on the server and store the same value as a"},{"oldLine":12,"kind":"removed","text":"masked GitHub Actions secret:"},{"oldLine":13,"kind":"removed","text":""},{"oldLine":14,"kind":"removed","text":"```bash"},{"oldLine":15,"kind":"removed","text":"PX1_IMPORT_TOKEN='replace-with-a-random-secret' \\"},{"oldLine":16,"kind":"removed","text":"PX1_REVIEW_LINK_SECRET='replace-with-a-different-random-secret' \\"},{"oldLine":17,"kind":"removed","text":"px1 -host 0.0.0.0 -port 7777 /workspace"},{"oldLine":18,"kind":"removed","text":"```"},{"oldLine":19,"kind":"removed","text":""},{"oldLine":20,"kind":"removed","text":"`PX1_IMPORT_TOKEN` authenticates CI uploads. `PX1_REVIEW_LINK_SECRET` signs"},{"oldLine":21,"kind":"removed","text":"review URLs. Keep both values server-side and rotate the link secret to revoke"},{"oldLine":22,"kind":"removed","text":"previously issued read links. If the link secret is not configured, px1 keeps"},{"oldLine":23,"kind":"removed","text":"the legacy private-network behavior: imported reports are readable by anyone"},{"oldLine":24,"kind":"removed","text":"who can reach the server and knows the commit-pinned URL."},{"oldLine":25,"kind":"removed","text":""},{"oldLine":26,"kind":"removed","text":"CI can generate the nested `snapshot` object without parsing HTML:"},{"oldLine":27,"kind":"removed","text":""},{"oldLine":28,"kind":"removed","text":"```bash"},{"oldLine":29,"kind":"removed","text":"px1 export-review \\"},{"oldLine":30,"kind":"removed","text":"  --base \"$BASE_SHA\" \\"},{"oldLine":31,"kind":"removed","text":"  --head \"$HEAD_SHA\" \\"},{"oldLine":32,"kind":"removed","text":"  --out ./site \\"},{"oldLine":33,"kind":"removed","text":"  --snapshot-out ./snapshot.json"},{"oldLine":34,"kind":"removed","text":"```"},{"oldLine":35,"kind":"removed","text":""},{"oldLine":36,"kind":"removed","text":"Wrap `snapshot.json` with the GitHub owner, repository, and pull-request fields"},{"oldLine":37,"kind":"removed","text":"shown below, then POST that envelope to the import endpoint."},{"oldLine":38,"kind":"removed","text":""},{"oldLine":39,"kind":"removed","text":"The request body is limited to 16 MiB and uses this versioned shape:"},{"oldLine":40,"kind":"removed","text":""},{"oldLine":41,"kind":"removed","text":"```json"},{"oldLine":42,"kind":"removed","text":"{"},{"oldLine":43,"kind":"removed","text":"  \"version\": 1,"},{"oldLine":44,"kind":"removed","text":"  \"provider\": \"github\","},{"oldLine":45,"kind":"removed","text":"  \"owner\": \"acme\","},{"oldLine":46,"kind":"removed","text":"  \"repository\": \"widgets\","},{"oldLine":47,"kind":"removed","text":"  \"pullRequest\": 42,"},{"oldLine":48,"kind":"removed","text":"  \"base\": \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\","},{"oldLine":49,"kind":"removed","text":"  \"head\": \"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\","},{"oldLine":50,"kind":"removed","text":"  \"snapshot\": {"},{"oldLine":51,"kind":"removed","text":"    \"version\": 1,"},{"oldLine":52,"kind":"removed","text":"    \"repository\": \"widgets\","},{"oldLine":53,"kind":"removed","text":"    \"base\": \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\","},{"oldLine":54,"kind":"removed","text":"    \"head\": \"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\","},{"oldLine":55,"kind":"removed","text":"    \"generatedAt\": \"2026-10-03T12:00:00Z\","},{"oldLine":56,"kind":"removed","text":"    \"files\": [],"},{"oldLine":57,"kind":"removed","text":"    \"ruleHits\": [],"},{"oldLine":58,"kind":"removed","text":"    \"explanations\": [],"},{"oldLine":59,"kind":"removed","text":"    \"verification\": {"},{"oldLine":60,"kind":"removed","text":"      \"available\": false,"},{"oldLine":61,"kind":"removed","text":"      \"checks\": []"},{"oldLine":62,"kind":"removed","text":"    }"},{"oldLine":63,"kind":"removed","text":"  }"},{"oldLine":64,"kind":"removed","text":"}"},{"oldLine":65,"kind":"removed","text":"```"},{"oldLine":66,"kind":"removed","text":""},{"oldLine":67,"kind":"removed","text":"The top-level repository and commit identity must exactly match the embedded"},{"oldLine":68,"kind":"removed","text":"snapshot. Owners, repository names, PR numbers, changed-file paths, findings,"},{"oldLine":69,"kind":"removed","text":"explanations, and verification evidence are validated before anything is"},{"oldLine":70,"kind":"removed","text":"stored. Unknown JSON fields are rejected."},{"oldLine":71,"kind":"removed","text":""},{"oldLine":72,"kind":"removed","text":"An initial import returns HTTP `201`; retrying identical content returns HTTP"},{"oldLine":73,"kind":"removed","text":"`200`. Different content for the same repository, PR, and head SHA returns"},{"oldLine":74,"kind":"removed","text":"HTTP `409`, preserving the immutable-link contract. Snapshots are stored with"},{"oldLine":75,"kind":"removed","text":"user-only permissions under the px1 state directory, not in the checkout."},{"oldLine":76,"kind":"removed","text":""},{"oldLine":77,"kind":"removed","text":"The response contains the review path:"},{"oldLine":78,"kind":"removed","text":" d generation and\n-natural-language rule understanding.\n-\n-This document defines critical instructions, architectural principles, and documentation maintenance workflows for AI coding agents working on px1.\n-\n-## 1. Core Architectural Tenets\n-\n-1. Review artifacts first: help reviewers understand PR changes through diffs, explanations, and team-rule findings. Keep evidence tied to the reviewed commit. Preserve existing confirmation, preview, and undo protections for local mutation APIs.\n-1. Zero Runtime and Single Binary Footprint: Any change must compile into a single static binary (`go:embed` for web assets). Do not introduce runtime dependencies (no Node.js/npm runtime requirement, no external database, no CGO dependencies).\n-1. Stateless in the Workspace: px1 never writes metadata into a served repository. Per-user settings and durable review-session snapshots live outside it under the px1 state directory.\n-1. Performance Budgets: Indexing must complete in milliseconds using bounded concurrency (`NumCPU * 4`). File open must remain $O(1)$ relative to file length using windowed chunking (`hlChunk = 1000`) and browser DOM virtualization. Maintain explicit memory reclamation (`debug.FreeOSMemory()` on idle).\n-\n-## 2. Mandatory Documentation Maintenance Protocol\n-\n-Whenever modifying, adding, or refactoring code in this repository, you must audit and update the documentation accordingly:\n-\n-### Documentation Mapping Matrix\n-\n-| Component Modified                   | Primary Source Files                                             | Docs to Update                                                                                                   |\n-| ------------------------------------ | ---------------------------------------------------------------- | ---------------------------------------------------------------------------------------------------------------- |\n-| System Architecture / Optimizations  | All `.go` files, `web/app.js`                                    | [`docs/internals/architecture.md`](../internals/architecture.md)                                                 |\n-| Indexing / Tree Walk / Gitignore     | `index.go`, `ignore.go`                                          | [`docs/internals/indexing-and-ignore.md`](../internals/indexing-and-ignore.md), [`README.md`](../../README.md)    |\n-| Fuzzy File Finder                    | `fuzzy.go`                                                       | [`docs/internals/fuzzy-search.md`](../internals/fuzzy-search.md)                                                 |\n-| Search / Regex / Symbol Outlines     | `search.go`, `symbols.go`                                        | [`docs/internals/workspace-search.md`](../internals/workspace-search.md), [`BENCHMARKS.md`](../../BENCHMARKS.md) |\n-| Syntax Highlighting \u0026 Lexing         | `highlight.go`                                                   | [`docs/internals/syntax-highlighting.md`](../internals/syntax-highlighting.md), [`README.md`](../../README.md)   |\n-| Language Servers (LSP)               | `lsp.go`, `lspnav.go`, `lspservers.go`, `lspsetup.go`, `calls.go`| [`docs/internals/lsp-and-intelligence.md`](../internals/lsp-and-intelligence.md), [`README.md`](../../README.md)|\n-| Git Integration \u0026 Diffing            | `git.go`                                                         | [`docs/internals/git-integration.md`](../internals/git-integration.md)                                           |\n-| Worktrees \u0026 Workspace Switching      | `git.go`, `server.go`, `index.go`, `web/src/worktree.js`         | [`docs/internals/git-integration.md`](../internals/git-integration.md), [`README.md`](../../README.md)            |\n-| Review Provider Dispatch             | `agent.go`, `settings.go`, `review.go`, `pins.go`                 | [`docs/internals/agent-editing.md`](../internals/agent-editing.md), [`README.md`](../../README.md)                |\n-| Frontend UI / Virtualization         | `web/app.js`, `web/index.html`, `web/style.css`                  | [`docs/internals/editor-virtualization.md`](../internals/editor-virtualization.md), [`README.md`](../../README.md)|\n-| CSS Tokens                           | `web/themes/github-dark.css`, `web/style.css`                    | [`docs/internals/styling-and-themes.md`](../internals/styling-and-themes.md)                                    |\n-| CLI Flags / Configuration            | `main.go`                                                        | [`README.md`](../../README.md)                                                                                  |\n-| Performance Metrics / Scripts        | `benchmark.sh`                                                   | [`BENCHMARKS.md`](../../BENCHMARKS.md)                                                                           |\n-| Release Workflow                     | `Makefile`, `build.sh`, `scripts/build-web.js`                   | [`PUBLISHING.md`](../../PUBLISHING.md)                                                                           |\n-| npm Packaging                        | `npm/px1-cli/`, `scripts/build-npm.js`, `.github/workflows/release.yml` | [`PUBLISHING.md`](../../PUBLISHING.md), [`README.md`](../../README.md)                                     |\n-\n-## 3. Checklist for Agents Prior to Submitting Work\n-\n-- Verification: Ran `go test ./...` and confirmed all unit/regression tests pass (`ok px1`).\n-- Build Integrity: Verified successful build with `go build -o px1 .`.\n-- Web Bundling: If modifying `web/src/`, verified bundle update with `./scripts/build-web.js`.\n-- Architecture Sync: Any new optimization, algorithmic adjustment, or structural change is documented in the corresponding [`docs/internals/`](../internals/README.md) write-up.\n-- Flag \u0026 Shortcut Sync: Any new keyboard shortcut, UI behavior, or CLI flag is reflected in [`README.md`](../../README.md).\n-- Benchmark Alignment: If search, highlight, or index performance characteristics change, verify whether [`BENCHMARKS.md`](../../BENCHMARKS.md) requires updated notes or numbers.\n-\n-## 4. Frontend Architecture \u0026 Code Map for Agents\n-\n-To quickly locate and modify UI features, refer to this structured section index of [`web/index.html`](../../web/index.html) and `web/app.js`:\n-\n-### HTML Structure\n-\n-| Section / Element ID         | Description                                                                                                                                                                                                                                                                          |\n-| ---------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n-| `\u003caside id=\"side\"\u003e`          | Collapsible sidebar containing the file tree and review queue. Its `.panel-head` shows the workspace name (`#root-name`), the changed-files filter (`#btn-changed`), and re-index button (`#btn-reindex`). `#access-policy` states whether this host has local patch and agent access or is remote read-only. Its `.side-foot` holds the px1 logo, GitHub link, and raw JSON settings entry point. |\n-| `\u003cdiv id=\"resizer\"\u003e`         | Draggable splitter between sidebar and main editor viewport.                                                                                                                                                                                                                         |\n-| `\u003cdiv id=\"tabs\"\u003e` \u0026 `#crumbs`| Open file tabs bar and current file path breadcrumb navigation.                                                                                                                                                                                                                      |\n-| `\u003cdiv id=\"editor\"\u003e`          | Core editor container with `#viewport`, `#sizer`, and virtual rows container `#rows`.                                                                                                                                                                                                |\n-| `\u003cdiv id=\"empty\"\u003e`           | Welcome / splash screen shown when no files are open.                                                                                                                                                                                                                                |\n-| `\u003cdiv id=\"hovercard\"\u003e`       | Floating LSP type signature, doc preview, and quick reference buttons.                                                                                                                                                                                                              |\n-| `\u003cdiv id=\"findbar\"\u003e`         | In-file search overlay (Ctrl+F).                                                                                                                                                                                                                                                     |\n-| `\u003cdiv id=\"sel-menu\"\u003e`        | Right-click menu on a selection, offering Copy Ref, Copy with Context, Add Review Comment, and Find Usages.                                                                                                                                                                         |\n-| `\u003cdiv id=\"toast\"\u003e`           | Floating bottom notification toast confirming actions.                                                                                                                                                                                                                               |\n-| `\u003cfooter id=\"status\"\u003e`       | Review action bar. It stays quiet until a code selection exposes Copy Ref, Copy with Context, Add Review Comment, and Patch actions; transient review messages use `#st-pos`. Navigation, file-size, version, and LSP status chrome are deliberately outside this bar. |\n-| `\u003cdiv id=\"overlay\"\u003e`         | Modal overlay hosting Quick Open and Command Palette (`#palette`).                                                                                                                                                                                                                   |\n-| `\u003cdiv id=\"helpsheet\"\u003e`       | Keyboard shortcuts cheat-sheet modal overlay.                                                                                                                                                                                                                                        |\n-\n-### Frontend Modules (`web/src/`)\n-\n-The frontend is modularized into clean ES modules under `web/src/` and bundled into `web/app.js` using `scripts/build-web.js`:\n-\n-| Module                 | Primary Responsibilities \u0026 Key Exports                                                                                                                                                       |\n-| ---------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n-| `web/src/state.js`     | Core state object `S`, `doc_()`, `api()`, `apiPost()`, `esc()`, `$`, `$$`, constants (`LH`, `CHUNK`, `OVERSCAN`, `MOD`, `isMac`). Per-OS shortcut labels: `keyLabel()`, `keyCaps()`, `withKeys()`, `applyKeyLabels()`. |\n-| `web/src/ui.js`        | DOM references (`vp`, `sizer`, `rowsEl`, `editor`, `toastEl`), `showToast()`, `copyToClipboard()`.                                                                                         |\n-| `web/src/renderer.js`  | `measure()`, `layout()`, `render()`, `paint()`, `toggleWordWrap()`, `toggleLineNumbers()`, on-demand chunk fetching.                                                                        |\n-| `web/src/tabs.js`      | `openFile()`, `closeTab()`, `switchTab()`, `drawTabs()`, `drawCrumbs()`, `showImage()`, `reloadOpenTabs()` (in-place tab refresh on reindex), `reopenClosedTab()` (Alt+Shift+T).          |\n-| `web/src/history.js`   | `pushHistory()`, `go()`: jump history back/forward (Alt+Left, Alt+Right).                                                                                                                   |\n-| `web/src/status.js`    | `updateStatus()`, `setStatusNote()`, and `setLspState()` for review actions, transient notes, and active LSP state.                                                          |\n-| `web/src/cursor.js`    | `wordAtPoint()`, `moveCursor()`, click / double-click selection, occurrence highlight.                                                                                                       |\n-| `web/src/hover.js`     | `onMove()`, `hoverAt()`, `showHover()`, `hideHover()`, token link modifier handling.                                                                                                        |\n-| `web/src/selbar.js`    | Status bar selection mode: `updateSelectionBar()`, `hideSelectionBar()`, `runSelectionAction()`. Whole-file selection: `selectAll()`, `clearSelectAll()`, `copySelectAll()`. Diff-view selections, on either side of a split and including deleted lines, resolve to working-tree line numbers via `diffSelection()`. Right-click menu: `closeSelMenu()`.                  |\n-| `web/src/lsp.js`       | `gotoDefinition()`, `findReferences()`, `warmLSP()`, `lspCall()`, hit formatting.                                                                                                            |\n-| `web/src/tree.js`      | `drawTree()`, `fileKind()`, `revealDir()`, `revealFile()`, explorer tree click handlers.                                                                                                    |\n-| `web/src/search.js`    | `runSearch()`, `renderResults()`, `displayPath()`, workspace search panel.                                                                                                                   |\n-| `web/src/outline.js`   | `loadOutline()`, `upgradeOutline()`, `drawOutline()`, symbol kind badges.                                                                                                                    |\n-| `web/src/panels.js`    | `showPanel()`, sidebar switching, reindex trigger, draggable sidebar resizer.                                                                                                               |\n-| `web/src/inspector.js` | `showRightInspector()`, `setRightInspectorTab()`, `inspectReferences()`, right resizer.                                                                                                       |\n-| `web/src/calls.js`     | `showCalls()`, `initCalls()`, `openLspSetup()`: call trail tree in the right inspector (callers / callees via `/api/lsp/calls`).                                                            |\n-| `web/src/lspsetup.js`  | `renderLspSetup()`, `cancelLspSetup()`: install / detect-and-start panel shown when no language server is running.                                                                          |\n-| `web/src/find.js`      | `openFind()`, `clearFind()`, `runFind()`, `jumpToHit()`, minimap hit dots (Ctrl+F).                                                                                                         |\n-| `web/src/palette.js`   | `openPalette()`, `refreshPalette()`, `COMMANDS`, fuzzy file/symbol/command finder.                                                                                                           |\n-| `web/src/shortcuts.js` | `showHelp()`, Alt+Z word wrap toggle, keyboard shortcuts listener.                                                                                                                          |\n-| Provider jobs          | Implemented in `agent.go`; explicit review actions invoke them without adding provider state to editor selection or navigation. |\n-| `web/src/main.js`      | Module initializations and application `boot()` sequence.                                                                                                                                    |\n","hunks":[{"id":"diff-a0d227d4de788beb","header":"@@ -1,106 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Operational Guidelines for AI Agents"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"## Product vision"},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"Agents write the PR. px1 helps reviewers understand it through an attached HTML"},{"oldLine":6,"kind":"removed","text":"report: diffs, highlighted code blocks, concise AI explanation chips, and"},{"oldLine":7,"kind":"removed","text":"violations of team rules stored in `.px1/rules.json`. Each report identifies"},{"oldLine":8,"kind":"removed","text":"the reviewed commit. Reviewers make the final decision in GitHub."},{"oldLine":9,"kind":"removed","text":""},{"oldLine":10,"kind":"removed","text":"Prioritize the PR report experience. Preserve the self-hosted, no-account core"},{"oldLine":11,"kind":"removed","text":"and keep GitHub and LLM integrations additive. Follow the"},{"oldLine":12,"kind":"removed","text":"[product vision](../PRODUCT_VISION.md), and distinguish implemented"},{"oldLine":13,"kind":"removed","text":"provider-neutral explanation chips from planned automated generation and"},{"oldLine":14,"kind":"removed","text":"natural-language rule understanding."},{"oldLine":15,"kind":"removed","text":""},{"oldLine":16,"kind":"removed","text":"This document defines critical instructions, architectural principles, and documentation maintenance workflows for AI coding agents working on px1."},{"oldLine":17,"kind":"removed","text":""},{"oldLine":18,"kind":"removed","text":"## 1. Core Architectural Tenets"},{"oldLine":19,"kind":"removed","text":""},{"oldLine":20,"kind":"removed","text":"1. Review artifacts first: help reviewers understand PR changes through diffs, explanations, and team-rule findings. Keep evidence tied to the reviewed commit. Preserve existing confirmation, preview, and undo protections for local mutation APIs."},{"oldLine":21,"kind":"removed","text":"1. Zero Runtime and Single Binary Footprint: Any change must compile into a single static binary (`go:embed` for web assets). Do not introduce runtime dependencies (no Node.js/npm runtime requirement, no external database, no CGO dependencies)."},{"oldLine":22,"kind":"removed","text":"1. Stateless in the Workspace: px1 never writes metadata into a served repository. Per-user settings and durable review-session snapshots live outside it under the px1 state directory."},{"oldLine":23,"kind":"removed","text":"1. Performance Budgets: Indexing must complete in milliseconds using bounded concurrency (`NumCPU * 4`). File open must remain $O(1)$ relative to file length using windowed chunking (`hlChunk = 1000`) and browser DOM virtualization. Maintain explicit memory reclamation (`debug.FreeOSMemory()` on idle)."},{"oldLine":24,"kind":"removed","text":""},{"oldLine":25,"kind":"removed","text":"## 2. Mandatory Documentation Maintenance Protocol"},{"oldLine":26,"kind":"removed","text":""},{"oldLine":27,"kind":"removed","text":"Whenever modifying, adding, or refactoring code in this repository, you must audit and update the documentation accordingly:"},{"oldLine":28,"kind":"removed","text":""},{"oldLine":29,"kind":"removed","text":"### Documentation Mapping Matrix"},{"oldLine":30,"kind":"removed","text":""},{"oldLine":31,"kind":"removed","text":"| Component Modified                   | Primary Source Files                                             | Docs to Update                                                                                                   |"},{"oldLine":32,"kind":"removed","text":"| ------------------------------------ | ---------------------------------------------------------------- | ---------------------------------------------------------------------------------------------------------------- |"},{"oldLine":33,"kind":"removed","text":"| System Architecture / Optimizations  | All `.go` files, `web/app.js`                                    | [`docs/internals/architecture.md`](../internals/architecture.md)                                                 |"},{"oldLine":34,"kind":"removed","text":"| Indexing / Tree Walk / Gitignore     | `index.go`, `ignore.go`                                          | [`docs/internals/indexing-and-ignore.md`](../internals/indexing-and-ignore.md), [`README.md`](../../README.md)    |"},{"oldLine":35,"kind":"removed","text":"| Fuzzy File Finder                    | `fuzzy.go`                                                       | [`docs/internals/fuzzy-search.md`](../internals/fuzzy-search.md)                                                 |"},{"oldLine":36,"kind":"removed","text":"| Search / Regex / Symbol Outlines     | `search.go`, `symbols.go`                                        | [`docs/internals/workspace-search.md`](../internals/workspace-search.md), [`BENCHMARKS.md`](../../BENCHMARKS.md) |"},{"oldLine":37,"kind":"removed","text":"| Syntax Highlighting \u0026 Lexing         | `highlight.go`                                                   | [`docs/internals/syntax-highlighting.md`](../internals/syntax-highlighting.md), [`README.md`](../../README.md)   |"},{"oldLine":38,"kind":"removed","text":"| Language Servers (LSP)               | `lsp.go`, `lspnav.go`, `lspservers.go`, `lspsetup.go`, `calls.go`| [`docs/internals/lsp-and-intelligence.md`](../internals/lsp-and-intelligence.md), ":"docs/internals/README.md","status":"D","diff":"diff --git a/docs/internals/README.md b/docs/internals/README.md\ndeleted file mode 100644\nindex 865b08d..0000000\n--- a/docs/internals/README.md\n+++ /dev/null\n@@ -1,90 +0,0 @@\n-# px1 Internal Architecture \u0026 Design Documentation\n-\n-Welcome to the internal engineering documentation for px1, a local-first review\n-control plane for AI-generated code. It turns team-specific rules, commit-\n-pinned diffs, contextual findings, and CI evidence into a reviewable artifact;\n-optional provider integrations can explain code without making the core depend\n-on a cloud service or an LLM. The local application remains an ultra-lightweight,\n-zero-config code reader and navigator packaged as a single statically-linked\n-binary (~9.5 MB).\n-\n-See the [product vision](../PRODUCT_VISION.md) for the intended experience and\n-implementation status.\n-\n-This directory contains in-depth technical write-ups explaining how px1 achieves sub-millisecond startup, instantaneous file navigation, deep code intelligence, and a minimal memory footprint (~20 MB RSS) across codebases containing tens of thousands of files.\n-\n-## 1. Subsystem Architecture Map\n-\n-```mermaid\n-flowchart TD\n-    subgraph Client [\"Browser Frontend (Vanilla JS + CSS, Virtualized)\"]\n-        UI[\"DOM Shell (Sidebar, Tabs, Review Actions)\"]\n-        VirtEditor[\"Virtualized Code Viewer (~60 DOM rows)\"]\n-        Inspector[\"Right Inspector (Call Hierarchy / References)\"]\n-        Palette[\"Command Palette \u0026 Fuzzy Picker\"]\n-    end\n-\n-    subgraph GoServer [\"px1 Go Backend (HTTP / JSON / Gzip)\"]\n-        Router[\"HTTP Router \u0026 Middleware\"]\n-        Scavenger[\"Memory Scavenger (FreeOSMemory after 15s)\"]\n-        IndexEngine[\"In-Memory Index (Paths \u0026 Tree Nodes)\"]\n-        IgnoreEngine[\"Optimized Classification Ignore Engine\"]\n-        FuzzyEngine[\"Two-Pass Bounded Fuzzy Matcher\"]\n-        SearchEngine[\"Parallel Search Pool (Buffer Reuse)\"]\n-        HLEngine[\"Windowed Syntax Highlighter (Chroma + LRU)\"]\n-        LSPMgr[\"Lazy LSP Lifecycle Manager\"]\n-        GitEngine[\"Git Status \u0026 Gutter Engine\"]\n-    end\n-\n-    subgraph HostFS [\"Host Operating System \u0026 Tools\"]\n-        FS[\"Workspace Files \u0026 .gitignore\"]\n-        GitCLI[\"git CLI (porcelain=v2, diff)\"]\n-        LSPBinaries[\"Installed Language Servers (gopls, rust-analyzer, etc.)\"]\n-    end\n-\n-    Client \u003c--\u003e|\"HTTP / JSON (Pooled Gzip)\"| Router\n-    Router --\u003e IndexEngine\n-    Router --\u003e SearchEngine\n-    Router --\u003e FuzzyEngine\n-    Router --\u003e HLEngine\n-    Router --\u003e LSPMgr\n-    Router --\u003e GitEngine\n-    Router --\u003e Scavenger\n-\n-    IndexEngine --\u003e FS\n-    IgnoreEngine --\u003e FS\n-    SearchEngine --\u003e FS\n-    HLEngine --\u003e FS\n-    GitEngine --\u003e GitCLI\n-    LSPMgr --\u003e LSPBinaries\n-```\n-\n-## 2. Documentation Directory\n-\n-The internal documentation is modularized into the following focused guides:\n-\n-### Core Architecture \u0026 Server Runtime\n-\n-- [System Architecture \u0026 Runtime Lifecycle](architecture.md): High-level architectural tenets, single-binary distribution, sub-millisecond startup sequence, HTTP router and endpoints, proactive memory scavenging (`debug.FreeOSMemory()`), and path sandboxing.\n-- [Filesystem Indexing \u0026 Ignore Engine](indexing-and-ignore.md): Bounded-concurrency directory traversal (`NumCPU * 4`), instant root availability, symlink cycle immunity, and the custom classification-based `.gitignore` engine.\n-- [Performance \u0026 Comparative Benchmarks](../../BENCHMARKS.md): Measurement methodology across the 7-repository test corpus (Flask to the Linux Kernel) and side-by-side memory/CPU comparison against the VS Code process tree.\n-\n-### Search \u0026 Intelligence Engines\n-\n-- [Fuzzy Path Matching](fuzzy-search.md): Two-pass bounded search algorithm ($O(N)$ scan time matching dynamic programming ranking accuracy), weighted scoring matrix, and parallel query slicing.\n-- [Workspace Search \u0026 Symbol Extraction](workspace-search.md): Multi-core parallel grep, buffer reuse (`workBuf`), whole-file rejection fast paths (`bytes.Contains`), smart snippet elision (`{Pre, Mid, Post}`), and regex outline extraction.\n-- [Windowed Syntax Highlighting](syntax-highlighting.md): Solving Chroma lexer bottlenecks with viewport-based windowing (`hlChunk = 1000`), byte-capping (`512 KB`), dual-tier tokenization (instant inexact window + background exact pass), and byte-budgeted LRU caching.\n-- [Language Server Protocol (LSP) Architecture](lsp-and-intelligence.md): Lazy on-demand server lifecycle, zero-cost background binary discovery, external path boundary control, stateless call hierarchy trails, in-app installer recipes, and regex fallback.\n-- [Git Awareness \u0026 Diffing](git-integration.md): CLI shell-out architecture that never stages or commits, concurrent status generation with indexing, ancestor folder dirty propagation, gutter diff parsing, and the client-side split/unified diff renderer.\n-- [Review Provider Dispatch](agent-editing.md): The optional provider flow for review explanations and comment follow-up, its headless invocation contract, job status, change detection, and the cache, language-server and tab reload path. Inline editing is intentionally outside the review UI.\n-\n-### Frontend \u0026 UI Subsystems\n-\n-- [Editor Virtualization \u0026 Caret Engine](editor-virtualization.md): Custom ~60-row DOM virtualization, offscreen sub-pixel font measurement, selection preservation across repaints, decoupled overlay caret, and non-destructive inline decorations.\n-- [File Updates \u0026 In-Place Tab Reloading](file-reload-and-updates.md): End-to-end flow for workspace reindex and tab refreshing, in-place document reconciliation, concurrent chunk fetches, live viewport scroll snapshotting, and file shrinkage handling.\n-- [Styling \u0026 CSS Tokens](styling-and-themes.md): the fixed GitHub Dark palette and the shared CSS custom-property token architecture.\n-\n-### Operations \u0026 Maintenance\n-\n-- [AI Agent Operational Guidelines](../agents/README.md): Engineering principles for AI coding agents, mandatory documentation maintenance protocol, and frontend codebase index.\n-- [Publishing \u0026 Release Guide](../../PUBLISHING.md): Step-by-step instructions for preparing, testing, and publishing new px1 releases.\n","hunks":[{"id":"diff-086a38de3a82a873","header":"@@ -1,90 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# px1 Internal Architecture \u0026 Design Documentation"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"Welcome to the internal engineering documentation for px1, a local-first review"},{"oldLine":4,"kind":"removed","text":"control plane for AI-generated code. It turns team-specific rules, commit-"},{"oldLine":5,"kind":"removed","text":"pinned diffs, contextual findings, and CI evidence into a reviewable artifact;"},{"oldLine":6,"kind":"removed","text":"optional provider integrations can explain code without making the core depend"},{"oldLine":7,"kind":"removed","text":"on a cloud service or an LLM. The local application remains an ultra-lightweight,"},{"oldLine":8,"kind":"removed","text":"zero-config code reader and navigator packaged as a single statically-linked"},{"oldLine":9,"kind":"removed","text":"binary (~9.5 MB)."},{"oldLine":10,"kind":"removed","text":""},{"oldLine":11,"kind":"removed","text":"See the [product vision](../PRODUCT_VISION.md) for the intended experience and"},{"oldLine":12,"kind":"removed","text":"implementation status."},{"oldLine":13,"kind":"removed","text":""},{"oldLine":14,"kind":"removed","text":"This directory contains in-depth technical write-ups explaining how px1 achieves sub-millisecond startup, instantaneous file navigation, deep code intelligence, and a minimal memory footprint (~20 MB RS ly snapshots through `GET /api/agent/job`; the review action that started\n-the job polls until it finishes.\n-\n-Provider jobs retain server-side guards for overlapping anchored work and for a\n-busy workspace. Those checks now live in Go; the browser no longer maintains a\n-second edit-composer state machine.\n-\n-When a provider writes files, px1 compares the workspace snapshot before and\n-after the job. Changed files invalidate the relevant highlight and language\n-server caches, rebuild the index, and become visible through the ordinary\n-review refresh path. This is the same safety boundary used for edits made by a\n-harness outside px1.\n-\n-## HTTP surface\n-\n-The review UI exposes only the read-only job snapshot needed while an explicit\n-provider action is running:\n-\n-| Endpoint | Method | Purpose |\n-| --- | --- | --- |\n-| `/api/agent/job` | GET | Read a running or completed provider job. |\n-\n-Provider selection is configuration-only (`-agent` or the persisted settings\n-file), and provider jobs can only be started by the review actions that create\n-them. The former harness discovery, selection, direct-edit, and cancellation\n-routes are intentionally gone; they made an editor-like agent control plane\n-part of px1's review artifact API.\n-\n-px1 does not scan installed providers at startup and `/api/meta` does not expose\n-provider names, models, or pinning state. A provider is resolved only when the\n-configured `-agent` value or persisted setting is loaded, keeping provider\n-configuration out of the workspace metadata and the normal navigation path.\n-\n-## Security\n-\n-Harness execution is arbitrary local code execution as the user running px1.\n-Local access requires both a loopback connection peer and loopback HTTP host,\n-plus a matching browser origin. From every other connection it also requires\n-`-allow-agent` and `Authorization: Bearer` matching\n-`-remote-token` or `PX1_REMOTE_TOKEN`. `-allow-patch` and `-allow-checks` do\n-not grant it. Remote instances still belong on a trusted network: the token\n-limits who can execute a provider, and everyone who can open the URL can read\n-the workspace.\n","hunks":[{"id":"diff-58814aef641b8597","header":"@@ -1,72 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Review Provider \u0026 Agent Dispatch"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"px1 can optionally invoke a locally configured coding harness for review"},{"oldLine":4,"kind":"removed","text":"actions. The review UI remains a read-only surface: it does not contain an"},{"oldLine":5,"kind":"removed","text":"inline edit composer, harness picker, cancellation controls, or agent-range"},{"oldLine":6,"kind":"removed","text":"decorations."},{"oldLine":7,"kind":"removed","text":""},{"oldLine":8,"kind":"removed","text":"## Provider model"},{"oldLine":9,"kind":"removed","text":""},{"oldLine":10,"kind":"removed","text":"The provider is wired by `main.go` and implemented by [`agent.go`](../../agent.go)."},{"oldLine":11,"kind":"removed","text":"Use `-agent` to pin a command for a run, or configure the persisted provider"},{"oldLine":12,"kind":"removed","text":"choice in the user settings file. `-no-agent` disables provider actions. A"},{"oldLine":13,"kind":"removed","text":"missing or unavailable provider does not prevent browsing or reviewing a"},{"oldLine":14,"kind":"removed","text":"workspace."},{"oldLine":15,"kind":"removed","text":""},{"oldLine":16,"kind":"removed","text":"The provider is used only for explicit review actions:"},{"oldLine":17,"kind":"removed","text":""},{"oldLine":18,"kind":"removed","text":"- decision explanations and alternative suggestions from [`pins.go`](../../pins.go);"},{"oldLine":19,"kind":"removed","text":"- rule-pattern suggestions from [`rules.go`](../../rules.go); and"},{"oldLine":20,"kind":"removed","text":"- addressing saved review comments through [`review.go`](../../review.go)."},{"oldLine":21,"kind":"removed","text":""},{" us a matching browser origin. From every other connection it also requires"},{"oldLine":68,"kind":"removed","text":"`-allow-agent` and `Authorization: Bearer` matching"},{"oldLine":69,"kind":"removed","text":"`-remote-token` or `PX1_REMOTE_TOKEN`. `-allow-patch` and `-allow-checks` do"},{"oldLine":70,"kind":"removed","text":"not grant it. Remote instances still belong on a trusted network: the token"},{"oldLine":71,"kind":"removed","text":"limits who can execute a provider, and everyone who can open the URL can read"},{"oldLine":72,"kind":"removed","text":"the workspace."}]}]},{"path":"docs/internals/architecture.md","status":"D","diff":"diff --git a/docs/internals/architecture.md b/docs/internals/architecture.md\ndeleted file mode 100644\nindex abe3381..0000000\n--- a/docs/internals/architecture.md\n+++ /dev/null\n@@ -1,198 +0,0 @@\n-# System Architecture \u0026 Runtime Lifecycle\n-\n-This document describes the high-level architecture, startup pipeline, HTTP server, memory scavenging, and security model of `px1`.\n-\n-## 1. High-Level Design Principles\n-\n-px1 is building review reports linked from GitHub PRs, with diffs, concise AI\n-explanations beside highlighted code, and team-rule findings. See the\n-[product vision](../PRODUCT_VISION.md) for status. This document describes the\n-existing local application that supports that work:\n-\n-1. Edits Are Delegated: px1 navigates, searches, and inspects code, and does not author changes itself. There are no save buttons and no endpoint accepts file content. Optional provider actions are explicitly requested from review surfaces, while ordinary harness work remains external to px1 (see [Review Provider Dispatch](agent-editing.md)).\n-1. Single Static Binary Footprint: All frontend assets (HTML, CSS, JavaScript, and icons) are embedded directly into the Go binary at compile time via `go:embed`. px1 requires no Node.js, Python, or Ruby runtime, no external database, and no CGO dependencies.\n-1. Sub-Millisecond Responsiveness: The HTTP listener binds, serves the web UI, and opens the default browser in under 1 millisecond. Heavy operations (full directory indexing, git status checks, language server binary discovery) run asynchronously off the critical path.\n-1. Stateless in the Workspace: px1 never writes runtime configuration directories, temporary caches, or metadata files into a workspace. Indexes and caches live in volatile memory. Outside the workspace it keeps user settings, review baselines, and update state under `~/.px1/` (or `$XDG_CONFIG_HOME/px1/`); repository-owned team policy is the deliberate exception at `.px1/rules.json`.\n-1. Strict Memory Reclamation: Long-lived background processes should not hold idle RAM. When the user finishes a burst of queries, unused pages are proactively returned to the operating system.\n-\n-## 2. Startup Pipeline (\u003c1 ms Critical Path)\n-\n-When `px1` is executed in a terminal (e.g., `px1 .` or `px1 main.go:42`), the initialization flow executes as follows. A file target detects its enclosing project repository (or working directory) as the workspace and is passed to the browser with its relative path and optional line number.\n-\n-```mermaid\n-sequenceDiagram\n-    autonumber\n-    participant CLI as main() CLI Entrypoint\n-    participant Net as TCP Listener\n-    participant Browser as Host Browser\n-    participant Srv as HTTP Server Router\n-    participant Index as Background Indexer\n-    participant LSP as Background LSP Discovery\n-\n-    CLI-\u003e\u003eNet: listen(host, port)\n-    Note over CLI,Net: Binds socket in \u003c0.2ms\n-    CLI-\u003e\u003eSrv: NewServer(Index, LSP)\n-    CLI-\u003e\u003eBrowser: go openBrowser(url) [Non-blocking]\n-    CLI-\u003e\u003eIndex: go ix.Build() [Background Goroutine]\n-    CLI-\u003e\u003eLSP: go lsp.Available() [Background Goroutine]\n-    Note over CLI: CLI exits setup and enters HTTP loop (\u003c1ms total)\n-    Index-\u003e\u003eIndex: Extract root dir=\"\" entries immediately\n-    Index-\u003e\u003eIndex: Walk tree (NumCPU*4 workers) + Run gitStatus\n-    LSP-\u003e\u003eLSP: Scan $PATH for language server binaries\n-    Index--\u003e\u003eSrv: ReadyCh closed, full index available\n-```\n-\n-### Key Stages in [`main.go`](../../main.go)\n-\n-1. Target Resolution: Directories become workspace roots. For a file target, its repository or project root is detected as the workspace, and its relative path (with optional line number) is retained for the initial browser tab.\n-1. Socket Binding: `listen(*host, *port)` binds an ephemeral or user-specified TCP socket immediately.\n-1. Instant Root Tree Extraction: Before descending into subdirectories, `ix.Build()` extracts and populates the root directory entries (`dir=\"\"`), publishing them directly to `ix.children[\"\"]`. When the browser makes its initial request to `/api/tree`, it immediately renders the root tree nodes without waiting for the deep repository scan to finish.\n-1. Non-Blocking Browser Launch: `go openBrowser(url)` spawns the platform-specific browser opener (`xdg-open` on Linux, `open` on macOS, `rundll32` on Windows) in a separate goroutine.\n-1. Concurrent Tree Walk \u0026 Git Status: Indexing runs inside a background goroutine. A dedicated goroutine runs `gitStatus(ix.root)` in parallel with the file walk so that subprocess overhead overlaps the walk rather than adding to it.\n-1. Background Language Server Discovery: `lsp.Available()` checks `$PATH` using `exec.LookPath` across standard binary locations asynchronously.\n-\n-## 3. HTTP Server \u0026 API Catalog\n-\n-The server is implemented in [`server.go`](../../server.go) using Go's standard `http.ServeMux`. Every request passes through a centralized `ServeHTTP` wrapper that records activity timestamps and applies pooled Gzip compression when accepted by the client.\n-\n-### Endpoints Reference\n-\n-| Endpoint              | Method | Purpose                                                                 | Response Format                            |\n-| --------------------- | ------ | ----------------------------------------------------------------------- | ------------------------------------------ |\n-| `/`                   | `GET`  | Serves `web/index.html` (embedded or `-dev` disk copy)                  | `text/html; charset=utf-8`                 |\n-| `/github/:owner/:repo/pull/:number?sha=:head` | `GET` | Serves an imported immutable report when present; otherwise serves the app with the validated identity embedded as read-only JSON | `text/html; charset=utf-8` |\n-| `/static/*`           | `GET`  | Serves bundled JavaScript, CSS, and static assets                       | Asset MIME type                            |\n-| `/api/meta`           | `GET`  | Workspace metadata (root path, file count, git status)                  | JSON (`{root, name, files, git}`)          |\n-| `/api/tree`           | `GET`  | Directory contents for the sidebar file explorer (`?dir=path`)          | JSON array of `Node` objects               |\n-| `/api/file`           | `GET`  | Windowed, highlighted source file lines (`?path=...\u0026start=0\u0026count=500`) | JSON (`{lines, total, refine}`)  |\n-| `/api/raw`            | `GET`  | Raw, unhighlighted file content for whole-file copies                  | `text/plain` or binary                     |\n-| `/api/find`           | `GET`  | Fast fuzzy match against all indexed workspace paths (`?q=...`)         | JSON array of `FuzzyResult` objects        |\n-| `/api/search`         | `GET`  | Full-text project grep with snippet elision (`?q=...\u0026case=...\u0026regex=...`)| JSON array of file hits and matches        |\n-| `/api/outline`        | `GET`  | Regex-extracted symbol outline for a given file (`?path=...`)          | JSON array of symbol declarations          |\n-| `/api/def`            | `GET`  | Quick definition lookup fallback                                        | JSON array of matching definition locations|\n-| `/api/diff`           | `GET`  | Unified diff of working tree vs. `HEAD` (`?path=...`)                   | JSON (`{path, diff, available}`)           |\n-| `/api/gutter`         | `GET`  | Per-line change markers for code view gutter                            | JSON (`{added, modified, deleted}`)        |\n-| `/api/reindex`        | `POST` | Re-runs index walk and git status on demand (triggers frontend tab reload; see [`file-reload-and-updates.md`](file-reload-and-updates.md)) | JSON (`{ok}`)                              |\n-| `/api/lsp/def`        | `GET`  | Go-to-Definition via LSP (`?path=...\u0026line=...\u0026col=...`)                 | JSON array of target locations             |\n-| `/api/lsp/refs`       | `GET`  | Find References via LSP                                                 | JSON array of reference locations          |\n-| `/api/lsp/calls`      | `POST` | Incoming/outgoing call hierarchy tree expansion                         | JSON array of `CallNode` objects           |\n-| `/api/lsp/symbols`    | `GET`  | Document symbols extracted via LSP                                      | JSON array of LSP symbols                  |\n-| `/api/lsp/hover`      | `GET`  | Type signature and markdown doc hovercard info                          | JSON (`{contents: ...}`)                   |\n-| `/api/lsp/warm`       | `POST` | Pre-warms or spawns language server for given file extension            | JSON (`{ok: true}`)                        |\n-| `/api/lsp/setup`      | `GET`  | Reports install status and commands for current file language           | JSON (`{installed, recipes, ...}`)         |\n-| `/api/lsp/install`    | `POST` | Executes user-level installer in background                             | JSON (`{ok: true}`)                        |\n-| `/api/lsp/start`      | `POST` | Rescans and starts language server after installation                   | JSON (`{ok: true}`)                        |\n-| `/api/agent/job`      | `GET`  | Snapshot of an explicit review-provider job `?id=...`, or the most recently started when omitted | JSON job snapshot |\n-| `/api/review/import`  | `POST` | Authenticated, size-limited import of a versioned GitHub PR snapshot; requires `PX1_IMPORT_TOKEN` | JSON (`{imported, path, target}`) |\n-| `/api/audit`          | `GET`  | Session log of allowed and refused patch, agent, and check decisions    | JSON (`{entries}`)                 |\n-| `/api/review/session` | `GET` | Reads the active local review session, changed paths, and review queue | JSON (`{active, changed, queue}`) |\n-| `/api/review/session/start` | `POST` | Captures a repository-external task baseline | JSON (`{active, changed}`) |\n-| `/api/review/session/restore` | `POST` | Restores the active session baseline after integrity and path checks | JSON (`{active, changed}`) |\n-| `/api/review/session/close` | `POST` | Closes the active session while retaining its recoverable snapshot | JSON (`{closed}`) |\n-| `/api/review/session/delete?id=:id` | `POST` | Deletes a closed session and its snapshot for explicit cleanup | JSON (`{deleted}`) |\n-| `/api/review/attention` | `GET` | Runs bounded, deterministic high-review-risk heuristics against the active task baseline | JSON (`{flags, truncated}`) |\n-| `/api/review/attention/dismiss` | `POST` | Dismisses one current attention flag for the active review session | JSON (`{flags, truncated}`) |\n-\n-Attention analysis reads at most 500 changed files, 512 KiB per file, and 8\n-MiB of text in total, and returns at most 250 flags. It uses no model or remote\n-API. Flag IDs derive from the rule, path, and evidence so dismissals remain\n-stable inside the review session while changed evidence can be flagged again.\n-\n-### Recoverable local review sessions\n-\n-The Review panel stores each task baseline outside the repository, keyed by a\n-hash of the served workspace root. A session captures regular, non-ignored\n-files and their modes, hashes, and sizes; symbolic links and special files are\n-explicitly unsupported and are left untouched. A snapshot is limited to\n-200,000 files and 512 MiB. Restore validates every manifest entry and content\n-hash before changing the workspace, and refuses symlinked parents so a damaged\n-or manipulated baseline cannot write outside the served root. Closed sessions\n-remain available until the explicit delete endpoint removes their snapshot.\n-If the active pointer or manifest is corrupt, px1 quarantines the pointer and\n-allows a new session to be started while preserving the damaged file for\n-diagnosis.\n-\n-### Automatic external-change refresh\n-\n-px1 captures a review baseline for the current workspace during startup. The browser polls `GET /api/review/revision` every two seconds; when the compact fingerprint differs, it runs the normal re-index and in-place tab reload path. This makes ordinary harness writes visible without a wrapper command or a filesystem-watcher dependency in the server.\n-\n-## 4. Memory Management \u0026 Proactive Scavenging\n-\n-Even though Go's garbage collector frees unreferenced heap objects rapidly, the Go runtime does not immediately release physical memory pages back to the host operating system. In high-churn CLI sessions (such as searching a 50,000-file repository), the process resident set size (RSS) could appear inflated long after the search completes.\n-\n-To maintain a lean footprint (~20 MB RSS), `server.go` implements an automatic scavenger:\n-\n-```go\n-func (s *Server) scavenge() {\n-    const idleFor = 15 * time.Second\n-    tick := time.NewTicker(10 * time.Second)\n-    defer tick.Stop()\n-    done := true\n-    for range tick.C {\n-        idle := time.Since(time.Unix(0, s.lastReq.Load()))\n-        if idle \u003c idleFor {\n-            done = false\n-            continue\n-        }\n-        if done {\n-            continue\n-        }\n-        debug.FreeOSMemory()\n-        done = true\n-    }\n-}\n-```\n-\n-### Scavenging Mechanism\n-\n-- `s.lastReq`: An atomic 64-bit integer tracks the Unix timestamp (in nanoseconds) of the most recent incoming HTTP request.\n-- When no HTTP traffic has arrived for 15 seconds after an active period, `debug.FreeOSMemory()` is invoked.\n-- Physical memory pages freed by the GC are surrendered back to the operating system kernel immediately, preventing background memory bloat.\n-\n-### Gzip Buffer Pooling\n-\n-To avoid heap allocations on every JSON endpoint response, `gzip.Writer` instances are pooled via `sync.Pool` using `gzip.BestSpeed`:\n-\n-```go\n-var gzipPool = sync.Pool{New: func() any {\n-    w, _ := gzip.NewWriterLevel(io.Discard, gzip.BestSpeed)\n-    return w\n-}}\n-```\n-\n-## 5. Security Model \u0026 Path Sandboxing\n-\n-Because px1 exposes a local HTTP server that can display source files and interact with local tools, strict boundary constraints are enforced.\n-\n-### Path Resolution (`safePath` \u0026 `resolvePath`)\n-\n-Paths supplied by client queries are rigorously sanitized:\n-\n-1. Leading slashes and spaces are trimmed.\n-1. The path is cleaned via `filepath.Clean()`.\n-1. Paths attempting directory traversal (`..`, `../`, or containing `..` path segments) are rejected with HTTP 400.\n-1. Any path that resolves outside the indexed workspace root is rejected, unless it has been explicitly admitted into the external path allowlist (`extAllowed`).\n-\n-### External Path Allowlist (`extAllowed`)\n-\n-When navigating code via LSP Go-to-Definition, targets often reside outside the workspace directory (e.g., standard library packages in `/usr/local/go/src` or cached crates in `~/.cargo/registry`).\n-\n-- Rather than opening up arbitrary filesystem reads, targets returned by the trusted LSP server are admitted into an in-memory allowlist: `extAllowed[canonicalPath] = true`.\n-- `/api/file` and `/api/raw` permit reading external files only if the exact path exists in `extAllowed`.\n-- External paths can never be enumerated via `/api/tree` or searched via `/api/search`.\n-\n-### Origin Verification and Remote Capabilities\n-\n-Filesystem edits (`patch`, revert, restore), process execution (review-provider actions and every explicit or lazy language-server start), and verification-command attempts are three separate capabilities. A request is local only when its connected peer and HTTP host are both loopback (`localhost`, `127.0.0.1`, `::1`); the client-controlled `Host` header alone never grants local access. Any other IP, hostname, or reverse-proxy name is read-only unless that one capability is enabled with `-allow-patch`, `-allow-agent`, or `-allow-checks`. Enabling one does not enable the others. A remote capability also requires `Authorization: Bearer` matching `-remote-token` or `PX1_REMOTE_TOKEN`; a flag without a token stays refused.\n-\n-Mutating capability requests must be POSTs whose `Origin` matches `Host`. Read-shaped LSP requests are also agent-capability gated because they can lazily start a process; remote requests send the bearer token on those GETs. Other state-changing routes, such as settings and review comments, use `localPost` and are accepted only from a loopback peer to a loopback host with a matching origin. Forwarded headers are ignored unless a future explicit trusted-proxy policy is added.\n-\n-px1 does not execute verification commands. `POST /api/review/checks` passes the check capability gate and then returns that CI results are imported, not run. Successful and refused capability decisions are kept in an in-memory session log at `GET /api/audit` (loopback, or a remote request that presents the token). `/api/meta` includes the policy for the request connection so the UI can show local access or remote read-only.\n-\n-The executed command is never supplied by the client. Language-server installs come from `lspRegistry`. Review-provider actions use the configured provider; only the review prompt comes from the action.\n-\n-Anyone who can open the server can read the workspace. SSH local forwarding to `127.0.0.1` is loopback, so that browser has local write access. A LAN IP or Tailscale hostname does not.\n-\n-### Self-Update Integrity\n-\n-Before `px1 --update` executes or installs a release binary, it verifies the download against the SHA-256 digest in that release's `checksums.txt` asset. Missing, malformed, or mismatched checksum data aborts the update without replacing the current executable.\n","hunks":[{"id":"diff-36e3034742d39be6","header":"@@ -1,198 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# System Architecture \u0026 Runtime Lifecycle"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document describes the high-level architecture, startup pipeline, HTTP server, memory scavenging, and security model of `px1`."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. High-Level Design Principles"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"px1 is building review reports linked from GitHub PRs, with diffs, concise AI"},{"oldLine":8,"kind":"removed","text":"explanations beside highlighted code, and team-rule findings. See the"},{"oldLine":9,"kind":"removed","text":"[product vision](../PRODUCT_VISION.md) for status. This document describes the"},{"oldLine":10,"kind":"removed","text":"existing local application that supports that work:"},{"oldLine":11,"kind":"removed","text":""},{"oldLine":12,"kind":"removed","text":"1. Edits Are Delegated: px1 navigates, searches, and inspects code, and does not author changes itself. There are no save buttons and no endpoint accepts file content. Optional provider actions are explicitly requested from review surfaces, while ordinary harness work remains external to px1 (see [Review Provider Dispatch](agent-editing.md))."},{"oldLine":13,"kind":"removed","text":"1. Single Static Binary Footprint: All frontend assets (HTML, CSS, JavaScript, and icons) are embedded directly into the Go binary at compile time via `go:embed`. px1 r
