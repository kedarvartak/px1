nding: `listen(*host, *port)` binds an ephemeral or user-specified TCP socket immediately."},{"oldLine":49,"kind":"removed","text":"1. Instant Root Tree Extraction: Before descending into subdirectories, `ix.Build()` extracts and populates the root directory entries (`dir=\"\"`), publishing them directly to `ix.children[\"\"]`. When the browser makes its initial request to `/api/tree`, it immediately renders the root tree nodes without waiting for the deep repository scan to finish."},{"oldLine":50,"kind":"removed","text":"1. Non-Blocking Browser Launch: `go openBrowser(url)` spawns the platform-specific browser opener (`xdg-open` on Linux, `open` on macOS, `rundll32` on Windows) in a separate goroutine."},{"oldLine":51,"kind":"removed","text":"1. Concurrent Tree Walk \u0026 Git Status: Indexing runs inside a background goroutine. A dedicated goroutine runs `gitStatus(ix.root)` in parallel with the file walk so that subprocess overhead overlaps the walk rather than adding to it."},{"oldLine":52,"kind":"removed","text":"1. Background Language Server Discovery: `lsp.Available()` checks `$PATH` using `exec.LookPath` across standard binary locations asynchronously."},{"oldLine":53,"kind":"removed","text":""},{"oldLine":54,"kind":"removed","text":"## 3. HTTP Server \u0026 API Catalog"},{"oldLine":55,"kind":"removed","text":""},{"oldLine":56,"kind":"removed","text":"The server is implemented in [`server.go`](../../server.go) using Go's standard `http.ServeMux`. Every request passes through a centralized `ServeHTTP` wrapper that records activity timestamps and applies pooled Gzip compression when accepted by the client."},{"oldLine":57,"kind":"removed","text":""},{"oldLine":58,"kind":"removed","text":"### Endpoints Reference"},{"oldLine":59,"kind":"removed","text":""},{"oldLine":60,"kind":"removed","text":"| Endpoint              | Method | Purpose                                                                 | Response Format                            |"},{"oldLine":61,"kind":"removed","text":"| --------------------- | ------ | ----------------------------------------------------------------------- | ------------------------------------------ |"},{"oldLine":62,"kind":"removed","text":"| `/`                   | `GET`  | Serves `web/index.html` (embedded or `-dev` disk copy)                  | `text/html; charset=utf-8`                 |"},{"oldLine":63,"kind":"removed","text":"| `/github/:owner/:repo/pull/:number?sha=:head` | `GET` | Serves an imported immutable report when present; otherwise serves the app with the validated identity embedded as read-only JSON | `text/html; charset=utf-8` |"},{"oldLine":64,"kind":"removed","text":"| `/static/*`           | `GET`  | Serves bundled JavaScript, CSS, and static assets                       | Asset MIME type                            |"},{"oldLine":65,"kind":"removed","text":"| `/api/meta`           | `GET`  | Workspace metadata (root path, file count, git status)                  | JSON (`{root, name, files, git}`)          |"},{"oldLine":66,"kind":"removed","text":"| `/api/tree`           | `GET`  | Directory contents for the sidebar file explorer (`?dir=path`)          | JSON array of `Node` objects               |"},{"oldLine":67,"kind":"removed","text":"| `/api/file`           | `GET`  | Windowed, highlighted source file lines (`?path=...\u0026start=0\u0026count=500`) | JSON (`{lines, total, refine}`)  |"},{"oldLine":68,"kind":"removed","text":"| `/api/raw`            | `GET`  | Raw, unhighlighted file content for whole-file copies                  | `text/plain` or binary                     |"},{"oldLine":69,"kind":"removed","text":"| `/api/find`           | `GET`  | Fast fuzzy match against all indexed workspace paths (`?q=...`)         | JSON array of `FuzzyResult` objects        |"},{"oldLine":70,"kind":"removed","text":"| `/api/search`         | `GET`  | Full-text project grep with snippet elision (`?q=...\u0026case=...\u0026regex=...`)| JSON array of file hits and matches        |"},{"oldLine":71,"kind":"removed","text":"| `/api/outline`        | `GET`  | Regex-extracted symbol outline for a given file (`?path=...`)          | JSON array of symbol declarations          |"},{"oldLine":72,"kind":"removed","text":"| `/api/def`            | `GET`  | Quick definition lookup fallback                                        | JSON array of matching definition locations|"},{"oldLine":73,"kind":"removed","text":"| `/api/diff`           | `GET`  | Unified diff of working tree vs. `HEAD` (`?path=...`)                   | JSON (`{path, diff, available}`)           |"},{"oldLine":74,"kind":"removed","text":"| `/api/gutter`         | `GET`  | Per-line change markers for code view gutter                            | JSON (`{added, modified, deleted}`)        |"},{"oldLine":75,"kind":"removed","text":"| `/api/reindex`        | `POST` | Re-runs index walk and git status on demand (triggers frontend tab reload; see [`file-reload-and-updates.md`](file-reload-and-updates.md)) | JSON (`{ok}`)                              |"},{"oldLine":76,"kind":"removed","text":"| `/api/lsp/def`        | `GET`  | Go-to-Definition via LSP (`?path=...\u0026line=...\u0026col=...`)                 | JSON array of target locations             |"},{"oldLine":77,"kind":"removed","text":"| `/api/lsp/refs`       | `GET`  | Find References via LSP                                                 | JSON array of reference locations          |"},{"oldLine":78,"kind":"removed","text":"| `/api/lsp/calls`      | `POST` | Incoming/outgoing call hierarchy tree expansion                         | JSON array of `CallNode` objects           |"},{"oldLine":79,"kind":"removed","text":"| `/api/lsp/symbols`    | `GET`  | Document symbols extracted via LSP                                      | JSON array of LSP symbols                  |"},{"oldLine":80,"kind":"removed","text":"| `/api/lsp/hover`      | `GET`  | Type signature and markdown doc hovercard info                          | JSON (`{contents: ...}`)                   |"},{"oldLine":81,"kind":"removed","text":"| `/api/lsp/warm`       | `POST` | Pre-warms or spawns language server for given file extension            | JSON (`{ok: true}`)                        |"},{"oldLine":82,"kind":"removed","text":"| `/api/lsp/setup`      | `GET`  | Reports install status and commands for current file language           | JSON (`{installed, recipes, ...}`)         |"},{"oldLine":83,"kind":"removed","text":"| `/api/lsp/install`    | `POST` | Executes user-level installer in background                             | JSON (`{ok: true}`)                        |"},{"oldLine":84,"kind":"removed","text":"| `/api/lsp/start`      | `POST` | Rescans and starts language server after installation                   | JSON (`{ok: true}`)                        |"},{"oldLine":85,"kind":"removed","text":"| `/api/agent/job`      | `GET`  | Snapshot of an explicit review-provider job `?id=...`, or the most recently started when omitted | JSON job snapshot |"},{"oldLine":86,"kind":"removed","text":"| `/api/review/import`  | `POST` | Authenticated, size-limited import of a versioned GitHub PR snapshot; requires `PX1_IMPORT_TOKEN` | JSON (`{imported, path, target}`) |"},{"oldLine":87,"kind":"removed","text":"| `/api/audit`          | `GET`  | Session log of allowed and refused patch, agent, and check decisions    | JSON (`{entries}`)                 |"},{"oldLine":88,"kind":"removed","text":"| `/api/review/session` | `GET` | Reads the active local review session, changed paths, and review queue | JSON (`{active, changed, queue}`) |"},{"oldLine":89,"kind":"removed","text":"| `/api/review/session/start` | `POST` | Captures a repository-external task baseline | JSON (`{active, changed}`) |"},{"oldLine":90,"kind":"removed","text":"| `/api/review/session/restore` | `POST` | Restores the active session baseline after integrity and path checks | JSON (`{active, changed}`) |"},{"oldLine":91,"kind":"removed","text":"| `/api/review/session/close` | `POST` | Closes the active session while retaining its recoverable snapshot | JSON (`{closed}`) |"},{"oldLine":92,"kind":"removed","text":"| `/api/review/session/delete?id=:id` | `POST` | Deletes a closed session and its snapshot for explicit cleanup | JSON (`{deleted}`) |"},{"oldLine":93,"kind":"removed","text":"| `/api/review/attention` | `GET` | Runs bounded, deterministic high-review-risk heuristics against the active task baseline | JSON (`{flags, truncated}`) |"},{"oldLine":94,"kind":"removed","text":"| `/api/review/attention/dismiss` | `POST` | Dismisses one current attention flag for the active review session | JSON (`{flags, truncated}`) |"},{"oldLine":95,"kind":"removed","text":""},{"oldLine":96,"kind":"removed","text":"Attention analysis reads at most 500 changed files, 512 KiB per file, and 8"},{"oldLine":97,"kind":"removed","text":"MiB of text in total, and returns at most 250 flags. It uses no model or remote"},{"oldLine":98,"kind":"removed","text":"API. Flag IDs derive from the rule, path, and evidence so dismissals remain"},{"oldLine":99,"kind":"removed","text":"stable inside the review session while changed evidence can be flagged again."},{"oldLine":100,"kind":"removed","text":""},{"oldLine":101,"kind":"removed","text":"### Recoverable local review sessions"},{"oldLine":102,"kind":"removed","text":""},{"oldLine":103,"kind":"removed","text":"The Review panel stores each task baseline outside the repository, keyed by a"},{"oldLine":104,"kind":"removed","text":"hash of the served workspace root. A session captures regular, non-ignored"},{"oldLine":105,"kind":"removed","text":"files and their modes, hashes, and sizes; symbolic links and special files are"},{"oldLine":106,"kind":"removed","text":"explicitly unsupported and are left untouched. A snapshot is limited to"},{"oldLine":107,"kind":"removed","text":"200,000 files and 512 MiB. Restore validates every manifest entry and content"},{"oldLine":108,"kind":"removed","text":"hash before changing the workspace, and refuses symlinked parents so a damaged"},{"oldLine":109,"kind":"removed","text":"or manipulated baseline cannot write outside the served root. Closed sessions"},{"oldLine":110,"kind":"removed","text":"remain available until the explicit delete endpoint removes their snapshot."},{"oldLine":111,"kind":"removed","text":"If the active pointer or manifest is corrupt, px1 quarantines the pointer and"},{"oldLine":112,"kind":"removed","text":"allows a new session to be started while preserving the damaged file for"},{"oldLine":113,"kind":"removed","text":"diagnosis."},{"oldLine":114,"kind":"removed","text":""},{"oldLine":115,"kind":"removed","text":"### Automatic external-change refresh"},{"oldLine":116,"kind":"removed","text":""},{"oldLine":117,"kind":"removed","text":"px1 captures a review baseline for the current workspace during startup. The browser polls `GET /api/review/revision` every two seconds; when the compact fingerprint differs, it runs the normal re-index and in-place tab reload path. This makes ordinary harness writes visible without a wrapper command or a filesystem-watcher dependency in the server."},{"oldLine":118,"kind":"removed","text":""},{"oldLine":119,"kind":"removed","text":"## 4. Memory Management \u0026 Proactive Scavenging"},{"oldLine":120,"kind":"removed","text":""},{"oldLine":121,"kind":"removed","text":"Even though Go's garbage collector frees unreferenced heap objects rapidly, the Go runtime does not immediately release physical memory pages back to the host operating system. In high-churn CLI sessions (such as searching a 50,000-file repository), the process resident set size (RSS) could appear inflated long after the search completes."},{"oldLine":122,"kind":"removed","text":""},{"oldLine":123,"kind":"removed","text":"To maintain a lean footprint (~20 MB RSS), `server.go` implements an automatic scavenger:"},{"oldLine":124,"kind":"removed","text":""},{"oldLine":125,"kind":"removed","text":"```go"},{"oldLine":126,"kind":"removed","text":"func (s *Server) scavenge() {"},{"oldLine":127,"kind":"removed","text":"    const idleFor = 15 * time.Second"},{"oldLine":128,"kind":"removed","text":"    tick := time.NewTicker(10 * time.Second)"},{"oldLine":129,"kind":"removed","text":"    defer tick.Stop()"},{"oldLine":130,"kind":"removed","text":"    done := true"},{"oldLine":131,"kind":"removed","text":"    for range tick.C {"},{"oldLine":132,"kind":"removed","text":"        idle := time.Since(time.Unix(0, s.lastReq.Load()))"},{"oldLine":133,"kind":"removed","text":"        if idle \u003c idleFor {"},{"oldLine":134,"kind":"removed","text":"            done = false"},{"oldLine":135,"kind":"removed","text":"            continue"},{"oldLine":136,"kind":"removed","text":"        }"},{"oldLine":137,"kind":"removed","text":"        if done {"},{"oldLine":138,"kind":"removed","text":"            continue"},{"oldLine":139,"kind":"removed","text":"        }"},{"oldLine":140,"kind":"removed","text":"        debug.FreeOSMemory()"},{"oldLine":141,"kind":"removed","text":"        done = true"},{"oldLine":142,"kind":"removed","text":"    }"},{"oldLine":143,"kind":"removed","text":"}"},{"oldLine":144,"kind":"removed","text":"```"},{"oldLine":145,"kind":"removed","text":""},{"oldLine":146,"kind":"removed","text":"### Scavenging Mechanism"},{"oldLine":147,"kind":"removed","text":""},{"oldLine":148,"kind":"removed","text":"- `s.lastReq`: An atomic 64-bit integer tracks the Unix timestamp (in nanoseconds) of the most recent incoming HTTP request."},{"oldLine":149,"kind":"removed","text":"- When no HTTP traffic has arrived for 15 seconds after an active period, `debug.FreeOSMemory()` is invoked."},{"oldLine":150,"kind":"removed","text":"- Physical memory pages freed by the GC are surrendered back to the operating system kernel immediately, preventing background memory bloat."},{"oldLine":151,"kind":"removed","text":""},{"oldLine":152,"kind":"removed","text":"### Gzip Buffer Pooling"},{"oldLine":153,"kind":"removed","text":""},{"oldLine":154,"kind":"removed","text":"To avoid heap allocations on every JSON endpoint response, `gzip.Writer` instances are pooled via `sync.Pool` using `gzip.BestSpeed`:"},{"oldLine":155,"kind":"removed","text":""},{"oldLine":156,"kind":"removed","text":"```go"},{"oldLine":157,"kind":"removed","text":"var gzipPool = sync.Pool{New: func() any {"},{"oldLine":158,"kind":"removed","text":"    w, _ := gzip.NewWriterLevel(io.Discard, gzip.BestSpeed)"},{"oldLine":159,"kind":"removed","text":"    return w"},{"oldLine":160,"kind":"removed","text":"}}"},{"oldLine":161,"kind":"removed","text":"```"},{"oldLine":162,"kind":"removed","text":""},{"oldLine":163,"kind":"removed","text":"## 5. Security Model \u0026 Path Sandboxing"},{"oldLine":164,"kind":"removed","text":""},{"oldLine":165,"kind":"removed","text":"Because px1 exposes a local HTTP server that can display source files and interact with local tools, strict boundary constraints are enforced."},{"oldLine":166,"kind":"removed","text":""},{"oldLine":167,"kind":"removed","text":"### Path Resolution (`safePath` \u0026 `resolvePath`)"},{"oldLine":168,"kind":"removed","text":""},{"oldLine":169,"kind":"removed","text":"Paths supplied by client queries are rigorously sanitized:"},{"oldLine":170,"kind":"removed","text":""},{"oldLine":171,"kind":"removed","text":"1. Leading slashes and spaces are trimmed."},{"oldLine":172,"kind":"removed","text":"1. The path is cleaned via `filepath.Clean()`."},{"oldLine":173,"kind":"removed","text":"1. Paths attempting directory traversal (`..`, `../`, or containing `..` path segments) are rejected with HTTP 400."},{"oldLine":174,"kind":"removed","text":"1. Any path that resolves outside the indexed workspace root is rejected, unless it has been explicitly admitted into the external path allowlist (`extAllowed`)."},{"oldLine":175,"kind":"removed","text":""},{"oldLine":176,"kind":"removed","text":"### External Path Allowlist (`extAllowed`)"},{"oldLine":177,"kind":"removed","text":""},{"oldLine":178,"kind":"removed","text":"When navigating code via LSP Go-to-Definition, targets often reside outside the workspace directory (e.g., standard library packages in `/usr/local/go/src` or cached crates in `~/.cargo/registry`)."},{"oldLine":179,"kind":"removed","text":""},{"oldLine":180,"kind":"removed","text":"- Rather than opening up arbitrary filesystem reads, targets returned by the trusted LSP server are admitted into an in-memory allowlist: `extAllowed[canonicalPath] = true`."},{"oldLine":181,"kind":"removed","text":"- `/api/file` and `/api/raw` permit reading external files only if the exact path exists in `extAllowed`."},{"oldLine":182,"kind":"removed","text":"- External paths can never be enumerated via `/api/tree` or searched via `/api/search`."},{"oldLine":183,"kind":"removed","text":""},{"oldLine":184,"kind":"removed","text":"### Origin Verification and Remote Capabilities"},{"oldLine":185,"kind":"removed","text":""},{"oldLine":186,"kind":"removed","text":"Filesystem edits (`patch`, revert, restore), process execution (review-provider actions and every explicit or lazy language-server start), and verification-command attempts are three separate capabilities. A request is local only when its connected peer and HTTP host are both loopback (`localhost`, `127.0.0.1`, `::1`); the client-controlled `Host` header alone never grants local access. Any other IP, hostname, or reverse-proxy name is read-only unless that one capability is enabled with `-allow-patch`, `-allow-agent`, or `-allow-checks`. Enabling one does not enable the others. A remote capability also requires `Authorization: Bearer` matching `-remote-token` or `PX1_REMOTE_TOKEN`; a flag without a token stays refused."},{"oldLine":187,"kind":"removed","text":""},{"oldLine":188,"kind":"removed","text":"Mutating capability requests must be POSTs whose `Origin` matches `Host`. Read-shaped LSP requests are also agent-capability gated because they can lazily start a process; remote requests send the bearer token on those GETs. Other state-changing routes, such as settings and review comments, use `localPost` and are accepted only from a loopback peer to a loopback host with a matching origin. Forwarded headers are ignored unless a future explicit trusted-proxy policy is added."},{"oldLine":189,"kind":"removed","text":""},{"oldLine":190,"kind":"removed","text":"px1 does not execute verification commands. `POST /api/review/checks` passes the check capability gate and then returns that CI results are imported, not run. Successful and refused capability decisions are kept in an in-memory session log at `GET /api/audit` (loopback, or a remote request that presents the token). `/api/meta` includes the policy for the request connection so the UI can show local access or remote read-only."},{"oldLine":191,"kind":"removed","text":""},{"oldLine":192,"kind":"removed","text":"The executed command is never supplied by the client. Language-server installs come from `lspRegistry`. Review-provider actions use the configured provider; only the review prompt comes from the action."},{"oldLine":193,"kind":"removed","text":""},{"oldLine":194,"kind":"removed","text":"Anyone who can open the server can read the workspace. SSH local forwarding to `127.0.0.1` is loopback, so that browser has local write access. A LAN IP or Tailscale hostname does not."},{"oldLine":195,"kind":"removed","text":""},{"oldLine":196,"kind":"removed","text":"### Self-Update Integrity"},{"oldLine":197,"kind":"removed","text":""},{"oldLine":198,"kind":"removed","text":"Before `px1 --update` executes or installs a release binary, it verifies the download against the SHA-256 digest in that release's `checksums.txt` asset. Missing, malformed, or mismatched checksum data aborts the update without replacing the current executable."}]}]},{"path":"docs/internals/editor-virtualization.md","status":"D","diff":"diff --git a/docs/internals/editor-virtualization.md b/docs/internals/editor-virtualization.md\ndeleted file mode 100644\nindex 82802e7..0000000\n--- a/docs/internals/editor-virtualization.md\n+++ /dev/null\n@@ -1,185 +0,0 @@\n-# Editor Virtualization \u0026 Caret Engine\n-\n-This document provides a comprehensive technical breakdown of px1's bespoke virtualized code viewer, caret engine, and selection preservation system ([`web/src/renderer.js`](../../web/src/renderer.js), [`web/src/cursor.js`](../../web/src/cursor.js), and [`web/style.css`](../../web/style.css)).\n-\n-The review queue is a separate, bounded sidebar surface rather than part of the virtualized editor. Its diffs are rendered from the task snapshot in [`web/src/diff.js`](../../web/src/diff.js), so a file created after the review starts is rendered as a `/dev/null` to current-file diff and is not confused with a clean Git HEAD diff. Queue search and status filters reduce the rendered file rows before they are mounted, keeping large review sessions responsive. CI verification results stay in the sidebar and are read-only: px1 displays the `.px1/verification.json` report only when its GitHub Actions source and commit SHA match the active review.\n-\n-## 1. Why a Bespoke Virtualized Viewer?\n-\n-General-purpose browser code editors (such as Monaco, CodeMirror 6, or Ace) are engineered for bidirectional text editing, undo/redo trees, multi-cursor keystrokes, and complex grammar parsing inside the browser. Consequently:\n-\n-- They bundle massive JavaScript runtimes (several megabytes).\n-- Their initialization latency takes hundreds of milliseconds.\n-- Complex DOM representations degrade frame rates when scrolling large files.\n-\n-Because px1 is a code inspection and navigation tool that never edits text in place (changes go through a coding harness), it bypasses heavy third-party editor runtimes entirely. Instead, it implements a custom, high-performance virtualized surface with a fixed DOM footprint (~60 active nodes) and sub-millisecond paint budgets.\n-\n-## 2. DOM Surface Hierarchy\n-\n-The editor surface is defined in [`web/index.html`](../../web/index.html):\n-\n-```html\n-\u003cdiv id=\"editor\"\u003e\n-  \u003cdiv id=\"viewport\"\u003e\n-    \u003cdiv id=\"sizer\"\u003e\n-      \u003cdiv id=\"rows\"\u003e\u003c/div\u003e\n-      \u003cdiv id=\"caret\" hidden\u003e\u003c/div\u003e\n-    \u003c/div\u003e\n-  \u003c/div\u003e\n-  \u003cdiv id=\"findbar\"\u003e...\u003c/div\u003e\n-\u003c/div\u003e\n-```\n-\n-```mermaid\n-flowchart TD\n-    Editor[\"#editor (Container, position: relative)\"]\n-    Viewport[\"#viewport (Native Scroller: overflow: auto, contain: strict)\"]\n-    Sizer[\"#sizer (Virtual Spacer: height = totalLines * LH)\"]\n-    Rows[\"#rows (Recycled Elements: transform: translateY)\"]\n-    Caret[\"#caret (Decoupled Overlay: transform: translate)\"]\n-\n-    Editor --\u003e Viewport\n-    Viewport --\u003e Sizer\n-    Sizer --\u003e Rows\n-    Sizer --\u003e Caret\n-```\n-\n-### Element Roles \u0026 Responsibilities\n-\n-- `#viewport`:\n-  - CSS: `position: absolute; inset: 0; overflow: auto; contain: strict; cursor: text;`\n-  - Encapsulates native browser scrolling mechanics, trackpad physics, and wheel events.\n-- `#sizer`:\n-  - Functions as the scrollable canvas spacer.\n-  - Its vertical height is calculated during `layout()` as:\n-    $$\\text{height} = \\text{totalLines} \\times \\text{LH} + \\text{verticalPadding}$$\n-  - Its width expands based on word-wrap settings or:\n-    $$\\text{width} = (\\text{maxCols} + 4) \\times \\text{chW} + \\text{gutterWidth}$$\n-  - Configures the browser's native scrollbar geometry with mathematical precision without mounting offscreen rows.\n-- `#rows`:\n-  - CSS: `position: absolute; top: 0; left: 0; will-change: transform;`\n-  - Mounts only the visible lines.\n-  - Positioned vertically using CSS `transform: translateY(first * LH + \"px\")` to maintain exact alignment with `#viewport` without triggering layout reflows.\n-- `#caret`:\n-  - Independent overlay cursor element positioned directly under `#sizer`.\n-\n-## 3. Virtualization \u0026 Recycling Pipeline (`paint()`)\n-\n-The browser DOM never holds elements for lines outside the immediate view. Only the current viewport plus overscan buffers are instantiated:\n-\n-### Virtual Window Mathematics\n-\n-$$\\text{first} = \\max\\left(0, \\left\\lfloor\\frac{\\text{scrollTop}}{\\text{LH}}\\right\\rfloor - \\text{OVERSCAN}\\right)$$\n-$$\\text{count} = \\left\\lceil\\frac{\\text{clientHeight}}{\\text{LH}}\\right\\rceil + 2 \\times \\text{OVERSCAN} \\quad (\\text{OVERSCAN} = 24)$$\n-$$\\text{last} = \\min(\\text{totalLines}, \\text{first} + \\text{count})$$\n-\n-At standard desktop display resolutions, the total number of mounted `.row` elements is capped between 50 and 70 elements.\n-\n-### HTML Row Structure\n-\n-Each line inside `#rows` consists of:\n-\n-```html\n-\u003cdiv class=\"row\" data-l=\"123\"\u003e\n-  \u003cdiv class=\"g\"\u003e123\u003c/div\u003e\n-  \u003cdiv class=\"c\"\u003e...syntax token markup...\u003c/div\u003e\n-\u003c/div\u003e\n-```\n-\n-- `.g`: Line number gutter element (`position: sticky; left: 0; z-index: 2;`).\n-- `.c`: Code container (`white-space: pre; tab-size: 4; font-family: var(--font-mono);`).\n-\n-### Frame Throttling via `requestAnimationFrame`\n-\n-Scroll events are debounced to ensure painting runs in lockstep with the browser's display refresh rate:\n-\n-```javascript\n-let raf = 0;\n-export function render() {\n-  if (raf) return;\n-  raf = requestAnimationFrame(() =\u003e {\n-    raf = 0;\n-    paint();\n-  });\n-}\n-```\n-\n-## 4. Offscreen Sub-Pixel Font Measurement\n-\n-Proportional gutter widths and accurate scroll geometry require exact character dimensions. However, querying DOM layout properties (`offsetWidth`, `getBoundingClientRect`) during rendering triggers costly browser layout thrashing.\n-\n-Instead, px1 measures typography once via an offscreen DOM element (`#measure`):\n-\n-- `LH` (Line Height) and `chW` (Character Width) are measured with sub-pixel fractional precision.\n-- Values are cached in state `S.chW` and `S.LH`.\n-- Scrollbar dimensions and virtual positions are computed algebraically without reading DOM layout metrics.\n-\n-## 5. Selection Preservation Across Repaints\n-\n-A major pitfall of virtualized DOMs is that rebuilding or recycling `.row` elements drops the browser's active native text selection (e.g., when scrolling or refreshing background syntax highlighting).\n-\n-px1 solves this with Coordinate-Based Selection Persistence:\n-\n-```mermaid\n-sequenceDiagram\n-    autonumber\n-    participant DOM as Active DOM Rows\n-    participant Paint as paint() Function\n-    participant Walker as TreeWalker Selection Restorer\n-\n-    Paint-\u003e\u003ePaint: saveSelection()\n-    Note over Paint: Convert window.getSelection() into file coordinates {line, col}\n-    Paint-\u003e\u003eDOM: Replace #rows markup with recycled lines\n-    Paint-\u003e\u003eWalker: restoreSelection()\n-    Walker-\u003e\u003eDOM: Walk Text nodes via TreeWalker in target line rows\n-    Walker-\u003e\u003eDOM: window.getSelection().setBaseAndExtent(anchorNode, aOff, focusNode, fOff)\n-    Note over DOM: Native copy (Ctrl+C) and drag-selection preserved intact\n-```\n-\n-1. `saveSelection()`: Inspects `window.getSelection()`, determines the anchor and focus nodes, and maps them to file-level `{ line, col }` coordinates.\n-1. DOM Update: `#rows.innerHTML` is updated with the visible window.\n-1. `restoreSelection()`: Uses a `TreeWalker` over the newly mounted rows to find the exact matching text offsets and calls `window.getSelection().setBaseAndExtent()`.\n-\n-## 6. Decoupled Overlay Caret (`placeCaret()`)\n-\n-Unlike traditional editors that insert a cursor DOM element inside code lines, px1's caret is decoupled:\n-\n-- The `#caret` element lives as a direct child of `#sizer`.\n-- `placeCaret(line, col)` computes the collapsed range geometry using `toPoint(line, col)`.\n-- The caret is positioned using hardware-accelerated CSS `transform: translate(x, y)`.\n-\n-### Architectural Benefits\n-\n-1. Clean Row Markup: Text nodes inside `.c` containers remain pure code without intrusive caret tags.\n-1. Native Copy Integrity: Selecting text never accidentally copies caret artifacts.\n-1. Zero Interaction Conflicts: Mouse drag selections never fight with caret repaints.\n-\n-## 7. Non-Destructive Inline DOM Decorations\n-\n-Search match markers (`\u003cmark\u003e`), symbol occurrence markers (`.occ`), and definition jump links (`.link`) are added dynamically via `decorate()`:\n-\n-- Applied exclusively to the ~60 active rows.\n-- Uses `document.createTreeWalker(row, NodeFilter.SHOW_TEXT)` to inspect only text nodes within `.c`.\n-- Matches are split and wrapped without destroying or invalidating surrounding syntax highlighting tags (`.k`, `.s`, etc.).\n-\n-## 8. Dynamic Chunk Streaming \u0026 Whole-File Selection\n-### On-Demand Chunk Fetching (`ensureChunks`)\n-\n-Source lines are loaded from `/api/file` in chunks of `CHUNK = 500` lines:\n-\n-- As the user scrolls, `ensureChunks(d, first, last)` identifies missing 500-line blocks.\n-- Asynchronous API fetches retrieve missing chunks.\n-- When an inexact windowed chunk arrives (`refine: true`), `refineChunk()` automatically swaps in corrected lines once the server's background pass finishes.\n-\n-### Whole-File Selection (`selectAll()`)\n-\n-Pressing `Ctrl+A` / `Cmd+A` outside a text input does not use the browser's native select-all (which would select sidebar text and fail on virtualized offscreen code).\n-\n-- `selectAll()` activates `S.selAll` mode for the active document.\n-- `paint()` visually shades all currently rendered rows.\n-- File contents are retrieved once from `/api/raw` so that `Ctrl+C` copies the entire file to the clipboard cleanly.\n-- Esc, a left click, or tab switching clears whole-file selection mode. A right click keeps it, so the selection menu can act on it.\n-\n-### Selection Actions\n-\n-Any selection, native or whole-file, drives the footer selection bar (`#footer-sel`) and the right-click menu (`#sel-menu`) in [`web/src/selbar.js`](../../web/src/selbar.js): Copy Ref, Copy with Context, Add Review Comment, Find Usages, and reference copying via `Alt+C`. The viewport's `mousedown` handler only moves the caret for the primary button, so a right click on a selection neither moves the caret nor collapses the selection.\n","hunks":[{"id":"diff-95059ce533089c73","header":"@@ -1,185 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Editor Virtualization \u0026 Caret Engine"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document provides a comprehensive technical breakdown of px1's bespoke virtualized code viewer, caret engine, and selection preservation system ([`web/src/renderer.js`](../../web/src/renderer.js), [`web/src/cursor.js`](../../web/src/cursor.js), and [`web/style.css`](../../web/style.css))."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"The review queue is a separate, bounded sidebar surface rather than part of the virtualized editor. Its diffs are rendered from the task snapshot in [`web/src/diff.js`](../../web/src/diff.js), so a file created after the review starts is rendered as a `/dev/null` to current-file diff and is not confused with a clean Git HEAD diff. Queue search and status filters reduce the rendered file rows before they are mounted, keeping large review sessions responsive. CI verification results stay in the sidebar and are read-only: px1 displays the `.px1/verification.json` report only when its GitHub Actions source and commit SHA match the active review."},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"## 1. Why a Bespoke Virtualized Viewer?"},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"General-purpose browser code editors (such as Monaco, CodeMirror 6, or Ace) are engineered for bidirectional text editing, undo/redo trees, multi-cursor keystrokes, and complex grammar parsing inside the browser. Consequently:"},{"oldLine":10,"kind":"removed","text":""},{"oldLine":11,"kind":"removed","text":"- They bundle massive JavaScript runtimes (several megabytes)."},{"oldLine":12,"kind":"removed","text":"- Their initialization latency takes hundreds of milliseconds."},{"oldLine":13,"kind":"removed","text":"- Complex DOM representations degrade frame rates when scrolling large files."},{"oldLine":14,"kind":"removed","text":""},{"oldLine":15,"kind":"removed","text":"Because px1 is a code inspection and navigation tool that never edits text in place (changes go through a coding harness), it bypasses heavy third-party editor runtimes entirely. Instead, it implements a custom, high-performance virtualized surface with a fixed DOM footprint (~60 active nodes) and sub-millisecond paint budgets."},{"oldLine":16,"kind":"removed","text":""},{"oldLine":17,"kind":"removed","text":"## 2. DOM Surface Hierarchy"},{"oldLine":18,"kind":"removed","text":""},{"oldLine":19,"kind":"removed","text":"The editor surface is defined in [`web/index.html`](../../web/index.html):"},{"oldLine":20,"kind":"removed","text":""},{"oldLine":21,"kind":"removed","text":"```html"},{"oldLine":22,"kind":"removed","text":"\u003cdiv id=\"editor\"\u003e"},{"oldLine":23,"kind":"removed","text":"  \u003cdiv id=\"viewport\"\u003e"},{"oldLine":24,"kind":"removed","text":"    \u003cdiv id=\"sizer\"\u003e"},{"oldLine":25,"kind":"removed","text":"      \u003cdiv id=\"rows\"\u003e\u003c/div\u003e"},{"oldLine":26,"kind":"removed","text":"      \u003cdiv id=\"caret\" hidden\u003e\u003c/div\u003e"},{"oldLine":27,"kind":"removed","text":"    \u003c/div\u003e"},{"oldLine":28,"kind":"removed","text":"  \u003c/div\u003e"},{"oldLine":29,"kind":"removed","text":"  \u003cdiv id=\"findbar\"\u003e...\u003c/div\u003e"},{"oldLine":30,"kind":"removed","text":"\u003c/div\u003e"},{"oldLine":31,"kind":"removed","text":"```"},{"oldLine":32,"kind":"removed","text":""},{"oldLine":33,"kind":"removed","text":"```mermaid"},{"oldLine":34,"kind":"removed","text":"flowchart TD"},{"oldLine":35,"kind":"removed","text":"    Editor[\"#editor (Container, position: relative)\"]"},{"oldLine":36,"kind":"removed","text":"    Viewport[\"#viewport (Native Scroller: overflow: auto, contain: strict)\"]"},{"oldLine":37,"kind":"removed","text":"    Sizer[\"#sizer (Virtual Spacer: height = totalLines * LH)\"]"},{"oldLine":38,"kind":"removed","text":"    Rows[\"#rows (Recycled Elements: transform: translateY)\"]"},{"oldLine":39,"kind":"removed","text":"    Caret[\"#caret (Decoupled Overlay: transform: translate)\"]"},{"oldLine":40,"kind":"removed","text":""},{"oldLine":41,"kind":"removed","text":"    Editor --\u003e Viewport"},{"oldLine":42,"kind":"removed","text":"    Viewport --\u003e Sizer"},{"oldLine":43,"kind":"removed","text":"    Sizer --\u003e Rows"},{"oldLine":44,"kind":"removed","text":"    Sizer --\u003e Caret"},{"oldLine":45,"kind":"removed","text":"```"},{"oldLine":46,"kind":"removed","text":""},{"oldLine":47,"kind":"removed","text":"### Element Roles \u0026 Responsibilities"},{"oldLine":48,"kind":"removed","text":""},{"oldLine":49,"kind":"removed","text":"- `#viewport`:"},{"oldLine":50,"kind":"removed","text":"  - CSS: `position: absolute; inset: 0; overflow: auto; contain: strict; cursor: text;`"},{"oldLine":51,"kind":"removed","text":"  - Encapsulates native browser scrolling mechanics, trackpad physics, and wheel events."},{"oldLine":52,"kind":"removed","text":"- `#sizer`:"},{"oldLine":53,"kind":"removed","text":"  - Functions as the scrollable canvas spacer."},{"oldLine":54,"kind":"removed","text":"  - Its vertical height is calculated during `layout()` as:"},{"oldLine":55,"kind":"removed","text":"    $$\\text{height} = \\text{totalLines} \\times \\text{LH} + \\text{verticalPadding}$$"},{"oldLine":56,"kind":"removed","text":"  - Its width expands based on word-wrap settings or:"},{"oldLine":57,"kind":"removed","text":"    $$\\text{width} = (\\text{maxCols} + 4) \\times \\text{chW} + \\text{gutterWidth}$$"},{"oldLine":58,"kind":"removed","text":"  - Configures the browser's native scrollbar geometry with mathematical precision without mounting offscreen rows."},{"oldLine":59,"kind":"removed","text":"- `#rows`:"},{"oldLine":60,"kind":"removed","text":"  - CSS: `position: absolute; top: 0; left: 0; will-change: transform;`"},{"oldLine":61,"kind":"removed","text":"  - Mounts only the visible lines."},{"oldLine":62,"kind":"removed","text":"  - Positioned vertically using CSS `transform: translateY(first * LH + \"px\")` to maintain exact alignment with `#viewport` without triggering layout reflows."},{"oldLine":63,"kind":"removed","text":"- `#caret`:"},{"oldLine":64,"kind":"removed","text":"  - Independent overlay cursor element positioned directly under `#sizer`."},{"oldLine":65,"kind":"removed","text":""},{"oldLine":66,"kind":"removed","text":"## 3. Virtualization \u0026 Recycling Pipeline (`paint()`)"},{"oldLine":67,"kind":"removed","text":""},{"oldLine":68,"kind":"removed","text":"The browser DOM never holds elements for lines outside the immediate view. Only the current viewport plus overscan buffers are instantiated:"},{"oldLine":69,"kind":"removed","text":""},{"oldLine":70,"kind":"removed","text":"### Virtual Window Mathematics"},{"oldLine":71,"kind":"removed","text":""},{"oldLine":72,"kind":"removed","text":"$$\\text{first} = \\max\\left(0, \\left\\lfloor\\frac{\\text{scrollTop}}{\\text{LH}}\\right\\rfloor - \\text{OVERSCAN}\\right)$$"},{"oldLine":73,"kind":"removed","text":"$$\\text{count} = \\left\\lceil\\frac{\\text{clientHeight}}{\\text{LH}}\\right\\rceil + 2 \\times \\text{OVERSCAN} \\quad (\\text{OVERSCAN} = 24)$$"},{"oldLine":74,"kind":"removed","text":"$$\\text{last} = \\min(\\text{totalLines}, \\text{first} + \\text{count})$$"},{"oldLine":75,"kind":"removed","text":""},{"oldLine":76,"kind":"removed","text":"At standard desktop display resolutions, the total number o },{"oldLine":169,"kind":"removed","text":""},{"oldLine":170,"kind":"removed","text":"- As the user scrolls, `ensureChunks(d, first, last)` identifies missing 500-line blocks."},{"oldLine":171,"kind":"removed","text":"- Asynchronous API fetches retrieve missing chunks."},{"oldLine":172,"kind":"removed","text":"- When an inexact windowed chunk arrives (`refine: true`), `refineChunk()` automatically swaps in corrected lines once the server's background pass finishes."},{"oldLine":173,"kind":"removed","text":""},{"oldLine":174,"kind":"removed","text":"### Whole-File Selection (`selectAll()`)"},{"oldLine":175,"kind":"removed","text":""},{"oldLine":176,"kind":"removed","text":"Pressing `Ctrl+A` / `Cmd+A` outside a text input does not use the browser's native select-all (which would select sidebar text and fail on virtualized offscreen code)."},{"oldLine":177,"kind":"removed","text":""},{"oldLine":178,"kind":"removed","text":"- `selectAll()` activates `S.selAll` mode for the active document."},{"oldLine":179,"kind":"removed","text":"- `paint()` visually shades all currently rendered rows."},{"oldLine":180,"kind":"removed","text":"- File contents are retrieved once from `/api/raw` so that `Ctrl+C` copies the entire file to the clipboard cleanly."},{"oldLine":181,"kind":"removed","text":"- Esc, a left click, or tab switching clears whole-file selection mode. A right click keeps it, so the selection menu can act on it."},{"oldLine":182,"kind":"removed","text":""},{"oldLine":183,"kind":"removed","text":"### Selection Actions"},{"oldLine":184,"kind":"removed","text":""},{"oldLine":185,"kind":"removed","text":"Any selection, native or whole-file, drives the footer selection bar (`#footer-sel`) and the right-click menu (`#sel-menu`) in [`web/src/selbar.js`](../../web/src/selbar.js): Copy Ref, Copy with Context, Add Review Comment, Find Usages, and reference copying via `Alt+C`. The viewport's `mousedown` handler only moves the caret for the primary button, so a right click on a selection neither moves the caret nor collapses the selection."}]}]},{"path":"docs/internals/file-reload-and-updates.md","status":"D","diff":"diff --git a/docs/internals/file-reload-and-updates.md b/docs/internals/file-reload-and-updates.md\ndeleted file mode 100644\nindex 76c8eb0..0000000\n--- a/docs/internals/file-reload-and-updates.md\n+++ /dev/null\n@@ -1,271 +0,0 @@\n-# File Updates \u0026 In-Place Tab Reloading\n-\n-This document details the end-to-end architecture, performance optimizations, and edge-case handling for workspace file updates and tab reloading ([`web/src/tabs.js`](../../web/src/tabs.js), [`web/src/panels.js`](../../web/src/panels.js), [`server.go`](../../server.go), and [`highlight.go`](../../highlight.go)), introduced in commit `c33376b4b43b2ae3ecbc6fedd45b9dee0726a401`.\n-\n----\n-\n-## 1. Problem Statement \u0026 Motivation\n-\n-Most file mutations (such as `git checkout`, `git pull`, branch switching, code generation, or edits from an external IDE) occur on the host filesystem outside of px1's process boundary. Review-provider actions reuse the same reload path once they finish (see [Review Provider Dispatch](agent-editing.md)).\n-\n-Users trigger a workspace re-index by clicking the **Re-index** button (`#btn-reindex` in the sidebar header) or via the Command Palette (`Mod+K` \u0026rarr; `Re-index Workspace`).\n-\n-### The Historical Limitation\n-\n-Prior to this implementation:\n-1. Re-indexing rescanned the directory tree via `POST /api/reindex` and redrew the file explorer.\n-2. **Open tabs remained stale**: The document objects in memory (`S.tabs`) retained old file lines, stale line totals, outdated git diff annotations, and previous syntax highlighting states.\n-3. If an open file was edited or truncated on disk, px1 showed stale cached lines. If the file shrank, attempting to scroll or jump to previous line numbers resulted in blank lines or out-of-bounds errors.\n-4. Users were forced to manually close and re-open every tab, or execute a full browser reload (which destroyed active tabs, cursor positions, navigation history, and scroll offsets).\n-5. Simply re-running `openFile()` in a loop across open tabs was unacceptable: it caused jarring tab-switching UI flicker, multiple full-DOM layout calculations, scroll resets, and history stack pollution.\n-\n-The solution is `reloadOpenTabs()`: a quiet, concurrent, in-place tab synchronization engine that refreshes all open tabs without tab-switching thrash, preserving exact viewport and caret states while gracefully handling file mutations.\n-\n----\n-\n-## 2. End-to-End Architectural Flow\n-\n-The diagram below maps the complete lifecycle of a file reload triggered by workspace re-indexing:\n-\n-```mermaid\n-sequenceDiagram\n-    autonumber\n-    actor User\n-    participant UI as Sidebar / Palette\n-    participant Panels as web/src/panels.js\n-    participant Tabs as web/src/tabs.js (reloadOpenTabs)\n-    participant Server as Go Backend (/api/reindex \u0026 /api/file)\n-    participant Cache as highlight.go (Doc Cache)\n-    participant Renderer as web/src/renderer.js (layout \u0026 render)\n-\n-    User-\u003e\u003eUI: Click \"#btn-reindex\" or run Palette command\n-    UI-\u003e\u003ePanels: Trigger click listener\n-    Panels-\u003e\u003eServer: POST /api/reindex\n-    Server-\u003e\u003eServer: Rescan index \u0026 run git status (porcelain=v2)\n-    Server--\u003e\u003ePanels: Return {ok: true}\n-    Panels-\u003e\u003ePanels: Redraw file explorer tree\n-    Panels-\u003e\u003eTabs: await reloadOpenTabs()\n-\n-    rect rgb(30, 35, 45)\n-        note over Tabs: Step 1: Pre-flight Snapshotting\n-        Tabs-\u003e\u003eTabs: Capture live activeDoc.scrollTop from vp.scrollTop\n-        Tabs-\u003e\u003eTabs: Compute chunk start for each open tab based on cur anchor\n-    end\n-\n-    rect rgb(35, 40, 55)\n-        note over Tabs,Server: Step 2: Concurrent Batch Fetching\n-        Tabs-\u003e\u003eServer: Promise.allSettled(api('/api/file', {path, start, count}))\n-        Server-\u003e\u003eCache: Open(abs, rel) with stat check (key = abs|mtime|size)\n-        alt File Changed on Disk\n-            Cache-\u003e\u003eCache: Cache miss -\u003e Read file -\u003e Windowed Chroma highlight\n-        else File Unchanged\n-            Cache--\u003e\u003eServer: Cache hit -\u003e Return memoized Doc\n-        end\n-        Server--\u003e\u003eTabs: Return JSON payload {total, lines, maxCols, diffAvailable, lsp}\n-    end\n-\n-    rect rgb(30, 45, 35)\n-        note over Tabs: Step 3: In-Place Document Construction \u0026 Reconciliation\n-        loop For each target tab\n-            Tabs-\u003e\u003eTabs: Validate tab still open (S.tabs.indexOf(oldDoc) \u003e= 0)\n-            Tabs-\u003e\u003eTabs: Clamp cur line to new total (Math.min(cur, total))\n-            Tabs-\u003e\u003eTabs: Preserve diffMode, diffDismissed, and col\n-            Tabs-\u003e\u003eTabs: Construct new doc object d \u0026 populate line chunk\n-            Tabs-\u003e\u003eTabs: S.tabs[idx] = d (replace in-place without tab switch)\n-            Tabs-\u003e\u003eTabs: Dispatch background refineChunk() \u0026 loadGutter()\n-        end\n-    end\n-\n-    rect rgb(45, 35, 35)\n-        note over Tabs,Renderer: Step 4: Single-Pass Resync \u0026 Viewport Restoration\n-        Tabs-\u003e\u003eTabs: Sync active doc LSP and Diff views\n-        Tabs-\u003e\u003eRenderer: layout() (recalculate sizer height/width)\n-        Tabs-\u003e\u003eTabs: Restore vp.scrollTop = d.scrollTop\n-        Tabs-\u003e\u003eRenderer: render() (virtualized rows mount)\n-        Tabs-\u003e\u003eTabs: Re-fetch Outline if active, drawTabs(), drawCrumbs(), updateStatus()\n-    end\n-```\n-\n----\n-\n-## 3. Step-by-Step Implementation Mechanics\n-\n-### Step 1: Live State Snapshotting\n-\n-Before issuing any network requests, `reloadOpenTabs` captures volatile DOM scroll positions:\n-\n-```javascript\n-const activeDoc = doc_();\n-if (activeDoc) {\n-  activeDoc.scrollTop = vp.scrollTop;\n-}\n-```\n-\n-- **Viewport DOM Offset**: While `activeDoc.scrollTop` is maintained in memory during tab switches, native mouse-wheel or trackpad scrolling mutates `vp.scrollTop` directly. Snapshotting guarantees the live scroll offset is preserved.\n-\n-### Step 2: Virtualized Chunk Target Calculation\n-\n-Instead of fetching entire files, px1 leverages its windowed virtualization architecture (`CHUNK = 1000` lines):\n-\n-```javascript\n-const targets = S.tabs.map(t =\u003e ({\n-  oldDoc: t,\n-  path: t.path,\n-  anchor: t.cur || 1,\n-  start: t.cur ? Math.max(0, Math.floor((t.cur - 1) / CHUNK) * CHUNK) : 0,\n-}));\n-```\n-\n-- Each tab's current viewing line (`t.cur`) acts as the anchor.\n-- px1 calculates the precise 1000-line chunk boundary enclosing that anchor:\n-  $$\\text{start} = \\left\\lfloor \\frac{\\text{cur} - 1}{\\text{CHUNK}} \\right\\rfloor \\times \\text{CHUNK}$$\n-- Offscreen chunks are not requested upfront; they load on-demand when scrolled into view via `ensureChunk()`.\n-\n-### Step 3: Concurrent Non-Blocking Fetching (`Promise.allSettled`)\n-\n-All open tabs are re-fetched concurrently:\n-\n-```javascript\n-const results = await Promise.allSettled(\n-  targets.map(tgt =\u003e api('/api/file', { path: tgt.path, start: tgt.start, count: CHUNK }))\n-);\n-```\n-\n-- **`Promise.allSettled` vs. `Promise.all`**: If an open file was deleted, locked, or became inaccessible on disk, `Promise.all` would abort the entire batch. `Promise.allSettled` ensures successful tab updates proceed uninterrupted regardless of individual file errors.\n-- **Network Pipeline**: Dispatched simultaneously over HTTP/1.1 keep-alive or HTTP/2 multiplexing.\n-\n-### Step 4: Backend Invalidation \u0026 Cache Coherence\n-\n-On the Go server, `/api/file` calls `Open(abs, rel)` in [`highlight.go`](../../highlight.go):\n-\n-```go\n-key := fmt.Sprintf(\"%s|%d|%d\", abs, st.ModTime().UnixNano(), st.Size())\n-if d := cache.get(key); d != nil {\n-    return d, nil\n-}\n-```\n-\n-- **Compound Key Invalidation**: The server cache key includes the file's absolute path, nanosecond modification timestamp (`ModTime().UnixNano()`), and byte size.\n-- **Zero-Cost Unchanged Reads**: If a file was untouched during workspace re-indexing, its key matches the LRU cache. The server serves the cached `Doc` without re-reading the filesystem or re-running Chroma tokenization.\n-- **Automatic Invalidation**: If the file was modified, the timestamp/size changes, triggering a cache miss, fresh disk read (`os.ReadFile`), and Lexer pass.\n-\n-### Step 5: In-Place Document Construction \u0026 Tab Replacement\n-\n-When reconciling each tab result:\n-\n-```javascript\n-const idx = S.tabs.indexOf(tgt.oldDoc);\n-if (idx \u003c 0) continue; // Tab was closed while reload was in-flight\n-\n-// Handle errors gracefully\n-if (res.status !== 'fulfilled') {\n-  if (idx === S.active) {\n-    setStatusNote(tgt.path + ': ' + (res.reason?.message || 'failed to load'));\n-  }\n-  continue;\n-}\n-\n-const j = res.value;\n-if (j.image) continue;\n-\n-const keep = tgt.oldDoc;\n-const hasDiff = !!j.diffAvailable;\n-const newCur = Math.max(1, Math.min(keep.cur || 1, j.total));\n-```\n-\n-- **In-Place Mutation**: `S.tabs[idx] = d` swaps the document instance inside the array directly. The active tab index (`S.active`) remains unchanged, completely avoiding tab activation events.\n-- **New Line Buffer**: A new array `d.lines = new Array(j.total)` is allocated to the new line count, and the returned lines are inserted at `j.start`.\n-- **Chunk Tracking**: `d.chunks = new Set([tgt.start / CHUNK])` records the refreshed chunk. All other chunks are cleared so they fetch fresh content if scrolled into view.\n-- **Gutter \u0026 Lexer Refinement**: `loadGutter(d)` is dispatched to fetch fresh Git line diff markers, and `refineChunk(d, ...)` is called if Chroma emitted an inexact first-pass window.\n-\n-### Step 6: Active Document Resynchronization \u0026 Single-Pass Render\n-\n-Once all tabs have been updated in memory, px1 updates the view surface:\n-\n-```javascript\n-const d = doc_();\n-if (d) {\n-  S.lsp.state = (d.lsp \u0026\u0026 d.lsp.state) || 'off';\n-  S.lsp.server = (d.lsp \u0026\u0026 d.lsp.server) || '';\n-  S.lsp.missing = (d.lsp \u0026\u0026 d.lsp.missing) || '';\n-  warmLSP(d);\n-  syncDiffView();\n-  layout();\n-  vp.scrollTop = d.scrollTop;\n-  render();\n-  if ($('#panel-outline')?.classList.contains('active')) loadOutline();\n-}\n-\n-drawTabs();\n-drawCrumbs();\n-updateStatus();\n-```\n-\n-- **Single Layout \u0026 Paint Budget**: Rather than re-rendering for each tab, a single `layout()` recalculates the sizer dimensions and a single `render()` mounts the ~60 visible rows into the DOM.\n-- **Viewport Scroll Restoration**: `vp.scrollTop = d.scrollTop` restores the user's exact scroll position on the freshly-sized canvas.\n-- **Outline Panel Resync**: If the symbol outline sidebar is active, `loadOutline()` re-extracts declarations against the updated file.\n-\n----\n-\n-## 4. Performance Optimizations\n-\n-| Optimization | Technique | Impact |\n-| :--- | :--- | :--- |\n-| **Zero Tab-Switching Thrash** | Direct in-place array assignment (`S.tabs[idx] = d`) without calling `openFile()` | Eliminates $N$ DOM reflows, tab button CSS transitions, and navigation history pollution. |\n-| **Single Reflow / Render Budget** | Deferred `layout()` and `render()` called once after all tabs are resolved | Keeps UI execution within the sub-millisecond frame budget regardless of open tab count. |\n-| **Anchor-Bounded Chunk Loading** | Requests only the 1000-line chunk containing `cur` (`CHUNK = 1000`) | Network transfer payload remains $O(1)$ relative to total file size. |\n-| **Concurrent Network Fetching** | `Promise.allSettled` over parallel HTTP connections | Overcomes serialized network latency across multi-tab sessions. |\n-| **Server-Side Stat Validation** | `key = abs \\| mtime \\| size` caching in `highlight.go` | Bypasses disk I/O and syntax tokenization for all unmodified open files. |\n-| **Non-Blocking Auxiliary Tasks** | Asynchronous `loadGutter()` and `refineChunk()` calls | Git diff markers and exact lexer refinements load in the background without stalling editor paint. |\n-\n----\n-\n-## 5. Edge Cases \u0026 Resilience\n-\n-### 1. Concurrent Tab Closure during In-Flight Network Requests\n-- **Problem**: While `Promise.allSettled` is waiting on HTTP responses, the user might close one or more tabs.\n-- **Solution**: px1 looks up the index dynamically using the object reference captured before the request:\n-  ```javascript\n-  const idx = S.tabs.indexOf(tgt.oldDoc);\n-  if (idx \u003c 0) continue;\n-  ```\n-  If the tab was closed, `idx` evaluates to `-1`, and the response is safely discarded without corrupting the tab array or array bounds.\n-\n-### 2. File Shrinkage \u0026 Caret Out-of-Bounds Clamping\n-- **Problem**: An external process or branch switch truncates a 2,000-line file down to 50 lines while the user's cursor was at line 1,250. Retaining line 1,250 would cause blank virtualized rows and broken cursor rendering.\n-- **Solution**: The cursor position is clamped to the new file total:\n-  ```javascript\n-  const newCur = Math.max(1, Math.min(keep.cur || 1, j.total));\n-  ```\n-  Cursor line `cur` is guaranteed to satisfy $1 \\le \\text{cur} \\le \\text{total}$. Cursor horizontal column (`keep.col`) is safely retained.\n-\n-### 3. File Deletion or Permission Revocation on Disk\n-- **Problem**: An open file is deleted or renamed externally before re-indexing. The backend `/api/file` endpoint responds with a `404` or `500` error.\n-- **Solution**: `Promise.allSettled` isolates the rejection. The old tab remains loaded and functional in the UI. If the deleted file is the currently active tab, an unobtrusive status bar warning is displayed (`setStatusNote`), preventing application crashes or blank editor views.\n-\n-### 4. Diff View Preference \u0026 Dismissal Persistence\n-- **Problem**: A file with uncommitted Git changes might have diff mode active or dismissed by the user. On reload, Git diff availability may appear or disappear.\n-- **Solution**: A reload keeps each tab in the view it was in:\n-  ```javascript\n-  const diffMode = hasDiff ? (keep.diffMode || null) : null;\n-  // ...\n-  diffDismissed: !!keep.diffDismissed || !keep.diffMode,\n-  diffScroll: keep === activeDoc \u0026\u0026 keep.diffMode ? diffScrollTop() : 0,\n-  ```\n-  - A tab in source view stays in source, even when the reload finds new changes (for example after an agent edit). It is marked `diffDismissed`, so `loadGutter()` does not switch it to the diff either. The Diff button is one click away.\n-  - A tab in the diff view keeps its split or unified layout, and the active tab's diff scroll offset is restored once the new diff renders.\n-  - If changes were committed externally, `hasDiff` evaluates to `false`, and `diffMode` cleanly resets to `null`.\n-  - Opening a file fresh is unaffected: a modified file still opens in the diff view.\n-\n-### 5. Binary \u0026 Image Tab Protection\n-- **Problem**: If a file extension was replaced with an image or binary file, passing it to the text virtualization buffer would corrupt line array parsing.\n-- **Solution**: `if (j.image) continue;` skips image tabs, allowing specialized image rendering flows to handle the media.\n-\n----\n-\n-## 6. Related Documentation\n-\n-- [System Architecture \u0026 Runtime Lifecycle](architecture.md) — HTTP router, lifecycle, and proactive memory management.\n-- [Editor Virtualization \u0026 Caret Engine](editor-virtualization.md) — Viewport virtualization, DOM recycling, and selection preservation.\n-- [Git Awareness \u0026 Diffing](git-integration.md) — CLI shell-out git status generation and diff view synchronization.\n-- [Windowed Syntax Highlighting](syntax-highlighting.md) — Dual-tier Chroma tokenization and chunked line streaming.\n","hunks":[{"id":"diff-9ef6fd18b751dda9","hea
