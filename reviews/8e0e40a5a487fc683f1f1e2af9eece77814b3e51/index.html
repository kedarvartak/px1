   note over Tabs,Renderer: Step 4: Single-Pass Resync \u0026 Viewport Restoration"},{"oldLine":81,"kind":"removed","text":"        Tabs-\u003e\u003eTabs: Sync active doc LSP and Diff views"},{"oldLine":82,"kind":"removed","text":"        Tabs-\u003e\u003eRenderer: layout() (recalculate sizer height/width)"},{"oldLine":83,"kind":"removed","text":"        Tabs-\u003e\u003eTabs: Restore vp.scrollTop = d.scrollTop"},{"oldLine":84,"kind":"removed","text":"        Tabs-\u003e\u003eRenderer: render() (virtualized rows mount)"},{"oldLine":85,"kind":"removed","text":"        Tabs-\u003e\u003eTabs: Re-fetch Outline if active, drawTabs(), drawCrumbs(), updateStatus()"},{"oldLine":86,"kind":"removed","text":"    end"},{"oldLine":87,"kind":"removed","text":"```"},{"oldLine":88,"kind":"removed","text":""},{"oldLine":89,"kind":"removed","text":"---"},{"oldLine":90,"kind":"removed","text":""},{"oldLine":91,"kind":"removed","text":"## 3. Step-by-Step Implementation Mechanics"},{"oldLine":92,"kind":"removed","text":""},{"oldLine":93,"kind":"removed","text":"### Step 1: Live State Snapshotting"},{"oldLine":94,"kind":"removed","text":""},{"oldLine":95,"kind":"removed","text":"Before issuing any network requests, `reloadOpenTabs` captures volatile DOM scroll positions:"},{"oldLine":96,"kind":"removed","text":""},{"oldLine":97,"kind":"removed","text":"```javascript"},{"oldLine":98,"kind":"removed","text":"const activeDoc = doc_();"},{"oldLine":99,"kind":"removed","text":"if (activeDoc) {"},{"oldLine":100,"kind":"removed","text":"  activeDoc.scrollTop = vp.scrollTop;"},{"oldLine":101,"kind":"removed","text":"}"},{"oldLine":102,"kind":"removed","text":"```"},{"oldLine":103,"kind":"removed","text":""},{"oldLine":104,"kind":"removed","text":"- **Viewport DOM Offset**: While `activeDoc.scrollTop` is maintained in memory during tab switches, native mouse-wheel or trackpad scrolling mutates `vp.scrollTop` directly. Snapshotting guarantees the live scroll offset is preserved."},{"oldLine":105,"kind":"removed","text":""},{"oldLine":106,"kind":"removed","text":"### Step 2: Virtualized Chunk Target Calculation"},{"oldLine":107,"kind":"removed","text":""},{"oldLine":108,"kind":"removed","text":"Instead of fetching entire files, px1 leverages its windowed virtualization architecture (`CHUNK = 1000` lines):"},{"oldLine":109,"kind":"removed","text":""},{"oldLine":110,"kind":"removed","text":"```javascript"},{"oldLine":111,"kind":"removed","text":"const targets = S.tabs.map(t =\u003e ({"},{"oldLine":112,"kind":"removed","text":"  oldDoc: t,"},{"oldLine":113,"kind":"removed","text":"  path: t.path,"},{"oldLine":114,"kind":"removed","text":"  anchor: t.cur || 1,"},{"oldLine":115,"kind":"removed","text":"  start: t.cur ? Math.max(0, Math.floor((t.cur - 1) / CHUNK) * CHUNK) : 0,"},{"oldLine":116,"kind":"removed","text":"}));"},{"oldLine":117,"kind":"removed","text":"```"},{"oldLine":118,"kind":"removed","text":""},{"oldLine":119,"kind":"removed","text":"- Each tab's current viewing line (`t.cur`) acts as the anchor."},{"oldLine":120,"kind":"removed","text":"- px1 calculates the precise 1000-line chunk boundary enclosing that anchor:"},{"oldLine":121,"kind":"removed","text":"  $$\\text{start} = \\left\\lfloor \\frac{\\text{cur} - 1}{\\text{CHUNK}} \\right\\rfloor \\times \\text{CHUNK}$$"},{"oldLine":122,"kind":"removed","text":"- Offscreen chunks are not requested upfront; they load on-demand when scrolled into view via `ensureChunk()`."},{"oldLine":123,"kind":"removed","text":""},{"oldLine":124,"kind":"removed","text":"### Step 3: Concurrent Non-Blocking Fetching (`Promise.allSettled`)"},{"oldLine":125,"kind":"removed","text":""},{"oldLine":126,"kind":"removed","text":"All open tabs are re-fetched concurrently:"},{"oldLine":127,"kind":"removed","text":""},{"oldLine":128,"kind":"removed","text":"```javascript"},{"oldLine":129,"kind":"removed","text":"const results = await Promise.allSettled("},{"oldLine":130,"kind":"removed","text":"  targets.map(tgt =\u003e api('/api/file', { path: tgt.path, start: tgt.start, count: CHUNK }))"},{"oldLine":131,"kind":"removed","text":");"},{"oldLine":132,"kind":"removed","text":"```"},{"oldLine":133,"kind":"removed","text":""},{"oldLine":134,"kind":"removed","text":"- **`Promise.allSettled` vs. `Promise.all`**: If an open file was deleted, locked, or became inaccessible on disk, `Promise.all` would abort the entire batch. `Promise.allSettled` ensures successful tab updates proceed uninterrupted regardless of individual file errors."},{"oldLine":135,"kind":"removed","text":"- **Network Pipeline**: Dispatched simultaneously over HTTP/1.1 keep-alive or HTTP/2 multiplexing."},{"oldLine":136,"kind":"removed","text":""},{"oldLine":137,"kind":"removed","text":"### Step 4: Backend Invalidation \u0026 Cache Coherence"},{"oldLine":138,"kind":"removed","text":""},{"oldLine":139,"kind":"removed","text":"On the Go server, `/api/file` calls `Open(abs, rel)` in [`highlight.go`](../../highlight.go):"},{"oldLine":140,"kind":"removed","text":""},{"oldLine":141,"kind":"removed","text":"```go"},{"oldLine":142,"kind":"removed","text":"key := fmt.Sprintf(\"%s|%d|%d\", abs, st.ModTime().UnixNano(), st.Size())"},{"oldLine":143,"kind":"removed","text":"if d := cache.get(key); d != nil {"},{"oldLine":144,"kind":"removed","text":"    return d, nil"},{"oldLine":145,"kind":"removed","text":"}"},{"oldLine":146,"kind":"removed","text":"```"},{"oldLine":147,"kind":"removed","text":""},{"oldLine":148,"kind":"removed","text":"- **Compound Key Invalidation**: The server cache key includes the file's absolute path, nanosecond modification timestamp (`ModTime().UnixNano()`), and byte size."},{"oldLine":149,"kind":"removed","text":"- **Zero-Cost Unchanged Reads**: If a file was untouched during workspace re-indexing, its key matches the LRU cache. The server serves the cached `Doc` without re-reading the filesystem or re-running Chroma tokenization."},{"oldLine":150,"kind":"removed","text":"- **Automatic Invalidation**: If the file was modified, the timestamp/size changes, triggering a cache miss, fresh disk read (`os.ReadFile`), and Lexer pass."},{"oldLine":151,"kind":"removed","text":""},{"oldLine":152,"kind":"removed","text":"### Step 5: In-Place Document Construction \u0026 Tab Replacement"},{"oldLine":153,"kind":"removed","text":""},{"oldLine":154,"kind":"removed","text":"When reconciling each tab result:"},{"oldLine":155,"kind":"removed","text":""},{"oldLine":156,"kind":"removed","text":"```javascript"},{"oldLine":157,"kind":"removed","text":"const idx = S.tabs.indexOf(tgt.oldDoc);"},{"oldLine":158,"kind":"removed","text":"if (idx \u003c 0) continue; // Tab was closed while reload was in-flight"},{"oldLine":159,"kind":"removed","text":""},{"oldLine":160,"kind":"removed","text":"// Handle errors gracefully"},{"oldLine":161,"kind":"removed","text":"if (res.status !== 'fulfilled') {"},{"oldLine":162,"kind":"removed","text":"  if (idx === S.active) {"},{"oldLine":163,"kind":"removed","text":"    setStatusNote(tgt.path + ': ' + (res.reason?.message || 'failed to load'));"},{"oldLine":164,"kind":"removed","text":"  }"},{"oldLine":165,"kind":"removed","text":"  continue;"},{"oldLine":166,"kind":"removed","text":"}"},{"oldLine":167,"kind":"removed","text":""},{"oldLine":168,"kind":"removed","text":"const j = res.value;"},{"oldLine":169,"kind":"removed","text":"if (j.image) continue;"},{"oldLine":170,"kind":"removed","text":""},{"oldLine":171,"kind":"removed","text":"const keep = tgt.oldDoc;"},{"oldLine":172,"kind":"removed","text":"const hasDiff = !!j.diffAvailable;"},{"oldLine":173,"kind":"removed","text":"const newCur = Math.max(1, Math.min(keep.cur || 1, j.total));"},{"oldLine":174,"kind":"removed","text":"```"},{"oldLine":175,"kind":"removed","text":""},{"oldLine":176,"kind":"removed","text":"- **In-Place Mutation**: `S.tabs[idx] = d` swaps the document instance inside the array directly. The active tab index (`S.active`) remains unchanged, completely avoiding tab activation events."},{"oldLine":177,"kind":"removed","text":"- **New Line Buffer**: A new array `d.lines = new Array(j.total)` is allocated to the new line count, and the returned lines are inserted at `j.start`."},{"oldLine":178,"kind":"removed","text":"- **Chunk Tracking**: `d.chunks = new Set([tgt.start / CHUNK])` records the refreshed chunk. All other chunks are cleared so they fetch fresh content if scrolled into view."},{"oldLine":179,"kind":"removed","text":"- **Gutter \u0026 Lexer Refinement**: `loadGutter(d)` is dispatched to fetch fresh Git line diff markers, and `refineChunk(d, ...)` is called if Chroma emitted an inexact first-pass window."},{"oldLine":180,"kind":"removed","text":""},{"oldLine":181,"kind":"removed","text":"### Step 6: Active Document Resynchronization \u0026 Single-Pass Render"},{"oldLine":182,"kind":"removed","text":""},{"oldLine":183,"kind":"removed","text":"Once all tabs have been updated in memory, px1 updates the view surface:"},{"oldLine":184,"kind":"removed","text":""},{"oldLine":185,"kind":"removed","text":"```javascript"},{"oldLine":186,"kind":"removed","text":"const d = doc_();"},{"oldLine":187,"kind":"removed","text":"if (d) {"},{"oldLine":188,"kind":"removed","text":"  S.lsp.state = (d.lsp \u0026\u0026 d.lsp.state) || 'off';"},{"oldLine":189,"kind":"removed","text":"  S.lsp.server = (d.lsp \u0026\u0026 d.lsp.server) || '';"},{"oldLine":190,"kind":"removed","text":"  S.lsp.missing = (d.lsp \u0026\u0026 d.lsp.missing) || '';"},{"oldLine":191,"kind":"removed","text":"  warmLSP(d);"},{"oldLine":192,"kind":"removed","text":"  syncDiffView();"},{"oldLine":193,"kind":"removed","text":"  layout();"},{"oldLine":194,"kind":"removed","text":"  vp.scrollTop = d.scrollTop;"},{"oldLine":195,"kind":"removed","text":"  render();"},{"oldLine":196,"kind":"removed","text":"  if ($('#panel-outline')?.classList.contains('active')) loadOutline();"},{"oldLine":197,"kind":"removed","text":"}"},{"oldLine":198,"kind":"removed","text":""},{"oldLine":199,"kind":"removed","text":"drawTabs();"},{"oldLine":200,"kind":"removed","text":"drawCrumbs();"},{"oldLine":201,"kind":"removed","text":"updateStatus();"},{"oldLine":202,"kind":"removed","text":"```"},{"oldLine":203,"kind":"removed","text":""},{"oldLine":204,"kind":"removed","text":"- **Single Layout \u0026 Paint Budget**: Rather than re-rendering for each tab, a single `layout()` recalculates the sizer dimensions and a single `render()` mounts the ~60 visible rows into the DOM."},{"oldLine":205,"kind":"removed","text":"- **Viewport Scroll Restoration**: `vp.scrollTop = d.scrollTop` restores the user's exact scroll position on the freshly-sized canvas."},{"oldLine":206,"kind":"removed","text":"- **Outline Panel Resync**: If the symbol outline sidebar is active, `loadOutline()` re-extracts declarations against the updated file."},{"oldLine":207,"kind":"removed","text":""},{"oldLine":208,"kind":"removed","text":"---"},{"oldLine":209,"kind":"removed","text":""},{"oldLine":210,"kind":"removed","text":"## 4. Performance Optimizations"},{"oldLine":211,"kind":"removed","text":""},{"oldLine":212,"kind":"removed","text":"| Optimization | Technique | Impact |"},{"oldLine":213,"kind":"removed","text":"| :--- | :--- | :--- |"},{"oldLine":214,"kind":"removed","text":"| **Zero Tab-Switching Thrash** | Direct in-place array assignment (`S.tabs[idx] = d`) without calling `openFile()` | Eliminates $N$ DOM reflows, tab button CSS transitions, and navigation history pollution. |"},{"oldLine":215,"kind":"removed","text":"| **Single Reflow / Render Budget** | Deferred `layout()` and `render()` called once after all tabs are resolved | Keeps UI execution within the sub-millisecond frame budget regardless of open tab count. |"},{"oldLine":216,"kind":"removed","text":"| **Anchor-Bounded Chunk Loading** | Requests only the 1000-line chunk containing `cur` (`CHUNK = 1000`) | Network transfer payload remains $O(1)$ relative to total file size. |"},{"oldLine":217,"kind":"removed","text":"| **Concurrent Network Fetching** | `Promise.allSettled` over parallel HTTP connections | Overcomes serialized network latency across multi-tab sessions. |"},{"oldLine":218,"kind":"removed","text":"| **Server-Side Stat Validation** | `key = abs \\| mtime \\| size` caching in `highlight.go` | Bypasses disk I/O and syntax tokenization for all unmodified open files. |"},{"oldLine":219,"kind":"removed","text":"| **Non-Blocking Auxiliary Tasks** | Asynchronous `loadGutter()` and `refineChunk()` calls | Git diff markers and exact lexer refinements load in the background without stalling editor paint. |"},{"oldLine":220,"kind":"removed","text":""},{"oldLine":221,"kind":"removed","text":"---"},{"oldLine":222,"kind":"removed","text":""},{"oldLine":223,"kind":"removed","text":"## 5. Edge Cases \u0026 Resilience"},{"oldLine":224,"kind":"removed","text":""},{"oldLine":225,"kind":"removed","text":"### 1. Concurrent Tab Closure during In-Flight Network Requests"},{"oldLine":226,"kind":"removed","text":"- **Problem**: While `Promise.allSettled` is waiting on HTTP responses, the user might close one or more tabs."},{"oldLine":227,"kind":"removed","text":"- **Solution**: px1 looks up the index dynamically using the object reference captured before the request:"},{"oldLine":228,"kind":"removed","text":"  ```javascript"},{"oldLine":229,"kind":"removed","text":"  const idx = S.tabs.indexOf(tgt.oldDoc);"},{"oldLine":230,"kind":"removed","text":"  if (idx \u003c 0) continue;"},{"oldLine":231,"kind":"removed","text":"  ```"},{"oldLine":232,"kind":"removed","text":"  If the tab was closed, `idx` evaluates to `-1`, and the response is safely discarded without corrupting the tab array or array bounds."},{"oldLine":233,"kind":"removed","text":""},{"oldLine":234,"kind":"removed","text":"### 2. File Shrinkage \u0026 Caret Out-of-Bounds Clamping"},{"oldLine":235,"kind":"removed","text":"- **Problem**: An external process or branch switch truncates a 2,000-line file down to 50 lines while the user's cursor was at line 1,250. Retaining line 1,250 would cause blank virtualized rows and broken cursor rendering."},{"oldLine":236,"kind":"removed","text":"- **Solution**: The cursor position is clamped to the new file total:"},{"oldLine":237,"kind":"removed","text":"  ```javascript"},{"oldLine":238,"kind":"removed","text":"  const newCur = Math.max(1, Math.min(keep.cur || 1, j.total));"},{"oldLine":239,"kind":"removed","text":"  ```"},{"oldLine":240,"kind":"removed","text":"  Cursor line `cur` is guaranteed to satisfy $1 \\le \\text{cur} \\le \\text{total}$. Cursor horizontal column (`keep.col`) is safely retained."},{"oldLine":241,"kind":"removed","text":""},{"oldLine":242,"kind":"removed","text":"### 3. File Deletion or Permission Revocation on Disk"},{"oldLine":243,"kind":"removed","text":"- **Problem**: An open file is deleted or renamed externally before re-indexing. The backend `/api/file` endpoint responds with a `404` or `500` error."},{"oldLine":244,"kind":"removed","text":"- **Solution**: `Promise.allSettled` isolates the rejection. The old tab remains loaded and functional in the UI. If the deleted file is the currently active tab, an unobtrusive status bar warning is displayed (`setStatusNote`), preventing application crashes or blank editor views."},{"oldLine":245,"kind":"removed","text":""},{"oldLine":246,"kind":"removed","text":"### 4. Diff View Preference \u0026 Dismissal Persistence"},{"oldLine":247,"kind":"removed","text":"- **Problem**: A file with uncommitted Git changes might have diff mode active or dismissed by the user. On reload, Git diff availability may appear or disappear."},{"oldLine":248,"kind":"removed","text":"- **Solution**: A reload keeps each tab in the view it was in:"},{"oldLine":249,"kind":"removed","text":"  ```javascript"},{"oldLine":250,"kind":"removed","text":"  const diffMode = hasDiff ? (keep.diffMode || null) : null;"},{"oldLine":251,"kind":"removed","text":"  // ..."},{"oldLine":252,"kind":"removed","text":"  diffDismissed: !!keep.diffDismissed || !keep.diffMode,"},{"oldLine":253,"kind":"removed","text":"  diffScroll: keep === activeDoc \u0026\u0026 keep.diffMode ? diffScrollTop() : 0,"},{"oldLine":254,"kind":"removed","text":"  ```"},{"oldLine":255,"kind":"removed","text":"  - A tab in source view stays in source, even when the reload finds new changes (for example after an agent edit). It is marked `diffDismissed`, so `loadGutter()` does not switch it to the diff either. The Diff button is one click away."},{"oldLine":256,"kind":"removed","text":"  - A tab in the diff view keeps its split or unified layout, and the active tab's diff scroll offset is restored once the new diff renders."},{"oldLine":257,"kind":"removed","text":"  - If changes were committed externally, `hasDiff` evaluates to `false`, and `diffMode` cleanly resets to `null`."},{"oldLine":258,"kind":"removed","text":"  - Opening a file fresh is unaffected: a modified file still opens in the diff view."},{"oldLine":259,"kind":"removed","text":""},{"oldLine":260,"kind":"removed","text":"### 5. Binary \u0026 Image Tab Protection"},{"oldLine":261,"kind":"removed","text":"- **Problem**: If a file extension was replaced with an image or binary file, passing it to the text virtualization buffer would corrupt line array parsing."},{"oldLine":262,"kind":"removed","text":"- **Solution**: `if (j.image) continue;` skips image tabs, allowing specialized image rendering flows to handle the media."},{"oldLine":263,"kind":"removed","text":""},{"oldLine":264,"kind":"removed","text":"---"},{"oldLine":265,"kind":"removed","text":""},{"oldLine":266,"kind":"removed","text":"## 6. Related Documentation"},{"oldLine":267,"kind":"removed","text":""},{"oldLine":268,"kind":"removed","text":"- [System Architecture \u0026 Runtime Lifecycle](architecture.md) — HTTP router, lifecycle, and proactive memory management."},{"oldLine":269,"kind":"removed","text":"- [Editor Virtualization \u0026 Caret Engine](editor-virtualization.md) — Viewport virtualization, DOM recycling, and selection preservation."},{"oldLine":270,"kind":"removed","text":"- [Git Awareness \u0026 Diffing](git-integration.md) — CLI shell-out git status generation and diff view synchronization."},{"oldLine":271,"kind":"removed","text":"- [Windowed Syntax Highlighting](syntax-highlighting.md) — Dual-tier Chroma tokenization and chunked line streaming."}]}]},{"path":"docs/internals/fuzzy-search.md","status":"D","diff":"diff --git a/docs/internals/fuzzy-search.md b/docs/internals/fuzzy-search.md\ndeleted file mode 100644\nindex e78f9ab..0000000\n--- a/docs/internals/fuzzy-search.md\n+++ /dev/null\n@@ -1,103 +0,0 @@\n-# Fuzzy Path Matching Engine\n-\n-This document describes the algorithms, scoring heuristics, and concurrency strategies behind px1's ultra-fast fuzzy file finder ([`fuzzy.go`](../../fuzzy.go)).\n-\n-## 1. The Fuzzy Matching Challenge\n-\n-Traditional fuzzy matchers (such as Smith-Waterman or Needleman-Wunsch dynamic programming algorithms) achieve high ranking accuracy by evaluating an $O(N \\times M)$ alignment matrix (where $N$ is path length and $M$ is query length). However, on large workspaces containing 50,000-100,000 files, evaluating DP matrices for every keystroke introduces noticeable typing latency and burns CPU cycles.\n-\n-Conversely, naive greedy linear scans run in $O(N)$ time but frequently produce poor match clusters, matching the earliest available character rather than the tightest and most intuitive run.\n-\n-px1 solves this with a Two-Pass Bounded Search Algorithm:\n-\n-- It achieves the clustering and ranking accuracy of dynamic programming.\n-- It operates strictly in $O(N)$ linear time without intermediate allocations.\n-- It returns ranked results across tens of thousands of paths in sub-millisecond time.\n-\n-## 2. Two-Pass Bounded Matching Algorithm\n-\n-The matching logic in `fuzzyScore(q, e, pos)` operates in two discrete passes:\n-\n-```mermaid\n-flowchart TD\n-    subgraph Pass1 [\"Pass 1: Forward Linear Scan (Existence \u0026 Boundary)\"]\n-        F1[\"Scan query characters left-to-right against lowercase path\"]\n-        F2[\"Verify all query runes exist in sequential order\"]\n-        F3[\"Record ending index 'end' of last matched rune\"]\n-    end\n-\n-    subgraph Pass2 [\"Pass 2: Backward Bounded Scan (Tightest Clustering)\"]\n-        B1[\"Start at 'end' index and scan backwards toward index 0\"]\n-        B2[\"Greedily match query characters right-to-left\"]\n-        B3[\"Pulls matched indices into tightest possible cluster\"]\n-        B4[\"Invert matched positions in-place\"]\n-    end\n-\n-    subgraph Scoring [\"Scoring \u0026 Heuristic Evaluation\"]\n-        S1[\"Consecutive character bonuses\"]\n-        S2[\"Boundary / Segment separator bonuses\"]\n-        S3[\"camelCase transition bonuses\"]\n-        S4[\"Basename concentration bonuses\"]\n-        S5[\"Bounded gap penalties\"]\n-    end\n-\n-    Pass1 --\u003e|Query Match Confirmed| Pass2\n-    Pass1 --\u003e|Missing Rune| Reject[\"Reject Path (score = 0)\"]\n-    Pass2 --\u003e Scoring\n-```\n-\n-### Step-by-Step Execution\n-\n-1. Pass 1 (Forward Scan): Evaluates whether every rune in query `q` exists sequentially in `e.lower`. Records the index `end` where the final rune was located. If the scan reaches the end of the path without exhausting the query, the path is immediately rejected ($O(\\text{prefix})$ fast rejection).\n-1. Pass 2 (Backward Scan from `end`): Starting from `end`, scans backward toward 0, matching query characters in reverse order. Because it starts from the earliest valid termination point and moves backward, it naturally converges on the tightest possible cluster of matching runes. Matched byte offsets are appended to a reusable slice `pos` and flipped in-place.\n-\n-## 3. Weighted Scoring Matrix\n-\n-Once the optimal character positions `pos` are determined, the path is scored according to human developer navigation patterns:\n-\n-| Criterion              | Score Delta     | Rationale                                                                                                               |\n-| ---------------------- | --------------- | ----------------------------------------------------------------------------------------------------------------------- |\n-| Consecutive Run        | `+12`           | Characters typed together (e.g. `ctrl` matching `controller`) should score significantly higher than scattered characters. |\n-| Boundary Character     | `+16`           | Characters immediately following `/`, `_`, `-`, `.`, space, or `@` indicate word boundaries (e.g., `gs` matching `git_status`). |\n-| camelCase Transition   | `+14`           | Matches on uppercase letters in mixed-case names (e.g., `fb` matching `FooBar`).                                       |\n-| Hit in Basename        | `+14`           | Matches inside the file's filename are penalized far less than matches buried deep in directory prefix names.          |\n-| Exact Basename Match   | `+40`           | If the matched positions exactly encompass the entire basename, massive priority is awarded.                            |\n-| Gap Penalty            | `-min(gap, 12)` | Bounded penalty for non-consecutive gaps between matched characters.                                                    |\n-| Path Length Penalty    | `-len(path) / 4`| Prevents deeply nested files from outranking shorter, top-level canonical files.                                        |\n-\n-```go\n-func isBoundary(b byte) bool {\n-    switch b {\n-    case '/', '_', '-', '.', ' ', '@':\n-        return true\n-    }\n-    return false\n-}\n-```\n-\n-## 4. Multi-Core Parallel Query Slicing\n-\n-For smaller repositories (\u003c4,000 files), single-threaded execution easily completes in under 1 ms. However, when navigating repositories like Kubernetes or the Linux Kernel (25,000-100,000 files), query evaluation is automatically partitioned across CPU cores.\n-\n-```go\n-func (ix *Index) Find(q string, limit int) []FuzzyResult {\n-    files := ix.Files()\n-    if len(files) == 0 || q == \"\" {\n-        return nil\n-    }\n-\n-    // Partition across CPU workers for large indices\n-    if len(files) \u003e= 4000 {\n-        workers := runtime.NumCPU()\n-        chunkSize := (len(files) + workers - 1) / workers\n-        // Workers evaluate chunks concurrently...\n-    }\n-}\n-```\n-\n-### Concurrency Pipeline\n-\n-1. The `files` slice is partitioned into equal chunks across `runtime.NumCPU()` workers.\n-1. Each worker allocates a local result buffer and evaluates its chunk independently without lock contention.\n-1. Once all workers finish, top candidate slices are merged and sorted in-place.\n-1. The sorted results are capped at `limit` (typically 50 results) and returned to the client as JSON.\n","hunks":[{"id":"diff-90422b3a20dde009","header":"@@ -1,103 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Fuzzy Path Matching Engine"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document describes the algorithms, scoring heuristics, and concurrency strategies behind px1's ultra-fast fuzzy file finder ([`fuzzy.go`](../../fuzzy.go))."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. The Fuzzy Matching Challenge"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"Traditional fuzzy matchers (such as Smith-Waterman or Needleman-Wunsch dynamic programming algorithms) achieve high ranking accuracy by evaluating an $O(N \\times M)$ alignment matrix (where $N$ is path length and $M$ is query length). However, on large workspaces containing 50,000-100,000 files, evaluating DP matrices for every keystroke introduces noticeable typing latency and burns CPU cycles."},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"Conversely, naive greedy linear scans run in $O(N)$ time but frequently produce poor match clusters, matching the earliest available characte en matched characters.                                                    |"},{"oldLine":66,"kind":"removed","text":"| Path Length Penalty    | `-len(path) / 4`| Prevents deeply nested files from outranking shorter, top-level canonical files.                                        |"},{"oldLine":67,"kind":"removed","text":""},{"oldLine":68,"kind":"removed","text":"```go"},{"oldLine":69,"kind":"removed","text":"func isBoundary(b byte) bool {"},{"oldLine":70,"kind":"removed","text":"    switch b {"},{"oldLine":71,"kind":"removed","text":"    case '/', '_', '-', '.', ' ', '@':"},{"oldLine":72,"kind":"removed","text":"        return true"},{"oldLine":73,"kind":"removed","text":"    }"},{"oldLine":74,"kind":"removed","text":"    return false"},{"oldLine":75,"kind":"removed","text":"}"},{"oldLine":76,"kind":"removed","text":"```"},{"oldLine":77,"kind":"removed","text":""},{"oldLine":78,"kind":"removed","text":"## 4. Multi-Core Parallel Query Slicing"},{"oldLine":79,"kind":"removed","text":""},{"oldLine":80,"kind":"removed","text":"For smaller repositories (\u003c4,000 files), single-threaded execution easily completes in under 1 ms. However, when navigating repositories like Kubernetes or the Linux Kernel (25,000-100,000 files), query evaluation is automatically partitioned across CPU cores."},{"oldLine":81,"kind":"removed","text":""},{"oldLine":82,"kind":"removed","text":"```go"},{"oldLine":83,"kind":"removed","text":"func (ix *Index) Find(q string, limit int) []FuzzyResult {"},{"oldLine":84,"kind":"removed","text":"    files := ix.Files()"},{"oldLine":85,"kind":"removed","text":"    if len(files) == 0 || q == \"\" {"},{"oldLine":86,"kind":"removed","text":"        return nil"},{"oldLine":87,"kind":"removed","text":"    }"},{"oldLine":88,"kind":"removed","text":""},{"oldLine":89,"kind":"removed","text":"    // Partition across CPU workers for large indices"},{"oldLine":90,"kind":"removed","text":"    if len(files) \u003e= 4000 {"},{"oldLine":91,"kind":"removed","text":" hose from an explicit review-provider action ([Review Provider Dispatch](agent-editing.md)).\n-- Zero disk footprint: holds all status and diff structures in volatile memory on the `Index` (`Node.Status`).\n-- Graceful degradation: if `git` is not installed, or if the opened directory is not a git repository, git features degrade silently without warnings or errors.\n-- Can be disabled explicitly using the `-no-git` CLI flag.\n-\n-## 2. Concurrent Status Generation\n-\n-On large repositories, running `git status` can take 50-100 milliseconds. Running this serially during startup would delay index readiness.\n-\n-px1 runs `git status` concurrently alongside the filesystem walk:\n-\n-```go\n-gsCh := make(chan map[string]string, 1)\n-go func() { gsCh \u003c- gitStatus(ix.root) }()\n-\n-// Walk directory tree concurrently...\n-walk(ix.root, \"\", root)\n-\n-// Overlay git status onto index nodes\n-gs := \u003c-gsCh\n-```\n-\n-### Git Command Specification\n-\n-px1 invokes:\n-\n-```bash\n-git status --porcelain=v2 -z\n-```\n-\n-- `--porcelain=v2`: Machine-readable format immune to user git config customizations.\n-- `-z`: NUL-delimited output preventing issues with filenames containing spaces, tabs, quotes, or Unicode characters.\n-\n-## 3. In-Memory Status \u0026 Dirty Folder Propagation\n-\n-Git status codes are mapped onto tree nodes:\n-\n-- `M`: Modified\n-- `A`: Added / Staged\n-- `D`: Deleted\n-- `U`: Untracked\n-- `R`: Renamed\n-\n-### Ancestor Folder Dirty Propagation (`Node.Dirty`)\n-\n-When a file is modified, its status is recorded on its `Node.Status`. Furthermore, every ancestor folder in its path hierarchy is marked `Dirty: true`:\n-\n-```go\n-for p := rel; p != \"\"; {\n-    if i := strings.LastIndexByte(p, '/'); i \u003e= 0 {\n-        p = p[:i]\n-    } else {\n-        p = \"\"\n-    }\n-    for i := range children[p] {\n-        if children[p][i].Dir \u0026\u0026 isAncestor(children[p][i].Path, rel) {\n-            children[p][i].Dirty = true\n-        }\n-    }\n-}\n-```\n-\n-This enables the file tree in the sidebar to visually highlight collapsed directories that contain modified descendants, allowing developers to immediately spot repository changes.\n-\n-## 4. Diffing: One Git Call, Two Consumers, Three Views\n-\n-Both the line gutter and the full diff view are read off the same shell-out, `gitDiff(root, relpath)`:\n-\n-```bash\n-git diff --no-color HEAD -- \u003cpath\u003e\n-```\n-\n-The raw unified diff text is cached at that call site; everything downstream (line-range extraction in Go, and hunk parsing in the browser) is a pure parse of that one string, so a file is never diffed against `HEAD` more than once per request.\n-\n-### Gutter Change Indicators (`/api/gutter?path=...`)\n-\n-When viewing a file, the editor displays green, blue, and red markers in the line gutter indicating local edits. `gitHunks(root, relpath)` (`git.go`) runs `gitDiff` and walks its `@@ -l,s +l,s @@` hunk headers and `+`/`-` lines with a small state machine, bucketing every changed line into 1-based **new-file** line numbers:\n-\n-- `added`: Pure insertions.\n-- `modified`: Lines replaced (a `-` run immediately followed by a `+` run).\n-- `deleted`: One marker per pure-deletion run, placed at the new-file line the deletion sat before.\n-\n-`/api/gutter` returns these three arrays; `web/src/tabs.js` fetches them once per opened tab and `web/src/renderer.js` paints them as `box-shadow` bars (added/modified) or a small wedge (deleted) on the `.g` line-number cell — O(1) per visible row, no re-parsing on scroll.\n-\n-### File Diff (`/api/diff?path=...`)\n-\n-`handleDiff` (`server.go`) returns `{ path, diff, available }` — the same raw text `gitDiff` produced, with `available` set whenever it's non-empty (clean or untracked files get `\"\"`). No hunk parsing happens on the server for this endpoint; the client owns that, because it needs two different reshapes of the same hunks (split and unified) and re-parsing client-side avoids two server round trips or two response shapes for one diff.\n-\n-### Split \u0026 Unified Views (`web/src/diff.js`)\n-\n-The active tab gets a `Source | Diff` switch next to the tab bar (`#diff-switch`, shown only when `d.diffAvailable`) whenever the open file is modified in a git repo. `#diff-source` and `#diff-btn` each show their own view, and hovering the Diff half opens the Split/Unified menu; `Cmd/Ctrl+D` toggles the same thing, resuming whichever layout was used last (`localStorage['px1.diffLayout']`, default `split`). Each tab remembers its state on `d.diffMode` (`'split' | 'unified' | null`).\n-\n-Unlike the main code view, the diff is **not** rendered through the virtualized `#rows` viewport. A single file's diff is small (bounded by the size of that one file), so `diff.js` renders it as plain DOM into a dedicated `#diffview` overlay:\n-\n-1. **Parse.** `parseDiff(text)` splits the raw diff on `@@ ... @@` hunk headers and walks each hunk's `+`/`-`/context lines once, tagging every row `add` / `del` / `ctx` and carrying its old-file and/or new-file line number. This runs once per file per session; the parsed hunks are cached on `d.diffHunks` so switching Split ↔ Unified re-renders from memory with no re-fetch.\n-1. **Unified layout.** One row per parsed line: old-line column, new-line column (whichever side doesn't apply is blank), a `+`/`-` marker, and the code — a direct read of `d.diffHunks`, GitHub-\"unified\"-style.\n-1. **Split layout.** `pairRows(hunk.rows)` walks each hunk and pairs a deletion run with the addition run immediately following it, index by index, padding the shorter side with a blank cell (`.diff-blank`) — the same replacement-block pairing GitHub's split view uses. Context lines pass straight across both columns unpaired. Each pair renders as one flex row with a left/right half, so the two columns stay vertically aligned for free — no synced-scroll JavaScript, because both halves of a pair are literally the same DOM row.\n-\n-Every rendered row that exists in the working tree carries its line in `data-l`, on both halves of a split context row; a deleted row carries `data-at`, the working-tree line it sat before. `selbar.js` reads these so a selection anywhere in the diff can drive the selection bar and right-click review actions.\n-\n-Both layouts share the same hunk-header, line-number, marker, and code-cell builders; only the row-shape (one column vs. two) differs, so a fix to how a line renders never needs to be made twice.\n-\n-## 6. Worktrees\n-\n-`git worktree list --porcelain` gives px1 every checkout of the repository (`worktrees` in [`git.go`](../../git.go)): path, branch, HEAD, which one is the main checkout, which one is being served, and whether the directory still exists. An agent told to work on a branch frequently runs in one of these, so the files it changed are not in the directory px1 was launched in; without the switcher the review queue simply looks empty.\n-\n-- **Listing.** `GET /api/worktrees` is read-only and returns an empty list outside a git repository, which hides the switcher in the UI. Entries are ordered newest first, by the modification time of the `.git` *file* `git worktree add` writes into a linked checkout. The main checkout's `.git` is a directory that every git operation touches, so it carries no time and sorts last.\n-- **Switching.** `POST /api/worktree/switch` accepts only a path git itself lists, so it never becomes a way to open an arbitrary directory. It re-points each root-bound manager through its own `SetRoot` — index, language servers (stopped first: a server is started inside one root and cannot follow), checks, review sessions and team rules — then rebuilds the index. It refuses while a review-provider job is in flight, since that provider is writing into the old checkout.\n-- **Per-checkout state.** Review sessions and rules are keyed by workspace root, so each worktree keeps its own baseline, comments, pins and rule hits. Switching therefore never carries one branch's review into another.\n-- **Starting the review.** The Review panel starts an explicit local session from the current checkout. Its baseline is the working tree and its `Head` is the checkout's current commit, if any. `autoStartReview` ([`autoreview.go`](../../autoreview.go)) is an optional local convenience, disabled by default, that can start a session at launch and after a switch. Main checkouts and non-worktree directories keep the same working-tree baseline behavior; linked worktrees use `worktreeBase` — the commit checked out when the worktree was created, from its per-worktree HEAD reflog — only in this opt-in compatibility path. `reviewManager.StartFromCommits(base, head)` is the separate commit-pinned path: both SHAs are resolved and stored explicitly, and the workspace's current `HEAD` is never substituted for the requested head. GitHub-linked sessions should use that path rather than relying on local discovery.\n-\n-The session identity matrix is therefore:\n-\n-| Session mode | Baseline | Identity source |\n-| --- | --- | --- |\n-| Explicit local Review-panel start | Current working tree | Current checkout `HEAD` captured at start, when available |\n-| Opt-in automatic local start | Current working tree, or linked-worktree `worktreeBase` | Local compatibility discovery |\n-| Commit-pinned/imported review | Explicit `base` commit archive | Explicit `base` and `head` SHAs via `StartFromCommits` |\n-\n-- **The gitfile.** In a linked worktree `.git` is a file pointing at the main repository, not a directory, so the index and the review snapshot skip `.git` by name rather than by type.\n-- **Client.** [`web/src/worktree.js`](../../web/src/worktree.js) fills the header menu and reloads the page after a successful switch: open tabs, the tree and the review queue all belong to the previous checkout.\n","hunks":[{"id":"diff-243b293c29020f3f","header":"@@ -1,132 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Git Awareness \u0026 Diffing"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document describes the design and implementation of px1's git integration engine ([`git.go`](../../git.go)) and its diff-rendering frontend ([`web/src/diff.js`](../../web/src/diff.js))."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. Zero-Dependency Shell-Out Architecture"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"px1 avoids heavy third-party Go git libraries (such as `go-git`, which can consume large amounts of memory re-parsing packfiles, or `libgit2`, which requires CGO)."},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"Instead, px1 adheres to a Pure Shell-Out Architecture:"},{"oldLine":10,"kind":"removed","text":""},{"oldLine":11,"kind":"removed","text":"- Shells out directly to the host `git` binary."},{"oldLine":12,"kind":"removed","text":"- Never stages, commits, or changes refs or the index. The only workspace writes px1 makes are those from an explicit review-provider action ([Review Provider Dispatch](agent-editing.md))."},{"oldLine":13,"kind":"removed","text":"- Zero disk footprint: holds all status and diff structures in volatile memory on the `Index` (`Node.Status`)."},{"oldLine":14,"kind":"removed","text":"- Graceful degradation: if `git` is not installed, or if the opened directory is not a git repository, git features degrade silently without warnings or errors."},{"oldLine":15,"kind":"removed","text":"- Can be disabled explicitly using the `-no-git` CLI flag."},{"oldLine":16,"kind":"removed","text":""},{"oldLine":17,"kind":"removed","text":"## 2. Concurrent Status Generation"},{"oldLine":18,"kind":"removed","text":""},{"oldLine":19,"kind":"removed","text":"On large repositories, running `git status` can take 50-100 milliseconds. Running this serially during startup would delay index readiness."},{"oldLine":20,"kind":"removed","text":""},{"oldLine":21,"kind":"removed","text":"px1 runs `git status` concurrently alongside the filesystem walk:"},{"oldLine":22,"kind":"removed","text":""},{"oldLine":23,"kind":"removed","text":"```go"},{"oldLine":24,"kind":"removed","text":"gsCh := make(chan map[string]string, 1)"},{"oldLine":25,"kind":"removed","text":"go func() { gsCh \u003c- gitStatus(ix.root) }()"},{"oldLine":26,"kind":"removed","text":""},{"oldLine":27,"kind":"removed","text":"// Walk directory tree concurrently..."},{"oldLine":28,"kind":"removed","text":"walk(ix.root, \"\", root)"},{"oldLine":29,"kind":"removed","text":""},{"oldLine":30,"kind":"removed","text":"// Overlay git status onto index nodes"},{"oldLine":31,"kind":"removed","text":"gs := \u003c-gsCh"},{"oldLine":32,"kind":"removed","text":"```"},{"oldLine":33,"kind":"removed","text":""},{"oldLine":34,"kind":"removed","text":"### Git Command Specification"},{"oldLine":35,"kind":"removed","text":""},{"oldLine":36,"kind":"removed","text":"px1 invokes:"},{"oldLine":37,"kind":"removed","text":""},{"oldLine":38,"kind":"removed","text":"```bash"},{"oldLine":39,"kind":"removed","text":"git status --porcelain=v2 -z"},{"oldLine":40,"kind":"removed","text":"```"},{"oldLine":41,"kind":"removed","text":""},{"oldLine":42,"kind":"removed","text":"- `--porcelain=v2`: Machine-readable format immune to user git config customizations."},{"oldLine":43,"kind":"removed","text":"- `-z`: NUL-delimited output preventing issues with filenames containing spaces, tabs, quotes, or Unicode characters."},{"oldLine":44,"kind":"removed","text":""},{"oldLine":45,"kind":"removed","text":"## 3. In-Memory Status \u0026 Dirty Folder Propagation"},{"oldLine":46,"kind":"removed","text":""},{"oldLine":47,"kind":"removed","text":"Git status codes are mapped onto tree nodes:"},{"oldLine":48,"kind":"removed","text":""},{"oldLine":49,"kind":"removed","text":"- `M`: Modified"},{"oldLine":50,"kind":"removed","text":"- `A`: Added / Staged"},{"oldLine":51,"kind":"removed","text":"- `D`: Deleted"},{"oldLine":52,"kind":"removed","text":"- `U`: Untracked"},{"oldLine":53,"kind":"removed","text":"- `R`: Renamed"},{"oldLine":54,"kind":"removed","text":""},{"oldLine":55,"kind":"removed","text":"### Ancestor Folder Dirty Propagation (`Node.Dirty`)"},{"oldLine":56,"kind":"removed","text":""},{"oldLine":57,"kind":"removed","text":"When a file is modified, its status is recorded on its `Node.Status`. Furthermore, every ancestor folder in its path hierarchy is marked `Dirty: true`:"},{"oldLine":58,"kind":"removed","text":""},{"oldLine":59,"kind":"removed","text":"```go"},{"oldLine":60,"kind":"removed","text":"for p := rel; p != \"\"; {"},{"oldLine":61,"kind":"removed","text":"    if i := strings.LastIndexByte(p, '/'); i \u003e= 0 {"},{"oldLine":62,"kind":"removed","text":"        p = p[:i]"},{"oldLine":63,"kind":"removed","text":"    } else {"},{"oldLine":64,"kind":"removed","text":"        p = \"\""},{"oldLine":65,"kind":"removed","text":"    }"},{"oldLine":66,"kind":"removed","text":"    for i := range children[p] {"},{"oldLine":67,"kind":"removed","text":"        if children[p][i].Dir \u0026\u0026 isAncestor(children[p][i].Path, rel) {"},{"oldLine":68,"kind":"removed","text":"            children[p][i].Dirty = true"},{"oldLine":69,"kind":"removed","text":"        }"},{"oldLine":70,"kind":"removed","text":"    }"},{"oldLine":71,"kind":"removed","text":"}"},{"oldLine":72,"kind":"removed","text":"```"},{"oldLine":73,"kind":"removed","text":""},{"oldLine":74,"kind":"removed","text":"This enables the file tree in the sidebar to visually highlight collapsed directories that contain modified descendants, allowing developers to immediately spot repository changes."},{"oldLine":75,"kind":"removed","text":""},{"oldLine":76,"kind":"removed","text":"## 4. Diffing: One Git Call, Two Consumers, Three Views"},{"oldLine":77,"kind":"removed","text":""},{"oldLine":78,"kind":"removed","text":"Both the line gutter and the full diff view are read off the same shell-out, `gitDiff(root, relpath)`:"},{"oldLine":79,"kind":"removed","text":""},{"oldLine":80,"kind":"removed","text":"```bash"},{"oldLine":81,"kind":"removed","text":"git diff --no-color HEAD -- \u003cpath\u003e"},{"oldLine":82,"kind":"removed","text":"```"},{"oldLine":83,"kind":"removed","text":""},{"oldLine":84,"kind":"removed","text":"The raw unified diff text is cached at that call site; everything downstream (line-range extraction in Go, and hunk parsing in the browser) is a pure parse of that one string, so a file is never diffed against `HEAD` more than once per request."},{"oldLine":85,"kind":"removed","text":""},{"oldLine":86,"kind":"removed","text":"### Gutter Change Indicators (`/api/gutter?path=...`)"},{"oldLine":87,"kind":"removed","text":""},{"oldLine":88,"kind":"removed","text":"When viewing a file, the editor displays green, blue, and red markers in the line gutter indicating local edits. `gitHunks(root, relpath)` (`git.go`) runs `gitDiff` and walks its `@@ -l,s +l,s @@` hunk headers and `+`/`-` lines with a small state machine, bucketing every changed line into 1-based **new-file** line numbers:"},{"oldLine":89,"kind":"removed","text":""},{"oldLine":90,"kind":"removed","text":"- `added`: Pure insertions."},{"oldLine":91,"kind":"removed","text":"- `modified`: Lines replaced (a `-` run immediately followed by a `+` run)."},{"oldLine":92,"kind":"removed","text":"- `deleted`: One marker per pure-deletion run, placed at the new-file line the deletion sat before."},{"oldLine":93,"kind":"removed","text":""},{"oldLine":94,"kind":"removed","text":"`/api/gutter` returns these three arrays; `web/src/tabs.js` fetches them once per opened tab and `web/src/renderer.js` paints them as `box-shadow` bars (added/modified) or a small wedge (deleted) on the `.g` line-number cell — O(1) per visible row, no re-parsing on scroll."},{"oldLine":95,"kind":"removed","text":""},{"oldLine":96,"kind":"removed","text":"### File Diff (`/api/diff?path=...`)"},{"oldLine":97,"kind":"removed","text":""},{"oldLine":98,"kind":"removed","text":"`handleDiff` (`server.go`) returns `{ path, diff, available }` — the same raw text `gitDiff` produced, with `available` set whenever it's non-empty (clean or untracked files get `\"\"`). No hunk parsing happens on the server for this endpoint; the client owns that, because it needs two different reshapes of the same hunks (split and unified) and re-parsing client-side avoids two server round trips or two response shapes for one diff."},{"oldLine":99,"kind":"removed","text":""},{"oldLine":100,"kind":"removed","text":"### Split \u0026 Unified Views (`web/src/diff.js`)"},{"oldLine":101,"kind":"removed","text":""},{"oldLine":102,"kind":"removed","text":"The active tab gets a `Source | Diff` switch next to the tab bar (`#diff-switch`, shown only when `d.diffAvailable`) whenever the open file is modified in a git repo. `#diff-source` and `#diff-btn` each show their own view, and hovering the Diff half opens the Split/Unified menu; `Cmd/Ctrl+D` toggles the same thing, resuming whichever layout was used last (`localStorage['px1.diffLayout']`, default `split`). Each tab remembers its state on `d.diffMode` (`'split' | 'unified' | null`)."},{"oldLine":103,"kind":"removed","text":""},{"oldLine":104,"kind":"removed","text":"Unlike the main code view, the diff is **not** rendered through the virtualized `#rows` viewport. A single file's diff is small (bounded by the size of that one file), so `diff.js` renders it as plain DOM into a dedicated `#diffview` overlay:"},{"oldLine":105,"kind":"removed","text":""},{"oldLine":106,"kind":"removed","text":"1. **Parse.** `parseDiff(text)` splits the raw diff on `@@ ... @@` hunk headers and walks each hunk's `+`/`-`/context lines once, tagging every row `add` / `del` / `ctx` and carrying its old-file and/or new-file line number. This runs once per file per session; the parsed hunks are cached on `d.diffHunks` so switching Split ↔ Unified re-renders from memory with no re-fetch."},{"oldLine":107,"kind":"removed","text":"1. **Unified layout.** One row per parsed line: old-line column, new-line column (whichever side doesn't apply is blank), a `+`/`-` marker, and the code — a direct read of `d.diffHunks`, GitHub-\"unified\"-style."},{"oldLine":108,"kind":"removed","text":"1. **Split layout.** `pairRows(hunk.rows)` walks each hunk and pairs a deletion run with the addition run immediately following it, index by index, padding the shorter side with a blank cell (`.diff-blank`) — the same replacement-block pairing GitHub's split view uses. Context lines pass straight across both columns unpaired. Each pair renders as one flex row with a left/right half, so the two columns stay vertically aligned for free — no synced-scroll JavaScript, because both halves of a pair are literally the same DOM row."},{"oldLine":109,"kind":"removed","text":""},{"oldLine":110,"kind":"removed","text":"Every rendered row that exists in the working tree carries its line in `data-l`, on both halves of a split context row; a deleted row carries `data-at`, the working-tree line it sat before. `selbar.js` reads these so a selection anywhere in the diff can drive the selection bar and right-click review actions."},{"oldLine":111,"kind":"removed","text":""},{"oldLine":112,"kind":"removed","text":"Both layouts share the same hunk-header, line-number, marker, and code-cell builders; only the row-shape (one column vs. two) differs, so a fix to how a line renders never needs to be made twice."},{"oldLine":113,"kind":"removed","text":""},{"oldLine":114,"kind":"removed","text":"## 6. Worktrees"},{"oldLine":115,"kind":"removed","text":""},{"oldLine":116,"kind":"removed","text":"`git worktree list --porcelain` gives px1 every checkout of the repository (`worktrees` in [`git.go`](../../git.go)): path, branch, HEAD, which one is the main checkout, which one is being served, and whether the directory still exists. An agent told to work on a branch frequently runs in one of these, so the files it changed are not in the directory px1 was launched in; without the switcher the review queue simply looks empty."},{"oldLine":117,"kind":"removed","text":""},{"oldLine":118,"kind":"removed","text":"- **Listing.** `GET /api/worktrees` is read-only and returns an empty list outside a git repository, which hides the switcher in the UI. Entries are ordered newest first, by the modification time of the `.git` *file* `git worktree add` writes into a linked checkout. The main checkout's `.git` is a directory that every git operation touches, so it carries no time and sorts last."},{"oldLine":119,"kind":"removed","text":"- **Switching.** `POST /api/worktree/switch` accepts only a path git itself lists, so it never becomes a way to open an arbitrary directory. It re-points each root-bound manager through its own `SetRoot` — index, language servers (stopped first: a server is started inside one root and cannot follow), checks, review sessions and team rules — then rebuilds the index. It refuses while a review-provider job is in flight, since that provider is writing into the old checkout."},{"oldLine":120,"kind":"removed","text":"- **Per-checkout state.** Review sessions and rules are keyed by workspace root, so each worktree keeps its own baseline, comments, pins and rule hits. Switching therefore never carries one branch's review into another."},{"oldLine":121,"kind":"removed","text":"- **Starting the review.** The Review panel starts an explicit local session from the current checkout. Its baseline is the working tree and its `Head` is the checkout's current commit, if any. `autoStartReview` ([`autoreview.go`](../../autoreview.go)) is an optional local convenience, disabled by default, that can start a session at launch and after a switch. Main checkouts and non-worktree directories keep the same working-tree baseline behavior; linked worktrees use `worktreeBase` — the commit checked out when the worktree was created, from its per-worktree HEAD reflog — only in this opt-in compatibility path. `reviewManager.StartFromCommits(base, head)` is the separate commit-pinned path: both SHAs are resolved and stored explicitly, and the workspace's current `HEAD` is never substituted for the requested head. GitHub-linked sessions should use that path rather than relying on local discovery."},{"oldLine":122,"kind":"removed","text":""},{"oldLine":123,"kind":"removed","text":"The session identity matrix is therefore:"},{"oldLine":124,"kind":"removed","text":""},{"oldLine":125,"kind":"removed","text":"| Session mode | Baseline | Identity source |"},{"oldLine":126,"kind":"removed","text":"| --- | --- | --- |"},{"oldLine":127,"kind":"removed","text":"| Explicit local Review-panel start | Current working tree | Current checkout `HEAD` captured at start, when available |"},{"oldLine":128,"kind":"removed","text":"| Opt-in automatic local start | Current working tree, or linked-worktree `worktreeBase` | Local compatibility discovery |"},{"oldLine":129,"kind":"removed","text":"| Commit-pinned/imported review | Explicit `base` commit archive | Explicit `base` and `head` SHAs via `StartFromCommits` |"},{"oldLine":130,"kind":"removed","text":""},{"oldLine":131,"kind":"removed","text":"- **The gitfile.** In a linked worktree `.git` is a file pointing at the main repository, not a directory, so the index and the review snapshot skip `.git` by name rather than by type."},{"oldLine":132,"kind":"removed","text":"- **Client.** [`web/src/worktree.js`](../../web/src/worktree.js) fills the header menu and reloads the page after a successful switch: open tabs, the tree and the review queue all belong to the previous checkout."}]}]},{"path":"docs/internals/indexing-and-ignore.md","status":"D","diff":"diff --git a/docs/internals/indexing-and-ignore.md b/docs/internals/indexing-and-ignore.md\ndeleted file mode 100644\nindex 32c2f2a..0000000\n--- a/docs/internals/indexing-and-ignore.md\n+++ /dev/null\n@@ -1,163 +0,0 @@\n-# Filesystem Indexing \u0026 Ignore Engine\n-\n-This document explains the technical implementation of px1's in-memory indexer ([`index.go`](../../index.go)) and custom `.gitignore` evaluation engine ([`ignore.go`](../../ignore.go)).\n-\n-## 1. Directory Traversal Architecture\n-\n-Indexing thousands of directories and tens of thousands of source files must complete in milliseconds without exhausting system memory or file descriptors.\n-\n-```mermaid\n-flowchart TD\n-    Start[\"Index.Build() Initiated\"] --\u003e RootIg[\"Initialize Root ignoreSet + .gitignore\"]\n-    RootIg --\u003e ReadRoot[\"Read Root Directory (dir='')\"]\n-    ReadRoot --\u003e PublishRoot[\"Publish ix.children[''] Immediately\u003cbr/\u003e(Sub-millisecond Sidebar Render)\"]\n-    PublishRoot --\u003e SpawnWalk[\"Enqueue Subdirectories into Semaphore Pool\"]\n-    \n-    subgraph WorkerPool [\"Bounded Parallel Worker Pool (NumCPU * 4)\"]\n-        W1[\"Worker Goroutine\"]\n-        W2[\"Worker Goroutine\"]\n-        W3[\"Worker Goroutine\"]\n-    end\n-    \n-    SpawnWalk --\u003e|Slot Available| WorkerPool\n-    SpawnWalk --\u003e|Pool Saturated| Inline[\"Recurse Inline on Current Goroutine\"]\n-    \n-    WorkerPool --\u003e ProcessDir[\"os.ReadDir(abs)\"]\n-    Inline --\u003e ProcessDir\n-    \n-    ProcessDir --\u003e CheckIg[\"Evaluate ignoreSet.match(rel, isDir)\"]\n-    CheckIg --\u003e|Ignored Directory| MarkDimmed[\"Add to Node List with Ignored=true\u003cbr/\u003e(Do NOT Descend or Index)\"]\n-    CheckIg --\u003e|Active Directory| AddSubdir[\"Add to Directory List \u0026 Recurse\"]\n-    CheckIg --\u003e|Active File| AppendFile[\"Append FileEntry to files Slice\"]\n-```\n-\n-### Bounded Concurrency Semaphore\n-\n-Unbounded goroutine creation during directory traversal can cause thread contention, high memory churn, and \"too many open files\" errors. px1 controls traversal concurrency using a buffered channel semaphore:\n-\n-```go\n-sem := make(chan struct{}, runtime.NumCPU() * 4)\n-```\n-\n-When a subdirectory is discovered:\n-\n-```go\n-select {\n-case sem \u003c- struct{}{}:\n-    go func(a, r string, g *ignoreSet) {\n-        defer func() { \u003c-sem }()\n-        walk(a, r, g)\n-    }(sd.abs, sd.rel, ig)\n-default:\n-    walk(sd.abs, sd.rel, ig) // Pool saturated: recurse inline\n-}\n-```\n-\n-If all worker slots are occupied, the current goroutine processes the subdirectory directly (inline execution). This ensures the work queue never balloons in memory, scheduling overhead remains negligible, and CPU cache locality is preserved.\n-\n-### Immediate Root Publishing\n-\n-To achieve sub-millisecond startup, the root directory (`rel == \"\"`) is read and sorted first:\n-\n-```go\n-if rel == \"\" {\n-    ix.mu.Lock()\n-    ix.children[\"\"] = kids\n-    ix.mu.Unlock()\n-}\n-```\n-\n-The browser frontend can fetch and render the primary workspace tree via `/api/tree?dir=` instantly, while the background worker pool completes recursive indexing of subdirectories.\n-\n-### Symlink Cycle Immunity\n-\n-Directory symlinks are systematically ignored:\n-\n-```go\n-if e.Type()\u0026os.ModeSymlink != 0 {\n-    continue\n-}\n-```\n-\n-This guarantees immunity against recursive directory loops (e.g., circular symlinks created by package managers or container runtimes) and eliminates costly filesystem `stat` calls.\n-\n-## 2. In-Memory Data Structures\n-\n-The index prioritizes low memory footprint and cache-friendly layout for fuzzy matching and search.\n-\n-### `FileEntry`\n-\n-```go\n-type FileEntry struct {\n-    Path      string `json:\"path\"`      // Slash-separated relative path\n-    Name      string `json:\"name\"`      // Basename\n-    Size      int64  `json:\"size\"`      // File size in bytes\n-    lower     string // Precomputed lowercase Path for instant matching\n-    nameStart int    // Index in Path where the basename begins\n-}\n-```\n-\n-- Precomputed Lowercase (`lower`): Computed once during traversal. Fuzzy matching and case-insensitive queries run directly against this slice without string allocations during user typing.\n-- `nameStart`: Caches the byte offset of the basename (e.g., `src/components/Button.tsx` $\\to 15$). This allows the fuzzy scoring matrix to award basename match bonuses without runtime string splitting.\n-\n-### `Node` (Explorer Tree Representation)\n-\n-```go\n-type Node struct {\n-    Name    string `json:\"name\"`\n-    Path    string `json:\"path\"`\n-    Dir     bool   `json:\"dir\"`\n-    Size    int64  `json:\"size\"`\n-    Ignored bool   `json:\"ignored,omitempty\"` // Matched by .gitignore: listed, never indexed\n-    Status  string `json:\"status,omitempty\"`  // Git status: M, A, D, U, etc.\n-    Dirty   bool   `json:\"dirty,omitempty\"`   // Contains git-modified descendants\n-}\n-```\n-\n-## 3. High-Performance `.gitignore` Engine\n-\n-Evaluating regular expressions for hundreds of `.gitignore` patterns against tens of thousands of paths can cripple indexing performance. In [`ignore.go`](../../ignore.go), px1 classifies patterns into specialized non-regex fast paths and adds heuristic pre-filters to regexes.\n-\n-### Rule Classification (`ruleKind`)\n-\n-```go\n-type ruleKind uint8\n-\n-const (\n-    rkRegex     ruleKind = iota // Wildcards requiring regex (guarded by filters)\n-    rkSegEq                     // Exact segment match: \"node_modules\", \"dist\"\n-    rkSegSuffix                 // Suffix match: \"*.pyc\", \"*.log\"\n-    rkPathEq                    // Anchored path match: \"/build\", \"docs/draft\"\n-)\n-```\n-\n-#### Fast-Path Evaluation\n-\n-When testing a path against a rule:\n-\n-- `rkSegEq`: Checks whether any segment of `path` exactly matches the literal string (`seg == r.lit`). Avoids regex engines entirely.\n-- `rkSegSuffix`: Checks whether any segment ends with the suffix (`strings.HasSuffix(seg, r.lit)`).\n-- `rkPathEq`: Compares path prefix or exact match (`strings.HasPrefix(rel, r.lit)`).\n-\n-#### Regex Pre-Filtering\n-\n-For patterns that require regular expressions (e.g., `**/foo[0-9]*/**`), two pre-checks eliminate ~99% of regex executions:\n-\n-1. `prefix` Test: If the pattern is anchored (e.g., `/foo/**/bar`), `strings.HasPrefix(rel, r.prefix)` is verified before invoking the regex.\n-1. `must` Substring Test: The longest non-wildcard run in the pattern is extracted. Any candidate path must contain this literal substring (`strings.Contains(rel, r.must)`), otherwise the regex engine is never called.\n-\n-### Hierarchical `ignoreSet`\n-\n-Directories can contain nested `.gitignore` files that override or extend parent rules:\n-\n-- `ignoreSet` forms a linked tree where child directories point to their parent `ignoreSet`.\n-- When entering a directory containing a `.gitignore`, a child set is constructed with `ig.child(readGitignore(abs, rel))`.\n-- Rules are evaluated from child to root, respecting negation patterns (`!file.txt`).\n-\n-## 4. Ignored Directory Semantics (Listing vs. Descent)\n-\n-px1 implements a clear distinction between ignored entries and version control internals:\n-\n-1. Version Control Internals (`.git`, `.hg`, `.svn`): Dropped completely. They are neither indexed nor listed in `/api/tree`.\n-1. Ignored Directories (`node_modules/`, `target/`, etc.): Added to the parent node listing with `Ignored: true`. Never descended into during `Index.Build()`. Never entered into the flat `files` slice used by fuzzy find and workspace search. The file explorer displays them with dimmed opacity.\n-1. On-Demand Expansion (`Index.Children` \u0026 `listIgnored`): If the user clicks to expand an ignored folder in the explorer sidebar, `Children()` detects that the directory was ignored and reads only that single directory from disk on demand (`os.ReadDir`). Every child inside it is marked `Ignored: true`, adhering to git semantics: nothing beneath an excluded directory can be re-included. Traversal protection (`underIgnoredLocked`) ensures that crafted paths with `.` or `..` segments are rejected before accessing the filesystem.\n","hunks":[{"id":"diff-b04db06ac869ff1f","header":"@@ -1,163 +0,0 @@","lines":[{"oldLine":1,"kind":"removed","text":"# Filesystem Indexing \u0026 Ignore Engine"},{"oldLine":2,"kind":"removed","text":""},{"oldLine":3,"kind":"removed","text":"This document explains the technical implementation of px1's in-memory indexer ([`index.go`](../../index.go)) and custom `.gitignore` evaluation engine ([`ignore.go`](../../ignore.go))."},{"oldLine":4,"kind":"removed","text":""},{"oldLine":5,"kind":"removed","text":"## 1. Directory Traversal Architecture"},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"Indexing thousands of directories and tens of thousands of source files must complete in milliseconds without exhausting system memory or file descriptors."},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"```mermaid"},{"oldLine":10,"kind":"removed","text":"flowchart TD"},{"oldLine":11,"kind":"removed","text":"    Start[\"Index.Build() Initiated\"] --\u003e RootIg[\"Initialize Root ignoreSet + .gitignore\"]"},{"oldLine":12,"kind":"removed","text":"    RootIg --\u003e ReadRoot[\"Read Root Directory (dir='')\"]"},{"oldLine":13,"kind":"removed","text":"    ReadRoot --\u003e PublishRoot[\"Publish ix.children[''] Immediately\u003cbr/\u003e(Sub-millisecond Sidebar Render)\"]"},{"oldLine":14,"kind":"removed","text":"    PublishRoot --\u003e SpawnWalk[\"Enqueue Subdirectories into Semaphore Pool\"]"},{"oldLine":15,"kind":"removed","text":"    "},{"oldLine":16,"kind":"removed","text":"    subgraph WorkerPool [\"Bounded Parallel Worker Pool (NumCPU * 4)\"]"},{"oldLine":17,"kind":"removed","text":"        W1[\"Worker Goroutine\"]"},{"oldLine":18,"kind":"removed","text":"        W2[\"Worker Goroutine\"]"},{"oldLine":19,"kind":"removed","text":"        W3[\"Worker Goroutine\"]"},{"oldLine":20,"kind":"removed","text":"    end"},{"oldLine":21,"kind":"removed","text":"    "},{"oldLine":22,"kind":"removed","text":"    SpawnWalk --\u003e|Slot Available| WorkerPool"},{"oldLine":23,"kind":"removed","text":"    SpawnWalk --\u003e|Pool Saturated| Inline[\"Recurse Inline on Current Goroutine\"]"},{"oldLine":24,"kind":"removed","text":"    "},{"oldLine":25,"kind":"removed","text":"    WorkerPool --\u003e ProcessDir[\"os.ReadDir(abs)\"]"},{"oldLine":26,"kind":"removed","text":"    Inline --\u003e ProcessDir"},{"oldLine":27,"kind":"removed","text":"    "},{"oldLine":28,"kind":"removed","text":"    ProcessDir --\u003e CheckIg[\"Evaluate ignoreSet.match(rel, isDir)\"]"},{"oldLine":29,"kind":"removed","text":"    CheckIg --\u003e|Ignored Directory| MarkDimmed[\"Add to Node List with Ignored=true\u003cbr/\u003e(Do NOT Descend or Index)\"]"},{"oldLine":30,"kind":"removed","text":"    CheckIg --\u003e|Active Directory| AddSubdir[\"Add to Directory List \u0026 Recurse\"]"},{"oldLine":31,"kind":"removed","text":"    CheckIg --\u003e|Active File| AppendFile[\"Append FileEntry to files Slice\"]"},{"oldLine":32,"kind":"removed","text":"```"},{"oldLine":33,"kind":"removed","text":""},{"oldLine":34,"kind":"removed","text":"### Bounded Concurrency Semaphore"},{"oldLine":35,"kind":"removed","text":""},{"oldLine":36,"kind":"removed","text":"Unbounded goroutine creation during directory traversal can cause thread contention, high memory churn, and \"too many open files\" errors. px1 controls traversal concurrency using a buffered channel semaphore:"},{"oldLine":37,"kind":"removed","text":""},{"oldLine":38,"kind":"removed","text":"```go"},{"oldLine":39,"kind":"removed","text":"sem := make(chan struct{}, runtime.NumCPU() * 4)"},{"oldLine":40,"kind":"removed","text":"```"},{"oldLine":41,"kind":"removed","text":""},{"oldLine":42,"kind":"removed","text":"When a subdirectory is discovered:"},{"oldLine":43,"kind":"removed","text":""},{"oldLine":44,"kind":"removed","text":"```go"},{"oldLine":45,"kind":"removed","text":"select {"},{"oldLine":46,"kind":"removed","text":"case sem \u003c- struct{}{}:"},{"oldLine":47,"kind":"removed","text":"    go func(a, r string, g *ignoreSet) {"},{"oldLine":48,"kind":"removed","text":"        defer func() { \u003c-sem }()"},{"oldLine":49,"kind":"removed","text":"        walk(a, r, g)"},{"oldLine":50,"kind":"removed","text":"    }(sd.abs, sd.rel, ig)"},{"oldLine":51,"kind":"removed","text":"default:"},{"oldLine":52,"kind":"removed","text":"    walk(sd.abs, sd.rel, ig) // Pool saturated: recurse inline"},{"oldLine":53,"kind":"removed","text":"}"},{"oldLine":54,"kind":"removed","text":"```"},{"oldLine":55,"kind":"removed","text":""},{"oldLine":56,"kind":"removed","text":"If all worker slots are occupied, the current goroutine processes the subdirectory directly (inline execution). This ensures the work queue never balloons in memory, scheduling overhead remains negligible, and CPU cache locality is preserved."},{"oldLine":57,"kind":"removed","text":""},{"oldLine":58,"kind":"removed","text":"### Immediate Root Publishing"},{"oldLine":59,"kind":"removed","text":""},{"oldLine":60,"kind":"removed","text":"To achieve sub-millisecond startup, the root directory (`rel == \"\"`) is read and sorted first:"},{"oldLine":61,"kind":"removed","text":""},{"oldLine":62,"kind":"removed","text":"```go"},{"oldLine":63,"kind":"removed","text":"if rel == \"\" {"},{"oldLine":64,"kind":"removed","text":"    ix.mu.Lock()"},{"oldLine":65,"kind":"removed","text":"    ix.children[\"\"] = kids"},{"oldLine":66,"kind":"removed","text":"    ix.mu.Unlock()"},{"oldLine":67,"kind":"removed","text":"}"},{"oldLine":68,"kind":"removed","text":"```"},{"oldLine":69,"kind":"removed","text":""},{"oldLine":70,"kind":"removed","text":"The browser frontend can fetch and render the primary workspace tree via `/api/tree?dir=` instantly, while the background worker pool completes recursive indexing of subdirectories."},{"oldLine":71,"kind":"removed","text":""},{"oldLine":72,"kind":"removed","text":"### Symlink Cycle Immunity"},{"oldLine":73,"kind":"removed","text":""},{"oldLine":74,"kind":"removed","text":"Directory symlinks are systematically ignored:"},{"oldLine":75,"kind":"removed","text":""},{"oldLine":76,"kind":"removed","text":"```go"},{"oldLine":77,"kind":"removed","text":"if e.Type()\u0026os.ModeSymlink != 0 {"},{"oldLine":78,"kind":"removed","text":"    continue"},{"oldLine":79,"kind":"removed","text":"}"},{"oldLine":80,"kind":"removed","text":"```"},{"oldLine":81,"kind":"removed","text":""},{"oldLine":82,"kind":"removed","text":"This guarantees immunity against recursive directory loops (e.g., circular symlinks created by package managers or container runtimes) and eliminates costly filesystem `stat` calls."},{"oldLine":83,"kind":"removed","text":""},{"oldLine":84,"kind":"removed","text":"## 2. In-Memory Data Structures"},{"oldLine":85,"kind":"removed","text":""},{"oldLine":86,"kind":"removed","text":"The index prioritizes low memory footprint and cache-friendly layout for fuzzy matching and search."},{"oldLine":87,"kind":"removed","text":""},{"oldLine":88,"kind":"removed","text":"### `FileEntry`"},{"oldLine":89,"kind":"removed","text":""},{"oldLine":90,"kind":"removed","text":"```go"},{"oldLine":91,"kind":"removed","text":"type FileEntry struct {"},{"oldLine":92,"kind":"removed","text":"    Path      string `json:\"path\"`      // Slash-separated relative path"},{"oldLine":93,"kind":"removed","text":"    Name      string `json:\"name\"`      // Basename"},{"oldLine":94,"kind":"removed","text":"    Size      int64  `json:\"size\"`      // File size in bytes"},{"oldLine":95,"kind":"removed","text":"    lower     string // Precomputed lowercase Path for instant matching"},{"oldLine":96,"kind":"removed","text":"    nameStart int    // Index in Path where the basename begins"},{"oldLine":97,"kind":"removed","text":"}"},{"oldLine":98,"kind":"removed","text":"```"},{"oldLine":99,"kind":"removed","text":""},{"oldLine":100,"kind":"removed","text":"- Precomputed Lowercase (`lower`): Computed once during traversal. Fuzzy matching and case-insensitive queries run directly against this slice without string allocations during user typing."},{"oldLine":101,"kind":"removed","text":"- `nameStart`: Caches the byte offset of the basename (e.g., `src/components/Button.tsx` $\\to 15$). This allows the fuzzy scoring matrix to award basename match bonuses without runtime string splitting."},{"oldLine":102,"kind":"removed","text":""},{"oldLine":103,"kind":"removed","text":"### `Node` (Explorer Tree Representation)"},{"oldLine":104,"kind":"removed","text":""},{"oldLine":105,"kind":"removed","text":"```go"},{"oldLine":106,"kind":"removed","text":"type Node struct {"},{"oldLine":107,"kind":"removed","text":"    Name    string `json:\"name\"`"},{"oldLine":108,"kind":"removed","text":"    Path    string `json:\"path\"`"},{"oldLine":109,"kind":"removed","text":"    Dir     bool   `json:\"dir\"`"},{"oldLine":110,"kind":"removed","text":"    Size    int64  `json:\"size\"`"},{"oldLine":111,"kind":"removed","text":"    Ignored bool   `json:\"ignored,omitempty\"` // Matched by .gitignore: listed, never indexed"},{"oldLine":112,"kind":"removed","text":"    Status  string `json:\"status,omitempty\"`  // Git status: M, A, D, U, etc."},{"oldLine":113,"kind":"removed","text":"    Dirty   bool   `json:\"dirty,omitempty\"`   // Contains git-modified descendants"},{"oldLine":114,"kind":"removed","text":"}"},{"oldLine":115,"kind":"removed","text":"```"},{"oldLine":116,"kind":"removed","text":""},{"oldLine":117,"kind":"removed","text":"## 3. High-Performance `.gitignore` Engine"},{"oldLine":118,"kind":"removed","text":""},{"oldLine":119,"kind":"removed","text":"Evaluating regular expressions for hundreds of `.gitignore` patterns against tens of thousands of paths can cripple indexing performance. In [`ignore.go`](../../ignore.go), px1 classifies patterns into specialized non-regex fast paths and adds heuristic pre-filters to regexes."},{"oldLine":120,"kind":"removed","text":""},{"oldLine":121,"kind":"removed","text":"### Rule Classification (`ruleKind`)"},{"oldLine":122,"kind":"removed","text":""},{"oldLine":123,"kind":"removed","text":"```go"},{"oldLine":124,"kind":"removed","text":"type ruleKind uint8"},{"oldLine":125,"kind":"removed","text":""},{"oldLine":126,"kind":"removed","text":"const ("},{"oldLine":127,"kind":"removed","text":"    rkRegex     ruleKind = iota // Wildcards requiring regex (guarded by filters)"},{"oldLine":128,"kind":"removed","text":"    rkSegEq                     // Exact segment match: \"node_modules\", \"dist\""},{"oldLine":129,"kind":"removed","text":"    rkSegSuffix                 // Suffix match: \"*.pyc\", \"*.log\""},{"oldLine":130,"kind":"removed","text":"    rkPathEq                    // Anchored path match: \"/build\", \"docs/draft\""},{"oldLine":131,"kind":"removed","text":")"},{"oldLine":132,"kind":"removed","text":"```"},{"oldLine":133,"kind":"removed","text":""},{"oldLine":134,"kind":"removed","text":"#### Fast-Path Evaluation"},{"oldLine":135,"kind":"removed","text":""},{"oldLine":136,"kind":"removed","text":"When testing a path against a rule:"},{"oldLine":137,"kind":"removed","text":""},{"oldLine":138,"kind":"removed","text":"- `rkSegEq`: Checks whether any segment of `path` exactly matches the literal string (`seg == r.lit`). Avoids regex engines entirely."},{"oldLine":139,"kind":"removed","text":"- `rkSegSuffix`: Checks whether any segment ends with the suffix (`strings.HasSuffix(seg, r.lit)`)."},{"oldLine":140,"kind":"removed","text":"- `rkPathEq`: Compares path prefix or exact match (`strings.HasPrefix(rel, r.lit)`)."},{"oldLine":141,"kind":"removed","text":""},{"oldLine":142,"kind":"removed","text":"#### Regex Pre-Filtering"},{"oldLine":143,"kind":"removed","text":""},{"oldLine":144,"kind":"removed","text":"For patterns that require regular expressions (e.g., `**/foo[0-9]*/**`), two pre-checks eliminate ~99% of regex executions:"},{"oldLine":145,"kind":"removed","text":""},{"oldLine":146,"kind":"removed","text":"1. `prefix` Test: If the pattern is anchored (e.g., `/foo/**/bar`), `strings.HasPrefix(rel, r.prefix)` is verified before invoking the regex."},{"oldLine":147,"kind":"removed","text":"1. `must` Substring Test: The longest non-wildcard run in the pattern is extracted. Any candidate path must contain this literal substring (`strings.Contains(rel, r.must)`), otherwise the regex engine is never called."},{"oldLine":148,"kind":"removed","text":""},{"oldLine":149,"kind":"removed","text":"### Hierarchical `ignoreSet`"},{"oldLine":150,"kind":"removed","text":""},{"oldLine":151,"kind":"removed","text":"Directories can contain nested `.gitignore` files that override or extend parent rules:"},{"oldLine":152,"kind":"removed","text":""},{"oldLine":153,"kind":"removed","text":"- `ignoreSet` forms a linked tree where child directories point to their parent `ignoreSet`."},{"oldLine":154,"kind":"removed","text":"- When entering a directory containing a `.gitignore`, a child set is constructed with `ig.child(readGitignore(abs, rel))`."},{"oldLine":155,"kind":"removed","text":"- Rules are evaluated from child to root, respecting negation patterns (`!file.txt`)."},{"oldLine":156,"kind":"removed","text":""},{"oldLine":157,"kind":"removed","text":"## 4. Ignored Directory Semantics (Listing vs. Descent)"},{"oldLine":158,"kind":"removed","text":""},{"oldLine":159,"kind":"removed","text":"px1 implements a clear distinction between ignored entries and version control internals:"},{"oldLine":160,"kind":"removed","text":""},{"oldLine":161,"kind":"removed","text":"1. Version Control Internals (`.git`, `.hg`, `.svn`): Dropped completely. They are neither indexed nor listed in `/api/tree`."},{"oldLine":162,"kind":"removed","text":"1. Ignored Directories (`node_modules/`, `target/`, etc.): Added to the parent node listing with `Ignored: true`. Never descended into during `Index.Build()`. Never entered into the flat `files` slice used by fuzzy find and workspace search. The file explorer displays them with dimmed opacity."},{"oldLine":163,"kind":"removed","text":"1. On-Demand Expansion (`Index.Children` \u0026 `listIgnored`): If the user clicks to expand an ignored folder in the explorer sidebar, `Children()` detects that the directory was ignored and reads only that single directory from disk on demand (`os.ReadDir`). Every child inside it is marked `Ignored: true`, adhering to git semantics: nothing beneath an excluded directory can be re-included. Traversal protection (`underIgnoredLocked`) ensures that crafted paths with `.` or `..` segments are rejected before accessing the filesystem."}]}]},{"path":"docs/internals/lsp-and-intelligence.md","status":"D","diff":"diff --git a/docs/internals/lsp-and-intelligence.md b/docs/internals/lsp-and-intelligence.md\ndeleted file mode 100644\nindex daa509a..0000000\n--- a/docs/internals/lsp-and-intelligence.md\n+++ /dev/null\n@@ -1,117 +0,0 @@\n-# Language Server Protocol (LSP) Architecture \u0026 Intelligence\n-\n-This document details the architecture, lifecycle management, and security boundaries of px1's Language Server Protocol subsystem ([`lsp.go`](../../lsp.go), [`lspnav.go`](../../lspnav.go), [`lspservers.go`](../../lspservers.go), [`lspsetup.go`](../../lspsetup.go), and [`calls.go`](../../calls.go)).\n-\n-## 1. Zero-Cost Lazy Architecture\n-\n-Traditional IDEs start multiple language server processes during project initialization, consuming hundreds of megabytes of RAM before the developer opens a single file.\n-\n-px1 adopts a strictly Zero-Cost Lazy Architecture:\n-\n-```mermaid\n-stateDiagram-v2\n-    [*] --\u003e Idle: Server Boot\n-    Idle --\u003e Discovery: Background exec.LookPath across $PATH\n-    Discovery --\u003e Registered: Servers detected (No processes spawned)\n-    Registered --\u003e Spawning: First file request (e.g. open main.go)\n-    Spawning --\u003e Ready: JSON-RPC Initialize \u0026 Initialized handshake (\u003c=30s)\n-    Ready --\u003e Serving: Handle textDocument/definition, hover, refs\n-    Serving --\u003e Serving: Subsequent requests reuse existing process\n-    Serving --\u003e Stopped: Application Shutdown (Clean exit)\n-```\n-\n-### Key Principles\n-\n-1. Zero Boot Overhead: During startup, px1 does not launch any language servers. It scans `$PATH` concurrently via `exec.LookPath` to identify which server binaries exist on the host system.\n-1. On-Demand Spawning: A language server process is launched only when the user opens or queries a file matching its registered file extensions.\n-1. Graceful Fallback: If a server is missing, crashes, or fails initialization, the system falls back to instant regex-based symbol definitions without displaying error dialogs.\n-\n-## 2. Server Registry \u0026 Extension Precedence\n-\n-Language server definitions reside in [`lspservers.go`](../../lspservers.go). Multiple language servers can be registered for a given extension, evaluated in order of precedence:\n-\n-| Language          | Extensions                   | Primary Server               | Fallback Server | Discovery Search Paths     |\n-| ----------------- | ---------------------------- | ---------------------------- | --------------- | -------------------------- |\n-| Go                | `.go`                        | `gopls`                      | -               | `$PATH`, `~/go/bin`        |\n-| Rust              | `.rs`                        | `rust-analyzer`              | -               | `$PATH`, `~/.cargo/bin`    |\n-| TypeScript / JS   | `.ts`, `.tsx`, `.js`, `.jsx` | `typescript-language-server` | -               | `$PATH`, npm global prefix |\n-| Python            | `.py`                        | `pyright`                    | `pylsp`, `ruff` | `$PATH`, `~/.local/bin`    |\n-| C / C++           | `.c`, `.cpp`, `.h`, `.hpp`   | `clangd`                     | -               | `$PATH`, Homebrew LLVM     |\n-| Zig               | `.zig`                       | `zls`                        | -               | `$PATH`                    |\n-| Lua               | `.lua`                       | `lua-language-server`        | -
