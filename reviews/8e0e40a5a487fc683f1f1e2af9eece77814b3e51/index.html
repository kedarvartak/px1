links that remain valid after the PR changes"},{"newLine":28,"kind":"added","text":""},{"newLine":29,"kind":"added","text":"## How it works"},{"newLine":30,"kind":"added","text":""},{"newLine":31,"kind":"added","text":"```text"},{"newLine":32,"kind":"added","text":"PR opened or updated"},{"newLine":33,"kind":"added","text":"        ↓"},{"newLine":34,"kind":"added","text":"GitHub Action reads the base and head commits"},{"newLine":35,"kind":"added","text":"        ↓"},{"newLine":36,"kind":"added","text":"px1 generates reviews/\u003chead-sha\u003e/index.html"},{"newLine":37,"kind":"added","text":"        ↓"},{"newLine":38,"kind":"added","text":"GitHub Pages publishes the report"},{"newLine":39,"kind":"added","text":"        ↓"},{"newLine":40,"kind":"added","text":"A sticky PR comment links the reviewer to it"},{"oldLine":69,"newLine":41,"kind":"context","text":"```"},{"oldLine":70,"newLine":42,"kind":"context","text":""},{"oldLine":71,"kind":"removed","text":"The command is `px1`; the package downloads the platform binary and has no"},{"oldLine":72,"kind":"removed","text":"runtime dependencies beyond Node. For a source build, use Go 1.25+ and Node for"},{"oldLine":73,"kind":"removed","text":"the bundled web assets:"},{"newLine":43,"kind":"added","text":"The workflow checks out trusted base-branch code and fetches the PR head only"},{"newLine":44,"kind":"added","text":"as Git objects. px1 inspects the diff; it does not execute code from the PR."},{"oldLine":74,"newLine":45,"kind":"context","text":""},{"oldLine":75,"kind":"removed","text":"```bash"},{"oldLine":76,"kind":"removed","text":"git clone https://github.com/kedarvartak/px1.git"},{"oldLine":77,"kind":"removed","text":"cd px1"},{"oldLine":78,"kind":"removed","text":"make build"},{"oldLine":79,"kind":"removed","text":"install -d ~/.local/bin \u0026\u0026 install px1 ~/.local/bin/"},{"oldLine":80,"kind":"removed","text":"```"},{"newLine":46,"kind":"added","text":"## Set up px1"},{"oldLine":81,"newLine":47,"kind":"context","text":""},{"oldLine":82,"kind":"removed","text":"## Use"},{"newLine":48,"kind":"added","text":"1. Enable GitHub Pages with **GitHub Actions** as the source."},{"newLine":49,"kind":"added","text":"2. Copy [`examples/px1-review.yml`](examples/px1-review.yml) to"},{"newLine":50,"kind":"added","text":"   `.github/workflows/px1-review.yml` in the repository you want reviewed."},{"newLine":51,"kind":"added","text":"3. Pin both px1 Action references in that file to a released major version."},{"newLine":52,"kind":"added","text":"4. Open or update a non-draft pull request."},{"oldLine":83,"newLine":53,"kind":"context","text":""},{"oldLine":84,"kind":"removed","text":"```bash"},{"oldLine":85,"kind":"removed","text":"px1                    # current workspace"},{"oldLine":86,"kind":"removed","text":"px1 ~/src/project      # another workspace"},{"oldLine":87,"kind":"removed","text":"px1 main.go:42         # open a file at a line"},{"oldLine":88,"kind":"removed","text":"px1 -no-open -port 8080 /workspace"},{"newLine":54,"kind":"added","text":"The workflow publishes:"},{"newLine":55,"kind":"added","text":""},{"newLine":56,"kind":"added","text":"```text"},{"newLine":57,"kind":"added","text":"https://\u003cowner\u003e.github.io/\u003crepository\u003e/reviews/\u003chead-sha\u003e/"},{"oldLine":89,"newLine":58,"kind":"context","text":"```"},{"oldLine":90,"newLine":59,"kind":"context","text":""},{"oldLine":91,"kind":"removed","text":"### Export a static review report"},{"newLine":60,"kind":"added","text":"and creates or updates one marked px1 comment on the PR."},{"oldLine":92,"newLine":61,"kind":"context","text":""},{"oldLine":93,"kind":"removed","text":"Export a self-contained report from exact Git commits:"},{"newLine":62,"kind":"added","text":"## Team rules"},{"oldLine":94,"newLine":63,"kind":"context","text":""},{"oldLine":95,"kind":"removed","text":"```bash"},{"oldLine":96,"kind":"removed","text":"px1 export-review --base \"$BASE_SHA\" --head \"$HEAD_SHA\" --out ./site"},{"newLine":64,"kind":"added","text":"Rules live at `.px1/rules.json` and change through normal code review:"},{"newLine":65,"kind":"added","text":""},{"newLine":66,"kind":"added","text":"```json"},{"newLine":67,"kind":"added","text":"{"},{"newLine":68,"kind":"added","text":"  \"rules\": ["},{"newLine":69,"kind":"added","text":"    {"},{"newLine":70,"kind":"added","text":"      \"pattern\": \"\\\\bfetch\\\\(\","},{"newLine":71,"kind":"added","text":"      \"glob\": \"src/**/*.ts\","},{"newLine":72,"kind":"added","text":"      \"message\": \"Use the shared API client instead of fetch\""},{"newLine":73,"kind":"added","text":"    }"},{"newLine":74,"kind":"added","text":"  ]"},{"newLine":75,"kind":"added","text":"}"},{"oldLine":97,"newLine":76,"kind":"context","text":"```"},{"oldLine":98,"newLine":77,"kind":"context","text":""},{"oldLine":99,"kind":"removed","text":"The exporter reads committed team rules and verification evidence, evaluates"},{"oldLine":100,"kind":"removed","text":"added lines, runs the same attention rules as the local review on the two"},{"oldLine":101,"kind":"removed","text":"commits, and writes `./site/index.html`. The page inlines its styles, script and"},{"oldLine":102,"kind":"removed","text":"IBM Plex fonts (SIL OFL, see `static_report/fonts/OFL.txt`), so it makes no"},{"oldLine":103,"kind":"removed","text":"network requests. It does not execute PR code, call"},{"oldLine":104,"kind":"removed","text":"an LLM, require GitHub credentials, or start a server."},{"oldLine":105,"kind":"removed","text":""},{"oldLine":106,"kind":"removed","text":"Add `--snapshot-out ./snapshot.json` when CI also needs the versioned JSON"},{"oldLine":107,"kind":"removed","text":"payload for a self-hosted import."},{"oldLine":108,"kind":"removed","text":""},{"oldLine":109,"kind":"removed","text":"CI may pass `--verification-file` with an exact-revision GitHub Actions report."},{"oldLine":110,"kind":"removed","text":"A local script or CI job may pass"},{"oldLine":111,"kind":"removed","text":"`--explanations-file ./px1-explanations.json` to add expandable explanation"},{"oldLine":112,"kind":"removed","text":"chips. See the [explanation JSON contract](docs/STATIC_REVIEW_EXPLANATIONS.md)."},{"oldLine":113,"kind":"removed","text":""},{"oldLine":114,"kind":"removed","text":"The included workflow publishes reports at"},{"oldLine":115,"kind":"removed","text":"`reviews/\u003chead-sha\u003e/index.html`, retains older revisions on the generated-only"},{"oldLine":116,"kind":"removed","text":"`px1-review-reports` branch, and updates one PR comment with the current link."},{"oldLine":117,"kind":"removed","text":""},{"oldLine":118,"kind":"removed","text":"### Import into a self-hosted px1 server"},{"oldLine":119,"kind":"removed","text":""},{"oldLine":120,"kind":"removed","text":"A self-hosted server can accept the same versioned report snapshot from CI."},{"oldLine":121,"kind":"removed","text":"Set `PX1_IMPORT_TOKEN` on the server, then send an authenticated JSON payload"},{"oldLine":122,"kind":"removed","text":"to `POST /api/review/import`. Successful imports are available at the"},{"oldLine":123,"kind":"removed","text":"commit-pinned `/github/\u003cowner\u003e/\u003crepo\u003e/pull/\u003cnumber\u003e?sha=\u003chead-sha\u003e` route."},{"oldLine":124,"kind":"removed","text":""},{"oldLine":125,"kind":"removed","text":"Imports are size-limited, strictly validated, stored outside the repository,"},{"oldLine":126,"kind":"removed","text":"and immutable for a repository, PR, and head SHA. Set"},{"oldLine":127,"kind":"removed","text":"`PX1_REVIEW_LINK_SECRET` as a separate server-side secret to make the returned"},{"oldLine":128,"kind":"removed","text":"self-hosted review link HMAC-signed and reject unsigned links. See the"},{"oldLine":129,"kind":"removed","text":"[self-hosted import contract](docs/SELF_HOSTED_REVIEW_IMPORT.md) for the JSON"},{"oldLine":130,"kind":"removed","text":"shape and CI example. GitHub Pages links remain public static artifacts."},{"oldLine":131,"kind":"removed","text":""},{"oldLine":132,"kind":"removed","text":"## Local review loop"},{"oldLine":133,"kind":"removed","text":""},{"oldLine":134,"kind":"removed","text":"Start a review from the Review panel before assigning an agent. px1 records the"},{"oldLine":135,"kind":"removed","text":"task baseline, notices later edits, and includes files created or deleted after"},{"oldLine":136,"kind":"removed","text":"the task starts. Reviewers can inspect changes, leave comments, ask a configured"},{"oldLine":137,"kind":"removed","text":"provider to follow up, revert a hunk, and verify imported CI results. A bounded"},{"oldLine":138,"kind":"removed","text":"local pass also calls out dependency, authentication, schema, configuration,"},{"oldLine":139,"kind":"removed","text":"test deletion, generated-code, permission, large-diff, and public-API changes."},{"oldLine":140,"kind":"removed","text":"Every flag states the matching evidence, opens the diff, and can be dismissed"},{"oldLine":141,"kind":"removed","text":"for the current session; it never blocks approval or claims a change is unsafe."},{"oldLine":142,"kind":"removed","text":""},{"oldLine":143,"kind":"removed","text":"For remote use, keep px1 on a private network such as Tailscale or WireGuard."},{"oldLine":144,"kind":"removed","text":"A request is local only when its connected peer and HTTP host are both"},{"oldLine":145,"kind":"removed","text":"loopback. Everything else is read-only: it cannot change review state or"},{"oldLine":146,"kind":"removed","text":"settings, patch files, run an agent, or start a language server. Patch, agent,"},{"oldLine":147,"kind":"removed","text":"and check access are separate flags, and a remote flag does nothing"},{"oldLine":148,"kind":"removed","text":"until `-remote-token` or `PX1_REMOTE_TOKEN` is set. The browser asks for that"},{"oldLine":149,"kind":"removed","text":"token only when a remote capability is on. Loopback (`localhost` or `127.0.0.1`)"},{"oldLine":150,"kind":"removed","text":"keeps local patch and agent access without the token."},{"newLine":78,"kind":"added","text":"Current rules match added lines using Go regular expressions and optional file"},{"newLine":79,"kind":"added","text":"globs. A finding shows the rule, matching line, and nearby diff context. It is"},{"newLine":80,"kind":"added","text":"a team convention, not a claim that the code is unsafe."},{"oldLine":151,"newLine":81,"kind":"context","text":""},{"oldLine":152,"kind":"removed","text":"```bash"},{"oldLine":153,"kind":"removed","text":"# Private network, read-only. A LAN IP or hostname cannot mutate state or start processes."},{"oldLine":154,"kind":"removed","text":"px1 -host 0.0.0.0 -port 7777 ~/work/repo"},{"oldLine":155,"kind":"removed","text":""},{"oldLine":156,"kind":"removed","text":"# SSH tunnel. The browser talks to loopback, so this session has local write access."},{"oldLine":157,"kind":"removed","text":"ssh -L 7777:127.0.0.1:7777 user@host"},{"oldLine":158,"kind":"removed","text":"px1 -host 127.0.0.1 -port 7777 ~/work/repo"},{"newLine":82,"kind":"added","text":"## Optional explanations"},{"oldLine":159,"newLine":83,"kind":"context","text":""},{"oldLine":160,"kind":"removed","text":"# Remote patch only. Agent execution and checks stay off."},{"oldLine":161,"kind":"removed","text":"PX1_REMOTE_TOKEN='replace-with-a-random-secret' px1 -host 0.0.0.0 -allow-patch -port 7777 ~/work/repo"},{"oldLine":162,"kind":"removed","text":"```"},{"newLine":84,"kind":"added","text":"The generator accepts commit-pinned explanation JSON through"},{"newLine":85,"kind":"added","text":"`explanations-file`. This keeps model credentials and generation inside CI;"},{"newLine":86,"kind":"added","text":"the published page receives only validated explanation text. Reports remain"},{"newLine":87,"kind":"added","text":"useful when no model or API key is configured."},{"oldLine":163,"newLine":88,"kind":"context","text":""},{"oldLine":164,"kind":"removed","text":"Anyone who can open the URL can still read the workspace and imported reports."},{"oldLine":165,"kind":"removed","text":"The token authorizes only the capabilities you enabled, for that browser"},{"oldLine":166,"kind":"removed","text":"session. Do not expose the server publicly. px1 does not execute verification"},{"oldLine":167,"kind":"removed","text":"commands; `-allow-checks` only permits an attempt, which is refused because CI"},{"oldLine":168,"kind":"removed","text":"results are imported instead."},{"newLine":89,"kind":"added","text":"See [the explanation contract](docs/STATIC_REVIEW_EXPLANATIONS.md) and"},{"newLine":90,"kind":"added","text":"[verification contract](docs/VERIFICATION_REPORT.md)."},{"oldLine":169,"newLine":91,"kind":"context","text":""},{"oldLine":170,"kind":"removed","text":"## Performance"},{"newLine":92,"kind":"added","text":"## Security model"},{"oldLine":171,"newLine":93,"kind":"context","text":""},{"oldLine":172,"kind":"removed","text":"px1 is built for large repositories. The included benchmark indexes the Linux"},{"oldLine":173,"kind":"removed","text":"kernel corpus (95,710 files / 1.8 GB) in 370 ms with 55 MB RSS. See"},{"oldLine":174,"kind":"removed","text":"[BENCHMARKS.md](BENCHMARKS.md) for methodology."},{"newLine":94,"kind":"added","text":"- Every report identifies full base and head commit SHAs."},{"newLine":95,"kind":"added","text":"- The supplied workflow never checks out or executes the PR head."},{"newLine":96,"kind":"added","text":"- Verification and explanation inputs must match the report head SHA."},{"newLine":97,"kind":"added","text":"- Historical storage accepts only regular"},{"newLine":98,"kind":"added","text":"  `reviews/\u003c40-character-sha\u003e/index.html` files."},{"newLine":99,"kind":"added","text":"- The report is one static HTML file and makes no network requests."},{"newLine":100,"kind":"added","text":"- GitHub Pages reports are public unless the repository's Pages configuration"},{"newLine":101,"kind":"added","text":"  provides access control. Do not publish sensitive private code publicly."},{"oldLine":175,"newLine":102,"kind":"context","text":""},{"oldLine":176,"newLine":103,"kind":"context","text":"## Development"},{"oldLine":177,"newLine":104,"kind":"context","text":""},{"oldLine":178,"newLine":105,"kind":"context","text":"```bash"},{"oldLine":179,"kind":"removed","text":"make test"},{"oldLine":180,"kind":"removed","text":"go run . -dev . ."},{"oldLine":181,"kind":"removed","text":"make dist"},{"newLine":106,"kind":"added","text":"go test ./..."},{"newLine":107,"kind":"added","text":"go test -race ./..."},{"newLine":108,"kind":"added","text":"go run . export-review --base \u003cbase-sha\u003e --head \u003chead-sha\u003e --out ./site"},{"oldLine":182,"newLine":109,"kind":"context","text":"```"},{"oldLine":183,"newLine":110,"kind":"context","text":""},{"oldLine":184,"kind":"removed","text":"See [CONTRIBUTING.md](CONTRIBUTING.md), the"},{"oldLine":185,"kind":"removed","text":"[engineering documentation](docs/internals/README.md), the"},{"oldLine":186,"kind":"removed","text":"[roadmap](ROADMAP.md), and [release instructions](PUBLISHING.md)."},{"newLine":111,"kind":"added","text":"The product boundary and next work are documented in"},{"newLine":112,"kind":"added","text":"[PRODUCT_VISION.md](docs/PRODUCT_VISION.md) and [ROADMAP.md](ROADMAP.md)."},{"oldLine":187,"newLine":113,"kind":"context","text":""},{"oldLine":188,"newLine":114,"kind":"context","text":"## License"},{"oldLine":189,"newLine":115,"kind":"context","text":""},{"oldLine":190,"kind":"removed","text":"[MIT](LICENSE) © 2026 Arpit Bhayani. px1 is a fork of"},{"newLine":116,"kind":"added","text":"[MIT](LICENSE) © 2026 Arpit Bhayani. px1 began as a fork of"},{"oldLine":191,"newLine":117,"kind":"context","text":"[px0](https://github.com/px0-ai/px0); upstream notices are retained."}]}]},{"path":"ROADMAP.md","status":"M","diff":"diff --git a/ROADMAP.md b/ROADMAP.md\nindex 062c733..7765ea4 100644\n--- a/ROADMAP.md\n+++ b/ROADMAP.md\n@@ -1,130 +1,47 @@\n-# px1 Roadmap\n+# px1 roadmap\n \n-px1 stays local-first, fast, and useful without a cloud account. Cloud\n-features should extend the review workflow rather than make the core editor\n-dependent on them.\n-\n-## Next: GitHub-connected reviews\n-\n-Make a px1 review link attachable to a GitHub pull request, pinned to the PR's\n-exact head commit. The first version will be a static report generated by a\n-GitHub Action and published through GitHub Pages. This avoids building a SaaS\n-or running a server while still giving reviewers one clickable review view.\n-\n-The first link will look like:\n+px1 has one product flow:\n \n ```text\n-https://\u003corg\u003e.github.io/\u003crepo\u003e/reviews/\u003chead-sha\u003e/\n+push PR → GitHub Action → static review artifact → GitHub Pages → PR link\n ```\n \n-The Action will read the committed `.px1/rules.json`, inspect the exact PR\n-head SHA, generate changed-file and rule-finding data, publish the report, and\n-update one sticky PR comment with the link. The report can work without an LLM\n-API key; AI explanations are a later optional layer.\n-\n-This work has two supported flows:\n-\n-- **Self-hosted:** teams run px1 inside their network and use a GitHub Action\n-  plus `PX1_REVIEW_BASE_URL` to publish or update a PR link.\n-- **Hosted platform:** users sign up, install the px1 GitHub App, and let the\n-  platform manage webhooks, snapshots, authentication, storage, and optional\n-  AI providers.\n-\n-The detailed design is in\n-[GitHub Review Integration Plan](docs/GITHUB_REVIEW_INTEGRATION_PLAN.md).\n-\n-## Complexity reduction roadmap\n-\n-Before adding the GitHub review workflow, reduce the application to the parts\n-that directly support team-policy review. These are product-scope cuts, not a\n-requirement to break existing local users in one release.\n-\n-- [x] **Remove telemetry and in-app process metrics.** They do not help a\n-   reviewer understand a change and add flags, state, network behavior, API\n-   endpoints, UI, and release configuration.\n-- [x] **Shrink the primary UI to review surfaces.** The primary surface now\n-   centers on changed files, diffs, review findings, and explicit actions. The\n-   old activity rail, Markdown preview, typed settings catalog, theme switching,\n-   and IDE-like status chrome are gone; local file search, the palette, and the\n-   worktree switcher remain because they support navigation during review.\n-- [x] **Separate or remove agent-editing orchestration.** Keep an optional\n-   explanation-provider interface, but do not make harness detection,\n-   selection, inline editing, cancellation, and agent prompts part of the\n-   review artifact path. The first slice removes the stale inline-edit\n-   shortcut and legacy harness discovery, selection, direct-edit, and\n-   cancellation endpoints; issue #56 removes the remaining startup discovery\n-   and metadata residue. Configured provider calls for explanations and comment\n-   follow-up remain available.\n-- [x] **Replace personal decision memory with explicit team rules.** Keep human\n-   comments and finding acknowledgement; make learned rules proposals rather\n-   than a second hidden policy store.\n-- [x] **Move verification execution to CI.** px1 should display trusted GitHub\n-   Action results instead of running arbitrary shell commands in the review\n-   service.\n-- [x] **Simplify local-only session machinery.** Treat the GitHub commit SHA and\n-   base SHA as the normal review identity; keep worktree and automatic-baseline\n-   behavior only for an optional local mode. First slice: local automatic\n-   baselines are now opt-in; issue #57 makes explicit base/head sessions\n-   authoritative while the Review panel remains the explicit local path.\n-\n-Each reduction should leave the policy-review path clearer and easier to test.\n-The first reduction was merged in PR #47. The UI reduction continued through\n-PRs #48, #53, and #58, removing cross-worktree aggregation, theme switching,\n-and Markdown preview. The provider boundary was separated from the review UI\n-in PR #49 and #54, then made configuration-only in issue #56. Team rules and\n-revision-pinned CI results landed in PRs #50 and #51; local automatic reviews\n-became opt-in in PR #52.\n-The local-session identity cleanup in issue #57 keeps automatic worktree\n-compatibility isolated from explicit commit-pinned sessions. PRs #63 and #64\n-completed the raw-settings and status-chrome reductions; the remaining cleanup\n-queue removes dead implementation residue around those smaller surfaces.\n-\n-### Delivery stages\n-\n-1. Static report MVP: evaluate `.px1/rules.json`, render diffs and findings,\n-   publish to GitHub Pages, and update a commit-pinned PR comment. The local\n-   commit-pinned export is implemented with `px1 export-review`; the remaining\n-   work in this stage is now covered by the GitHub Action, Pages publication,\n-   and sticky PR comment workflow. Historical report retention remains a later\n-   improvement.\n-2. Improve the static report with block extraction, plain-language explanations,\n-   verification summaries, finding acknowledgement, and historical SHA paths.\n-   The Pages workflow now includes exact-head GitHub check-run summaries, and\n-   findings now include hunk-local context blocks. A provider-neutral,\n-   commit-pinned JSON input now renders plain-language explanation chips; an\n-   automated explanation generator is still planned. Changed files now render\n-   as structured, line-numbered, highlighted hunks instead of raw patch text.\n-   Reviewers can now acknowledge team-rule findings locally, with state scoped\n-   to the exact repository and head commit. The Pages workflow preserves older\n-   SHA-addressed reports on a generated-artifact branch, completing the static\n-   report improvements planned for this stage.\n-3. Self-hosted live px1: add an import endpoint, authenticated links, secure\n-   link configuration, and deployment documentation for private repositories.\n-   Commit-pinned GitHub review links are strictly parsed and routed. The\n-   bearer-authenticated snapshot import endpoint now stores immutable reports\n-   outside the checkout and serves them from those routes. Self-hosted read\n-   links can now be HMAC-signed with `PX1_REVIEW_LINK_SECRET`; rotating that\n-   secret revokes previously issued links. GitHub Pages remains the public\n-   static-artifact flow.\n-4. Hosted GitHub App: add accounts, organizations, repository permissions, and\n-   webhook processing.\n-5. Hosted snapshot storage, managed or bring-your-own LLM keys, quotas, and\n-   optional write-back of comments/statuses to GitHub.\n-\n-### Scope guardrail\n-\n-The static report is the product milestone, not a temporary demo. A reviewer\n-must be able to understand a PR from the generated page without opening the\n-full local workspace. Server-side hosting, accounts, billing, and LLM keys\n-must not block this milestone.\n-\n-## Completed foundations\n-\n-- Task-baseline review diffs, including files added or deleted after review\n-  starts.\n-- Worktree switching with per-checkout review state.\n-- Review comments, patches, hunk reverts, pin acknowledgement, rules, and stale\n-  result detection.\n-- Read-only, revision-pinned CI verification results in the review queue.\n-- Transparent, deterministic attention flags for high-review-risk changes,\n-  with rule evidence, direct diff navigation, and session-scoped dismissal.\n+Local code browsing, local review sessions, agent editing, self-hosted imports,\n+accounts, and a managed SaaS are outside the product.\n+\n+## Current foundation\n+\n+- [x] Commit-pinned static report generation\n+- [x] Structured diffs with old and new line numbers\n+- [x] Repository rules from `.px1/rules.json`\n+- [x] Exact-revision GitHub check summaries\n+- [x] Deterministic attention signals\n+- [x] Provider-neutral explanation chips\n+- [x] Historical SHA report retention\n+- [x] GitHub Pages deployment and sticky PR comment\n+- [x] Reusable report and history Actions\n+- [x] Removal of the local server and workspace application\n+\n+## Next priorities\n+\n+1. **Automated explanations in Actions.** Add an optional provider step that\n+   writes the existing commit-pinned explanation contract. Keep reports fully\n+   functional without a key.\n+2. **Semantic team rules.** Let teams express focused rules in plain language,\n+   while showing evidence and uncertainty rather than pretending every match is\n+   a proven defect.\n+3. **Better review blocks.** Group related hunks across files when they belong\n+   to one behavioral change.\n+4. **Report quality gates.** Add fixture-driven browser tests, accessibility\n+   checks, and large-diff performance limits.\n+5. **Action releases.** Publish immutable version tags and document safe upgrade\n+   practices for consuming repositories.\n+\n+## Product constraints\n+\n+- Never execute code from an untrusted PR head.\n+- Never require an account or px1-hosted backend.\n+- Keep reports tied to one full head SHA.\n+- Keep approval and requests for changes in GitHub.\n+- Treat AI output as explanation, not proof.\n+- Prefer evidence visible in the diff over opaque scores.\n","hunks":[{"id":"diff-9923af13a4e0b619","header":"@@ -1,130 +1,47 @@","lines":[{"oldLine":1,"kind":"removed","text":"# px1 Roadmap"},{"newLine":1,"kind":"added","text":"# px1 roadmap"},{"oldLine":2,"newLine":2,"kind":"context","text":""},{"oldLine":3,"kind":"removed","text":"px1 stays local-first, fast, and useful without a cloud account. Cloud"},{"oldLine":4,"kind":"removed","text":"features should extend the review workflow rather than make the core editor"},{"oldLine":5,"kind":"removed","text":"dependent on them."},{"oldLine":6,"kind":"removed","text":""},{"oldLine":7,"kind":"removed","text":"## Next: GitHub-connected reviews"},{"oldLine":8,"kind":"removed","text":""},{"oldLine":9,"kind":"removed","text":"Make a px1 review link attachable to a GitHub pull request, pinned to the PR's"},{"oldLine":10,"kind":"removed","text":"exact head commit. The first version will be a static report generated by a"},{"oldLine":11,"kind":"removed","text":"GitHub Action and published through GitHub Pages. This avoids building a SaaS"},{"oldLine":12,"kind":"removed","text":"or running a server while still giving reviewers one clickable review view."},{"oldLine":13,"kind":"removed","text":""},{"oldLine":14,"kind":"removed","text":"The first link will look like:"},{"newLine":3,"kind":"added","text":"px1 has one product flow:"},{"oldLine":15,"newLine":4,"kind":"context","text":""},{"oldLine":16,"newLine":5,"kind":"context","text":"```text"},{"oldLine":17,"kind":"removed","text":"https://\u003corg\u003e.github.io/\u003crepo\u003e/reviews/\u003chead-sha\u003e/"},{"newLine":6,"kind":"added","text":"push PR → GitHub Action → static review artifact → GitHub Pages → PR link"},{"oldLine":18,"newLine":7,"kind":"context","text":"```"},{"oldLine":19,"newLine":8,"kind":"context","text":""},{"oldLine":20,"kind":"removed","text":"The Action will read the committed `.px1/rules.json`, inspect the exact PR"},{"oldLine":21,"kind":"removed","text":"head SHA, generate changed-file and rule-finding data, publish the report, and"},{"oldLine":22,"kind":"removed","text":"update one sticky PR comment with the link. The report can work without an LLM"},{"oldLine":23,"kind":"removed","text":"API key; AI explanations are a later optional layer."},{"oldLine":24,"kind":"removed","text":""},{"oldLine":25,"kind":"removed","text":"This work has two supported flows:"},{"oldLine":26,"kind":"removed","text":""},{"oldLine":27,"kind":"removed","text":"- **Self-hosted:** teams run px1 inside their network and use a GitHub Action"},{"oldLine":28,"kind":"removed","text":"  plus `PX1_REVIEW_BASE_URL` to publish or update a PR link."},{"oldLine":29,"kind":"removed","text":"- **Hosted platform:** users sign up, install the px1 GitHub App, and let the"},{"oldLine":30,"kind":"removed","text":"  platform manage webhooks, snapshots, authentication, storage, and optional"},{"oldLine":31,"kind":"removed","text":"  AI providers."},{"oldLine":32,"kind":"removed","text":""},{"oldLine":33,"kind":"removed","text":"The detailed design is in"},{"oldLine":34,"kind":"removed","text":"[GitHub Review Integration Plan](docs/GITHUB_REVIEW_INTEGRATION_PLAN.md)."},{"oldLine":35,"kind":"removed","text":""},{"oldLine":36,"kind":"removed","text":"## Complexity reduction roadmap"},{"oldLine":37,"kind":"removed","text":""},{"oldLine":38,"kind":"removed","text":"Before adding the GitHub review workflow, reduce the application to the parts"},{"oldLine":39,"kind":"removed","text":"that directly support team-policy review. These are product-scope cuts, not a"},{"oldLine":40,"kind":"removed","text":"requirement to break existing local users in one release."},{"oldLine":41,"kind":"removed","text":""},{"oldLine":42,"kind":"removed","text":"- [x] **Remove telemetry and in-app process metrics.** They do not help a"},{"oldLine":43,"kind":"removed","text":"   reviewer understand a change and add flags, state, network behavior, API"},{"oldLine":44,"kind":"removed","text":"   endpoints, UI, and release configuration."},{"oldLine":45,"kind":"removed","text":"- [x] **Shrink the primary UI to review surfaces.** The primary surface now"},{"oldLine":46,"kind":"removed","text":"   centers on changed files, diffs, review findings, and explicit actions. The"},{"oldLine":47,"kind":"removed","text":"   old activity rail, Markdown preview, typed settings catalog, theme switching,"},{"oldLine":48,"kind":"removed","text":"   and IDE-like status chrome are gone; local file search, the palette, and the"},{"oldLine":49,"kind":"removed","text":"   worktree switcher remain because they support navigation during review."},{"oldLine":50,"kind":"removed","text":"- [x] **Separate or remove agent-editing orchestration.** Keep an optional"},{"oldLine":51,"kind":"removed","text":"   explanation-provider interface, but do not make harness detection,"},{"oldLine":52,"kind":"removed","text":"   selection, inline editing, cancellation, and agent prompts part of the"},{"oldLine":53,"kind":"removed","text":"   review artifact path. The first slice removes the stale inline-edit"},{"oldLine":54,"kind":"removed","text":"   shortcut and legacy harness discovery, selection, direct-edit, and"},{"oldLine":55,"kind":"removed","text":"   cancellation endpoints; issue #56 removes the remaining startup discovery"},{"oldLine":56,"kind":"removed","text":"   and metadata residue. Configured provider calls for explanations and comment"},{"oldLine":57,"kind":"removed","text":"   follow-up remain available."},{"oldLine":58,"kind":"removed","text":"- [x] **Replace personal decision memory with explicit team rules.** Keep human"},{"oldLine":59,"kind":"removed","text":"   comments and finding acknowledgement; make learned rules proposals rather"},{"oldLine":60,"kind":"removed","text":"   than a second hidden policy store."},{"oldLine":61,"kind":"removed","text":"- [x] **Move verification execution to CI.** px1 should display trusted GitHub"},{"oldLine":62,"kind":"removed","text":"   Action results instead of running arbitrary shell commands in the review"},{"oldLine":63,"kind":"removed","text":"   service."},{"oldLine":64,"kind":"removed","text":"- [x] **Simplify local-only session machinery.** Treat the GitHub commit SHA and"},{"oldLine":65,"kind":"removed","text":"   base SHA as the normal review identity; keep worktree and automatic-baseline"},{"oldLine":66,"kind":"removed","text":"   behavior only for an optional local mode. First slice: local automatic"},{"oldLine":67,"kind":"removed","text":"   baselines are now opt-in; issue #57 makes explicit base/head sessions"},{"oldLine":68,"kind":"removed","text":"   authoritative while the Review panel remains the explicit local path."},{"oldLine":69,"kind":"removed","text":""},{"oldLine" ; rotating that"},{"oldLine":107,"kind":"removed","text":"   secret revokes previously issued links. GitHub Pages remains the public"},{"oldLine":108,"kind":"removed","text":"   static-artifact flow."},{"oldLine":109,"kind":"removed","text":"4. Hosted GitHub App: add accounts, organizations, repository permissions, and"},{"oldLine":110,"kind":"removed","text":"   webhook processing."},{"oldLine":111,"kind":"removed","text":"5. Hosted snapshot storage, managed or bring-your-own LLM keys, quotas, and"},{"oldLine":112,"kind":"removed","text":"   optional write-back of comments/statuses to GitHub."},{"oldLine":113,"kind":"removed","text":""},{"oldLine":114,"kind":"removed","text":"### Scope guardrail"},{"oldLine":115,"kind":"removed","text":""},{"oldLine":116,"kind":"removed","text":"The static report is the product milestone, not a temporary demo. A reviewer"},{"oldLine":117,"kind":"removed","text":"must be able to understand a PR from the generated page without opening the"},{"oldLine":118,"kind":"removed","text":"full local workspace. Server-side hosting, accounts, billing, and LLM keys"},{"oldLine":119,"kind":"removed","text":"must not block this milestone."},{"oldLine":120,"kind":"removed","text":""},{"oldLine":121,"kind":"removed","text":"## Completed foundations"},{"oldLine":122,"kind":"removed","text":""},{"oldLine":123,"kind":"removed","text":"- Task-baseline review diffs, including files added or deleted after review"},{"oldLine":124,"kind":"removed","text":"  starts."},{"oldLine":125,"kind":"removed","text":"- Worktree switching with per-checkout review state."},{"oldLine":126,"kind":"removed","text":"- Review comments, patches, hunk reverts, pin acknowledgement, rules, and stale"},{"oldLine":127,"kind":"removed","text":"  result detection."},{"oldLine":128,"kind":"removed","text":"- Read-only, revision-pinned CI verification results in the review queue."},{"oldLine":129,"kind":"removed","text":"- Transparent, deterministic attention flags for high-review-risk changes,"},{"oldLine":130,"kind":"removed","text":"  with rule evidence, direct diff navigation, and session-scoped dismissal."},{"newLine":9,"kind":"added","text":"Local code browsing, local review sessions, agent editing, self-hosted imports,"},{"newLine":10,"kind":"added","text":"accounts, and a managed SaaS are outside the product."},{"newLine":11,"kind":"added","text":""},{"newLine":12,"kind":"added","text":"## Current foundation"},{"newLine":13,"kind":"added","text":""},{"newLine":14,"kind":"added","text":"- [x] Commit-pinned static report generation"},{"newLine":15,"kind":"added","text":"- [x] Structured diffs with old and new line numbers"},{"newLine":16,"kind":"added","text":"- [x] Repository rules from `.px1/rules.json`"},{"newLine":17,"kind":"added","text":"- [x] Exact-revision GitHub check summaries"},{"newLine":18,"kind":"added","text":"- [x] Deterministic attention signals"},{"newLine":19,"kind":"added","text":"- [x] Provider-neutral explanation chips"},{"newLine":20,"kind":"added","text":"- [x] Historical SHA report retention"},{"newLine":21,"kind":"added","text":"- [x] GitHub Pages deployment and sticky PR comment"},{"newLine":22,"kind":"added","text":"- [x] Reusable report and history Actions"},{"newLine":23,"kind":"added","text":"- [x] Removal of the local server and workspace application"},{"newLine":24,"kind":"added","text":""},{"newLine":25,"kind":"added","text":"## Next priorities"},{"newLine":26,"kind":"added","text":""},{"newLine":27,"kind":"added","text":"1. **Automated explanations in Actions.** Add an optional provider step that"},{"newLine":28,"kind":"added","text":"   writes the existing commit-pinned explanation contract. Keep reports fully"},{"newLine":29,"kind":"added","text":"   functional without a key."},{"newLine":30,"kind":"added","text":"2. **Semantic team rules.** Let teams express focused rules in plain language,"},{"newLine":31,"kind":"added","text":"   while showing evidence and uncertainty rather than pretending every match is"},{"newLine":32,"kind":"added","text":"   a proven defect."},{"newLine":33,"kind":"added","text":"3. **Better review blocks.** Group related hunks across files when they belong"},{"newLine":34,"kind":"added","text":"   to one behavioral change."},{"newLine":35,"kind":"added","text":"4. **Report quality gates.** Add fixture-driven browser tests, accessibility"},{"newLine":36,"kind":"added","text":"   checks, and large-diff performance limits."},{"newLine":37,"kind":"added","text":"5. **Action releases.** Publish immutable version tags and document safe upgrade"},{"newLine":38,"kind":"added","text":"   practices for consuming repositories."},{"newLine":39,"kind":"added","text":""},{"newLine":40,"kind":"added","text":"## Product constraints"},{"newLine":41,"kind":"added","text":""},{"newLine":42,"kind":"added","text":"- Never execute code from an untrusted PR head."},{"newLine":43,"kind":"added","text":"- Never require an account or px1-hosted backend."},{"newLine":44,"kind":"added","text":"- Keep reports tied to one full head SHA."},{"newLine":45,"kind":"added","text":"- Keep approval and requests for changes in GitHub."},{"newLine":46,"kind":"added","text":"- Treat AI output as explanation, not proof."},{"newLine":47,"kind":"added","text":"- Prefer evidence visible in the diff over opaque scores."}]}]},{"path":"benchmark.sh","status":"D","diff":"diff --git a/benchmark.sh b/benchmark.sh\ndeleted file mode 100755\nindex b87d314..0000000\n--- a/benchmark.sh\n+++ /dev/null\n@@ -1,661 +0,0 @@\n-#!/usr/bin/env bash\n-# Benchmark px1 against real repositories.\n-#\n-# Every number printed here comes from a running server: timings from curl,\n-# memory from /proc, index size from the server's own /api/meta.\n-set -u\n-unalias find 2\u003e/dev/null || true\n-unset -f find 2\u003e/dev/null || true\n-\n-BIN=${BIN:-./px1}\n-CORPUS=${CORPUS:-./bench-repos}\n-PORT=${PORT:-7900}\n-RUNS=${RUNS:-5}\n-\n-# name|url - shallow single-branch clones, no submodules\n-REPOS=\"\n-flask|https://github.com/pallets/flask\n-redis|https://github.com/redis/redis\n-react|https://github.com/facebook/react\n-django|https://github.com/django/django\n-typescript|https://github.com/microsoft/TypeScript\n-kubernetes|https://github.com/kubernetes/kubernetes\n-linux|https://github.com/torvalds/linux\n-\"\n-\n-usage() {\n-  cat \u003c\u003c'EOF'\n-usage: ./benchmark.sh [mode] [directory ...]\n-\n-modes:\n-  (none)            benchmark every repo in the corpus, or the directories given\n-  --clone           fetch the standard corpus into ./bench-repos (about 3 GB)\n-  --memory          trace resident memory through index, search and file open\n-  --lsp             time go-to-definition, references, hover and outline\n-  --vscode          measure and compare running VS Code process tree vs px1\n-  --vscode-vanilla  spawn isolated vanilla VS Code (no extensions) \u0026 measure\n-  --editors         compare px1 vs VS Code (running \u0026 vanilla), Neovim, Vim, etc.\n-  --help            show this\n-\n-examples:\n-  ./benchmark.sh --clone\n-  ./benchmark.sh\n-  ./benchmark.sh --vscode [directory]\n-  ./benchmark.sh --vscode-vanilla [directory]\n-  ./benchmark.sh --editors [directory]\n-  ./benchmark.sh ~/src/myproject\n-  ./benchmark.sh --memory bench-repos/linux\n-  ./benchmark.sh --lsp .\n-  RUNS=20 ./benchmark.sh bench-repos/redis\n-\n-environment:\n-  BIN=./px1             binary to measure\n-  CORPUS=./bench-repos  where the corpus lives\n-  PORT=7900             first port to use, incremented per repo\n-  RUNS=5                requests per timing, the fastest is reported\n-EOF\n-}\n-\n-die() { echo \"benchmark: $*\" \u003e\u00262; exit 1; }\n-\n-clone_corpus() {\n-  command -v git \u003e/dev/null || die \"git is required for --clone\"\n-  mkdir -p \"$CORPUS\"\n-  for entry in $REPOS; do\n-    name=${entry%%|*}; url=${entry##*|}\n-    if [ -d \"$CORPUS/$name/.git\" ]; then\n-      echo \"  have   $name\"\n-      continue\n-    fi\n-    echo \"  clone  $name ...\"\n-    git clone --depth 1 --single-branch --no-tags -q \"$url\" \"$CORPUS/$name\" \\\n-      || echo \"         failed: $name\"\n-  done\n-  echo \"corpus ready in $CORPUS ($(du -sh \"$CORPUS\" 2\u003e/dev/null | cut -f1))\"\n-}\n-\n-# start DIR PORT [extra flags...] - echoes the pid, waits until it answers\n-start_server() {\n-  local dir=$1 port=$2; shift 2\n-  \"$BIN\" -no-open -port \"$port\" \"$@\" \"$dir\" \u003e\"/tmp/px1-bench-$port.log\" 2\u003e\u00261 \u0026\n-  local pid=$!\n-  local i\n-  for i in $(seq 100); do\n-    curl -sf -o /dev/null \"http://127.0.0.1:$port/api/meta\" \u0026\u0026 { echo \"$pid\"; return 0; }\n-    kill -0 \"$pid\" 2\u003e/dev/null || break\n-    sleep 0.3\n-  done\n-  kill \"$pid\" 2\u003e/dev/null\n-  return 1\n-}\n-\n-# best_ms URL - fastest of RUNS requests, in milliseconds\n-best_ms() {\n-  local url=$1 best=999999 t\n-  for _ in $(seq \"$RUNS\"); do\n-    t=$(curl -s -o /dev/null -w '%{time_total}' \"$url\" 2\u003e/dev/null) || continue\n-    t=$(awk -v x=\"$t\" 'BEGIN{printf \"%.1f\", x*1000}')\n-    awk -v a=\"$t\" -v b=\"$best\" 'BEGIN{exit !(a\u003cb)}' \u0026\u0026 best=$t\n-  done\n-  echo \"$best\"\n-}\n-\n-rss_mb() { awk '/VmRSS/{printf \"%.0f\", $2/1024}' \"/proc/$1/status\" 2\u003e/dev/null || echo \"?\"; }\n-\n-# The biggest source file in the tree, which is the worst case for opening.\n-# Skips what px1 itself skips, so the file picked is one the index holds.\n-biggest_file() {\n-  local dir=$1 corpus_abs\n-  local -a prune=()\n-  corpus_abs=$(cd \"$CORPUS\" 2\u003e/dev/null \u0026\u0026 pwd) || corpus_abs=\"\"\n-  # Prune the corpus only when it sits inside the tree being measured, which is\n-  # the case when you point the script at px1's own directory.\n-  case \"$corpus_abs\" in\n-    \"$dir\"/*) prune=(-not -path \"$corpus_abs/*\") ;;\n-  esac\n-  # One -size predicate only: some find implementations drop every result when\n-  # an upper and a lower bound are combined. The upper bound is applied below.\n- n/amd64 darwin/arm64"},{"oldLine":12,"kind":"removed","text":"windows/amd64 windows/arm64 windows/386"},{"oldLine":13,"kind":"removed","text":"freebsd/amd64 freebsd/arm64 openbsd/amd64 openbsd/arm64 netbsd/amd64"},{"oldLine":14,"kind":"removed","text":"\""},{"oldLine":15,"kind":"removed","text":""},{"oldLine":16,"kind":"removed","text":"rm -rf \"$OUT\""},{"oldLine":17,"kind":"removed","text":"mkdir -p \"$OUT\""},{"oldLine":18,"kind":"removed","text":""},{"oldLine":19,"kind":"removed","text":"for t in $TARGETS; do"},{"oldLine":20,"kind":"removed","text":"  os=${t%/*}"},{"oldLine":21,"kind":"removed","text":"  arch=${t#*/}"},{"oldLine":22,"kind":"removed","text":"  ext=\"\""},{"oldLine":23,"kind":"removed","text":"  [ \"$os\" = \"windows\" ] \u0026\u0026 ext=\".exe\""},{"oldLine":24,"kind":"removed","text":"  name=\"px1-$VERSION-$os-$arch$ext\""},{"oldLine":25,"kind":"removed","text":"  printf '  %-28s' \"$name\""},{"oldLine":26,"kind":"removed","text":"  CGO_ENABLED=0 GOOS=\"$os\" GOARCH=\"$arch\" \\"},{"oldLine":27,"kind":"removed","text":"    go build -trimpath -ldflags=\"$LDFLAGS\" -o \"$OUT/$name\" ."},{"oldLine":28,"kind":"removed","text":"  printf '%s\\n' \"$(du -h \"$OUT/$name\" | cut -f1)\""},{"oldLine":29,"kind":"removed","text":"done"},{"oldLine":30,"kind":"removed","text":""},{"oldLine":31,"kind":"removed","text":"echo \"built $(ls -1 \"$OUT\" | wc -l | tr -d ' ') binaries in $OUT/\""}]}]},{"path":"docs/GITHUB_REVIEW_INTEGRATION_PLAN.md","status":"M","diff":"diff --git a/docs/GITHUB_REVIEW_INTEGRATION_PLAN.md b/docs/GITHUB_REVIEW_INTEGRATION_PLAN.md\nindex 345c030..a279e47 100644\n--- a/docs/GITHUB_REVIEW_INTEGRATION_PLAN.md\n+++ b/docs/GITHUB_REVIEW_INTEGRATION_PLAN.md\n@@ -1,174 +1,66 @@\n-# GitHub Review Integration Plan\n+# GitHub review artifact architecture\n \n-px1 should support two deployment flows that share the same review model and\n-URL contract:\n+## Supported flow\n \n-1. **Self-hosted px1:** a team runs the review service in its own network.\n-2. **Hosted px1:** a user signs up, connects GitHub, and uses managed review\n-   links and storage.\n+px1 supports one delivery path:\n \n-The core review experience must remain useful without an LLM API key. AI\n-explanations are an optional provider layered on top of the review snapshot.\n+1. A pull request is opened, synchronized, or reopened.\n+2. A `pull_request_target` workflow loads trusted workflow code from the base\n+   branch.\n+3. The workflow fetches the PR head as Git objects without executing it.\n+4. px1 compares the exact base and head SHAs and generates one static HTML file.\n+5. The workflow restores older reports, adds the new SHA report, and publishes\n+   the complete site through GitHub Pages.\n+6. A sticky PR comment links to `reviews/\u003chead-sha\u003e/`.\n \n-## Shared review link\n+## Artifact identity\n \n-Every external review link is pinned to an immutable commit SHA:\n+Every report contains full base and head commit SHAs. A new PR commit creates a\n+new path rather than changing the old report:\n \n ```text\n-https://\u003cpx1-host\u003e/github/\u003cowner\u003e/\u003crepo\u003e/pull/\u003cnumber\u003e?sha=\u003chead-sha\u003e\n+https://\u003cowner\u003e.github.io/\u003crepo\u003e/reviews/\u003chead-sha\u003e/\n ```\n \n-The URL identifies the GitHub PR, while the SHA prevents the review from\n-silently changing when the PR receives another commit. A new PR commit creates\n-a new snapshot and a new link target.\n-\n-The review snapshot contains:\n-\n-- changed files and baseline/current contents;\n-- review comments and their line anchors;\n-- AI explanations, when available;\n-- verification results;\n-- review disposition: pending, approved, or changes requested.\n-\n-## Flow A: self-hosted environment\n-\n-The customer owns the px1 host, repository data, and credentials.\n-\n-1. Deploy px1 next to the repository or on an internal HTTPS host.\n-2. Configure a repository or organization variable such as\n-   `PX1_REVIEW_BASE_URL`.\n-3. A GitHub Action runs on PR open/update, checks out the exact head SHA, and\n-   sends the PR metadata plus a review snapshot to the self-hosted px1 import\n-   endpoint.\n-4. The Action creates or updates one sticky PR comment containing the pinned\n-   px1 link.\n-5. Reviewers open the link through the company network or VPN.\n-6. Optional write-back uses the Action's `GITHUB_TOKEN` or a customer-managed\n-   GitHub App to post review summaries/statuses back to GitHub.\n-\n-Self-hosted installations can use local coding harnesses, a team-owned LLM\n-endpoint, or no LLM at all. No px1 cloud account is required.\n-\n-## Flow B: hosted px1 platform\n-\n-The platform owns hosting, snapshot storage, and the user experience; GitHub\n-access is granted explicitly by the customer.\n-\n-1. The user signs up and creates or joins an organization.\n-2. The user installs the px1 GitHub App and chooses repositories.\n-3. GitHub sends pull-request webhooks for opened, synchronized, reopened, and\n-   closed events.\n-4. The platform fetches the PR's exact head SHA, creates a snapshot, and stores\n-   it under the organization and repository.\n-5. The platform posts the pinned px1 link to the PR.\n-6. Reviewers use px1 for diffs, comments, explanations, verification, and the\n-   approval gate.\n-7. px1 can optionally post a summary, review decision, or check status back to\n-   GitHub.\n-\n-Hosted AI should support both a platform-managed provider key and a future\n-bring-your-own-key option. Keys must remain server-side and must never be\n-embedded in review links or browser code.\n-\n-## Code to build before deployment\n-\n-These pieces can be implemented and tested locally without external accounts:\n-\n-1. Add a versioned review snapshot export/import format. The first local\n-   export slice is now available as `px1 export-review`: it takes explicit\n-   `--base` and `--head` commits, reads team rules and verification from the\n-   head commit, and writes a self-contained `index.html` containing changed\n-   files, unified diffs, rule findings, and verification status. It is suitable\n-   for a local preview or as the artifact consumed by a future GitHub Action;\n-   it intentionally does not publish, authenticate, or call an LLM. An\n-   optional `--explanations-file` input accepts provider-neutral, commit-pinned\n-   explanation JSON and renders expandable chips; generation remains a\n-   separate local or CI concern. Changed files are parsed into structured\n-   hunks with old/new line numbers and addition/removal highlighting, while\n-   binary or otherwise unparsed patches retain a raw-diff fallback.\n-2. Add commit-pinned GitHub review URL parsing and routing. This is now\n-   implemented: the live server accepts only the exact shared-link shape,\n-   requires one full 40-character SHA, and embeds the validated, read-only\n-   review identity in the app page. Snapshot import remains separate, so\n-   opening a valid route does not mutate a local review session.\n-3. Add persisted review disposition with approval guards for stale files and\n-   open comments.\n-4. Add an import endpoint that accepts PR metadata and a snapshot, with strict\n-   SHA validation. This is now implemented at `POST /api/review/import`: it\n-   requires `PX1_IMPORT_TOKEN`, rejects ambiguous or mismatched identities,\n-   stores immutable snapshots outside the checkout, and serves them from the\n-   commit-pinned GitHub route. When `PX1_REVIEW_LINK_SECRET` is configured,\n-   returned self-hosted links are HMAC-signed and unsigned reads are rejected.\n-5. Add a GitHub Action template that publishes or updates the sticky link when\n-   `PX1_REVIEW_BASE_URL` is configured. The first Pages-based workflow is now\n-   implemented in `.github/workflows/px1-review-report.yml`: it runs trusted\n-   base-branch code, fetches the PR head as an object, publishes\n-   `reviews/\u003chead-sha\u003e/index.html`, and creates or updates one marked PR\n-   comment. It does not execute the PR checkout. Before export it also reads\n-   GitHub check runs for the exact head SHA and supplies them through the\n-   existing `.px1/verification.json` contract, so the report shows CI status\n-   without requiring that file to be committed by the PR.\n-6. Add interfaces for GitHub and LLM providers, with local fakes for tests.\n-7. Add documentation and fixture-based tests for both flows.\n-\n-## Credentials and security\n-\n-- Self-hosted mode uses customer-controlled GitHub credentials or the Action's\n-  short-lived `GITHUB_TOKEN`.\n-- Hosted mode uses a GitHub App with least-privilege repository permissions.\n-- Snapshot imports must validate repository, PR number, and full commit SHA.\n-- Snapshot imports require a high-entropy `PX1_IMPORT_TOKEN`; identical\n-  deliveries are idempotent and existing commit identities cannot be replaced.\n-- Self-hosted review links should use `PX1_REVIEW_LINK_SECRET`; rotate it to\n-  revoke previously issued links. GitHub Pages links are public static\n-  artifacts and should not be used for private repositories without repository\n-  access controls.\n-- API keys are server-side configuration only; the browser receives provider\n-  results, never secrets.\n-- Comments and approvals must remain tied to the snapshot SHA and become stale\n-  after the PR changes.\n-\n-## GitHub Pages workflow\n-\n-The repository can publish the local exporter without a px1 server. Enable\n-GitHub Pages with **GitHub Actions** as its source, then keep\n-`.github/workflows/px1-review-report.yml` on the target base branch. On each\n-opened, synchronized, or reopened non-draft pull request, it creates a link in\n-the form:\n+The generated-only `px1-review-reports` branch retains historical reports. Its\n+tree is validated before restore and may contain only regular files matching:\n \n ```text\n-https://\u003cowner\u003e.github.io/\u003crepo\u003e/reviews/\u003chead-sha\u003e/\n+reviews/\u003c40-character-lowercase-sha\u003e/index.html\n ```\n \n-The workflow uses `pull_request_target` so it can update the PR comment and\n-deploy Pages for fork pull requests. Its checkout is always the trusted base\n-SHA; the PR head is fetched only to let Git inspect its diff and committed\n-`.px1/rules.json`. Do not change it to execute code from the PR head.\n-\n-Before each export, the workflow restores generated reports from the dedicated\n-`px1-review-reports` branch. It overlays the new `reviews/\u003chead-sha\u003e/index.html`,\n-publishes the complete site, then updates that artifact-only branch through a\n-temporary Git index. Historical commit links therefore remain valid across\n-deployments without mixing generated HTML into the source branch. The workflow\n-validates that the history tree contains only regular\n-`reviews/\u003c40-character-sha\u003e/index.html` files before extracting it.\n-\n-Static findings include a short hunk-local context block with line numbers and\n-added, unchanged, or removed markers. The full unified diff remains available\n-below the findings for reviewers who need broader context.\n-\n-Reviewers can acknowledge individual team-rule findings in the generated page.\n-Acknowledgements are intentionally browser-local and keyed by repository plus\n-the exact head SHA, so they require no account and cannot leak onto a later PR\n-revision. They are personal review progress, not a shared approval signal.\n-\n-## Suggested delivery order\n-\n-1. Local snapshot contract, deep links, review disposition, and fake providers.\n-2. Self-hosted Action plus import endpoint and deployment documentation.\n-3. GitHub App, accounts, organization/repository access, and webhook handling.\n-4. Hosted storage, managed LLM provider, usage limits, and optional BYOK.\n-5. GitHub write-back for summaries, checks, comments, and approval status.\n-\n-The first milestone proves the review workflow without requiring hosting,\n-GitHub credentials, or an LLM API key.\n+## Inputs\n+\n+The generator reads only commit-pinned data:\n+\n+- base and head Git commits;\n+- `.px1/rules.json` from the head commit;\n+- GitHub check runs collected for the head SHA; and\n+- optional explanation JSON whose revision equals the head SHA.\n+\n+The report contains changed files, structured hunks, rule findings, attention\n+signals, verification results, and optional explanations.\n+\n+## Security boundaries\n+\n+- Workflow and Action code come from a trusted px1 release and the PR base.\n+- PR code is inspected as data and is never executed.\n+- Shell arguments are passed through environment variables and quoted arrays.\n+- Verification URLs must be HTTPS.\n+- Imported verification and explanation revisions must equal the report head.\n+- The static report has no backend and makes no network requests.\n+- Reviewer acknowledgement is browser-local progress, not approval.\n+\n+GitHub remains the authority for comments, requested changes, and approval.\n+\n+## Deliberately unsupported\n+\n+- Local workspace servers\n+- Snapshot import endpoints\n+- Signed self-hosted links\n+- px1 user accounts\n+- Hosted snapshot storage\n+- Agent-driven code edits\n+- Mutable comments or approvals inside a static report\n+\n+These features create a second product architecture and are not planned.\n","hunks":[{"id":"diff-6dff4c6c3fcebfca","header":"@@ -1,174 +1,66 @@","lines":[{"oldLine":1,"kind":"removed","text":"# GitHub Review Integration Plan"},{"newLine":1,"kind":"added","text":"# GitHub review artifact architecture"},{"oldLine":2,"newLine":2,"kind":"context","text":""},{"oldLine":3,"kind":"removed","text":"px1 should support two deployment flows that share the same review model and"},{"oldLine":4,"kind":"removed","text":"URL contract:"},{"newLine":3,"kind":"added","text":"## Supported flow"},{"oldLine":5,"newLine":4,"kind":"context","text":""},{"oldLine":6,"kind":"removed","text":"1. **Self-hosted px1:** a team runs the review service in its own network."},{"oldLine":7,"kind":"removed","text":"2. **Hosted px1:** a user signs up, connects GitHub, and uses managed review"},{"oldLine":8,"kind":"removed","text":"   links and storage."},{"newLine":5,"kind":"added","text":"px1 supports one delivery path:"},{"oldLine":9,"newLine":6,"kind":"context","text":""},{"oldLine":10,"kind":"removed","text":"The core review experience must remain useful without an LLM API key. AI"},{"oldLine":11,"kind":"removed","text":"explanations are an optional provider layered on top of the review snapshot."},{"newLine":7,"kind":"added","text":"1. A pull request is opened, synchronized, or reopened."},{"newLine":8,"kind":"added","text":"2. A `pull_request_target` workflow loads trusted workflow code from the base"},{"newLine":9,"kind":"added","text":"   branch."},{"newLine":10,"kind":"added","text":"3. The workflow fetches the PR head as Git objects without executing it."},{"newLine":11,"kind":"added","text":"4. px1 compares the exact base and head SHAs and generates one static HTML file."},{"newLine":12,"kind":"added","text":"5. The workflow restores older reports, adds the new SHA report, and publishes"},{"newLine":13,"kind":"added","text":"   the complete site through GitHub Pages."},{"newLine":14,"kind":"added","text":"6. A sticky PR comment links to `reviews/\u003chead-sha\u003e/`."},{"oldLine":12,"newLine":15,"kind":"context","text":""},{"oldLine":13,"kind":"removed","text":"## Shared review link"},{"newLine":16,"kind":"added","text":"## Artifact identity"},{"oldLine":14,"newLine":17,"kind":"context","text":""},{"oldLine":15,"kind":"removed","text":"Every external review link is pinned to an immutable commit SHA:"},{"newLine":18,"kind":"added","text":"Every report contains full base and head commit SHAs. A new PR commit creates a"},{"newLine":19,"kind":"added","text":"new path rather than changing the old report:"},{"oldLine":16,"newLine":20,"kind":"context","text":""},{"oldLine":17,"newLine":21,"kind":"context","text":"```text"},{"oldLine":18,"kind":"removed","text":"https://\u003cpx1-host\u003e/github/\u003cowner\u003e/\u003crepo\u003e/pull/\u003cnumber\u003e?sha=\u003chead-sha\u003e"},{"newLine":22,"kind":"added","text":"https://\u003cowner\u003e.github.io/\u003crepo\u003e/reviews/\u003chead-sha\u003e/"},{"oldLine":19,"newLine":23,"kind":"context","text":"```"},{"oldLine":20,"newLine":24,"kind":"context","text":""},{"oldLine":21,"kind":"removed","text":"The URL identifies the GitHub PR, while the SHA prevents the review from"},{"oldLine":22,"kind":"removed","text":"silently changing when the PR receives another commit. A new PR commit creates"},{"oldLine":23,"kind":"removed","text":"a new snapshot and a new link target."},{"oldLine":24,"kind":"removed","text":""},{"oldLine":25,"kind":"removed","text":"The review snapshot contains:"},{"oldLine":26,"kind":"removed","text":""},{"oldLine":27,"kind":"removed","text":"- changed files and baseline/current contents;"},{"oldLine":28,"kind":"removed","text":"- review comments and their line anchors;"},{"oldLine":29,"kind":"removed","text":"- AI explanations, when available;"},{"oldLine":30,"kind":"removed","text":"- verification results;"},{"oldLine":31,"kind":"removed","text":"- review disposition: pending, approved, or changes requested."},{"oldLine":32,"kind":"removed","text":""},{"oldLine":33,"kind":"removed","text":"## Flow A: self-hosted environment"},{"oldLine":34,"kind":"removed","text":""},{"oldLine":35,"kind":"removed","text":"The customer owns the px1 host, repository data, and credentials."},{"oldLine":36,"kind":"removed","text":""},{"oldLine":37,"kind":"removed","text":"1. Deploy px1 next to the repository or on an internal HTTPS host."},{"oldLine":38,"kind":"removed","text":"2. Configure a repository or organization variable such as"},{"oldLine":39,"kind":"removed","text":"   `PX1_REVIEW_BASE_URL`."},{"oldLine":40,"kind":"removed","text":"3. A GitHub Action runs on PR open/update, checks out the exact head SHA, and"},{"oldLine":41,"kind":"removed","text":"   sends the PR metadata plus a review snapshot to the self-hosted px1 import"},{"oldLine":42,"kind":"removed","text":"   endpoint."},{"oldLine":43,"kind":"removed","text":"4. The Action creates or updates one sticky PR comment containing the pinned"},{"oldLine":44,"kind":"removed","text":"   px1 link."},{"oldLine":45,"kind":"removed","text":"5. Reviewers open the link through the company network or VPN."},{"oldLine":46,"kind":"removed","text":"6. Optional write-back uses the Action's `GITHUB_TOKEN` or a customer-managed"},{"oldLine":47,"kind":"removed","text":"   GitHub App to post review summaries/statuses back to GitHub."},{"oldLine":48,"kind":"removed","text":""},{"oldLine":49,"kind":"removed","text":"Self-hosted installations can use local coding harnesses, a team-owned LLM"},{"oldLine":50,"kind":"removed","text":"endpoint, or no LLM at all. No px1 cloud account is required."},{"oldLine":51,"kind":"removed","text":""},{"oldLine":52,"kind":"removed","text":"## Flow B: hosted px1 platform"},{"oldLine":53,"kind":"removed","text":""},{"oldLine":54,"kind":"removed","text":"The platform owns hosting, snapshot storage, and the user experience; GitHub"},{"oldLine":55,"kind":"removed","text":"access is granted explicitly by the customer."},{"oldLine":56,"kind":"removed","text":""},{"oldLine":57,"kind":"removed","text":"1. The user signs up and creates or joins an organization."},{"oldLine":58,"kind":"removed","text":"2. The user installs the px1 GitHub App and chooses repositories."},{"oldLine":59,"kind":"removed","text":"3. GitHub sends pull-request webhooks for opened, synchronized, reopened, and"},{"oldLine":60,"kind":"removed","text":"   closed events."},{"oldLine":61,"kind":"removed","text":"4. The platform fetches the PR's exact head SHA, creates a snapshot, and stores"},{"oldLine":62,"kind":"removed","text":"   it under the organization and repository."},{"oldLine":63,"kind":"removed","text":"5. The platform posts the pinned px1 link to the PR."},{"oldLine":64,"kind":"removed","text":"6. Reviewers use px1 for diffs, comments, explanations, verification, and the"},{"oldLine":65,"kind":"removed","text":"   approval gate."},{"oldLine":66,"kind":"removed","text":"7. px1 can optionally post a summary, review decision, or check status back to"},{"oldLine":67,"kind":"removed","text":"   GitHub."},{"oldLine":68,"kind":"removed","text":""},{"oldLine":69,"kind":"removed","text":"Hosted AI should support both a platform-managed provider key and a future"},{"oldLine":70,"kind":"removed","text":"bring-your-own-key option. Keys must remain server-side and must never be"},{"oldLine":71,"kind":"removed","text":"embedded in review links or browser code."},{"oldLine":72,"kind":"removed","text":""},{"oldLine":73,"kind":"removed","text":"## Code to build before deployment"},{"oldLine":74,"kind":"removed","text":""},{"oldLine":75,"kind":"removed","text":"These pieces can be implemented and tested locally without external accounts:"},{"oldLine":76,"kind":"removed","text":""},{"oldLine":77,"kind":"removed","text":"1. Add a versioned review snapshot export/import format. The first local"},{"oldLine":78,"kind":"removed","text":"   export slice is now available as `px1 export-review`: it takes explicit"},{"oldLine":79,"kind":"removed","text":"   `--base` and `--head` commits, reads team rules and verification from the"},{"oldLine":80,"kind":"removed","text":"   head commit, and writes a self-contained `index.html` containing changed"},{"oldLine":81,"kind":"removed","text":"   files, unified diffs, rule findings, and verification status. It is suitable"},{"oldLine":82,"kind":"removed","text":"   for a local preview or as the artifact consumed by a future GitHub Action;"},{"oldLine":83,"kind":"removed","text":"   it intentionally does not publish, authenticate, or call an LLM. An"},{"oldLine":84,"kind":"removed","text":"   optional `--explanations-file` input accepts provider-neutral, commit-pinned"},{"oldLine":85,"kind":"removed","text":"   explanation JSON and renders expandable chips; generation remains a"},{"oldLine":86,"kind":"removed","text":"   separate local or CI concern. Changed files are parsed into structured"},{"oldLine":87,"kind":"removed","text":"   hunks with old/new line numbers and addition/removal highlighting, while"},{"oldLine":88,"kind":"removed","text":"   binary or otherwise unparsed patches retain a raw-diff fallback."},{"oldLine":89,"kind":"removed","text":"2. Add commit-pinned GitHub review URL parsing and routing. This is now"},{"oldLine":90,"kind":"removed","text":"   implemented: the live server accepts only the exact shared-link shape,"},{"oldLine":91,"kind":"removed","text":"   requires one full 40-character SHA, and embeds the validated, read-only"},{"oldLine":92,"kind":"removed","text":"   review identity in the app page. Snapshot import remains separate, so"},{"oldLine":93,"kind":"removed","text":"   opening a valid route does not mutate a local review session."},{"oldLine":94,"kind":"removed","text":"3. Add persisted review disposition with approval guards for stale files and"},{"oldLine":95,"kind":"removed","text":"   open comments."},{"oldLine":96,"kind":"removed","text":"4. Add an import endpoint that accepts PR metadata and a snapshot, with strict"},{"oldLine":97,"kind":"removed","text":"   SHA validation. This is now implemented at `POST /api/review/import`: it"},{"oldLine":98,"kind":"removed","text":"   requires `PX1_IMPORT_TOKEN`, rejects ambiguous or mismatched identities,"},{"oldLine":99,"kind":"removed","text":"   stores immutable snapshots outside the checkout, and serves them from the"},{"oldLine":100,"kind":"removed","text":"   commit-pinned GitHub route. When `PX1_REVIEW_LINK_SECRET` is configured,"},{"oldLine":101,"kind":"removed","text":"   returned self-hosted links are HMAC-signed and unsigned reads are rejected."},{"oldLine":102,"kind":"removed","text":"5. Add a GitHub Action template that publishes or updates the sticky link when"},{"oldLine":103,"kind":"removed","text":"   `PX1_REVIEW_BASE_URL` is configured. The first Pages-based workflow is now"},{"oldLine":104,"kind":"removed","text":"   implemented in `.github/workflows/px1-review-report.yml`: it runs trusted"},{"oldLine":105,"kind":"removed","text":"   base-branch code, fetches the PR head as an object, publishes"},{"oldLine":106,"kind":"removed","text":"   `reviews/\u003chead-sha\u003e/index.html`, and creates or updates one marked PR"},{"oldLine":107,"kind":"removed","text":"   comment. It does not execute the PR checkout. Before export it also reads"},{"oldLine":108,"kind":"removed","text":"   GitHub check runs for the exact head SHA and supplies them through the"},{"oldLine":109,"kind":"removed","text":"   existing `.px1/verification.json` contract, so the report shows CI status"},{"oldLine":110,"kind":"removed","text":"   without requiring that file to be committed by the PR."},{"oldLine":111,"kind":"removed","text":"6. Add interfaces for GitHub and LLM providers, with local fakes for tests."},{"oldLine":112,"kind":"removed","text":"7. Add documentation and fixture-based tests for both flows."},{"oldLine":113,"kind":"removed","text":""},{"oldLine":114,"kind":"removed","text":"## Credentials and security"},{"oldLine":115,"kind":"removed","text":""},{"oldLine":116,"kind":"removed","text":"- Self-hosted mode uses customer-controlled GitHub credentials or the Action's"},{"oldLine":117,"kind":"removed","text":"  short-lived `GITHUB_TOKEN`."},{"oldLine":118,"kind":"removed","text":"- Hosted mode uses a GitHub App with least-privilege repository permissions."},{"oldLine":119,"kind":"removed","text":"- Snapshot imports must validate repository, PR number, and full commit SHA."},{"oldLine":120,"kind":"removed","text":"- Snapshot imports require a high-entropy `PX1_IMPORT_TOKEN`; identical"},{"oldLine":121,"kind":"removed","text":"  deliveries are idempotent and existing commit identities cannot be replaced."},{"oldLine":122,"kind":"removed","text":"- Self-hosted review links should use `PX1_REVIEW_LINK_SECRET`; rotate it to"},{"oldLine":123,"kind":"removed","text":"  revoke previously issued links. GitHub Pages links are public static"},{"oldLine":124,"kind":"removed","text":"  artifacts and should not be used for private repositories without repository"},{"oldLine":125,"kind":"removed","text":"  access controls."},{"oldLine":126,"kind":"removed","text":"- API keys are server-side configuration only; the browser receives provider"},{"oldLine":127,"kind":"removed","text":"  results, never secrets."},{"oldLine":128,"kind":"removed","text":"- Comments and approvals must remain tied to the snapshot SHA and become stale"},{"oldLine":129,"kind":"removed","text":"  after the PR changes."},{"oldLine":130,"kind":"removed","text":""},{"oldLine":131,"kind":"removed","text":"## GitHub Pages workflow"},{"oldLine":132,"kind":"removed","text":""},{"oldLine":133,"kind":"removed","text":"The repository can publish the local exporter without a px1 server. Enable"},{"oldLine":134,"kind":"removed","text":"GitHub Pages with **GitHub Actions** as its source, then keep"},{"oldLine":135,"kind":"removed","text":"`.github/workflows/px1-review-report.yml` on the target base branch. On each"},{"oldLine":136,"kind":"removed","text":"opened, synchronized, or reopened non-draft pull request, it creates a link in"},{"oldLine":137,"kind":"removed","text":"the form:"},{"newLine":25,"kind":"added","text":"The generated-only `px1-review-reports` branch retains historical reports. Its"},{"newLine":26,"kind":"added","text":"tree is validated before restore and may contain only regular files matching:"},{"oldLine":138,"newLine":27,"kind":"context","text":""},{"oldLine":139,"newLine":28,"kind":"context","text":"```text"},{"oldLine":140,"kind":"removed","text":"https://\u003cowner\u003e.github.io/\u003crepo\u003e/reviews/\u003chead-sha\u003e/"},{"newLine":29,"kind":"added","text":"reviews/\u003c40-character-lowercase-sha\u003e/index.html"},{"oldLine":141,"newLine":30,"kind":"context","text":"```"},{"oldLine":142,"newLine":31,"kind":"context","text":""},{"oldLine":143,"kind":"removed","text":"The workflow uses `pull_request_target` so it can update the PR comment and"},{"oldLine":144,"kind":"removed","text":"deploy Pages for fork pull requests. Its checkout is always the trusted base"},{"oldLine":145,"kind":"removed","text":"SHA; the PR head is fetched only to let Git inspect its diff and committed"},{"oldLine":146,"kind":"removed","text":"`.px1/rules.json`. Do not change it to execute code from the PR head."},{"oldLine":147,"kind":"removed","text":""},{"oldLine":148,"kind":"removed","text":"Before each export, the workflow restores generated reports from the dedicated"},{"oldLine":149,"kind":"removed","text":"`px1-review-reports` branch. It overlays the new `reviews/\u003chead-sha\u003e/index.html`,"},{"oldLine":150,"kind":"removed","text":"publishes the complete site, then updates that artifact-only branch through a"},{"oldLine":151,"kind":"removed","text":"temporary Git index. Historical commit links therefore remain valid across"},{"oldLine":152,"kind":"removed","text":"deployments without mixing generated HTML into the source branch. The workflow"},{"oldLine":153,"kind":"removed","text":"validates that the history tree contains only regular"},{"oldLine":154,"kind":"removed","text":"`reviews/\u003c40-character-sha\u003e/index.html` files before extracting it."},{"oldLine":155,"kind":"removed","text":""},{"oldLine":156,"kind":"removed","text":"Static findings include a short hunk-local context block with line numbers and"},{"oldLine":157,"kind":"removed","text":"added, unchanged, or removed markers. The full unified diff remains available"},{"oldLine":158,"kind":"removed","text":"below the findings for reviewers who need broader context."},{"oldLine":159,"kind":"removed","text":""},{"oldLine":160,"kind":"removed","text":"Reviewers can acknowledge individual team-rule findings in the generated page."},{"oldLine":161,"kind":"removed","text":"Acknowledgements are intentionally browser-local and keyed by repository plus"},{"oldLine":162,"kind":"removed","text":"the exact head SHA, so they require no account and cannot leak onto a later PR"},{"oldLine":163,"kind":"removed","text":"revision. They are personal review progress, not a shared approval signal."},{"oldLine":164,"kind":"removed","text":""},{"oldLine":165,"kind":"removed","text":"## Suggested delivery order"},{"oldLine":166,"kind":"removed","text":""},{"oldLine":167,"kind":"removed","text":"1. Local snapshot contract, deep links, review disposition, and fake providers."},{"oldLine":168,"kind":"removed","text":"2. Self-hosted Action plus import endpoint and deployment documentation."},{"oldLine":169,"kind":"removed","text":"3. GitHub App, accounts, organization/repository access, and webhook handling."},{"oldLine":170,"kind":"removed","text":"4. Hosted storage, managed LLM provider, usage limits, and optional BYOK."},{"oldLine":171,"kind":"removed","text":"5. GitHub write-back for summaries, checks, comments, and approval status."},{"oldLine":172,"kind":"removed","text":""},{"oldLine":173,"kind":"removed","text":"The first milestone proves the review workflow without requiring hosting,"},{"oldLine":174,"kind":"removed","text":"GitHub credentials, or an LLM API key."},{"newLine":32,"kind":"added","text":"## Inputs"},{"newLine":33,"kind":"added","text":""},{"newLine":34,"kind":"added","text":"The generator reads only commit-pinned data:"},{"newLine":35,"kind":"added","text":""},{"newLine":36,"kind":"added","text":"- base and head Git commits;"},{"newLine":37,"kind":"added","text":"- `.px1/rules.json` from the head commit;"},{"newLine":38,"kind":"added","text":"- GitHub check runs collected for the head SHA; and"},{"newLine":39,"kind":"added","text":"- optional explanation JSON whose revision equals the head SHA."},{"newLine":40,"kind":"added","text":""},{"newLine":41,"kind":"added","text":"The report contains changed files, structured hunks, rule findings, attention"},{"newLine":42,"kind":"added","text":"signals, verification results, and optional explanations."},{"newLine":43,"kind":"added","text":""},{"newLine":44,"kind":"added","text":"## Security boundaries"},{"newLine":45,"kind":"added","text":""},{"newLine":46,"kind":"added","text":"- Workflow and Action code come from a trusted px1 release and the PR base."},{"newLine":47,"kind":"added","text":"- PR code is inspected as data and is never executed."},{"newLine":48,"kind":"added","text":"- Shell arguments are passed through environment variables and quoted arrays."},{"newLine":49,"kind":"added","text":"- Verification URLs must be HTTPS."},{"newLine":50,"kind":"added","text":"- Imported verification and explanation revisions must equal the report head."},{"newLine":51,"kind":"added","text":"- The static report has no backend and makes no network requests."},{"newLine":52,"kind":"added","text":"- Reviewer acknowledgement is browser-local progress, not approval."},{"newLine":53,"kind":"added","text":""},{"newLine":54,"kind":"added","text":"GitHub remains the authority for comments, requested changes, and approval."},{"newLine":55,"kind":"added","text":""},{"newLine":56,"kind":"added","text":"## Deliberately unsupported"},{"newLine":57,"kind":"added","text":""},{"newLine":58,"kind":"added","text":"- Local workspace servers"},{"newLine":59,"kind":"added","text":"- Snapshot import endpoints"},{"newLine":60,"kind":"added","text":"- Signed self-hosted links"},{"newLine":61,"kind":"added","text":"- px1 user accounts"},{"newLine":62,"kind":"added","text":"- Hosted snapshot storage"},{"newLine":63,"kind":"added","text":"- Agent-driven code edits"},{"newLine":64,"kind":"added","text":"- Mutable comments or approvals inside a static report"},{"newLine":65,"kind":"added","text":""},{"newLine":66,"kind":"added","text":"These features create a second product architecture and are not planned."}]}]},{"path":"docs/MVP_MANUAL_TEST.md","status":"D","diff":"diff --git a/docs/
