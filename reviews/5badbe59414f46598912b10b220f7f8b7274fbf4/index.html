\n+```\n+\n+CI can generate the nested `snapshot` object without parsing HTML:\n+\n+```bash\n+px1 export-review \\\n+  --base \"$BASE_SHA\" \\\n+  --head \"$HEAD_SHA\" \\\n+  --out ./site \\\n+  --snapshot-out ./snapshot.json\n+```\n+\n+Wrap `snapshot.json` with the GitHub owner, repository, and pull-request fields\n+shown below, then POST that envelope to the import endpoint.\n+\n+The request body is limited to 16 MiB and uses this versioned shape:\n+\n+```json\n+{\n+  \"version\": 1,\n+  \"provider\": \"github\",\n+  \"owner\": \"acme\",\n+  \"repository\": \"widgets\",\n+  \"pullRequest\": 42,\n+  \"base\": \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\",\n+  \"head\": \"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\",\n+  \"snapshot\": {\n+    \"version\": 1,\n+    \"repository\": \"widgets\",\n+    \"base\": \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\",\n+    \"head\": \"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\",\n+    \"generatedAt\": \"2026-10-03T12:00:00Z\",\n+    \"files\": [],\n+    \"ruleHits\": [],\n+    \"explanations\": [],\n+    \"verification\": {\n+      \"available\": false,\n+      \"checks\": []\n+    }\n+  }\n+}\n+```\n+\n+The top-level repository and commit identity must exactly match the embedded\n+snapshot. Owners, repository names, PR numbers, changed-file paths, findings,\n+explanations, and verification evidence are validated before anything is\n+stored. Unknown JSON fields are rejected.\n+\n+An initial import returns HTTP `201`; retrying identical content returns HTTP\n+`200`. Different content for the same repository, PR, and head SHA returns\n+HTTP `409`, preserving the immutable-link contract. Snapshots are stored with\n+user-only permissions under the px1 state directory, not in the checkout.\n+\n+The response contains the review path:\n+\n+```text\n+/github/acme/widgets/pull/42?sha=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\n+```\n+\n+Use an HTTPS reverse proxy and keep the service behind a VPN or private\n+network. The import endpoint is bearer-authenticated, but read-link\n+authentication is a separate roadmap item; possessing the review URL is\n+currently enough to read the imported report.\n","hunks":[{"id":"diff-5ccf14da5c5dc04e","header":"@@ -0,0 +1,78 @@","lines":[{"newLine":1,"kind":"added","text":"# Self-hosted review snapshot import"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"The live px1 server accepts a commit-pinned review snapshot from trusted CI:"},{"newLine":4,"kind":"added","text":""},{"newLine":5,"kind":"added","text":"```text"},{"newLine":6,"kind":"added","text":"POST /api/review/import"},{"newLine":7,"kind":"added","text":"Authorization: Bearer \u003cPX1_IMPORT_TOKEN\u003e"},{"newLine":8,"kind":"added","text":"Content-Type: application/json"},{"newLine":9,"kind":"added","text":"```"},{"newLine":10,"kind":"added","text":""},{"newLine":11,"kind":"added","text":"Configure a high-entropy token on the server and store the same value as a"},{"newLine":12,"kind":"added","text":"masked GitHub Actions secret:"},{"newLine":13,"kind":"added","text":""},{"newLine":14,"kind":"added","text":"```bash"},{"newLine":15,"kind":"added","text":"PX1_IMPORT_TOKEN='replace-with-a-random-secret' px1 -host 0.0.0.0 -port 7777 /workspace"},{"newLine":16,"kind":"added","text":"```"},{"newLine":17,"kind":"added","text":""},{"newLine":18,"kind":"added","text":"CI can generate the nested `snapshot` object without parsing HTML:"},{"newLine":19,"kind":"added","text":""},{"newLine":20,"kind":"added","text":"```bash"},{"newLine":21,"kind":"added","text":"px1 export-review \\"},{"newLine":22,"kind":"added","text":"  --base \"$BASE_SHA\" \\"},{"newLine":23,"kind":"added","text":"  --head \"$HEAD_SHA\" \\"},{"newLine":24,"kind":"added","text":"  --out ./site \\"},{"newLine":25,"kind":"added","text":"  --snapshot-out ./snapshot.json"},{"newLine":26,"kind":"added","text":"```"},{"newLine":27,"kind":"added","text":""},{"newLine":28,"kind":"added","text":"Wrap `snapshot.json` with the GitHub o :59,"kind":"added","text":"The top-level repository and commit identity must exactly match the embedded"},{"newLine":60,"kind":"added","text":"snapshot. Owners, repository names, PR numbers, changed-file paths, findings,"},{"newLine":61,"kind":"added","text":"explanations, and verification evidence are validated before anything is"},{"newLine":62,"kind":"added","text":"stored. Unknown JSON fields are rejected."},{"newLine":63,"kind":"added","text":""},{"newLine":64,"kind":"added","text":"An initial import returns HTTP `201`; retrying identical content returns HTTP"},{"newLine":65,"kind":"added","text":"`200`. Different content for the same repository, PR, and head SHA returns"},{"newLine":66,"kind":"added","text":"HTTP `409`, preserving the immutable-link contract. Snapshots are stored with"},{"newLine":67,"kind":"added","text":"user-only permissions under the px1 state directory, not in the checkout."},{"newLine":68,"kind":"added","text":""},{"newLine":69,"kind":"added","text":"The response contains the review path:"},{"newLine":70,"kind":"added","text":""},{"newLine":71,"kind":"added","text":"```text"},{"newLine":72,"kind":"added","text":"/github/acme/widgets/pull/42?sha=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},{"newLine":73,"kind":"added","text":"```"},{"newLine":74,"kind":"added","text":""},{"newLine":75,"kind":"added","text":"Use an HTTPS reverse proxy and keep the service behind a VPN or private"},{"newLine":76,"kind":"added","text":"network. The import endpoint is bearer-authenticated, but read-link"},{"newLine":77,"kind":"added","text":"authentication is a separate roadmap item; possessing the review URL is"},{"newLine":78,"kind":"added","text":"currently enough to read the imported report."}]}]},{"path":"docs/internals/architecture.md","status":"M","diff":"diff --git a/docs/internals/architecture.md b/docs/internals/architecture.md\nindex 9846d9f..861c62b 100644\n--- a/docs/internals/architecture.md\n+++ b/docs/internals/architecture.md\n@@ -60,7 +60,7 @@ f --git a/review_import.go b/review_import.go\nnew file mode 100644\nindex 0000000..3603159\n--- /dev/null\n+++ b/review_import.go\n@@ -0,0 +1,325 @@\n+package main\n+\n+import (\n+\t\"crypto/sha256\"\n+\t\"crypto/subtle\"\n+\t\"encoding/json\"\n+\t\"errors\"\n+\t\"fmt\"\n+\t\"io\"\n+\t\"mime\"\n+\t\"net/http\"\n+\t\"os\"\n+\t\"path/filepath\"\n+\t\"strconv\"\n+\t\"strings\"\n+\t\"sync\"\n+)\n+\n+const (\n+\treviewImportVersion  = 1\n+\treviewImportMaxBytes = 16 \u003c\u003c 20\n+\treviewImportTokenEnv = \"PX1_IMPORT_TOKEN\"\n+\treviewImportMaxFiles = 5000\n+)\n+\n+var errReviewSnapshotConflict = errors.New(\"a different snapshot already exists for this repository, pull request, and head SHA\")\n+\n+// reviewSnapshotImport is the wire and persistence format shared with a\n+// self-hosted CI publisher. Identity is duplicated inside Snapshot on purpose:\n+// imports are rejected unless the routing envelope and rendered report agree.\n+type reviewSnapshotImport struct {\n+\tVersion     int                `json:\"version\"`\n+\tProvider    string             `json:\"provider\"`\n+\tOwner       string             `json:\"owner\"`\n+\tRepository  string             `json:\"repository\"`\n+\tPullRequest int                `json:\"pullRequest\"`\n+\tBase        string             `json:\"base\"`\n+\tHead        string             `json:\"head\"`\n+\tSnapshot    staticReviewReport `json:\"snapshot\"`\n+}\n+\n+type reviewSnapshotStore struct {\n+\troot string\n+\tmu   sync.RWMutex\n+}\n+\n+func reviewSnapshotRoot() string {\n+\tsessions := reviewStateRoot()\n+\tif sessions == \"\" {\n+\t\treturn \"\"\n+\t}\n+\treturn filepath.Join(filepath.Dir(sessions), \"review-snapshots\")\n+}\n+\n+func newReviewSnapshotStore(root string) *reviewSnapshotStore {\n+\treturn \u0026reviewSnapshotStore{root: root}\n+}\n+\n+func (s *reviewSnapshotStore) snapshotPath(owner, repository string, pullRequest int, head string) string {\n+\treturn filepath.Join(s.root, strings.ToLower(owner), strings.ToLower(repository), strconv.Itoa(pullRequest), head+\".json\")\n+}\n+\n+// Save preserves the immutable-link contract. Repeating the same import is\n+// idempotent, while different content at the same repository/PR/head is a\n+// conflict rather than a silent replacement.\n+func (s *reviewSnapshotStore) Save(in reviewSnapshotImport) (bool, error) {\n+\tif s == nil || s.root == \"\" {\n+\t\treturn false, errors.New(\"cannot determine px1 snapshot directory\")\n+\t}\n+\tb, err := json.MarshalIndent(in, \"\", \"  \")\n+\tif err != nil {\n+\t\treturn false, err\n+\t}\n+\tpath := s.snapshotPath(in.Owner, in.Repository, in.PullRequest, in.Head)\n+\ts.mu.Lock()\n+\tdefer s.mu.Unlock()\n+\texisting, err := os.ReadFile(path)\n+\tif err == nil {\n+\t\tif string(existing) == string(b) {\n+\t\t\treturn false, nil\n+\t\t}\n+\t\treturn false, errReviewSnapshotConflict\n+\t}\n+\tif !errors.Is(err, os.ErrNotExist) {\n+\t\treturn false, err\n+\t}\n+\tcreated, err := writeImmutable(path, b, 0o600)\n+\tif err == nil \u0026\u0026 created {\n+\t\treturn true, nil\n+\t}\n+\tif err != nil \u0026\u0026 !errors.Is(err, os.ErrExist) {\n+\t\treturn false, err\n+\t}\n+\t// Another px1 process may have won the exclusive publish after our first\n+\t// read. Compare its complete file rather than replacing it.\n+\texisting, err = os.ReadFile(path)\n+\tif err != nil {\n+\t\treturn false, err\n+\t}\n+\tif string(existing) == string(b) {\n+\t\treturn false, nil\n+\t}\n+\treturn false, errReviewSnapshotConflict\n+}\n+\n+// writeImmutable publishes a complete file only when its destination does not\n+// exist. Linking a fully written temporary file keeps the operation atomic\n+// across multiple px1 processes sharing the same state directory.\n+func writeImmutable(path string, b []byte, mode os.FileMode) (bool, error) {\n+\tif err := os.MkdirAll(filepath.Dir(path), 0o700); err != nil {\n+\t\treturn false, err\n+\t}\n+\ttmp, err := os.CreateTemp(filepath.Dir(path), \".px1-import-\")\n+\tif err != nil {\n+\t\treturn false, err\n+\t}\n+\ttmpName := tmp.Name()\n+\tdefer os.Remove(tmpName)\n+\tif _, err = tmp.Write(b); err == nil {\n+\t\terr = tmp.Chmod(mode)\n+\t}\n+\tif closeErr := tmp.Close(); err == nil {\n+\t\terr = closeErr\n+\t}\n+\tif err != nil {\n+\t\treturn false, err\n+\t}\n+\tif err := os.Link(tmpName, path); err != nil {\n+\t\treturn false, err\n+\t}\n+\treturn true, nil\n+}\n+\n+func (s *reviewSnapshotStore) Load(target githubReviewTarget) (staticReviewReport, bool, error) {\n+\tif s == nil || s.root == \"\" {\n+\t\treturn staticReviewReport{}, false, nil\n+\t}\n+\tpath := s.snapshotPath(target.Owner, target.Repository, target.PullRequest, target.Head)\n+\ts.mu.RLock()\n+\tb, err := os.ReadFile(path)\n+\ts.mu.RUnlock()\n+\tif errors.Is(err, os.ErrNotExist) {\n+\t\treturn staticReviewReport{}, false, nil\n+\t}\n+\tif err != nil {\n+\t\treturn staticReviewReport{}, false, err\n+\t}\n+\tvar imported reviewSnapshotImport\n+\tif err := json.Unmarshal(b, \u0026imported); err != nil {\n+\t\treturn staticReviewReport{}, false, fmt.Errorf(\"invalid stored snapshot: %w\", err)\n+\t}\n+\tif err := validateReviewSnapshotImport(\u0026imported); err != nil {\n+\t\treturn staticReviewReport{}, false, fmt.Errorf(\"invalid stored snapshot: %w\", err)\n+\t}\n+\tif !strings.EqualFold(imported.Owner, target.Owner) || !strings.EqualFold(imported.Repository, target.Repository) || imported.PullRequest != target.PullRequest || imported.Head != target.Head {\n+\t\treturn staticReviewReport{}, false, errors.New(\"stored snapshot identity does not match review link\")\n+\t}\n+\treturn imported.Snapshot, true, nil\n+}\n+\n+func (s *Server) handleReviewImport(w http.ResponseWriter, r *http.Request) {\n+\tif r.Method != http.MethodPost {\n+\t\tw.Header().Set(\"Allow\", http.MethodPost)\n+\t\tfail(w, http.StatusMethodNotAllowed, \"POST only\")\n+\t\treturn\n+\t}\n+\tif !authorizeReviewImport(w, r) {\n+\t\treturn\n+\t}\n+\tmediaType, _, err := mime.ParseMediaType(r.Header.Get(\"Content-Type\"))\n+\tif err != nil || mediaType != \"application/json\" {\n+\t\tfail(w, http.StatusUnsupportedMediaType, \"Content-Type must be application/json\")\n+\t\treturn\n+\t}\n+\tr.Body = http.MaxBytesReader(w, r.Body, reviewImportMaxBytes)\n+\tdecoder := json.NewDecoder(r.Body)\n+\tdecoder.DisallowUnknownFields()\n+\tvar imported reviewSnapshotImport\n+\tif err := decoder.Decode(\u0026imported); err != nil {\n+\t\tvar tooLarge *http.MaxBytesError\n+\t\tif errors.As(err, \u0026tooLarge) {\n+\t\t\tfail(w, http.StatusRequestEntityTooLarge, fmt.Sprintf(\"snapshot exceeds %d bytes\", reviewImportMaxBytes))\n+\t\t\treturn\n+\t\t}\n+\t\tfail(w, http.StatusBadRequest, \"invalid snapshot JSON: \"+err.Error())\n+\t\treturn\n+\t}\n+\tif err := decoder.Decode(\u0026struct{}{}); !errors.Is(err, io.EOF) {\n+\t\tfail(w, http.StatusBadRequest, \"request body must contain exactly one JSON object\")\n+\t\treturn\n+\t}\n+\tif err := validateReviewSnapshotImport(\u0026imported); err != nil {\n+\t\tfail(w, http.StatusBadRequest, err.Error())\n+\t\treturn\n+\t}\n+\tcreated, err := s.snapshots.Save(imported)\n+\tif err != nil {\n+\t\tif errors.Is(err, errReviewSnapshotConflict) {\n+\t\t\tfail(w, http.StatusConflict, err.Error())\n+\t\t\treturn\n+\t\t}\n+\t\tfail(w, http.StatusInternalServerError, \"store review snapshot: \"+err.Error())\n+\t\treturn\n+\t}\n+\tw.Header().Set(\"Content-Type\", \"application/json\")\n+\tif created {\n+\t\tw.WriteHeader(http.StatusCreated)\n+\t}\n+\twriteJSON(w, map[string]any{\n+\t\t\"imported\": created,\n+\t\t\"path\":     fmt.Sprintf(\"/github/%s/%s/pull/%d?sha=%s\", imported.Owner, imported.Repository, imported.PullRequest, imported.Head),\n+\t\t\"target\": githubReviewTarget{\n+\t\t\tProvider: \"github\", Owner: imported.Owner, Repository: imported.Repository,\n+\t\t\tPullRequest: imported.PullRequest, Head: imported.Head,\n+\t\t},\n+\t})\n+}\n+\n+func authorizeReviewImport(w http.ResponseWriter, r *http.Request) bool {\n+\texpected := strings.TrimSpace(os.Getenv(reviewImportTokenEnv))\n+\tif expected == \"\" {\n+\t\tfail(w, http.StatusServiceUnavailable, reviewImportTokenEnv+\" is not configured\")\n+\t\treturn false\n+\t}\n+\tconst prefix = \"Bearer \"\n+\theader := r.Header.Get(\"Authorization\")\n+\tif !strings.HasPrefix(header, prefix) || !constantTimeStringEqual(strings.TrimSpace(strings.TrimPrefix(header, prefix)), expected) {\n+\t\tw.Header().Set(\"WWW-Authenticate\", \"Bearer\")\n+\t\tfail(w, http.StatusUnauthorized, \"invalid import token\")\n+\t\treturn false\n+\t}\n+\treturn true\n+}\n+\n+func constantTimeStringEqual(left, right string) bool {\n+\tleftHash := sha256.Sum256([]byte(left))\n+\trightHash := sha256.Sum256([]byte(right))\n+\treturn subtle.ConstantTimeCompare(leftHash[:], rightHash[:]) == 1\n+}\n+\n+func validateReviewSnapshotImport(in *reviewSnapshotImport) error {\n+\tif in.Version != reviewImportVersion {\n+\t\treturn fmt.Errorf(\"unsupported import version %d\", in.Version)\n+\t}\n+\tif in.Provider != \"github\" {\n+\t\treturn errors.New(\"provider must be github\")\n+\t}\n+\tif !validGitHubOwner(in.Owner) {\n+\t\treturn errors.New(\"import has an invalid GitHub owner\")\n+\t}\n+\tif !validGitHubRepository(in.Repository) {\n+\t\treturn errors.New(\"import has an invalid GitHub repository\")\n+\t}\n+\tif in.PullRequest \u003c= 0 {\n+\t\treturn errors.New(\"import has an invalid pull request number\")\n+\t}\n+\tin.Owner = strings.ToLower(in.Owner)\n+\tin.Repository = strings.ToLower(in.Repository)\n+\tin.Base = strings.ToLower(in.Base)\n+\tin.Head = strings.ToLower(in.Head)\n+\tif !validRevision(in.Base) || !validRevision(in.Head) {\n+\t\treturn errors.New(\"base and head must be full 40-character commit SHAs\")\n+\t}\n+\treport := \u0026in.Snapshot\n+\treport.Repository = strings.ToLower(report.Repository)\n+\treport.Base = strings.ToLower(report.Base)\n+\treport.Head = strings.ToLower(report.Head)\n+\tif report.Version != 1 {\n+\t\treturn fmt.Errorf(\"unsupported snapshot version %d\", report.Version)\n+\t}\n+\tif !strings.EqualFold(report.Repository, in.Repository) {\n+\t\treturn errors.New(\"snapshot repository does not match import repository\")\n+\t}\n+\tif report.Base != in.Base || report.Head != in.Head {\n+\t\treturn errors.New(\"snapshot base and head must match the import envelope\")\n+\t}\n+\tif report.GeneratedAt.IsZero() {\n+\t\treturn errors.New(\"snapshot generatedAt is required\")\n+\t}\n+\tif len(report.Files) \u003e reviewImportMaxFiles {\n+\t\treturn fmt.Errorf(\"snapshot contains more than %d files\", reviewImportMaxFiles)\n+\t}\n+\tchanged := make(map[string]bool, len(report.Files))\n+\tfor i, file := range report.Files {\n+\t\tif !safeExplanationPath(file.Path) {\n+\t\t\treturn fmt.Errorf(\"snapshot file %d has an invalid path\", i+1)\n+\t\t}\n+\t\tif changed[file.Path] {\n+\t\t\treturn fmt.Errorf(\"snapshot file %q is duplicated\", file.Path)\n+\t\t}\n+\t\tchanged[file.Path] = true\n+\t\tswitch file.Status {\n+\t\tcase \"A\", \"M\", \"D\", \"R\", \"C\", \"T\":\n+\t\tdefault:\n+\t\t\treturn fmt.Errorf(\"snapshot file %q has invalid status %q\", file.Path, file.Status)\n+\t\t}\n+\t}\n+\tif len(report.RuleHits) \u003e ruleMaxHits {\n+\t\treturn fmt.Errorf(\"snapshot contains more than %d rule findings\", ruleMaxHits)\n+\t}\n+\tseenHits := map[string]bool{}\n+\tfor i, hit := range report.RuleHits {\n+\t\tif hit.Key == \"\" || seenHits[hit.Key] {\n+\t\t\treturn fmt.Errorf(\"snapshot rule finding %d must have a unique key\", i+1)\n+\t\t}\n+\t\tseenHits[hit.Key] = true\n+\t\tif !changed[hit.Path] || hit.Line \u003c 1 || strings.TrimSpace(hit.RuleID) == \"\" || strings.TrimSpace(hit.Message) == \"\" {\n+\t\t\treturn fmt.Errorf(\"snapshot rule finding %q is invalid\", hit.Key)\n+\t\t}\n+\t}\n+\texplanations, err := validateStaticExplanations(report.Explanations, changed, \"snapshot\")\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\treport.Explanations = explanations\n+\tif report.Verification.Available {\n+\t\tverification := verifica section('Team-rule findings');if(!report.ruleHits.length)app.append(text('p','No team-rule findings on added lines.','ok'));for(const hit of report.ruleHits){const n=text('div');const heading=text('div');heading.className='finding-head';const message=text('div',hit.message);const ack=text('button','','ack');ack.type='button';const paintAcknowledged=()=>{const active=acknowledged.has(hit.key);n.className='finding'+(active?' acknowledged':'');ack.className='ack'+(active?' active':'');ack.textContent=active?'Acknowledged':'Acknowledge';ack.setAttribute('aria-pressed',String(active));if(openFindingValue)openFindingValue.textContent=String(openFindingCount())};ack.addEventListener('click',()=>{if(acknowledged.has(hit.key))acknowledged.delete(hit.key);else acknowledged.add(hit.key);persistAcknowledged();paintAcknowledged()});heading.append(message,ack);n.append(heading,text('div',hit.path+':'+hit.line+' — '),code(hit.text));if(hit.context?.length){const lines=hit.context.map((line)=>{const marker=line.kind==='added'?'+':line.kind==='removed'?'-':' ';const number=line.number?String(line.number).padStart(4,' '):'    ';return marker+' '+number+' | '+line.text}).join('\n');n.append(text('pre',lines));}paintAcknowledged();app.append(n)}
