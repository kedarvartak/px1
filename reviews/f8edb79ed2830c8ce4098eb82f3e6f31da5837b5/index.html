bed static_report/report.css static_report/report.js static_report/fonts/*.woff2\n+var staticReportAssets embed.FS\n+\n+func staticReportFontCSS() (string, error) {\n+\tfaces := []struct{ family, file, weight string }{\n+\t\t{\"Report Sans\", \"plex-sans-var.woff2\", \"400 600\"},\n+\t\t{\"Report Mono\", \"plex-mono-400.woff2\", \"400\"},\n+\t\t{\"Report Mono\", \"plex-mono-500.woff2\", \"500\"},\n+\t}\n+\tvar css strings.Builder\n+\tfor _, face := range faces {\n+\t\tb, err := fs.ReadFile(staticReportAssets, \"static_report/fonts/\"+face.file)\n+\t\tif err != nil {\n+\t\t\treturn \"\", err\n+\t\t}\n+\t\tfmt.Fprintf(\u0026css, \"@font-face{font-family:'%s';font-style:normal;font-weight:%s;font-display:swap;src:url(data:font/woff2;base64,%s) format('woff2')}\\n\",\n+\t\t\tface.family, face.weight, base64.StdEncoding.EncodeToString(b))\n+\t}\n+\treturn css.String(), nil\n+}\n+\n+func renderStaticReviewHTML(report staticReviewReport) ([]byte, error) {\n+\t// json.Marshal escapes \u003c, \u003e and \u0026 so the data cannot close its script tag.\n+\tdata, err := json.Marshal(report)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tfonts, err := staticReportFontCSS()\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tcss, err := fs.ReadFile(staticReportAssets, \"static_report/report.css\")\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tjs, err := fs.ReadFile(staticReportAssets, \"static_report/report.js\")\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tvar page bytes.Buffer\n+\tpage.WriteString(`\u003c!doctype html\u003e\n+\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n+\u003ctitle\u003eReview report\u003c/title\u003e\u003cstyle\u003e\n+`)\n+\tpage.WriteString(fonts)\n+\tpage.Write(css)\n+\tpage.WriteString(`\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cdiv id=\"app\"\u003e\u003cp class=\"noscript\"\u003eLoading review…\u003c/p\u003e\u003c/div\u003e\n+\u003cscript type=\"application/json\" id=\"report-data\"\u003e`)\n+\tpage.Write(data)\n+\tpage.WriteString(`\u003c/script\u003e\u003cscript\u003e\n+`)\n+\tpage.Write(js)\n+\tpage.WriteString(`\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e`)\n+\treturn page.Bytes(), nil\n+}\n+\n+// staticAttention runs the same attention rules as the local review session\n+// against the content of two commits, so a published report flags what the\n+// live review would.\n+func staticAttention(root, base, head string) ([]reviewAttentionFlag, error) {\n+\tout, err := exec.Command(\"git\", \"-C\", root, \"diff\", \"--raw\", \"--no-abbrev\", \"--find-renames\", \"-z\", base, head, \"--\").Output()\n+\tif err != nil {\n+\t\treturn nil, fmt.Errorf(\"list attention candidates: %w\", err)\n+\t}\n+\tcandidates, err := staticAttentionCandidates(root, base, head, out)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tflags := detectReviewAttention(candidates, nil).Flags\n+\tif flags == nil {\n+\t\tflags = []reviewAttentionFlag{}\n+\t}\n+\treturn flags, nil\n+}\n+\n+// staticAttentionCandidates parses `git diff --raw -z` output: a metadata\n+// record \":\u003cold mode\u003e \u003cnew mode\u003e \u003cold sha\u003e \u003cnew sha\u003e \u003cstatus\u003e\" followed by one\n+// path, or two for renames and copies.\n+func staticAttentionCandidates(root, base, head string, raw []byte) ([]attentionCandidate, error) {\n+\tfields := strings.Split(strings.TrimRight(string(raw), \"\\x00\"), \"\\x00\")\n+\tvar candidates []attentionCandidate\n+\tvar err error\n+\tremaining := int64(attentionMaxContentBytes)\n+\tfor i := 0; i \u003c len(fields) \u0026\u0026 len(candidates) \u003c attentionMaxFiles; {\n+\t\tmeta := strings.Fields(strings.TrimPrefix(fields[i], \":\"))\n+\t\tif len(meta) \u003c 5 {\n+\t\t\treturn nil, errors.New(\"unexpected git diff --raw output\")\n+\t\t}\n+\t\tstatus := meta[4][:1]\n+\t\toldPath, newPath := \"\", \"\"\n+\t\tif status == \"R\" || status == \"C\" {\n+\t\t\tif i+2 \u003e= len(fields) {\n+\t\t\t\treturn nil, errors.New(\"unexpected git diff --raw output\")\n+\t\t\t}\n+\t\t\toldPath, newPath = fields[i+1], fields[i+2]\n+\t\t\ti += 3\n+\t\t} else {\n+\t\t\tif i+1 \u003e= len(fields) {\n+\t\t\t\treturn nil, errors.New(\"unexpected git diff --raw output\")\n+\t\t\t}\n+\t\t\toldPath, newPath = fields[i+1], fields[i+1]\n+\t\t\ti += 2\n+\t\t}\n+\t\tdeleted := status == \"D\"\n+\t\tpath := newPath\n+\t\tif deleted {\n+\t\t\tpath = oldPath\n+\t\t}\n+\t\tcandidate := attentionCandidate{\n+\t\t\tPath:         filepath.ToSlash(path),\n+\t\t\tDeleted:      deleted,\n+\t\t\tBaselineMode: gitRawMode(meta[0]),\n+\t\t\tCurrentMode:  gitRawMode(meta[1]),\n+\t\t}\n+\t\tavailable := true\n+\t\tif status != \"A\" {\n+\t\t\tvar ok bool\n+\t\t\tif candidate.Baseline, ok, err = attentionBlob(root, base, oldPath, \u0026remaining); err != nil {\n+\t\t\t\treturn nil, err\n+\t\t\t}\n+\t\t\tavailable = available \u0026\u0026 ok\n+\t\t}\n+\t\tif !deleted {\n+\t\t\tvar ok bool\n+\t\t\tif candidate.Current, ok, err = attentionBlob(root, head, newPath, \u0026remaining); err != nil {\n+\t\t\t\treturn nil, err\n+\t\t\t}\n+\t\t\tavailable = available \u0026\u0026 ok\n+\t\t}\n+\t\tcandidate.ContentAvailable = available \u0026\u0026 !containsNUL(candidate.Baseline) \u0026\u0026 !containsNUL(candidate.Current)\n+\t\tcandidates = append(candidates, candidate)\n+\t}\n+\tsort.Slice(candidates, func(i, j int) bool { return candidates[i].Path \u003c candidates[j].Path })\n+\treturn candidates, nil\n+}\n+\n+// attentionBlob reads one file at a commit unless it is larger than the live\n+// review would read, or would push the total past the content budget. Skipped\n+// files still get the path-based rules; they only lose the content-based ones.\n+func attentionBlob(root, rev, path string, remaining *int64) ([]byte, bool, error) {\n+\tout, err := exec.Command(\"git\", \"-C\", root, \"cat-file\", \"-s\", rev+\":\"+filepath.ToSlash(path)).Output()\n+\tif err != nil {\n+\t\treturn nil, false, fmt.Errorf(\"size of %s at %s: %w\", path, shortRevision(rev), err)\n+\t}\n+\tsize, err := strconv.ParseInt(strings.TrimSpace(string(out)), 10, 64)\n+\tif err != nil {\n+\t\treturn nil, false, err\n+\t}\n+\tif size \u003e attentionMaxFileBytes || size \u003e *remaining {\n+\t\treturn nil, false, nil\n+\t}\n+\tb, found, err := gitFileAtCommit(root, rev, path)\n+\tif err != nil || !found {\n+\t\treturn nil, false, err\n+\t}\n+\t*remaining -= size\n+\treturn b, true, nil\n+}\n+\n+func gitRawMode(octal string) fs.FileMode {\n+\tn, err := strconv.ParseUint(octal, 8, 32)\n+\tif err != nil {\n+\t\treturn 0\n+\t}\n+\treturn fs.FileMode(n \u0026 0o777)\n+}\n","hunks":[{"id":"diff-59e305b008f08adb","header":"@@ -0,0 +1,187 @@","lines":[{"newLine":1,"kind":"added","text":"package main"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"added","text":"\t\"bytes\""},{"newLine":5,"kind":"added","text":"\t\"embed\""},{"newLine":6,"kind":"added","text":"\t\"encoding/base64\""},{"newLine":7,"kind":"added","text":"\t\"encoding/json\""},{"newLine":8,"kind":"added","text":"\t\"errors\""},{"newLine":9,"kind":"added","text":"\t\"fmt\""},{"newLine":10,"kind":"added","text":"\t\"io/fs\""},{"newLine":11,"kind":"added","text":"\t\"os/exec\""},{"newLine":12,"kind":"added","text":"\t\"path/filepath\""},{"newLine":13,"kind":"added","text":"\t\"sort\""},{"newLine":14,"kind":"added","text":"\t\"strconv\""},{"newLine":15,"kind":"added","text":"\t\"strings\""},{"newLine":16,"kind":"added","text":")"},{"newLine":17,"kind":"added","text":""},{"newLine":18,"kind":"added","text":"// The static report is one self-contained HTML file: stylesheet, script,"},{"newLine":19,"kind":"added","text":"// fonts and report JSON are all inlined, so a commit-pinned page loads with no"},{"newLine":20,"kind":"added","text":"// network requests and keeps working offline or from an archived Pages site."},{"newLine":21,"kind":"add m:#545450; --faint:#82827c;\n+  --brand:#2f2f2d;\n+  --ok:#2f6b4f; --attention:#8a5a14; --attention-tint:#efe3cb; --danger:#a1322c; --danger-tint:#f1d9d6;\n+  --add:#e3ebe4; --del:#ecdcd9;\n+  --fs-body:14px; --fs-small:12.5px; --fs-fine:11.5px; --fs-eyebrow:11px;\n+  --r-sm:4px; --r-md:6px; --r-lg:10px;\n+  color-scheme:light;\n+}\n+*{box-sizing:border-box}\n+body{background:var(--canvas);color:var(--ink);font:var(--fs-body)/1.5 var(--sans);margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}\n+button{font:inherit;color:inherit;cursor:pointer}\n+:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}\n+code,.mono{font-family:var(--mono);font-size:var(--fs-small)}\n+.eyebrow{font-size:var(--fs-eyebrow);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}\n+.muted{color:var(--dim)}\n+\n+/* Slim scrollbar: floating pill thumb, no track, darkens on hover. */\n+*{scrollbar-width:thin;scrollbar-color:var(--edge) transparent}\n+::-webkit-scrollbar{width:10px;height:10px}\n+::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}\n+::-webkit-scrollbar-thumb{background:var(--edge);border-radius:999px;border:3px solid transparent;background-clip:content-box;min-height:32px}\n+::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}\n+.fbody::-webkit-scrollbar{height:12px}\n+\n+.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}\n+.top-in{max-width:1480px;margin:0 auto;padding:14px 16px;display:grid;gap:8px}\n+.brand{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--dim);font-size:var(--fs-small)}\n+.range{font-family:var(--mono);font-size:var(--fs-small)}\n+.range b{font-weight:500;color:var(--ink)}\n+.headline{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}\n+h1{font:600 20px/1.3 var(--sans);margin:0;text-wrap:balance}\n+.verdict{d section('AI explanations');if(!report.explanations.length)app.append(text('p','No AI explanations were supplied for this commit.','muted'));for(const item of report.explanations){const n=text('div');n.className='explanation';const chip=text('button',item.title,'chip');chip.type='button';chip.setAttribute('aria-expanded','false');const where=text('span',' '+item.path+':'+item.lineStart+(item.lineEnd!==item.lineStart?'-'+item.lineEnd:''),'muted');const detail=text('p',item.summary);detail.hidden=true;chip.addEventListener('click',()=>{detail.hidden=!detail.hidden;chip.setAttribute('aria-expanded',String(!detail.hidden))});n.append(chip,where,detail);app.append(n)}
section('Verification');const v=text('div');v.className='card';if(report.verification.available){v.append(text('div','Verified by '+report.verification.source+' for '+report.verification.revision,'ok'));for(const check of report.verification.checks){const row=text('div',check.name+': '+check.status);if(check.url){row.append(text('span',' '),code(check.url))}v.append(row)}}else{v.append(text('div',report.verification.error||'No verification report is attached.','muted'))}app.append(v);
section('Changed files');if(!report.files.length)app.append(text('p','No changed files.','muted'));for(const file of report.files){const d=document.createElement('details'),s=text('summary',file.status+' '+file.path);d.append(s);if(file.hunks?.length){const diff=text('div');diff.className='diff';for(const hunk of file.hunks){const block=text('div');block.className='hunk';block.id=hunk.id;block.append(text('div',hunk.header,'hunk-head'));for(const line of hunk.lines){const row=text('div');row.className='diff-line '+line.kind;const marker=line.kind==='added'?'+':line.kind==='removed'?'-':' ';row.append(text('span',line.oldLine||'','gutter'),text('span',line.newLine||'','gutter'),text('span',marker,'mark'),text('span',line.text,'line-code'));block.append(row)}diff.append(block)}d.append(diff)}else if(file.diff){d.append(text('pre',file.diff))}else d.append(text('p','No textual diff available.','muted'));app.append(d)}
</script></body></html>
