/* Dark by default, light on request. Both palettes keep text, borders, additions,
   deletions, findings, and AI notes visibly distinct at a glance.
   Layout: top bar with verdict, left rail (queue + files), diff column with inline annotations, thin spine at the right edge. */
:root{
  --sans:'Report Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Report Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --canvas:#0b1118; --surface:#111a24; --well:#1b2836; --line:#2d3c4c; --edge:#5c7187;
  --ink:#f5f8fc; --dim:#c5d0dc; --faint:#91a3b5;
  --brand:#78b7ff;
  --ok:#5ee0a3; --attention:#ffd166; --attention-tint:#3b3016; --danger:#ff8580; --danger-tint:#422126;
  --add:#123823; --del:#421f27;
  --note:#ffe08a; --note-tint:#4a3a12;
  --ann:#0d151e;
  --fs-body:14px; --fs-small:12.5px; --fs-fine:11.5px; --fs-eyebrow:11px;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  color-scheme:dark;
}
/* Light is the alternate theme; dark is the default. */
:root[data-theme="light"]{
  --canvas:#e8eef5; --surface:#ffffff; --well:#e1e9f2; --line:#c2cfdd; --edge:#71869b;
  --ink:#0a1724; --dim:#30465a; --faint:#60758a;
  --brand:#075fca;
  --ok:#087a43; --attention:#8a4c00; --attention-tint:#fff0cb; --danger:#b42318; --danger-tint:#ffe2df;
  --add:#d9f3e3; --del:#ffe0de;
  --note:#7a4500; --note-tint:#fff0cb;
  --ann:#f3f7fb;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:var(--fs-body)/1.5 var(--sans);margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
code,.mono{font-family:var(--mono);font-size:var(--fs-small)}
.eyebrow{font-size:var(--fs-eyebrow);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--dim)}

/* Slim scrollbar: floating pill thumb, no track, darkens on hover. */
*{scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:999px;border:3px solid transparent;background-clip:content-box;min-height:32px}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}
.fbody::-webkit-scrollbar{height:12px}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{width:100%;padding:14px 16px;display:grid;gap:8px}
.brand{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--dim);font-size:var(--fs-small)}
.range{font-family:var(--mono);font-size:var(--fs-small)}
.range b{font-weight:500;color:var(--ink)}
.headline{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
h1{font:600 20px/1.3 var(--sans);margin:0;text-wrap:balance}
.verdict{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1.5px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap;background:var(--well);color:var(--dim);border:0}
.chip-note{background:var(--note-tint);color:var(--note)}
.chip-finding{background:var(--note-tint);color:var(--note);border-color:color-mix(in srgb,var(--note) 55%,var(--line))}
.chip-attention{background:var(--attention-tint);color:var(--attention)}
.chip-danger{background:var(--danger-tint);color:var(--danger)}
button.chip:hover{filter:brightness(1.12)}
.theme-btn{margin-left:auto;display:grid;place-items:center;width:32px;height:30px;padding:0;background:var(--well);border:1px solid var(--edge);border-radius:999px;font-size:18px;font-weight:600;line-height:1;color:var(--ink)}
.theme-btn:hover{border-color:var(--brand);color:var(--brand)}

.checks{border-top:1px solid var(--line);background:var(--canvas)}
.checks-in{width:100%;padding:10px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px}
.checks-note{width:100%;padding:10px 16px;color:var(--dim);font-size:var(--fs-small)}
.check{display:flex;gap:8px;align-items:baseline;font-size:var(--fs-small);min-width:0;color:inherit;text-decoration:none}
a.check:hover .name{text-decoration:underline}
.check .dot{flex:none;width:7px;height:7px;border-radius:50%;transform:translateY(-1px);background:var(--edge)}
.check .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check .st{margin-left:auto;color:var(--faint);flex:none}
.check.failed .dot{background:var(--danger)}.check.failed .st{color:var(--danger)}
.check.running .dot,.check.queued .dot{background:var(--attention)}

.wrap{position:relative;width:100%;padding:20px 16px;display:grid;grid-template-columns:var(--rail-w,288px) minmax(0,1fr) 10px;gap:24px;align-items:start}
.resize-handle{position:absolute;z-index:6;top:0;bottom:0;left:calc(16px + var(--rail-w,288px) + 4px);width:16px;cursor:col-resize;touch-action:none;display:flex;justify-content:center}
.resize-handle .grip{width:2px;height:100%;border-radius:2px;background:transparent;transition:background .15s}
.resize-handle:hover .grip,.resize-handle.active .grip,.resize-handle:focus-visible .grip{background:var(--edge)}
.resize-handle.active .grip{background:var(--faint)}
.resize-handle:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
.rail{position:sticky;top:calc(var(--top-h,140px) + 16px);max-height:calc(100vh - var(--top-h,140px) - 32px);overflow:auto;display:flex;flex-direction:column;gap:18px;padding-right:4px}
.rail-tools{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:7px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 5px 16px color-mix(in srgb,var(--canvas) 76%,transparent)}
.rail-tools-label{margin-right:auto;color:var(--dim);font-size:var(--fs-fine);font-weight:600}
.zoom-btn{display:grid;place-items:center;width:30px;height:28px;padding:0;border:1px solid var(--edge);border-radius:var(--r-md);background:var(--well);color:var(--ink);font:700 18px/1 var(--sans)}
.zoom-btn:hover{border-color:var(--brand);color:var(--brand)}
.zoom-status{min-width:44px;color:var(--dim);font:600 var(--fs-fine) var(--mono);text-align:center}
.rail section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.rail h2{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.rail h2 .count{font:400 var(--fs-fine) var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
.rail .empty{margin:0;color:var(--faint);font-size:var(--fs-small)}
.evidence-intro{margin:0 0 7px;color:var(--dim);font-size:var(--fs-fine);line-height:1.4}
.evidence-list{list-style:none;margin:0;padding:0}
.evidence-source{display:grid;gap:3px;padding:8px 0;border-top:1px solid var(--line)}
.evidence-source:first-child{border-top:0}
.evidence-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.evidence-label{font-size:var(--fs-small);font-weight:500}
.evidence-state{flex:none;border-radius:999px;padding:1px 6px;background:var(--well);color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.evidence-state.state-limited,.evidence-state.state-unavailable,.evidence-state.state-not-attached{background:var(--attention-tint);color:var(--attention)}
.evidence-detail,.evidence-revision,.evidence-limit{margin:0;color:var(--faint);font-size:var(--fs-fine);line-height:1.4}
.evidence-revision code{color:var(--dim)}
.evidence-limit{color:var(--attention)}
.evidence-missing{color:var(--attention);font-size:var(--fs-fine)}
.queue{list-style:none;margin:0;padding:0}
.inspection-list{list-style:none;margin:0;padding:0}
.inspection-link{display:grid;gap:2px;padding:7px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.inspection-list li:first-child .inspection-link{border-top:0;padding-top:2px}
.inspection-link .t{font-size:var(--fs-small);line-height:1.35}
.inspection-link .w{color:var(--faint);font:var(--fs-fine) var(--mono);overflow-wrap:anywhere}
.inspection-limit{margin:7px 0 0;color:var(--attention);font-size:var(--fs-fine)}
.qitem{display:grid;gap:2px;text-decoration:none;color:inherit;padding:8px 0;border-top:1px solid var(--line)}
.queue li:first-child .qitem{border-top:0;padding-top:2px}
.qitem .row{display:flex;gap:8px;align-items:center}
.qitem .t{font-size:13px;line-height:1.35;font-weight:500}
.qitem:hover .t{text-decoration:underline}
.qitem .w{font-family:var(--mono);font-size:var(--fs-fine);color:var(--faint);overflow-wrap:anywhere}
.qitem.done{opacity:.5}.qitem.done .t{text-decoration:line-through}
.seg{display:inline-flex;gap:10px;letter-spacing:0;text-transform:none}
.seg button{background:none;border:0;padding:0;font-size:var(--fs-small);font-weight:500;color:var(--faint)}
.seg button[aria-pressed="true"]{color:var(--brand)}
.files{list-style:none;margin:0;padding:0}
.file-search{box-sizing:border-box;width:calc(100% - 24px);margin:0 12px 10px;padding:8px 10px;border:1px solid var(--edge);border-radius:7px;background:var(--canvas);color:var(--ink);font:inherit}
.file-search::placeholder{color:var(--faint)}
.file-search:focus{outline:2px solid var(--brand);outline-offset:1px}
.file{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:6px 8px;margin:0 -8px;border-radius:var(--r-md);text-decoration:none;color:inherit;align-items:center}
.file:hover{background:var(--well)}
.file .p{font-family:var(--mono);font-size:var(--fs-small);overflow-wrap:anywhere}
.file .p b{font-weight:500}.file .p span{color:var(--faint)}
.file .m{display:flex;gap:4px}
.file .delta{grid-column:1/-1;font:var(--fs-fine) var(--mono);color:var(--faint)}
.mark{font:500 var(--fs-fine) var(--mono);padding:0 6px;border-radius:999px;background:var(--well);color:var(--dim)}
.mark.n{background:var(--note-tint);color:var(--note)}
.mark.f{background:var(--note-tint);color:var(--note)}
.mark.r{background:var(--danger-tint);color:var(--danger)}.mark.a{background:var(--attention-tint);color:var(--attention)}

.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.fsec{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);scroll-margin-top:calc(var(--top-h,140px) + 56px);overflow:clip}
.fhead{position:sticky;top:var(--top-h,140px);z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.fhead .path{font:500 13px var(--mono);overflow-wrap:anywhere}
.fhead .spacer{flex:1}
.fbody{overflow-x:auto}
.fbody pre{margin:0;padding:12px 16px;font:var(--fs-small)/1.6 var(--mono)}
.fbody .none{margin:0;padding:12px 16px;color:var(--faint)}
.hunk{min-width:max-content}
.hh{padding:4px 16px;font:var(--fs-small) var(--mono);color:var(--faint);background:var(--canvas);border-bottom:1px solid var(--line)}
.ln{display:grid;grid-template-columns:46px 46px 20px 1fr;font:var(--fs-small)/1.6 var(--mono)}
.ln .g{padding:0 8px;text-align:right;color:var(--faint);user-select:none}
.ln .mk{text-align:center;color:var(--faint);user-select:none}
.ln .c{padding:0 16px 0 4px;white-space:pre}
.ln.added{background:var(--add)}.ln.removed{background:var(--del)}

.ann{margin:0;padding:10px 16px 12px calc(46px + 46px + 20px + 4px);border-block:1px solid var(--line);background:var(--ann);position:sticky;left:0;width:100%;min-width:0;scroll-margin-top:calc(var(--top-h,140px) + 76px);font-family:var(--sans);white-space:normal}
.ann.note{padding-top:0;padding-bottom:0;background:var(--note-tint);border-color:color-mix(in srgb,var(--note) 45%,var(--line))}
.ann.note.filelevel{padding-block:10px}
.note-head{display:flex;gap:10px;align-items:center;width:100%;margin:0;padding:7px 0;background:none;border:0;text-align:left;color:var(--ink)}
.note-head:hover .note-title{text-decoration:underline}
.note-glyph{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;background:var(--note);color:var(--note-tint);font-size:11px;line-height:1}
.note-title{font-weight:500;min-width:0;overflow-wrap:anywhere}
.note-range{margin-left:auto;flex:none;font:var(--fs-fine) var(--mono);color:var(--note)}
.note-caret{flex:none;width:7px;height:7px;border:solid var(--note);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.note-head[aria-expanded="true"] .note-caret{transform:rotate(-135deg)}
.note-body{padding:0 0 12px 30px}
.note-body p{margin:0 0 6px;max-width:68ch;color:var(--ink)}
.ann.note .src{color:var(--note)}
.ann.filelevel{padding-left:16px;border-top:0}
.inspection-card{margin:10px;padding:12px;border:1px solid var(--edge);border-radius:var(--r-md);background:var(--surface);scroll-margin-top:calc(var(--top-h,140px) + 16px)}
.inspection-title{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.chip-question{background:var(--note-tint);color:var(--note)}
.inspection-label{display:block;margin-top:8px;color:var(--dim);font-size:var(--fs-fine);text-transform:uppercase;letter-spacing:.04em}
.inspection-observation,.inspection-question{margin:3px 0 0;font-size:var(--fs-small);line-height:1.45}
.inspection-question{font-weight:500}
.inspection-references{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:var(--fs-fine)}
.inspection-references a{color:var(--note)}
.inspection-references code{overflow-wrap:anywhere}
.ann-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ann-title{font-weight:600}
.ann p{margin:4px 0 0;max-width:68ch;color:var(--dim)}
.ann .ev{display:block;margin-top:7px;padding:4px 9px;background:var(--well);border-radius:var(--r-sm);width:fit-content;max-width:100%;overflow-x:auto;white-space:pre}
.ann .src{color:var(--faint);font-size:var(--fs-small)}
.ann .act{margin-left:auto}
.ann.done{opacity:.6}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:2px 10px;font-size:var(--fs-small);font-weight:500}
.btn:hover{border-color:var(--edge)}
.btn[aria-pressed="true"]{color:var(--ok)}
.btn:disabled{cursor:default;opacity:.5}
.review-summary{margin:0 0 8px;font-size:var(--fs-small)}
.review-hint{margin:8px 0 0;color:var(--dim);font-size:var(--fs-fine)}
.review-state{
  max-width:100%;min-width:150px;appearance:none;-webkit-appearance:none;
  background-color:var(--canvas);color:var(--ink);border:1px solid var(--edge);border-radius:var(--r-md);
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-repeat:no-repeat;background-size:5px 5px,5px 5px;
  padding:4px 36px 4px 12px;font:var(--fs-small) var(--sans)
}

.spine{position:sticky;top:var(--top-h,140px);height:calc(100vh - var(--top-h,140px) - 20px);border-radius:var(--r-sm);background:var(--well);overflow:hidden}
.spine a{position:absolute;left:0;right:0;height:4px}
.spine a{background:var(--edge)}
.spine .thumb{position:absolute;left:0;right:0;border-block:1px solid var(--dim);pointer-events:none}

.foot{width:100%;padding:6px 16px 40px;color:var(--faint);font-size:var(--fs-small)}
.foot a{color:var(--dim)}
.noscript{padding:24px 16px}

@media (max-width:1000px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .resize-handle{display:none}
  .spine{display:none}
  .rail{position:static;max-height:none;padding:0}
  .fhead{top:auto;position:static}
  .top{position:static}
  .ann{padding-left:16px;width:100%}
  .ln{grid-template-columns:36px 36px 18px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.trace-steps summary{cursor:pointer;color:var(--dim);font-size:var(--fs-fine);padding:6px 0}
.trace-list{margin:0;padding:0 0 0 18px;display:grid;gap:6px}
.trace-step{display:grid;gap:2px;min-width:0}
.trace-step.failed .evidence-label{color:var(--attention)}
.trace-args,.trace-preview{display:block;margin:0;max-height:120px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--faint);font-size:10.5px;background:var(--well);border-radius:4px;padding:3px 5px}

:"diff --git a/docs/DOCS_ROADMAP.md b/docs/DOCS_ROADMAP.md\nindex 7e62a70..9361694 100644\n--- a/docs/DOCS_ROADMAP.md\n+++ b/docs/DOCS_ROADMAP.md\n@@ -1,3 +1,14 @@\n+---\n+title: Self-evolving documentation: roadmap\n+section: operations\n+kind: narrative\n+status: planned\n+covers:\n+  - internal/docs/\n+  - docs_cmd.go\n+verified_at:\n+---\n+\n # Self-evolving documentation: roadmap\n \n Goal: px1's documentation is detailed, has a UI, and changes in the same pull\n@@ -51,3 +62,49 @@ Phases 1 to 4 are useful without any generation and ship first.\n - **Churn.** Edits are limited to pages the diff affects, and clean cases in the\n   evaluation set measure needless rewording.\n - **Cost.** About one extra review per pull request, under the same per-run cap.\n+\n+## Working with the pages (phase 1)\n+\n+Every page under `docs/` starts with front matter:\n+\n+```\n+---\n+title: Agentic review in CI\n+section: guides\n+kind: narrative\n+status: shipped\n+covers:\n+  - post_github.go\n+  - agentic-action/\n+verified_at:\n+---\n+```\n+\n+- `section` is one of start, guides, concepts, reference, operations, policies.\n+- `kind` is narrative or reference.\n+- `status` is shipped (usable now), built (code and tests exist, not deployed)\n+  or planned.\n+- `covers` lists the code the page describes: files, directories ending in\n+  `/`, or globs. Drift detection (phase 4) uses it to find the pages a diff\n+  affects.\n+- `verified_at` is the commit at which the page was last checked against that\n+  code. It is empty on every page today, because phase 0 did not read the\n+  prose line by line. Fill it in only after doing that check.\n+\n+`px1 docs manifest` writes `docs/manifest.json` (what the UI is built from) and\n+`docs/README.md` (an index of every page). Run it after adding a page or\n+changing front matter.\n+\n+`px1 docs check` fails on:\n+\n+- missing or invalid front matter;\n+- a relative link that does not resolve;\n+- a `covers` entry that names nothing;\n+- a m t)\n+\tif err == nil || !strings.Contains(out.String(), \"docs/PAGE.md:1: missing front matter\") {\n+\t\tt.Fatalf(\"err=%v out=%q\", err, out.String())\n+\t}\n+}\n","hunks":[{"id":"diff-fb7bf9bd18827263","header":"@@ -0,0 +1,40 @@","lines":[{"newLine":1,"kind":"added","text":"package main"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"added","text":"\t\"bytes\""},{"newLine":5,"kind":"added","text":"\t\"strings\""},{"newLine":6,"kind":"added","text":"\t\"testing\""},{"newLine":7,"kind":"added","text":""},{"newLine":8,"kind":"added","text":"\t\"px1/internal/docs\""},{"newLine":9,"kind":"added","text":")"},{"newLine":10,"kind":"added","text":""},{"newLine":11,"kind":"added","text":"// The repository's own documentation must pass its own check."},{"newLine":12,"kind":"added","text":"func TestRepositoryDocsPassCheck(t *testing.T) {"},{"newLine":13,"kind":"added","text":"\tproblems, err := docs.Check(\".\")"},{"newLine":14,"kind":"added","text":"\tif err != nil {"},{"newLine":15,"kind":"added","text":"\t\tt.Fatal(err)"},{"newLine":16,"kind":"added","text":"\t}"},{"newLine":17,"kind":"added","text":"\tfor _, problem := range problems {"},{"newLine":18,"kind":"added","text":"\t\tt.Error(problem)"},{"newLine":19,"kind":"added","text":"\t}"},{"newLine":20,"kind":"added","text":"}"},{"newLine":21,"kind":"added","text":""},{"newLine":22,"kind":"added","text":"func TestDocsCommandRejectsUnknownSubcommand(t *testing.T) {"},{"newLine":23,"kind":"added","text":"\tvar out bytes.Buffer"},{"newLine":24,"kind":"added","text":"\tif err := runDocs(nil, \u0026out); err == nil || !strings.Contains(err.Error(), \"usage\") {"},{"newLine":25,"kind":"added","text":"\t\tt.Fatalf(\"no arguments: %v\", err)"},{"newLine":26,"kind":"added","text":"\t}"},{"newLine":27,"kind":"added","text":"\tif err := runDocs([]string{\"publish\"}, \u0026out); err == nil || !strings.Contains(err.Error(), \"unknown docs command\") {"},{"newLine":28,"kind fmt.Errorf(\"docs check found %d problem(s)\", len(problems))\n+\t\t}\n+\t\tfmt.Fprintln(stdout, \"docs check: ok\")\n+\t\treturn nil\n+\tcase \"manifest\":\n+\t\tchanged, err := docs.WriteGenerated(*root)\n+\t\tif err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t\tfor _, rel := range changed {\n+\t\t\tfmt.Fprintln(stdout, \"wrote\", rel)\n+\t\t}\n+\t\tif len(changed) == 0 {\n+\t\t\tfmt.Fprintln(stdout, \"docs manifest: up to date\")\n+\t\t}\n+\t\treturn nil\n+\t}\n+\treturn fmt.Errorf(\"unknown docs command %q: use check or manifest\", args[0])\n+}\n","hunks":[{"id":"diff-b84f09fa7872ab49","header":"@@ -0,0 +1,52 @@","lines":[{"newLine":1,"kind":"added","text":"package main"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"added","text":"\t\"errors\""},{"newLine":5,"kind":"added","text":"\t\"flag\""},{"newLine":6,"kind":"added","text":"\t\"fmt\""},{"newLine":7,"kind":"added","text":"\t\"io\""},{"newLine":8,"kind":"added","text":"\t\"os\""},{"newLine":9,"kind":"added","text":""},{"newLine":10,"kind":"added","text":"\t\"px1/internal/docs\""},{"newLine":11,"kind":"added","text":")"},{"newLine":12,"kind":"added","text":""},{"newLine":13,"kind":"added","text":"// runDocs is \"px1 docs \u003ccheck|manifest\u003e\": the documentation's own checks."},{"newLine":14,"kind":"added","text":"func runDocs(args []string, stdout io.Writer) error {"},{"newLine":15,"kind":"added","text":"\tif len(args) == 0 {"},{"newLine":16,"kind":"added","text":"\t\treturn errors.New(\"usage: px1 docs \u003ccheck|manifest\u003e [--root dir]\")"},{"newLine":17,"kind":"added","text":"\t}"},{"newLine":18,"kind":"added","text":"\tfs := flag.NewFlagSet(\"docs \"+args[0], flag.ContinueOnError)"},{"newLine":19,"kind":"added","text":"\tfs.SetOutput(os.Stderr)"},{"newLine":20,"kind":"added","text":"\troot := fs.String(\"root\", \".\", \"repository root\")"},{"newLine":21,"kind":"added","text":"\tif err := fs.Parse(args[1:]); err != nil {"},{"newLine":22 s/check.go","status":"A","diff":"diff --git a/internal/docs/check.go b/internal/docs/check.go\nnew file mode 100644\nindex 0000000..a16b20a\n--- /dev/null\n+++ b/internal/docs/check.go\n@@ -0,0 +1,260 @@\n+package docs\n+\n+import (\n+\t\"encoding/json\"\n+\t\"errors\"\n+\t\"fmt\"\n+\t\"io/fs\"\n+\t\"os\"\n+\t\"path\"\n+\t\"path/filepath\"\n+\t\"regexp\"\n+\t\"sort\"\n+\t\"strings\"\n+)\n+\n+// ConfigFile holds what the checks cannot derive: code that is knowingly\n+// undocumented, and non-Go paths that need a page.\n+const ConfigFile = Dir + \"/docs.config.json\"\n+\n+// Config is docs/docs.config.json.\n+type Config struct {\n+\t// KnownGaps are code units with no page yet. The check fails when new\n+\t// code has no page and is not listed here, and when a listed gap has\n+\t// been closed or removed, so the list can only shrink honestly.\n+\tKnownGaps []string `json:\"known_gaps\"`\n+\t// ExtraUnits are paths outside Go packages that need a page, such as an\n+\t// action definition or the dashboard.\n+\tExtraUnits []string `json:\"extra_units\"`\n+\t// Exclude are directories that are not px1 code.\n+\tExclude []string `json:\"exclude\"`\n+}\n+\n+// LoadConfig reads the config. A missing file is an empty config.\n+func LoadConfig(root string) (Config, error) {\n+\tvar cfg Config\n+\tdata, err := os.ReadFile(filepath.Join(root, filepath.FromSlash(ConfigFile)))\n+\tif errors.Is(err, fs.ErrNotExist) {\n+\t\treturn cfg, nil\n+\t}\n+\tif err != nil {\n+\t\treturn cfg, err\n+\t}\n+\tif err := json.Unmarshal(data, \u0026cfg); err != nil {\n+\t\treturn cfg, fmt.Errorf(\"%s: %w\", ConfigFile, err)\n+\t}\n+\treturn cfg, nil\n+}\n+\n+// Check runs every check and returns the problems sorted by path and line.\n+func Check(root string) ([]Problem, error) {\n+\tcfg, err := LoadConfig(root)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tpages, problems, err := LoadPages(root)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tfor _, page := range pages {\n+\t\tproblems = append(problems, checkLinks(root, page)...)\n+\t\tproblems = append(problems, checkCovers(root, page)...)\n+\t}\n+\tunits, err := CodeUnits(root, cfg)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tproblems = append(problems, checkCoverage(root, pages, units, cfg)...)\n+\tproblems = append(problems, checkGenerated(root, pages)...)\n+\tsort.SliceStable(problems, func(i, j int) bool {\n+\t\tif problems[i].Path != problems[j].Path {\n+\t\t\treturn problems[i].Path \u003c problems[j].Path\n+\t\t}\n+\t\treturn problems[i].Line \u003c problems[j].Line\n+\t})\n+\treturn problems, nil\n+}\n+\n+var linkRE = regexp.MustCompile(`\\]\\(([^)\\s]+)(?:\\s+\"[^\"]*\")?\\)`)\n+\n+// checkLinks reports relative links that do not resolve to a file in the\n+// repository. Links inside fenced code are examples, not links.\n+func checkLinks(root string, page Page) []Problem {\n+\tvar problems []Problem\n+\tinFence := false\n+\tfor i, line := range strings.Split(page.body, \"\\n\") {\n+\t\tif strings.HasPrefix(strings.TrimSpace(line), \"```\") {\n+\t\t\tinFence = !inFence\n+\t\t\tcontinue\n+\t\t}\n+\t\tif inFence {\n+\t\t\tcontinue\n+\t\t}\n+\t\tfor _, m := range linkRE.FindAllStringSubmatch(line, -1) {\n+\t\t\ttarget := m[1]\n+\t\t\tif strings.Contains(target, \"://\") || strings.HasPrefix(target, \"mailto:\") || strings.HasPrefix(target, \"#\") {\n+\t\t\t\tcontinue\n+\t\t\t}\n+\t\t\ttarget, _, _ = strings.Cut(target, \"#\")\n+\t\t\tvar rel string\n+\t\t\tif strings.HasPrefix(target, \"/\") {\n+\t\t\t\trel = strings.TrimPrefix(target, \"/\")\n+\t\t\t} else {\n+\t\t\t\trel = path.Join(path.Dir(page.Path), target)\n+\t\t\t}\n+\t\t\tif rel == \"..\" || strings.HasPrefix(rel, \"../\") {\n+\t\t\t\tproblems = append(problems, Problem{page.Path, page.bodyStart + i, \"link leaves the repository: \" + m[1]})\n+\t\t\t\tcontinue\n+\t\t\t}\n+\t\t\tif _, err := os.Stat(filepath.Join(root, filepath.FromSlash(rel))); err != nil {\n+\t\t\t\tproblems = append(problems, Problem{page.Path, page.bodyStart + i, \"broken link: \" + m[1]})\n+\t\t\t}\n+\t\t}\n+\t}\n+\treturn problems\n+}\n+\n+// checkCovers reports covers entries that name nothing in the repository.\n+func checkCovers(root string, page Page) []Problem {\n+\tvar problems []Problem\n+\tfor _, entry := range page.Covers {\n+\t\tif entry == \"\" || strings.HasPrefix(entry, \"/\") || strings.Contains(entry, \"..\") {\n+\t\t\tproblems = append(problems, Problem{page.Path, 1, fmt.Sprintf(\"covers entry %q must be a path inside the repository\", entry)})\n+\t\t\tcontinue\n+\t\t}\n+\t\tif strings.ContainsAny(entry, \"*?[\") {\n+\t\t\tmatches, err := filepath.Glob(filepath.Join(root, filepath.FromSlash(entry)))\n+\t\t\tif err != nil || len(matches) == 0 {\n+\t\t\t\tproblems = append(problems, Problem{page.Path, 1, \"covers pattern matches nothing: \" + entry})\n+\t\t\t}\n+\t\t\tcontinue\n+\t\t}\n+\t\tinfo, err := os.Stat(filepath.Join(root, filepath.FromSlash(entry)))\n+\t\tswitch {\n+\t\tcase err != nil:\n+\t\t\tproblems = append(problems, Problem{page.Path, 1, \"covers a path that does not exist: \" + entry})\n+\t\tcase info.IsDir() != strings.HasSuffix(entry, \"/\"):\n+\t\t\tproblems = append(problems, Problem{page.Path, 1, \"covers entry must end in / exactly when it is a directory: \" + entry})\n+\t\t}\n+\t}\n+\treturn problems\n+}\n+\n+// CodeUnits lists what needs documentation: every Go package directory (as\n+// \"dir/\"), every non-test Go file of the root package (one command each, more\n+// or less), and the config's extra units.\n+func CodeUnits(root string, cfg Config) ([]string, error) {\n+\tskip := map[string]bool{Dir: true, \"node_modules\": true, \"testdata\": true, \"vendor\": true}\n+\tfor _, dir := range cfg.Exclude {\n+\t\tskip[strings.TrimSuffix(dir, \"/\")] = true\n+\t}\n+\tset := map[string]bool{}\n+\terr := filepath.WalkDir(root, func(p string, d fs.DirEntry, err error) error {\n+\t\tif err != nil {\n+\t\t\treturn err\n+\t\t}\n+\t\trel, _ := filepath.Rel(root, p)\n+\t\trel = filepath.ToSlash(rel)\n+\t\tif d.IsDir() {\n+\t\t\tif rel != \".\" \u0026\u0026 (strings.HasPrefix(d.Name(), \".\") || skip[d.Name()] || skip[rel]) {\n+\t\t\t\treturn filepath.SkipDir\n+\t\t\t}\n+\t\t\treturn nil\n+\t\t}\n+\t\tif !strings.HasSuffix(rel, \".go\") || strings.HasSuffix(rel, \"_test.go\") {\n+\t\t\treturn nil\n+\t\t}\n+\t\tif dir := path.Dir(rel); dir == \".\" {\n+\t\t\tset[rel] = true\n+\t\t} else {\n+\t\t\tset[dir+\"/\"] = true\n+\t\t}\n+\t\treturn nil\n+\t})\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tfor _, unit := range cfg.ExtraUnits {\n+\t\tset[unit] = true\n+\t}\n+\tunits := make([]string, 0, len(set))\n+\tfor unit := range set {\n+\t\tunits = append(units, unit)\n+\t}\n+\tsort.Strings(units)\n+\treturn units, nil\n+}\n+\n+// covered reports whether a covers entry describes a unit: the same path, a\n+// directory that contains the unit, a path inside the unit, or a glob that\n+// matches it.\n+func covered(unit, entry string) bool {\n+\tif unit == entry {\n+\t\treturn true\n+\t}\n+\tif strings.HasSuffix(entry, \"/\") \u0026\u0026 strings.HasPrefix(unit, entry) {\n+\t\treturn true\n+\t}\n+\tif strings.HasSuffix(unit, \"/\") \u0026\u0026 strings.HasPrefix(entry, unit) {\n+\t\treturn true\n+\t}\n+\tif strings.ContainsAny(entry, \"*?[\") {\n+\t\tif ok, _ := path.Match(entry, unit); ok {\n+\t\t\treturn true\n+\t\t}\n+\t}\n+\treturn false\n+}\n+\n+// checkCoverage enforces the gap policy: code needs a page or an entry in\n+// known_gaps, and known_gaps holds nothing that is covered or gone.\n+func checkCoverage(root string, pages []Page, units []string, cfg Config) []Problem {\n+\tisCovered := func(unit string) bool {\n+\t\tfor _, page := range pages {\n+\t\t\tfor _, entry := range page.Covers {\n+\t\t\t\tif covered(unit, entry) {\n+\t\t\t\t\treturn true\n+\t\t\t\t}\n+\t\t\t}\n+\t\t}\n+\t\treturn false\n+\t}\n+\tknown := map[string]bool{}\n+\tfor _, gap := range cfg.KnownGaps {\n+\t\tknown[gap] = true\n+\t}\n+\tisUnit := map[string]bool{}\n+\tvar problems []Problem\n+\tfor _, unit := range units {\n+\t\tisUnit[unit] = true\n+\t\tif !isCovered(unit) \u0026\u0026 !known[unit] {\n+\t\t\tproblems = append(problems, Problem{ConfigFile, 0, fmt.Sprintf(\"%s has no page: add it to a page's covers, or to known_gaps\", unit)})\n+\t\t}\n+\t}\n+\tfor _, gap := range cfg.KnownGaps {\n+\t\tswitch {\n+\t\tcase !isUnit[gap]:\n+\t\t\tproblems = append(problems, Problem{ConfigFile, 0, fmt.Sprintf(\"known gap %s is not a code unit any more: remove it\", gap)})\n+\t\tcase isCovered(gap):\n+\t\t\tproblems = append(problems, Problem{ConfigFile, 0, fmt.Sprintf(\"known gap %s now has a page: remove it\", gap)})\n+\t\t}\n+\t}\n+\tfor _, unit := range cfg.ExtraUnits {\n+\t\tif _, err := os.Stat(filepath.Join(root, filepath.FromSlash(unit))); err != nil {\n+\t\t\tproblems = append(problems, Problem{ConfigFile, 0, \"extra unit does not exist: \" + unit})\n+\t\t}\n+\t}\n+\treturn problems\n+}\n+\n+// checkGenerated reports a manifest or index that no longer matches the pages.\n+func checkGenerated(root string, pages []Page) []Problem {\n+\tvar problems []Problem\n+\tfor rel, want := range Generated(pages) {\n+\t\tgot, err := os.ReadFile(filepath.Join(root, filepath.FromSlash(rel)))\n+\t\tif err != nil || string(got) != want {\n+\t\t\tproblems = append(problems, Problem{rel, 0, \"out of date: run px1 docs manifest\"})\n+\t\t}\n+\t}\n+\treturn problems\n+}\n","hunks":[{"id":"diff-12b14865f49da51e","header":"@@ -0,0 +1,260 @@","lines":[{"newLine":1,"kind":"added","text":"package docs"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"added","text":"\t\"encoding/json\""},{"newLine":5,"kind":"added","text":"\t\"errors\""},{"newLine":6,"kind":"added","text":"\t\"fmt\""},{"newLine":7,"kind":"added","text":"\t\"io/fs\""},{"newLine":8,"kind":"added","text":"\t\"os\""},{"newLine":9,"kind":"added","text":"\t\"path\""},{"newLine":10,"kind":"added","text":"\t\"path/filepath\""},{"newLine":11,"kin e(filepath.Join(root, filepath.FromSlash(rel)))"},{"newLine":255,"kind":"added","text":"\t\tif err != nil || string(got) != want {"},{"newLine":256,"kind":"added","text":"\t\t\tproblems = append(problems, Problem{rel, 0, \"out of date: run px1 docs manifest\"})"},{"newLine":257,"kind":"added","text":"\t\t}"},{"newLine":258,"kind":"added","text":"\t}"},{"newLine":259,"kind":"added","text":"\treturn problems"},{"newLine":260,"kind":"added","text":"}"}]}]},{"path":"internal/docs/docs_test.go","status":"A","diff":"diff --git a/internal/docs/docs_test.go b/internal/docs/docs_test.go\nnew file mode 100644\nindex 0000000..3394d73\n--- /dev/null\n+++ b/internal/docs/docs_test.go\n@@ -0,0 +1,215 @@\n+package docs\n+\n+import (\n+\t\"os\"\n+\t\"path/filepath\"\n+\t\"strings\"\n+\t\"testing\"\n+)\n+\n+const goodFront = \"---\\ntitle: A page\\nsection: guides\\nkind: narrative\\nstatus: shipped\\ncovers:\\n  - tool.go\\n  - pkg/\\nverified_at:\\n---\\n\"\n+\n+func write(t *testing.T, root, rel, content string) {\n+\tt.Helper()\n+\tfull := filepath.Join(root, filepath.FromSlash(rel))\n+\tif err := os.MkdirAll(filepath.Dir(full), 0o755); err != nil {\n+\t\tt.Fatal(err)\n+\t}\n+\tif err := os.WriteFile(full, []byte(content), 0o644); err != nil {\n+\t\tt.Fatal(err)\n+\t}\n+}\n+\n+// repo is a small repository whose documentation passes the check.\n+func repo(t *testing.T) string {\n+\tt.Helper()\n+\troot := t.TempDir()\n+\twrite(t, root, \"tool.go\", \"package main\\n\")\n+\twrite(t, root, \"tool_test.go\", \"package main\\n\")\n+\twrite(t, root, \"pkg/a.go\", \"package pkg\\n\")\n+\twrite(t, root, \"docs/PAGE.md\", goodFront+\"\\n# A page\\n\\nSee [the other page](OTHER.md#part) and [the site](https://example.com).\\n\")\n+\twrite(t, root, \"docs/OTHER.md\", strings.Replace(goodFront, \"covers:\\n  - tool.go\\n  - pkg/\\n\", \"covers: []\\n\", 1)+\"\\n# Other\\n\")\n+\tif _, err := WriteGenerated(root); err != nil {\n+\t\tt.Fatal(err)\n+\t}\n+\treturn root\n+}\n+\n+func messages(t *testing.T, root string) string {\n+\tt.Helper()\n+\tproblems, err := Check(root)\n+\tif err != nil {\n+\t\tt.Fatal(err)\n+\t}\n+\tvar lines []string\n+\tfor _, problem := range problems {\n+\t\tlines = append(lines, problem.String())\n+\t}\n+\treturn strings.Join(lines, \"\\n\")\n+}\n+\n+func TestCleanRepositoryPasses(t *testing.T) {\n+\tif got := messages(t, repo(t)); got != \"\" {\n+\t\tt.Fatalf(\"unexpected problems:\\n%s\", got)\n+\t}\n+}\n+\n+func TestParsePageReadsFrontMatter(t *testing.T) {\n+\tpage, problems := parsePage(\"docs/PAGE.md\", strings.Replace(goodFront, \"verified_at:\", \"verified_at: 7905993\", 1)+\"body\\n\")\n+\tif len(problems) != 0 {\n+\t\tt.Fatalf(\"problems: %v\", problems)\n+\t}\n+\tif page.Title != \"A page\" || page.Section != \"guides\" || page.Kind != \"narrative\" || page.Status != \"shipped\" || page.VerifiedAt != \"7905993\" {\n+\t\tt.Fatalf(\"page = %+v\", page)\n+\t}\n+\tif len(page.Covers) != 2 || page.Covers[0] != \"tool.go\" || page.Covers[1] != \"pkg/\" {\n+\t\tt.Fatalf(\"covers = %v\", page.Covers)\n+\t}\n+\tif page.body != \"body\\n\" || page.bodyStart != 11 {\n+\t\tt.Fatalf(\"body = %q at line %d\", page.body, page.bodyStart)\n+\t}\n+}\n+\n+func TestParsePageRejectsBadFrontMatter(t *testing.T) {\n+\tcases := map[string]struct{ text, want string }{\n+\t\t\"none\":       {\"# Title\\n\", \"missing front matter\"},\n+\t\t\"unclosed\":   {\"---\\ntitle: x\\n\", \"not closed\"},\n+\t\t\"missing\":    {strings.Replace(goodFront, \"status: shipped\\n\", \"\", 1), \"missing status\"},\n+\t\t\"bad status\": {strings.Replace(goodFront, \"shipped\", \"live\", 1), `status is \"live\"`},\n+\t\t\"bad kind\":   {strings.Replace(goodFront, \"narrative\", \"essay\", 1), `kind is \"essay\"`},\n+\t\t\"unknown\":    {strings.Replace(goodFront, \"status:\", \"owner: me\\nstatus:\", 1), \"unknown key owner\"},\n+\t\t\"duplicate\":  {strings.Replace(goodFront, \"status:\", \"title: again\\nstatus:\", 1), \"duplicate key title\"},\n+\t\t\"bad commit\": {strings.Replace(goodFront, \"verified_at:\", \"verified_at: yesterday\", 1), \"verified_at must be\"},\n+\t\t\"stray item\": {strings.Replace(goodFront, \"status: shipped\\n\", \"status: shipped\\n  - stray\\n\", 1), \"list item outside covers\"},\n+\t\t\"no title\":   {strings.Replace(goodFront, \"title: A page\", \"title:\", 1), \"title is empty\"},\n+\t}\n+\tfor name, c := range cases {\n+\t\t_, problems := parsePage(\"docs/PAGE.md\", c.text)\n+\t\tfound := false\n+\t\tfor _, problem := range problems {\n+\t\t\tfound = found || strings.Contains(problem.Message, c.want)\n+\t\t}\n+\t\tif !found {\n+\t\t\tt.Errorf(\"%s: want %q in %v\", name, c.want, problems)\n+\t\t}\n+\t}\n+}\n+\n+func TestBrokenLinkIsReportedWithItsLine(t *testing.T) {\n+\troot := repo(t)\n+\twrite(t, root, \"docs/PAGE.md\", goodFront+\"\\n# A page\\n\\n[gone](MISSING.md)\\n\\n```\\n[example](ALSO_MISSING.md)\\n```\\n[out](../../elsewhere.md)\\n\")\n+\tgot := messages(t, root)\n+\tif !strings.Contains(got, \"docs/PAGE.md:14: broken link: MISSING.md\") {\n+\t\tt.Errorf(\"missing broken link:\\n%s\", got)\n+\t}\n+\tif strings.Contains(got, \"ALSO_MISSING\") {\n+\t\tt.Errorf(\"a link inside a code fence was checked:\\n%s\", got)\n+\t}\n+\tif !strings.Contains(got, \"link leaves the repository\") {\n+\t\tt.Errorf(\"missing escape report:\\n%s\", got)\n+\t}\n+}\n+\n+func TestCoversMustNameRealPaths(t *testing.T) {\n+\troot := repo(t)\n+\tfront := strings.Replace(goodFront, \"  - pkg/\\n\", \"  - pkg\\n  - gone.go\\n  - nothing/*.go\\n  - ../outside\\n\", 1)\n+\twrite(t, root, \"docs/PAGE.md\", front+\"\\n# A page\\n\")\n+\tgot := messages(t, root)\n+\tfor _, want := range []string{\n+\t\t\"must end in / exactly when it is a directory: pkg\",\n+\t\t\"does not exist: gone.go\",\n+\t\t\"matches nothing: nothing/*.go\",\n+\t\t`\"../outside\" must be a path inside the repository`,\n+\t} {\n+\t\tif !strings.Contains(got, want) {\n+\t\t\tt.Errorf(\"want %q in:\\n%s\", want, got)\n+\t\t}\n+\t}\n+}\n+\n+func TestNewCodeNeedsAPageOrAKnownGap(t *testing.T) {\n+\troot := repo(t)\n+\twrite(t, root, \"newcmd.go\", \"package main\\n\")\n+\twrite(t, root, \"internal/fresh/x.go\", \"package fresh\\n\")\n+\twrite(t, root, \"node_modules/dep/x.go\", \"package dep\\n\")\n+\tgot := messages(t, root)\n+\tif !strings.Contains(got, \"newcmd.go has no page\") || !strings.Contains(got, \"internal/fresh/ has no page\") {\n+\t\tt.Fatalf(\"uncovered code was not reported:\\n%s\", got)\n+\t}\n+\tif strings.Contains(got, \"node_modules\") || strings.Contains(got, \"tool_test.go\") {\n+\t\tt.Fatalf(\"dependencies or tests were treated as code units:\\n%s\", got)\n+\t}\n+\n+\twrite(t, root, ConfigFile, `{\"known_gaps\":[\"newcmd.go\",\"internal/fresh/\"]}`)\n+\tif got := messages(t, root); got != \"\" {\n+\t\tt.Fatalf(\"known gaps still reported:\\n%s\", got)\n+\t}\n+}\n+\n+func TestKnownGapsCannotGoStale(t *testing.T) {\n+\troot := repo(t)\n+\twrite(t, root, ConfigFile, `{\"known_gaps\":[\"pkg/\",\"removed.go\"],\"extra_units\":[\"action.yml\"]}`)\n+\tgot := messages(t, root)\n+\tfor _, want := range []string{\n+\t\t\"known gap pkg/ now has a page\",\n+\t\t\"known gap removed.go is not a code unit any more\",\n+\t\t\"action.yml has no page\",\n+\t\t\"extra unit does not exist: action.yml\",\n+\t} {\n+\t\tif !strings.Contains(got, want) {\n+\t\t\tt.Errorf(\"want %q in:\\n%s\", want, got)\n+\t\t}\n+\t}\n+}\n+\n+func TestCoveredMatching(t *testing.T) {\n+\tcases := []struct {\n+\t\tunit, entry string\n+\t\twant        bool\n+\t}{\n+\t\t{\"tool.go\", \"tool.go\", true},\n+\t\t{\"internal/a/\", \"internal/\", true},\n+\t\t{\"internal/a/\", \"internal/a/file.go\", true},\n+\t\t{\"eval_run.go\", \"eval_*.go\", true},\n+\t\t{\"internal/ab/\", \"internal/a/\", false},\n+\t\t{\"tool.go\", \"tool.go.bak\", false},\n+\t\t{\"internal/a/\", \"internal/a\", false},\n+\t}\n+\tfor _, c := range cases {\n+\t\tif got := covered(c.unit, c.entry); got != c.want {\n+\t\t\tt.Errorf(\"covered(%q, %q) = %v\", c.unit, c.entry, got)\n+\t\t}\n+\t}\n+}\n+\n+func TestStaleManifestAndIndexAreReported(t *testing.T) {\n+\troot := repo(t)\n+\twrite(t, root, \"docs/OTHER.md\", strings.Replace(goodFront, \"covers:\\n  - tool.go\\n  - pkg/\\n\", \"covers: []\\n\", 1)+\"\\n# Renamed\\n\")\n+\tif got := messages(t, root); got != \"\" {\n+\t\tt.Fatalf(\"a body change must not make the manifest stale:\\n%s\", got)\n+\t}\n+\twrite(t, root, \"docs/THIRD.md\", strings.Replace(goodFront, \"A page\", \"Third\", 1)+\"\\n# Third\\n\")\n+\tgot := messages(t, root)\n+\tif !strings.Contains(got, \"docs/manifest.json: out of date\") || !strings.Contains(got, \"docs/README.md: out of date\") {\n+\t\tt.Fatalf(\"stale generated files not reported:\\n%s\", got)\n+\t}\n+\tchanged, err := WriteGenerated(root)\n+\tif err != nil || len(changed) != 2 {\n+\t\tt.Fatalf(\"changed=%v err=%v\", changed, err)\n+\t}\n+\tif again, _ := WriteGenerated(root); len(again) != 0 {\n+\t\tt.Fatalf(\"second write changed %v\", again)\n+\t}\n+\tindex, _ := os.ReadFile(filepath.Join(root, \"docs\", \"README.md\"))\n+\tif !strings.Contains(string(index), \"- [Third](THIRD.md) (shipped)\") {\n+\t\tt.Fatalf(\"index:\\n%s\", index)\n+\t}\n+}\n+\n+func TestWriteGeneratedRefusesBadFrontMatter(t *testing.T) {\n+\troot := repo(t)\n+\twrite(t, root, \"docs/BAD.md\", \"# no front matter\\n\")\n+\tif _, err := WriteGenerated(root); err == nil || !strings.Contains(err.Error(), \"docs/BAD.md\") {\n+\t\tt.Fatalf(\"err = %v\", err)\n+\t}\n+}\n","hunks":[{"id":"diff-d4a9f59149fbae67","header":"@@ -0,0 +1,215 @@","lines":[{"newLine":1,"kind":"added","text":"package docs"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"added","text":"\t\"os\""},{"newLine":5,"kind":"added","text":"\t\"path/filepath\""},{"newLine":6,"kind":"added","text":"\t\"strings\""},{"newLine":7,"kind":"added","text":"\t\"testing\""},{"newLine":8,"kind":"added","text":")"},{"newLine":9,"kind":"added","text":""} n+// renderIndex lists every page by section, so no page is unreachable.\n+func renderIndex(pages []Page) string {\n+\tvar b strings.Builder\n+\tb.WriteString(\"\u003c!-- Generated by `px1 docs manifest` from the front matter of each page. Do not edit. --\u003e\\n\\n\")\n+\tb.WriteString(\"# px1 documentation\\n\\n\")\n+\tb.WriteString(\"Each page states a status: **shipped** (usable now), **built** (code and tests exist, not deployed) or **planned**.\\n\")\n+\tfor _, section := range Sections {\n+\t\twrote := false\n+\t\tfor _, page := range pages {\n+\t\t\tif page.Section != section {\n+\t\t\t\tcontinue\n+\t\t\t}\n+\t\t\tif !wrote {\n+\t\t\t\tfmt.Fprintf(\u0026b, \"\\n## %s\\n\\n\", sectionTitles[section])\n+\t\t\t\twrote = true\n+\t\t\t}\n+\t\t\tfmt.Fprintf(\u0026b, \"- [%s](%s) (%s)\\n\", page.Title, path.Base(page.Path), page.Status)\n+\t\t}\n+\t}\n+\treturn b.String()\n+}\n+\n+// WriteGenerated writes the manifest and the index and returns the paths it\n+// changed.\n+func WriteGenerated(root string) ([]string, error) {\n+\tpages, problems, err := LoadPages(root)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tif len(problems) \u003e 0 {\n+\t\treturn nil, fmt.Errorf(\"%s (and %d more): fix the front matter first\", problems[0], len(problems)-1)\n+\t}\n+\tvar changed []string\n+\tfor _, rel := range []string{ManifestFile, Dir + \"/\" + IndexFile} {\n+\t\twant := Generated(pages)[rel]\n+\t\tfull := filepath.Join(root, filepath.FromSlash(rel))\n+\t\tif got, err := os.ReadFile(full); err == nil \u0026\u0026 string(got) == want {\n+\t\t\tcontinue\n+\t\t}\n+\t\tif err := os.WriteFile(full, []byte(want), 0o644); err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t\tchanged = append(changed, rel)\n+\t}\n+\treturn changed, nil\n+}\n","hunks":[{"id":"diff-5d7352b033fde9e3","header":"@@ -0,0 +1,93 @@","lines":[{"newLine":1,"kind":"added","text":"package docs"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"adde ing `json:\"status\"`\n+\t// Covers lists the code the page describes: files, directories (ending\n+\t// in \"/\") or globs, relative to the repository root.\n+\tCovers []string `json:\"covers\"`\n+\t// VerifiedAt is the commit at which a person or the docs agent last\n+\t// checked the page against Covers. Empty means never.\n+\tVerifiedAt string `json:\"verified_at\"`\n+\n+\tbody      string\n+\tbodyStart int // line number of the first body line\n+}\n+\n+// Problem is one thing wrong with the documentation.\n+type Problem struct {\n+\tPath    string\n+\tLine    int\n+\tMessage string\n+}\n+\n+func (p Problem) String() string {\n+\tif p.Line \u003e 0 {\n+\t\treturn fmt.Sprintf(\"%s:%d: %s\", p.Path, p.Line, p.Message)\n+\t}\n+\treturn fmt.Sprintf(\"%s: %s\", p.Path, p.Message)\n+}\n+\n+// LoadPages reads every page under docs/. Problems are front matter errors;\n+// a page with problems is still returned so later checks can run on it.\n+func LoadPages(root string) ([]Page, []Problem, error) {\n+\tentries, err := os.ReadDir(filepath.Join(root, Dir))\n+\tif err != nil {\n+\t\treturn nil, nil, err\n+\t}\n+\tvar pages []Page\n+\tvar problems []Problem\n+\tfor _, entry := range entries {\n+\t\tname := entry.Name()\n+\t\tif entry.IsDir() || !strings.HasSuffix(name, \".md\") || name == IndexFile {\n+\t\t\tcontinue\n+\t\t}\n+\t\trel := Dir + \"/\" + name\n+\t\tdata, err := os.ReadFile(filepath.Join(root, Dir, name))\n+\t\tif err != nil {\n+\t\t\treturn nil, nil, err\n+\t\t}\n+\t\tpage, found := parsePage(rel, string(data))\n+\t\tproblems = append(problems, found...)\n+\t\tpages = append(pages, page)\n+\t}\n+\tsort.Slice(pages, func(i, j int) bool { return pages[i].Path \u003c pages[j].Path })\n+\treturn pages, problems, nil\n+}\n+\n+// parsePage splits front matter from the body and validates the fields. The\n+// front matter is a small fixed subset of YAML: \"key: value\" lines and one\n+// list, \"covers:\", whose items are \"  - value\" lines.\n+func parsePage(rel, text string) (Page, []Problem) {\n+\tpage := Page{Path: rel, Covers: []string{}, body: text, bodyStart: 1}\n+\tlines := strings.Split(text, \"\\n\")\n+\tif len(lines) == 0 || strings.TrimRight(lines[0], \"\\r\") != \"---\" {\n+\t\treturn page, []Problem{{rel, 1, \"missing front matter (the page must start with ---)\"}}\n+\t}\n+\tend := -1\n+\tfor i := 1; i \u003c len(lines); i++ {\n+\t\tif strings.TrimRight(lines[i], \"\\r\") == \"---\" {\n+\t\t\tend = i\n+\t\t\tbreak\n+\t\t}\n+\t}\n+\tif end \u003c 0 {\n+\t\treturn page, []Problem{{rel, 1, \"front matter is not closed with ---\"}}\n+\t}\n+\tpage.body = strings.Join(lines[end+1:], \"\\n\")\n+\tpage.bodyStart = end + 2\n+\n+\tvar problems []Problem\n+\tseen := map[string]bool{}\n+\tinCovers := false\n+\tfor i := 1; i \u003c end; i++ {\n+\t\tline := strings.TrimRight(lines[i], \"\\r\")\n+\t\tif strings.TrimSpace(line) == \"\" {\n+\t\t\tcontinue\n+\t\t}\n+\t\tif item, ok := strings.CutPrefix(strings.TrimSpace(line), \"- \"); ok \u0026\u0026 line != strings.TrimLeft(line, \" \") {\n+\t\t\tif !inCovers {\n+\t\t\t\tproblems = append(problems, Problem{rel, i + 1, \"list item outside covers\"})\n+\t\t\t\tcontinue\n+\t\t\t}\n+\t\t\tpage.Covers = append(page.Covers, unquote(item))\n+\t\t\tcontinue\n+\t\t}\n+\t\tkey, value, ok := strings.Cut(line, \":\")\n+\t\tif !ok || key != strings.TrimSpace(key) {\n+\t\t\tproblems = append(problems, Problem{rel, i + 1, \"expected \\\"key: value\\\"\"})\n+\t\t\tinCovers = false\n+\t\t\tcontinue\n+\t\t}\n+\t\tvalue = unquote(strings.TrimSpace(value))\n+\t\tinCovers = false\n+\t\tif seen[key] {\n+\t\t\tproblems = append(problems, Problem{rel, i + 1, \"duplicate key \" + key})\n+\t\t\tcontinue\n+\t\t}\n+\t\tseen[key] = true\n+\t\tswitch key {\n+\t\tcase \"title\":\n+\t\t\tpage.Title = value\n+\t\tcase \"section\":\n+\t\t\tpage.Section = value\n+\t\tcase \"kind\":\n+\t\t\tpage.Kind = value\n+\t\tcase \"status\":\n+\t\t\tpage.Status = value\n+\t\tcase \"verified_at\":\n+\t\t\tpage.VerifiedAt = value\n+\t\tcase \"covers\":\n+\t\t\tinCovers = true\n+\t\t\tif value != \"\" \u0026\u0026 value != \"[]\" {\n+\t\t\t\tproblems = append(problems, Problem{rel, i + 1, \"covers must be a list of \\\"  - path\\\" lines, or []\"})\n+\t\t\t}\n+\t\tdefault:\n+\t\t\tproblems = append(problems, Problem{rel, i + 1, \"unknown key \" + key})\n+\t\t}\n+\t}\n+\n+\tfor _, key := range []string{\"title\", \"section\", \"kind\", \"status\", \"covers\", \"verified_at\"} {\n+\t\tif !seen[key] {\n+\t\t\tproblems = append(problems, Problem{rel, 1, \"front matter is missing \" + key})\n+\t\t}\n+\t}\n+\tif seen[\"title\"] \u0026\u0026 page.Title == \"\" {\n+\t\tproblems = append(problems, Problem{rel, 1, \"title is empty\"})\n+\t}\n+\tproblems = append(problems, oneOf(rel, \"section\", page.Section, Sections, seen)...)\n+\tproblems = append(problems, oneOf(rel, \"kind\", page.Kind, kinds, seen)...)\n+\tproblems = append(problems, oneOf(rel, \"status\", page.Status, statuses, seen)...)\n+\tif page.VerifiedAt != \"\" \u0026\u0026 !commitRE.MatchString(page.VerifiedAt) {\n+\t\tproblems = append(problems, Problem{rel, 1, \"verified_at must be empty or a commit SHA (7 to 40 hex characters)\"})\n+\t}\n+\treturn page, problems\n+}\n+\n+func oneOf(rel, key, value string, allowed []string, seen map[string]bool) []Problem {\n+\tif !seen[key] {\n+\t\treturn nil\n+\t}\n+\tfor _, a := range allowed {\n+\t\tif value == a {\n+\t\t\treturn nil\n+\t\t}\n+\t}\n+\treturn []Problem{{rel, 1, fmt.Sprintf(\"%s is %q; it must be one of %s\", key, value, strings.Join(allowed, \", \"))}}\n+}\n+\n+func unquote(s string) string {\n+\ts = strings.TrimSpace(s)\n+\tif len(s) \u003e= 2 \u0026\u0026 (s[0] == '\"' || s[0] == '\\'') \u0026\u0026 s[len(s)-1] == s[0] {\n+\t\treturn s[1 : len(s)-1]\n+\t}\n+\treturn s\n+}\n","hunks":[{"id":"diff-b612c8f4092d8849","header":"@@ -0,0 +1,200 @@","lines":[{"newLine":1,"kind":"added","text":"// Package docs reads the Markdown pages under docs/, checks them against the"},{"newLine":2," const plural=(n,w)=>n+' '+w+(n===1?'':'s');
function paintTop(){
  const o=open(),rules=o.filter((i)=>i.k==='rule').length,attn=o.filter((i)=>i.k==='attn').length;
  const failing=checks.filter((c)=>c.status==='failed').length;
  const pending=checks.filter((c)=>c.status==='running'||c.status==='queued').length;
  const parts=[];
  h1.textContent='';
  const reviewed=files.filter((f)=>reviewState(f.path)==='reviewed').length;
  const followUp=files.filter((f)=>reviewState(f.path)==='follow-up').length;
  h1.textContent=files.length?reviewed+' of '+plural(files.length,'file')+' marked reviewed':'No changed files';
  if(followUp)h1.textContent+=' · '+followUp+' need follow-up';
  if(failing)h1.textContent+=' · '+plural(failing,'check')+' failing';
  verdict.textContent='';
  verdict.append(h('span','chip '+(rules?'chip-danger':''),plural(rules,'rule finding')));
  verdict.append(h('span','chip '+(attn?'chip-attention':''),plural(attn,'attention flag')));
  {const n=open().filter((i)=>i.k==='finding').length;verdict.append(h('span','chip'+(n?' chip-finding':''),plural(n,'AI finding')))}
  const ci=h('button','chip '+(failing?'chip-danger':pending?'chip-attention':''));
  ci.type='button';
  ci.setAttribute('aria-expanded',String(!checksPanel.hidden));
  ci.textContent=verification.available?(checks.length?'CI '+checks.filter((c)=>c.status==='passed').length+'/'+checks.length+' passed':'CI attached · 0 checks'):verification.error?'CI unavailable':'CI not attached';
  ci.onclick=()=>{checksPanel.hidden=!checksPanel.hidden;ci.setAttribute('aria-expanded',String(!checksPanel.hidden));syncTop()};
  verdict.append(ci);
  {const n=items.filter((i)=>i.k==='note').length;verdict.append(h('span','chip'+(n?' chip-note':''),plural(n,'AI note')))}
}

/* ---- rail ---- */
const rail=h('aside','rail');rail.setAttribute('aria-label','Review navigation');

const evidenceSec=h('section','evidence');

    const identity=h('p','evidence-revision');
    identity.append(document.createTextNode(source.base?'Comparison ': 'Revision '));
    if(source.base)identity.append(h('code',null,short(source.base)),document.createTextNode('…'));

}

/* The agentic trace shows how findings were produced, step by step. Every
   string is set with textContent: tool arguments and previews are repository
   data. The trace explains the process; it is not evidence the code is safe. */
const trace=report.trace&&Array.isArray(report.trace.events)?report.trace:null;
if(trace){
  const traceSec=h('section','evidence trace');traceSec.id='how-px1-reviewed';
  traceSec.append(h('h2','eyebrow','How px1 reviewed this'));
  const spend=trace.spend||{};
  traceSec.append(h('p','evidence-intro',trace.tier+' tier · '+plural(spend.model_calls||0,'model call')+' · '+plural(spend.tool_calls||0,'tool call')+' · $'+((spend.cost_microusd||0)/1e6).toFixed(2)+' model cost'));
  if(spend.exhausted)traceSec.append(h('p','evidence-limit','Exploration stopped early: the '+spend.exhausted+' budget ran out.'));
  if(trace.dropped)traceSec.append(h('p','evidence-limit',plural(trace.dropped,'later step')+' exceeded the trace limit and are not shown.'));
  const tasks=trace.events.filter((e)=>e.kind==='task');
  const taskList=h('ul','evidence-list');
  for(const task of tasks){
    const li=h('li','evidence-source');const head=h('div','evidence-head');
    head.append(h('span','evidence-label',task.agent),h('span','evidence-state'+(task.failed?' state-limited':''),task.name));
    li.append(head);if(task.detail)li.append(h('p','evidence-limit',task.detail));taskList.append(li);
  }
  if(tasks.length)traceSec.append(taskList);
  const steps=h('details','trace-steps');steps.append(h('summary',null,'All '+plural(trace.events.length,'step')));
  const stepList=h('ol','trace-list');
  for(const e of trace.events){
    const li=h('li',e.failed?'trace-step failed':'trace-step');
    li.append(h('span','evidence-label',e.agent+' · '+e.kind+' · '+e.name+(e.failed?' (failed)':'')));
    const facts=[];
    if(e.kind==='model')facts.push((e.input_tokens||0)+' in / '+(e.output_tokens||0)+' out tokens');
    if(e.result_bytes)facts.push(e.result_bytes+' bytes'+(e.truncated?', truncated':''));
    facts.push((e.elapsed_ms||0)+' ms');
    li.append(h('p','evidence-detail',facts.join(' · ')));
    if(e.detail&&e.kind==='tool')li.append(h('code','trace-args',e.detail));
    if(e.preview)li.append(h('pre','trace-preview',e.preview));
    stepList.append(li);
  }
  steps.append(stepList);traceSec.append(steps,h('p','evidence-limit','This log shows what px1 looked at. It does not show that unexamined code is correct.'));
  rail.append(traceSec);
}
const progressSec=h('section','review-progress');
progressSec.append(h('h2','eyebrow','Your code review'));

const progressHint=h('p','review-hint');

const inspectionList=h('ul','inspection-list');
for(const prompt of inspectionQuestions){

const queueSec=h('section');const queueHead=h('h2','eyebrow','Automated findings ');const queueCount=h('span','count');queueHead.append(queueCount);
const queue=h('ul','queue');queueSec.append(queueHead,queue);
const filesSec=h('section');const filesHead=h('h2','eyebrow','Files ');
const seg=h('span','seg');seg.setAttribute('role','group');seg.setAttribute('aria-label','File filter');
const fAll=h('button',null,'All '+files.length),fFlag=h('button',null,'Flagged');
fAll.type=fFlag.type='button';seg.append(fAll,fFlag);filesHead.append(seg);
const search=h('input','file-search');search.type='search';search.placeholder='Search files and changed code';search.setAttribute('aria-label','Search files and changed code');
const fileList=h('ul','files');filesSec.append(filesHead,fileList);
filesSec.insertBefore(search,fileList);
rail.append(queueSec,filesSec);
let flaggedOnly=false;
let searchQuery='';

const order={rule:0,attn:1,finding:2,note:3};
function paintQueue(){
  queue.textContent='';
  queueCount.textContent=open().length+' open';
  if(!items.length){queue.append(h('p','empty',files.length?'No automated findings matched. This is not evidence that the change is safe; changed code still needs your review.':'No automated findings matched.'));return}
  [...items].sort((a,b)=>order[a.k]-order[b.k]).forEach((it)=>{
    const a=h('a','qitem'+(it.k!=='note'&&ack.has(it.ackId)?' done':''));a.href='#'+it.id;
    const row=h('div','row');row.append(chipFor(it.k),h('span','t',it.title));
    a.append(row,h('span','w',it.path+(it.line?':'+it.line:'')));
    const li=h('li');li.append(a);queue.append(li);
  });
}
const stats=files.map((f)=>{let a=0,d=0;for(const hk of f.hunks||[])for(const l of hk.lines||[]){if(l.kind==='added')a++;else if(l.kind==='removed')d++}return{a,d}});
const searchable=files.map((f,i)=>[f.path,...(f.hunks||[]).flatMap((hk)=>(hk.lines||[]).map((l)=>l.text)),...items.filter((x)=>x.fi===i).flatMap((x)=>[x.title,x.why,x.ev])].join('\n').toLowerCase());
const fileVisible=(f,i)=>{if(flaggedOnly&&!items.some((x)=>x.fi===i))return false;return !searchQuery||searchable[i].includes(searchQuery)};
function paintFiles(){
  fileList.textContent='';
  fAll.setAttribute('aria-pressed',String(!flaggedOnly));fFlag.setAttribute('aria-pressed',String(flaggedOnly));
  const flaggedCount=files.filter((f,i)=>items.some((x)=>x.fi===i)).length;
  fFlag.textContent='Flagged '+flaggedCount;
  files.forEach((f,i)=>{
    const mine=items.filter((x)=>x.fi===i);
    if(!fileVisible(f,i))return;
    const li=h('li'),link=h('a','file');link.href='#f'+i;
    const parts=f.path.split('/'),base=parts.pop(),p=h('span','p');
    if(parts.length)p.append(h('span',null,parts.join('/')+'/'));
    p.append(h('b',null,base));
    const m=h('span','m');
    for(const [kind,cls] of [['rule','r'],['attn','a'],['finding','f'],['note','n']]){const n=mine.filter((x)=>x.k===kind).length;if(n)m.append(h('i','mark '+cls,n))}
    const stateLabel={unreviewed:'Unreviewed',reviewed:'Reviewed','follow-up':'Needs follow-up'}[reviewState(f.path)];
    link.append(p,m,h('span','delta','+'+stats[i].a+' −'+stats[i].d+' · '+(STATUS[f.status]||f.status)+' · '+stateLabel));
    li.append(link);fileList.append(li);
  });
}
const paintMainFilter=()=>document.querySelectorAll('.fsec').forEach((sec)=>{const i=Number(sec.dataset.fileIndex);sec.hidden=!fileVisible(files[i],i)});
fAll.onclick=()=>{flaggedOnly=false;paintFiles();paintMainFilter()};
fFlag.onclick=()=>{flaggedOnly=true;paintFiles();paintMainFilter()};
search.addEventListener('input',()=>{searchQuery=search.value.trim().toLowerCase();paintFiles();paintMainFilter()});
let lastReviewIndex=-1;
function paintProgress(){
  const unread=files.filter((f)=>reviewState(f.path)==='unreviewed').length;
  const followUp=files.filter((f)=>reviewState(f.path)==='follow-up').length;
  progressSummary.textContent=unread+' unreviewed · '+followUp+' need follow-up';
  nextUnreviewed.disabled=unread===0;
  progressHint.textContent=(reviewStorageAvailable?'Saved in this browser for this comparison.':'Browser storage unavailable; progress lasts only on this page.')+' Your marks record review progress, not approval or proof of correctness.';
}
nextUnreviewed.onclick=()=>{
  for(let offset=1;offset<=files.length;offset++){
    const i=(lastReviewIndex+offset)%files.length;
    if(reviewState(files[i].path)!=='unreviewed')continue;
    lastReviewIndex=i;
    flaggedOnly=false;searchQuery='';search.value='';paintFiles();paintMainFilter();
    const section=document.getElementById('f'+i);section.focus({preventScroll:true});section.scrollIntoView();
    break;
  }
};

/* ---- diff ---- */
function annotation(it,fileLevel){
  const a=h('div','ann '+it.k+(fileLevel?' filelevel':''));a.id=it.id;
  const head=h('div','ann-top');
  head.append(chipFor(it.k),h('span','ann-title',it.title));
  if(fileLevel&&it.line)head.append(h('span','src','line '+it.line));
  if(it.src)head.append(h('span','src',it.src));
  if(it.k!=='note'){
    const b=h('button','btn act');b.type='button';
    const paint=()=>{const on=ack.has(it.ackId);b.textContent=on?'Acknowledged':'Acknowledge';b.setAttribute('aria-pressed',String(on));a.classList.toggle('done',on)};
    b.onclick=()=>{ack.has(it.ackId)?ack.delete(it.ackId):ack.add(it.ackId);persist();paint();paintTop();paintQueue()};
    paint();head.append(b);
  }
  a.append(head);
  if(it.why)a.append(h('p',null,it.why));
  if(it.ev)a.append(h('code','ev',it.ev));
  return a;
}
/* An AI note is a slim strip under the last line it explains, collapsed until opened. */
const rangeLabel=(it)=>it.lineEnd>it.line?'Lines '+it.line+'–'+it.lineEnd:'Line '+it.line;
function noteStrip(it){
  const a=h('div','ann note');a.id=it.id;
  const head=h('button','note-head');head.type='button';head.setAttribute('aria-expanded','false');
  const glyph=h('span','note-glyph','✦');glyph.setAttribute('aria-hidden','true');
  head.append(glyph,h('span','note-title',it.title),h('span','note-range',rangeLabel(it)),h('span','note-caret'));
  const body=h('div','note-body');body.hidden=true;
  body.append(h('p',null,it.why),h('span','src','AI explanation · generated for this commit'));
  const set=(on)=>{head.setAttribute('aria-expanded',String(on));body.hidden=!on;a.classList.toggle('open',on)};
  head.onclick=()=>set(body.hidden);
  a.open=()=>set(true);
  a.append(head,body);
  return a;
}

      else{const related=h('span',null);related.append(h('code',null,ref.path),document.createTextNode(' · '+ref.relationship));links.append(related)}
    }
    if(links.childNodes.length)card.append(links);
    body.append(card);
  }
  const mine=items.filter((x)=>x.fi===i);
  const placed=new Set();
  const hunks=Array.isArray(f.hunks)?f.hunks:[];
  /* An annotation sits under its line when that line is in the diff; otherwise it leads the file. */
  const lineOf=(it)=>{if(!it.line)return null;for(const hk of hunks)for(const l of hk.lines||[])if(l.newLine===it.line&&l.kind!=='removed')return l;return null};
  const spanOf=(it)=>{const out=[];for(const hk of hunks)for(const l of hk.lines||[])if(l.newLine>=it.line&&l.newLine<=it.lineEnd&&l.kind!=='removed')out.push(l);return out};
  const byLine=new Map(),noteAfter=new Map(),noteSpans=new Map();
  for(const it of mine){
    if(it.k==='note'){const span=spanOf(it);if(span.length){noteSpans.set(it,span);const last=span[span.length-1];if(!noteAfter.has(last))noteAfter.set(last,[]);noteAfter.get(last).push(it);placed.add(it)}continue}
    const l=lineOf(it);if(l){if(!byLine.has(l))byLine.set(l,[]);byLine.get(l).push(it);placed.add(it)}
  }
  for(const it of mine)if(!placed.has(it)){const card=annotation(it,true);if(it.k==='note'){card.querySelector('.ann-top').append(h('span','src',rangeLabel(it)))}body.append(card)}
  const rowOf=new Map(),strips=[];
  if(hunks.length){
    for(const hk of hunks){
      const hunk=h('div','hunk');hunk.id=hk.id||'';hunk.append(h('div','hh',hk.header));
      for(const l of hk.lines||[]){
        const marks=byLine.get(l)||[];
        const row=h('div','ln '+l.kind);
        if(l.newLine)row.id='line-f'+i+'-n'+l.newLine;
        row.append(h('span','g',l.oldLine||''),h('span','g',l.newLine||''),h('span','mk',l.kind==='added'?'+':l.kind==='removed'?'−':' '),h('span','c',l.text));
        rowOf.set(l,row);hunk.append(row);
        for(const it of marks)hunk.append(annotation(it,false));
        for(const it of noteAfter.get(l)||[])strips.push([it,hunk]);
      }
      body.append(hunk);
    }
    /* Strips are placed after their last explained line once every row exists. */
    for(const [it,hunk] of strips){
      const span=noteSpans.get(it);
      rowOf.get(span[span.length-1]).after(noteStrip(it));
    }
  }else if(f.diff){body.append(h('pre',null,f.diff))}
  else body.append(h('p','none','No textual diff available.'));
  sec.append(body);main.append(sec);
});
if(!files.length)main.append(h('p','muted','No changed files.'));

/* ---- spine: every annotation at its position on the page ---- */
const spine=h('div','spine');spine.setAttribute('aria-hidden','true');
const thumb=h('div','thumb');spine.append(thumb);
function paintSpine(){
  spine.querySelectorAll('a').forEach((a)=>a.remove());
  const total=document.documentElement.scrollHeight;
  for(const it of items){
    const el=document.getElementById(it.id);if(!el)continue;
    const a=h('a',it.k);a.href='#'+it.id;a.tabIndex=-1;
    a.style.top=((el.getBoundingClientRect().top+scrollY)/total*100)+'%';
    spine.append(a);
  }
  paintThumb();
}
function paintThumb(){const total=document.documentElement.scrollHeight;thumb.style.top=(scrollY/total*100)+'%';thumb.style.height=(innerHeight/total*100)+'%'}
function syncTop(){document.documentElement.style.setProperty('--top-h',top.offsetHeight+'px');paintSpine()}

const wrap=h('div','wrap');wrap.append(rail,main,spine);
/* The divider between the side panel and the diff is a drag handle. Width is remembered;
   double-click or Home resets it. Narrow screens stack the panel and hide the handle. */
const RAIL_DEFAULT=288,RAIL_MIN=200,RAIL_MAX=520,railKey='px1:rail-width';
const handle=h('div','resize-handle');
handle.setAttribute('role','separator');handle.setAttribute('aria-orientation','vertical');
handle.setAttribute('aria-label','Resize side panel');handle.tabIndex=0;
handle.append(h('span','grip'));
wrap.append(handle);
const clampRail=(w)=>Math.round(Math.min(RAIL_MAX,Math.max(RAIL_MIN,Math.min(w,wrap.clientWidth*0.45))));
function setRailWidth(w,remember){
  w=clampRail(w);
  wrap.style.setProperty('--rail-w',w+'px');
  handle.setAttribute('aria-valuenow',String(w));handle.setAttribute('aria-valuemin',String(RAIL_MIN));handle.setAttribute('aria-valuemax',String(RAIL_MAX));
  if(remember){try{localStorage.setItem(railKey,String(w))}catch{}}
  return w;
}
let savedWidth=RAIL_DEFAULT;
try{const n=parseInt(localStorage.getItem(railKey),10);if(n>0)savedWidth=n}catch{}
let frame=0;const settle=()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(syncTop)};
handle.addEventListener('pointerdown',(e)=>{
  if(e.button!==0)return;
  e.preventDefault();handle.setPointerCapture(e.pointerId);
  document.body.classList.add('resizing');handle.classList.add('active');
  const left=wrap.getBoundingClientRect().left+parseFloat(getComputedStyle(wrap).paddingLeft);
  const move=(ev)=>{setRailWidth(ev.clientX-left,false);settle()};
  const done=()=>{
    handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',done);handle.removeEventListener('pointercancel',done);
    document.body.classList.remove('resizing');handle.classList.remove('active');
    setRailWidth(parseFloat(wrap.style.getPropertyValue('--rail-w')),true);settle();
  };
  handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',done);handle.addEventListener('pointercancel',done);
});
handle.addEventListener('dblclick',()=>{setRailWidth(RAIL_DEFAULT,true);settle()});
handle.addEventListener('keydown',(e)=>{
  const now=parseFloat(wrap.style.getPropertyValue('--rail-w'))||RAIL_DEFAULT;
  let next=null;
  if(e.key==='ArrowLeft')next=now-16;else if(e.key==='ArrowRight')next=now+16;
  else if(e.key==='Home')next=RAIL_DEFAULT;
  if(next===null)return;
  e.preventDefault();setRailWidth(next,true);settle();
});
addEventListener('resize',()=>setRailWidth(parseFloat(wrap.style.getPropertyValue('--rail-w'))||savedWidth,false));
const foot=h('div','foot');
foot.append(document.createTextNode('File review progress and finding acknowledgements are independent and browser-local. This static snapshot represents '+short(report.base)+'…'+short(report.head)+' and cannot know the current live PR head or check status. Confirm both in GitHub before approving. Bundle checksums detect file changes; they do not prove authorship. '));
const checksumLink=h('a',null,'View checksums');checksumLink.href='checksums.sha256';foot.append(checksumLink);
app.textContent='';
app.append(top,wrap,foot);
setRailWidth(savedWidth,false);
applyRailScale(false);
paintTop();paintQueue();paintFiles();paintProgress();syncTop();
/* A deep link such as #ann-3 opens its note and scrolls to it once the page is built. */
openNoteFromHash();
if(location.hash.length>1)document.getElementById(location.hash.slice(1))?.scrollIntoView();
addEventListener('scroll',paintThumb,{passive:true});
addEventListener('resize',syncTop);
document.fonts?.ready.then(syncTop);
})();
</script></body></html>
