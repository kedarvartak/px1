/* Dark by default (neutral charcoal), light on request. Colour is spent only on what needs a person; everything else is neutral.
   Layout: top bar with verdict, left rail (queue + files), diff column with inline annotations, thin spine at the right edge. */
:root{
  --sans:'Report Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Report Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --canvas:#212121; --surface:#2a2a2a; --well:#303030; --line:#3a3a3a; --edge:#565656;
  --ink:#ececec; --dim:#b4b4b4; --faint:#8e8e8e;
  --brand:#ececec;
  --ok:#6fcf9d; --attention:#e6b05a; --attention-tint:#3a3122; --danger:#f08a80; --danger-tint:#3c2626;
  --add:#233229; --del:#3a2626;
  --note:#a3b4f7; --note-tint:#262b44;
  --ann:#191919;
  --fs-body:14px; --fs-small:12.5px; --fs-fine:11.5px; --fs-eyebrow:11px;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  color-scheme:dark;
}
/* Light is the alternate theme; dark is the default. */
:root[data-theme="light"]{
  --canvas:#e9e9e7; --surface:#f4f4f2; --well:#deded9; --line:#d2d2cd; --edge:#b4b4ae;
  --ink:#1c1c1b; --dim:#545450; --faint:#82827c;
  --brand:#2f2f2d;
  --ok:#2f6b4f; --attention:#8a5a14; --attention-tint:#efe3cb; --danger:#a1322c; --danger-tint:#f1d9d6;
  --add:#e3ebe4; --del:#ecdcd9;
  --note:#4658b5; --note-tint:#e4e8f8;
  --ann:#e2e2de;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:var(--fs-body)/1.5 var(--sans);margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
code,.mono{font-family:var(--mono);font-size:var(--fs-small)}
.eyebrow{font-size:var(--fs-eyebrow);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--dim)}

/* Slim scrollbar: floating pill thumb, no track, darkens on hover. */
*{scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:999px;border:3px solid transparent;background-clip:content-box;min-height:32px}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}
.fbody::-webkit-scrollbar{height:12px}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding:14px 16px;display:grid;gap:8px}
.brand{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--dim);font-size:var(--fs-small)}
.range{font-family:var(--mono);font-size:var(--fs-small)}
.range b{font-weight:500;color:var(--ink)}
.headline{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
h1{font:600 20px/1.3 var(--sans);margin:0;text-wrap:balance}
.verdict{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1.5px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap;background:var(--well);color:var(--dim);border:0}
.chip-note{background:var(--note-tint);color:var(--note)}
.chip-attention{background:var(--attention-tint);color:var(--attention)}
.chip-danger{background:var(--danger-tint);color:var(--danger)}
button.chip:hover{filter:brightness(1.12)}
.theme-btn{margin-left:auto;background:var(--well);border:1px solid var(--line);border-radius:999px;padding:1.5px 10px;font-size:12px;font-weight:500;color:var(--dim)}
.theme-btn:hover{border-color:var(--edge);color:var(--ink)}

.checks{border-top:1px solid var(--line);background:var(--canvas)}
.checks-in{max-width:1480px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px}
.checks-note{max-width:1480px;margin:0 auto;padding:10px 16px;color:var(--dim);font-size:var(--fs-small)}
.check{display:flex;gap:8px;align-items:baseline;font-size:var(--fs-small);min-width:0;color:inherit;text-decoration:none}
a.check:hover .name{text-decoration:underline}
.check .dot{flex:none;width:7px;height:7px;border-radius:50%;transform:translateY(-1px);background:var(--edge)}
.check .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check .st{margin-left:auto;color:var(--faint);flex:none}
.check.failed .dot{background:var(--danger)}.check.failed .st{color:var(--danger)}
.check.running .dot,.check.queued .dot{background:var(--attention)}

.wrap{position:relative;max-width:1480px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:var(--rail-w,288px) minmax(0,1fr) 10px;gap:24px;align-items:start}
.resize-handle{position:absolute;z-index:6;top:0;bottom:0;left:calc(16px + var(--rail-w,288px) + 4px);width:16px;cursor:col-resize;touch-action:none;display:flex;justify-content:center}
.resize-handle .grip{width:2px;height:100%;border-radius:2px;background:transparent;transition:background .15s}
.resize-handle:hover .grip,.resize-handle.active .grip,.resize-handle:focus-visible .grip{background:var(--edge)}
.resize-handle.active .grip{background:var(--faint)}
.resize-handle:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
.rail{position:sticky;top:var(--top-h,140px);max-height:calc(100vh - var(--top-h,140px) - 20px);overflow:auto;display:flex;flex-direction:column;gap:18px;padding-right:4px}
.rail section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.rail h2{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.rail h2 .count{font:400 var(--fs-fine) var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
.rail .empty{margin:0;color:var(--faint);font-size:var(--fs-small)}
.queue{list-style:none;margin:0;padding:0}
.qitem{display:grid;gap:2px;text-decoration:none;color:inherit;padding:8px 0;border-top:1px solid var(--line)}
.queue li:first-child .qitem{border-top:0;padding-top:2px}
.qitem .row{display:flex;gap:8px;align-items:center}
.qitem .t{font-size:13px;line-height:1.35;font-weight:500}
.qitem:hover .t{text-decoration:underline}
.qitem .w{font-family:var(--mono);font-size:var(--fs-fine);color:var(--faint);overflow-wrap:anywhere}
.qitem.done{opacity:.5}.qitem.done .t{text-decoration:line-through}
.seg{display:inline-flex;gap:10px;letter-spacing:0;text-transform:none}
.seg button{background:none;border:0;padding:0;font-size:var(--fs-small);font-weight:500;color:var(--faint)}
.seg button[aria-pressed="true"]{color:var(--brand)}
.files{list-style:none;margin:0;padding:0}
.file{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:6px 8px;margin:0 -8px;border-radius:var(--r-md);text-decoration:none;color:inherit;align-items:center}
.file:hover{background:var(--well)}
.file .p{font-family:var(--mono);font-size:var(--fs-small);overflow-wrap:anywhere}
.file .p b{font-weight:500}.file .p span{color:var(--faint)}
.file .m{display:flex;gap:4px}
.file .delta{grid-column:1/-1;font:var(--fs-fine) var(--mono);color:var(--faint)}
.mark{font:500 var(--fs-fine) var(--mono);padding:0 6px;border-radius:999px;background:var(--well);color:var(--dim)}
.mark.n{background:var(--note-tint);color:var(--note)}
.mark.r{background:var(--danger-tint);color:var(--danger)}.mark.a{background:var(--attention-tint);color:var(--attention)}

.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.fsec{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);scroll-margin-top:calc(var(--top-h,140px) + 56px);overflow:clip}
.fhead{position:sticky;top:var(--top-h,140px);z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.fhead .path{font:500 13px var(--mono);overflow-wrap:anywhere}
.fhead .spacer{flex:1}
.fbody{overflow-x:auto}
.fbody pre{margin:0;padding:12px 16px;font:var(--fs-small)/1.6 var(--mono)}
.fbody .none{margin:0;padding:12px 16px;color:var(--faint)}
.hunk{min-width:max-content}
.hh{padding:4px 16px;font:var(--fs-small) var(--mono);color:var(--faint);background:var(--canvas);border-bottom:1px solid var(--line)}
.ln{display:grid;grid-template-columns:46px 46px 20px 1fr;font:var(--fs-small)/1.6 var(--mono)}
.ln .g{padding:0 8px;text-align:right;color:var(--faint);user-select:none}
.ln .mk{text-align:center;color:var(--faint);user-select:none}
.ln .c{padding:0 16px 0 4px;white-space:pre}
.ln.added{background:var(--add)}.ln.removed{background:var(--del)}

.ann{margin:0;padding:10px 16px 12px calc(46px + 46px + 20px + 4px);border-block:1px solid var(--line);background:var(--ann);position:sticky;left:0;width:100%;min-width:0;scroll-margin-top:calc(var(--top-h,140px) + 76px);font-family:var(--sans);white-space:normal}
.ann.note{padding-top:0;padding-bottom:0}
.ann.note.filelevel{padding-block:10px}
.note-head{display:flex;gap:10px;align-items:center;width:100%;margin:0;padding:7px 0;background:none;border:0;text-align:left;color:var(--ink)}
.note-head:hover .note-title{text-decoration:underline}
.note-glyph{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;background:var(--note-tint);color:var(--note);font-size:11px;line-height:1}
.note-title{font-weight:500;min-width:0;overflow-wrap:anywhere}
.note-range{margin-left:auto;flex:none;font:var(--fs-fine) var(--mono);color:var(--faint)}
.note-caret{flex:none;width:7px;height:7px;border:solid var(--faint);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.note-head[aria-expanded="true"] .note-caret{transform:rotate(-135deg)}
.note-body{padding:0 0 12px 30px}
.note-body p{margin:0 0 6px;max-width:68ch;color:var(--dim)}
.ann.filelevel{padding-left:16px;border-top:0}
.ann-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ann-title{font-weight:600}
.ann p{margin:4px 0 0;max-width:68ch;color:var(--dim)}
.ann .ev{display:block;margin-top:7px;padding:4px 9px;background:var(--well);border-radius:var(--r-sm);width:fit-content;max-width:100%;overflow-x:auto;white-space:pre}
.ann .src{color:var(--faint);font-size:var(--fs-small)}
.ann .act{margin-left:auto}
.ann.done{opacity:.6}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:2px 10px;font-size:var(--fs-small);font-weight:500}
.btn:hover{border-color:var(--edge)}
.btn[aria-pressed="true"]{color:var(--ok)}

.spine{position:sticky;top:var(--top-h,140px);height:calc(100vh - var(--top-h,140px) - 20px);border-radius:var(--r-sm);background:var(--well);overflow:hidden}
.spine a{position:absolute;left:0;right:0;height:4px}
.spine a{background:var(--edge)}
.spine .thumb{position:absolute;left:0;right:0;border-block:1px solid var(--dim);pointer-events:none}

.foot{max-width:1480px;margin:0 auto;padding:6px 16px 40px;color:var(--faint);font-size:var(--fs-small)}
.noscript{padding:24px 16px}

@media (max-width:1000px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .resize-handle{display:none}
  .spine{display:none}
  .rail{position:static;max-height:none;padding:0}
  .fhead{top:auto;position:static}
  .top{position:static}
  .ann{padding-left:16px;width:100%}
  .ln{grid-template-columns:36px 36px 18px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

 The smallest change in the wrong place isn't lazy, it's a second bug.\n+- Question complex requests: \"Do you actually need X, or does Y cover it?\"\n+- Pick the edge-case-correct option when two stdlib approaches are the same size, lazy means less code, not the flimsier algorithm.\n+- Mark deliberate simplifications that cut a real corner with a known ceiling (global lock, O(n²) scan, naive heuristic) with a `ponytail:` comment naming the ceiling and upgrade path.\n+\n+Not lazy about: understanding the problem (read it fully and trace the real flow before picking a rung, a small diff you don't understand is just laziness dressed up as efficiency), input validation at trust boundaries, error handling that prevents data loss, security, accessibility, the calibration real hardware needs (the platform is never the spec ideal, a clock drifts, a sensor reads off), anything explicitly requested. Lazy code without its check is unfinished: non-trivial logic leaves ONE runnable check behind, the smallest thing that fails if the logic breaks (an assert-based demo/self-check or one small test file; no frameworks, no fixtures). Trivial one-liners need no test.\n\\ No newline at end of file\n","hunks":[{"id":"diff-1dcc71d6cb0d628b","header":"@@ -0,0 +1,36 @@","lines":[{"newLine":1,"kind":"added","text":"---"},{"newLine":2,"kind":"added","text":"description: Ponytail, lazy senior dev mode. Always pick the simplest solution that works."},{"newLine":3,"kind":"added","text":"globs:"},{"newLine":4,"kind":"added","text":"alwaysApply: true"},{"newLine":5,"kind":"added","text":"---"},{"newLine":6,"kind":"added","text":""},{"newLine":7,"kind":"added","text":"# Ponytail, lazy senior dev mode"},{"newLine":8,"kind":"added","text":""},{"newLine":9,"kind":"added","text":"You are a lazy senior developer. Lazy means efficient, not careless. The best code is the code never written."},{"newLine":10,"kind":"added","text":""},{"newLine":11,"kind":"added","text":"Before writing any code, stop at th 4,"kind":"added","text":"A host that is not loopback is read-only: it cannot patch files, run an agent,"},{"newLine":145,"kind":"added","text":"or run checks. Each of those is a separate flag, and a remote flag does nothing"},{"newLine":146,"kind":"added","text":"until `-remote-token` or `PX1_REMOTE_TOKEN` is set. The browser asks for that"},{"newLine":147,"kind":"added","text":"token only when a remote capability is on. Loopback (`localhost` or `127.0.0.1`)"},{"newLine":148,"kind":"added","text":"keeps local patch and agent access without the token."},{"oldLine":144,"newLine":149,"kind":"context","text":""},{"oldLine":145,"newLine":150,"kind":"context","text":"```bash"},{"newLine":151,"kind":"added","text":"# Private network, read-only. A LAN IP or hostname cannot patch, run an agent, or run checks."},{"oldLine":146,"newLine":152,"kind":"context","text":"px1 -host 0.0.0.0 -port 7777 ~/work/repo"},{"newLine":153,"kind":"added","text":""},{"newLine":154,"kind":"added","text":"# SSH tunnel. The browser talks to loopback, so this session has local write access."},{"newLine":155,"kind":"added","text":"ssh -L 7777:127.0.0.1:7777 user@host"},{"newLine":156,"kind":"added","text":"px1 -host 127.0.0.1 -port 7777 ~/work/repo"},{"newLine":157,"kind":"added","text":""},{"newLine":158,"kind":"added","text":"# Remote patch only. Agent execution and checks stay off."},{"newLine":159,"kind":"added","text":"PX1_REMOTE_TOKEN='replace-with-a-random-secret' px1 -host 0.0.0.0 -allow-patch -port 7777 ~/work/repo"},{"oldLine":147,"newLine":160,"kind":"context","text":"```"},{"oldLine":148,"newLine":161,"kind":"context","text":""},{"oldLine":149,"kind":"removed","text":"Anyone who can reach the instance may read imported reports or invoke"},{"oldLine":150,"kind":"removed","text":"configured provider actions as you, so do not expose it publicly."},{"newLine":162,"kind":"added","text":"Anyone who can open the URL can still read the workspace and imported reports."},{"newLine":163,"kind":"added","text":"The token authorizes only the capabilities you enabled, for that browser"},{"newLine":164,"kind":"added","text":"session. Do not expose the server publicly. px1 does not execute verification"},{"newLine":165,"kind":"added","text":"commands; `-allow-checks` only permits an attempt, which is refused because CI"},{"newLine":166,"kind":"added","text":"results are imported instead."},{"oldLine":151,"newLine":167,"kind":"context","text":""},{"oldLine":152,"newLine":168,"kind":"context","text":"## Performance"},{"oldLine":153,"newLine":169,"kind":"context","text":""}]}]},{"path":"access.go","status":"A","diff":"diff --git a/access.go b/access.go\nnew file mode 100644\nindex 0000000..4a5a221\n--- /dev/null\n+++ b/access.go\n@@ -0,0 +1,193 @@\n+package main\n+\n+import (\n+\t\"crypto/subtle\"\n+\t\"net\"\n+\t\"net/http\"\n+\t\"net/url\"\n+\t\"strings\"\n+\t\"time\"\n+)\n+\n+// Remote writes stay off unless that one capability was enabled and the\n+// request presents the server token. Loopback keeps today's local review\n+// actions. The three capabilities never imply each other.\n+\n+const (\n+\tcapPatch  = \"patch\"\n+\tcapAgent  = \"agent\"\n+\tcapChecks = \"checks\"\n+\n+\taccessLoopback = \"loopback\"\n+\taccessIP       = \"ip\"\n+\taccessName     = \"name\"\n+\n+\t// ponytail: session audit is a slice capped at auditMax, copied on overflow. A ring index is the upgrade if a long-lived server records more than this.\n+\tauditMax = 200\n+)\n+\n+type accessPolicy struct {\n+\tallowPatch  bool\n+\tallowAgent  bool\n+\tallowChecks bool\n+\ttoken       string\n+}\n+\n+type auditEntry struct {\n+\tAt      string `json:\"at\"`\n+\tAction  string `json:\"action\"`\n+\tPath    string `json:\"path\"`\n+\tAccess  string `json:\"access\"`\n+\tAllowed bool   `json:\"allowed\"`\n+\tError   string `json:\"error,omitempty\"`\n+}\n+\n+func (s *Server) SetAccessPolicy(patch, agent, checks bool, token string) {\n+\ts.policy = accessPolicy{allowPatch: patch, allowAgent: agent, allowChecks: checks, token: token}\n+}\n+\n+func (p accessPolicy) enabled(cap string) bool {\n+\tswitch cap {\n+\tcase capPatch:\n+\t\treturn p.allowPatch\n+\tcase capAgent:\n+\t\treturn p.allowAgent\n+\tcase capChecks:\n+\t\treturn p.allowChecks\n+\tdefault:\n+\t\treturn false\n+\t}\n+}\n+\n+func requestHost(r *http.Request) string {\n+\thost := r.Host\n+\tif h, _, err := net.SplitHostPort(host); err == nil {\n+\t\thost = h\n+\t}\n+\treturn strings.Trim(host, \"[]\")\n+}\n+\n+func accessClass(host string) string {\n+\tif strings.EqualFold(host, \"localhost\") {\n+\t\treturn accessLoopback\n+\t}\n+\tip := net.ParseIP(host)\n+\tif ip == nil {\n+\t\treturn accessName\n+\t}\n+\tif ip.IsLoopback() {\n+\t\treturn accessLoopback\n+\t}\n+\treturn accessIP\n+}\n+\n+func originMatches(r *http.Request) bool {\n+\to, err := url.Parse(r.Header.Get(\"Origin\"))\n+\treturn err == nil \u0026\u0026 o.Host != \"\" \u0026\u0026 o.Host == r.Host\n+}\n+\n+func bearerOK(r *http.Request, token string) bool {\n+\tconst prefix = \"Bearer \"\n+\th := r.Header.Get(\"Authorization\")\n+\tif len(h) \u003c len(prefix) || !strings.EqualFold(h[:len(prefix)], prefix) {\n+\t\treturn false\n+\t}\n+\tgot := h[len(prefix):]\n+\tif len(got) != len(token) || token == \"\" {\n+\t\treturn false\n+\t}\n+\treturn subtle.ConstantTimeCompare([]byte(got), []byte(token)) == 1\n+}\n+\n+// permit is the gate for filesystem edits, process execution, and check\n+// execution. It fails closed and writes the response when it refuses.\n+func (s *Server) permit(w http.ResponseWriter, r *http.Request, cap string) bool {\n+\tclass := accessClass(requestHost(r))\n+\tif r.Method != http.MethodPost {\n+\t\ts.recordAudit(r, cap, false, \"POST only\")\n+\t\tfail(w, http.StatusMethodNotAllowed, \"POST only\")\n+\t\treturn false\n+\t}\n+\tif !originMatches(r) {\n+\t\ts.recordAudit(r, cap, false, \"origin mismatch\")\n+\t\tfail(w, http.StatusForbidden, \"request did not come from px1\")\n+\t\treturn false\n+\t}\n+\tif class == accessLoopback {\n+\t\ts.recordAudit(r, cap, true, \"\")\n+\t\treturn true\n+\t}\n+\tflag := \"-allow-\" + cap\n+\tif !s.policy.enabled(cap) {\n+\t\tmsg := \"remote \" + cap + \" is disabled; pass \" + flag + \" to enable it without enabling other remote actions\"\n+\t\ts.recordAudit(r, cap, false, msg)\n+\t\tfail(w, http.StatusForbidden, msg)\n+\t\treturn false\n+\t}\n+\tif s.policy.token == \"\" {\n+\t\tmsg := \"remote \" + cap + \" needs -remote-token or PX1_REMOTE_TOKEN; refusing without authentication\"\n+\t\ts.recordAudit(r, cap, false, msg)\n+\t\tfail(w, http.StatusForbidden, msg)\n+\t\treturn false\n+\t}\n+\tif !bearerOK(r, s.policy.token) {\n+\t\tmsg := \"remote \" + cap + \" needs Authorization: Bearer \u003ctoken\u003e\"\n+\t\ts.recordAudit(r, cap, false, msg)\n+\t\tfail(w, http.StatusUnauthorized, msg)\n+\t\treturn false\n+\t}\n+\ts.recordAudit(r, cap, true, \"\")\n+\treturn true\n+}\n+\n+func (s *Server) recordAudit(r *http.Request, action string, allowed bool, reason string) {\n+\ts.auditMu.Lock()\n+\tdefer s.auditMu.Unlock()\n+\ts.audit = append(s.audit, auditEntry{\n+\t\tAt:      time.Now().UTC().Format(time.RFC3339),\n+\t\tAction:  action,\n+\t\tPath:    r.URL.Path,\n+\t\tAccess:  accessClass(requestHost(r)),\n+\t\tAllowed: allowed,\n+\t\tError:   reason,\n+\t})\n+\tif extra := len(s.audit) - auditMax; extra \u003e 0 {\n+\t\ts.audit = append([]auditEntry(nil), s.audit[extra:]...)\n+\t}\n+}\n+\n+func (s *Server) policyView(r *http.Request) map[string]any {\n+\tclass := accessClass(requestHost(r))\n+\tremote := class != accessLoopback\n+\tflags := s.policy.allowPatch || s.policy.allowAgent || s.policy.allowChecks\n+\tauthed := s.policy.token != \"\"\n+\treturn map[string]any{\n+\t\t\"access\":        class,\n+\t\t\"remote\":        remote,\n+\t\t\"patch\":         !remote || (s.policy.allowPatch \u0026\u0026 authed),\n+\t\t\"agent\":         !remote || (s.policy.allowAgent \u0026\u0026 authed),\n+\t\t\"checks\":        !remote || (s.policy.allowChecks \u0026\u0026 authed),\n+\t\t\"tokenRequired\": remote \u0026\u0026 authed \u0026\u0026 flags,\n+\t\t\"needsToken\":    remote \u0026\u0026 flags \u0026\u0026 !authed,\n+\t}\n+}\n+\n+func (s *Server) handleAudit(w http.ResponseWriter, r *http.Request) {\n+\tif r.Method != http.MethodGet {\n+\t\tfail(w, http.StatusMethodNotAllowed, \"GET only\")\n+\t\treturn\n+\t}\n+\tif accessClass(requestHost(r)) != accessLoopback {\n+\t\tif s.policy.token == \"\" || !bearerOK(r, s.policy.token) {\n+\t\t\tfail(w, http.StatusUnauthorized, \"remote audit log needs Authorization: Bearer \u003ctoken\u003e\")\n+\t\t\treturn\n+\t\t}\n+\t}\n+\ts.auditMu.Lock()\n+\tentries := append([]auditEntry(nil), s.audit...)\n+\ts.auditMu.Unlock()\n+\tif entries == nil {\n+\t\tentries = []auditEntry{}\n+\t}\n+\twriteJSON(w, map[string]any{\"entries\": entries})\n+}\n","hunks":[{"id":"diff-2726ec8285a6afa5","header":"@@ -0,0 +1,193 @@","lines":[{"newLine":1,"kind":"added","text":"package main"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"added","text":"\t\"crypto/subtle\""},{"newLine":5,"kind":"added","text":"\t\"net\""},{"newLine":6,"kind":"added","text":"\t\"net/http\""},{"newLine":7,"kind":"added","text":"\t\"net/url\""},{"newLine":8,"kind":"added","text":"\t\"strings\""},{"newLine":9,"kind":"added","text":"\t\"time\""},{"newLine":10,"kind":"added","text":")"},{"newLine":11,"kind":"added","text":""},{"newLine":12,"kind":"added","text":"// Remote writes stay off unless that one capability was enabled and the"},{"newLine":13,"kind":"added","text":"// request presents the server token. Loopback keeps today's local review"},{"newLine":14,"kind":"added","text":"// actions. The three capabilities never imply each other."},{"newLine":15,"kind":"added","text":""},{"newLine":16,"kind":"added","text":"const ("},{"newLine":17,"kind":"added","text":"\tcapPatch  = \"patch\""},{"newLine":18,"kind":"added","text":"\tcapAgent  = \"agent\""},{"newLine":19, n || !strings.Contains(msg, \"-allow-patch\") {\n+\t\tt.Fatalf(\"default remote patch = %d %q\", code, msg)\n+\t}\n+\tif code, msg := postPatch(\"review.example:7777\", \"http://review.example:7777\", \"\"); code != http.StatusForbidden || !strings.Contains(msg, \"-allow-patch\") {\n+\t\tt.Fatalf(\"default hostname patch = %d %q\", code, msg)\n+\t}\n+\tif code, msg := postChecks(); code != http.StatusForbidden || !strings.Contains(msg, \"-allow-checks\") {\n+\t\tt.Fatalf(\"default remote checks = %d %q\", code, msg)\n+\t}\n+\n+\ts.SetAccessPolicy(true, false, false, \"tok\")\n+\treq := httptest.NewRequest(http.MethodPost, \"/api/lsp/install\", nil)\n+\treq.Host = \"10.1.2.3:7777\"\n+\treq.Header.Set(\"Origin\", \"http://10.1.2.3:7777\")\n+\treq.Header.Set(\"Authorization\", \"Bearer tok\")\n+\trec := httptest.NewRecorder()\n+\ts.handleLSPInstall(rec, req)\n+\tif rec.Code != http.StatusForbidden || !strings.Contains(rec.Body.String(), \"-allow-agent\") {\n+\t\tt.Fatalf(\"allow-patch also allowed agent: %d %s\", rec.Code, rec.Body.String())\n+\t}\n+\tif code, msg := postPatch(\"10.1.2.3:7777\", \"http://10.1.2.3:7777\", \"tok\"); code != http.StatusBadRequest || msg != \"bad path\" {\n+\t\tt.Fatalf(\"authed traversal = %d %q\", code, msg)\n+\t}\n+\tif _, err := os.Stat(outside); !os.IsNotExist(err) {\n+\t\tt.Fatal(\"path traversal wrote outside the workspace\")\n+\t}\n+\tif code, _ := postPatch(\"10.1.2.3:7777\", \"http://10.1.2.3:7777\", \"nope\"); code != http.StatusUnauthorized {\n+\t\tt.Fatalf(\"wrong token = %d\", code)\n+\t}\n+\tif code, msg := postPatch(\"review.example:7777\", \"https://evil.example\", \"tok\"); code != http.StatusForbidden || !strings.Contains(msg, \"did not come from px1\") {\n+\t\tt.Fatalf(\"cross-origin hostname = %d %q\", code, msg)\n+\t}\n+\n+\ts.SetAccessPolicy(false, true, false, \"tok\")\n+\tif code, msg := postPatch(\"10.1.2.3:7777\", \"http://10.1.2.3:7777\", \"tok\"); code != http.StatusForbidden || !strings.Contains(msg, \"-allow-patch\") {\n+\t\tt.Fatalf(\"allow-agent also allowed patch: %d %q\", code, msg)\n+\t}\n+\n+\ts.SetAccessPolicy(false, false, true, \"tok\")\n+\tif code, msg := postChecks(); code != http.StatusNotImplemented || !strings.Contains(msg, \"does not execute\") {\n+\t\tt.Fatalf(\"allow-checks executed a command: %d %q\", code, msg)\n+\t}\n+\tif code, msg := postPatch(\"10.1.2.3:7777\", \"http://10.1.2.3:7777\", \"tok\"); code != http.StatusForbidden {\n+\t\tt.Fatalf(\"allow-checks also allowed patch: %d %q\", code, msg)\n+\t}\n+\n+\ts.SetAccessPolicy(true, false, false, \"\")\n+\tif code, msg := postPatch(\"10.1.2.3:7777\", \"http://10.1.2.3:7777\", \"\"); code != http.StatusForbidden || !strings.Contains(msg, \"PX1_REMOTE_TOKEN\") {\n+\t\tt.Fatalf(\"flag without token = %d %q\", code, msg)\n+\t}\n+\n+\ts.SetAccessPolicy(false, false, false, \"\")\n+\tif code, msg := postPatch(\"127.0.0.1:7777\", \"http://127.0.0.1:7777\", \"\"); code != http.StatusBadRequest || msg != \"bad path\" {\n+\t\tt.Fatalf(\"loopback patch = %d %q\", code, msg)\n+\t}\n+\tif code, _ := postPatch(\"127.0.0.1:7777\", \"https://evil.example\", \"\"); code != http.StatusForbidden {\n+\t\tt.Fatalf(\"loopback cross-origin = %d\", code)\n+\t}\n+\n+\tareq := httptest.NewRequest(http.MethodGet, \"/api/audit\", nil)\n+\tareq.Host = \"127.0.0.1:7777\"\n+\tar := httptest.NewRecorder()\n+\ts.handleAudit(ar, areq)\n+\tif ar.Code != http.StatusOK || !strings.Contains(ar.Body.String(), `\"action\":\"patch\"`) {\n+\t\tt.Fatalf(\"audit = %d %s\", ar.Code, ar.Body.String())\n+\t}\n+\tareq = httptest.NewRequest(http.MethodGet, \"/api/audit\", nil)\n+\tareq.Host = \"10.1.2.3:7777\"\n+\tar = httptest.NewRecorder()\n+\ts.handleAudit(ar, areq)\n+\tif ar.Code != http.StatusUnauthorized {\n+\t\tt.Fatalf(\"remote audit = %d\", ar.Code)\n+\t}\n+}\n","hunks":[{"id":"diff-df7bf7ca4fa37386","header":"@@ -0,0 +1,119 @@","lines":[{"newLine":1,"kind":"added","text":"package main"},{"newLine":2,"kind":"added","text":""},{"newLine": g for the active review session | JSON (`{flags, truncated}`) |\n \n@@ -161,14 +162,17 @@ When navigating code via LSP Go-to-Definition, targets often reside outside the\n - `/api/file` and `/api/raw` permit reading external files only if the exact path exists in `extAllowed`.\n - External paths can never be enumerated via `/api/tree` or searched via `/api/search`.\n \n-### Origin Verification for Installers\n+### Origin Verification and Remote Capabilities\n \n-The `/api/lsp/install` and `/api/lsp/start` endpoints execute shell commands (e.g., `go install ...` or `npm install -g ...`), and explicit review actions can run a configured coding harness. To guard against cross-origin attacks (such as a malicious website triggering command execution via JavaScript fetch while px1 is running in the background):\n+Filesystem edits (`patch`, revert, restore), process execution (review-provider actions and language-server install/start), and verification-command attempts are three separate capabilities. Loopback (`localhost`, `127.0.0.1`, `::1`) may use all three. Any other IP, hostname, or reverse-proxy name is read-only unless that one capability is enabled with `-allow-patch`, `-allow-agent`, or `-allow-checks`. Enabling one does not enable the others. A remote capability also requires `Authorization: Bearer` matching `-remote-token` or `PX1_REMOTE_TOKEN`; a flag without a token stays refused.\n \n-1. The request method must be `POST`.\n-1. The request `Origin` header must match the request `Host` header.\n-1. The `Host` header is validated to ensure it is strictly an IP address (`127.0.0.1`, `[::1]`) or `localhost`. This prevents DNS-rebinding attacks.\n-1. The executed command is never supplied by the client; it is looked up exclusively from the hard-coded internal `lspRegistry`, or from the configured review provider (only the review prompt comes from the review action).\n+Every such request must be a POST whose `Origin` matches `Host`. Other machine-changing routes, such as settings and review comments, still use `localPost`: POST, matching origin, and a host that is an IP or `localhost`. That blocks a website on another origin, including a DNS-rebinding hostname, from calling them. The bearer token is what makes an opted-in hostname safe to allow for one capability: the attacker's page does not have the token.\n+\n+px1 does not execute verification commands. `POST /api/review/checks` passes the check capability gate and then returns that CI results are imported, not run. Successful and refused capability decisions are kept in an in-memory session log at `GET /api/audit` (loopback, or a remote request that presents the token). `/api/meta` includes the policy for the request host so the UI can show local access or remote read-only.\n+\n+The executed command is never supplied by the client. Language-server installs come from `lspRegistry`. Review-provider actions use the configured provider; only the review prompt comes from the action.\n+\n+Anyone who can open the server can read the workspace. SSH local forwarding to `127.0.0.1` is loopback, so that browser has local write access. A LAN IP or Tailscale hostname does not.\n \n ### Self-Update Integrity\n \n","hunks":[{"id":"diff-fb0af2602bf2bfb8","header":"@@ -84,6 +84,7 @@ The server is implemented in [`server.go`](../../server.go) using Go's standard","lines":[{"oldLine":84,"newLine":84,"kind":"context","text":"| `/api/lsp/start`      | `POST` | Rescans and starts language server after installation                   | JSON (`{ok: true}`)                        |"},{"oldLine":85,"newLine":85,"kind":"context","text":"| `/api/agent/job`      | `GET`  | Snapshot of an explicit review-provider job `?id=...`, or the most recently started when omitted | JSON job snapshot |"},{"oldLine":86,"newLine":86,"kind":"context","text":"| `/api/review/import`  | `POST` | Authenticated, size-limited import of a versioned GitHub PR snapshot; requires `PX1_IMPORT_TOKEN` | JSON (`{imported, path, target}`) |"},{"newLine":87,"kind":"added","text":"| `/api/audit`          | `GET`  | Session log of allowed and refused patch, agent, and check decisions    | JSON (`{entries}`)                 |"},{"oldLine":87,"newLine":88,"kind":"context","text":"| `/api/review/attention` | `GET` | Runs bounded, deterministic high-review-risk heuristics against the active task baseline | JSON (`{flags, truncated}`) |"},{"oldLine":88,"newLine":89,"kind":"context","text":"| `/api/review/attention/dismiss` | `POST` | Dismisses one current attention flag for the active review session | JSON (`{flags, truncated}`) |"},{"oldLine":89,"newLine":90,"kind":"context","text":""}]},{"id":"diff-fa2730e76d68e514","header":"@@ -161,14 +162,17 @@ When navigating code via LSP Go-to-Definition, targets often reside outside the","lines":[{"oldLine":161,"newLine":162,"kind":"context","text":"- `/api/file` and `/api/raw` permit reading external files only if the exact path exists in `extAllowed`."},{"oldLine":162,"newLine":163,"kind":"context","text":"- External paths can never be enumerated via `/api/tree` or searched via `/api/search`."},{"oldLine":163,"newLine":164,"kind":"context","text":""},{"oldLine":164,"kind":"removed","text":"### Origin Verification for Installers"},{"newLine":165,"kind":"added","text":"### Origin Verification and Remote Capabilities"},{"oldLine":165,"newLine":166,"kind":"context","text":""},{"oldLine":166,"kind":"removed","text":"The `/api/lsp/install` and `/api/lsp/start` endpoints execute shell commands (e.g., `go install ...` or `npm install -g ...`), and explicit review actions can run a configured coding harness. To guard against cross-origin attacks (such as a malicious website triggering command execution via JavaScript fetch while px1 is running in the background):"},{"newLine":167,"kind":"added","text":"Filesystem edits (`patch`, revert, restore), process execution (review-provider actions and language-server install/start), and verification-command attempts are thre (()=>{
const report=JSON.parse(document.getElementById('report-data').textContent);
const app=document.getElementById('app');
const files=Array.isArray(report.files)?report.files:[];
const ruleHits=Array.isArray(report.ruleHits)?report.ruleHits:[];
const attention=Array.isArray(report.attention)?report.attention:[];
const explanations=Array.isArray(report.explanations)?report.explanations:[];
const verification=report.verification||{checks:[]};
const checks=Array.isArray(verification.checks)?verification.checks:[];

const h=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=String(txt);return n};
const short=(sha)=>String(sha||'').slice(0,7);
const STATUS={A:'added',M:'modified',D:'deleted',R:'renamed',C:'copied',T:'type changed'};
const KIND={rule:'Rule',attn:'Attention',note:'Note'};
const CHIP={rule:'chip-danger',attn:'chip-attention',note:'chip-note'};
const chipFor=(k)=>h('span','chip '+CHIP[k],KIND[k]);

/* Acknowledgements live in this browser only. The key predates the redesign;
   keeping it means earlier acknowledgements still apply. */
const ackKey='px1:ack:'+report.repository+':'+report.head;
let ack=new Set();
try{const saved=JSON.parse(localStorage.getItem(ackKey)||'[]');if(Array.isArray(saved))ack=new Set(saved.filter((k)=>typeof k==='string'))}catch{}
const persist=()=>{try{localStorage.setItem(ackKey,JSON.stringify([...ack].sort()))}catch{}};

/* One list of everything worth a reader's attention, anchored to a file. */
const items=[];
const fileIndex=new Map(files.map((f,i)=>[f.path,i]));
const add=(it)=>{if(fileIndex.has(it.path)){it.fi=fileIndex.get(it.path);it.id='ann-'+items.length;items.push(it)}};
for(const hit of ruleHits)add({k:'rule',ackId:hit.key,path:hit.path,line:hit.line,title:hit.message,why:'Team rule '+hit.ruleId+(hit.origin?' ('+hit.origin+')':'')+'.',ev:hit.text,src:hit.source});
for(const flag of attention)add({k:'attn',ackId:flag.id,path:flag.path,line:flag.line||0,title:flag.title,why:flag.reason,ev:flag.evidence,src:'rule '+flag.rule});
for(const ex of explanations)add({k:'note',path:ex.path,line:ex.lineStart,lineEnd:Math.max(ex.lineEnd||0,ex.lineStart),title:ex.title,why:ex.summary,src:'AI explanation'});
const needsDecision=(it)=>it.k!=='note'&&!ack.has(it.ackId);
const open=()=>items.filter(needsDecision);

/* ---- top bar ---- */
const top=h('header','top');
const topIn=h('div','top-in');
const brand=h('div','brand');
brand.append(h('span',null,'Review report'),h('span',null,report.repository||''));
const range=h('span','range');
range.append(h('b',null,short(report.head)),document.createTextNode(' ← '),h('b',null,short(report.base)),document.createTextNode(report.generatedAt?' · generated '+new Date(report.generatedAt).toISOString().replace('T',' ').slice(0,16)+' UTC':''));
brand.append(range);
const root=document.documentElement;
const themeBtn=h('button','theme-btn');themeBtn.type='button';
const paintTheme=()=>{const light=root.dataset.theme==='light';themeBtn.textContent=light?'Dark theme':'Light theme';themeBtn.setAttribute('aria-label','Switch to '+(light?'dark':'light')+' theme')};
themeBtn.onclick=()=>{const next=root.dataset.theme==='light'?'dark':'light';root.dataset.theme=next;try{localStorage.setItem('px1:theme',next)}catch{}paintTheme()};
paintTheme();
brand.append(themeBtn);
const headline=h('div','headline');
const h1=h('h1');const verdict=h('div','verdict');
headline.append(h1,verdict);
topIn.append(brand,headline);
const checksPanel=h('div','checks');checksPanel.hidden=true;
top.append(topIn,checksPanel);

if(verification.available&&checks.length){
  const inner=h('div','checks-in');
  for(const c of checks){
    const row=h(c.url?'a':'div','check '+c.status);
    if(c.url){row.href=c.url;row.rel='noopener noreferrer'}
    row.append(h('span','dot'),h('span','name',c.name),h('span','st',c.status));
    inner.append(row);
  }
  checksPanel.append(inner);
}else{
  checksPanel.append(h('div','checks-note',verification.error||'No CI verification is attached to this report.'));
}

const plural=(n,w)=>n+' '+w+(n===1?'':'s');
function paintTop(){
  const o=open(),rules=o.filter((i)=>i.k==='rule').length,attn=o.filter((i)=>i.k==='attn').length;
  const failing=checks.filter((c)=>c.status==='failed').length;
  const pending=checks.filter((c)=>c.status==='running'||c.status==='queued').length;
  const parts=[];
  h1.textContent='';
  if(o.length)h1.textContent=plural(o.length,'place')+(o.length===1?' needs':' need')+' a decision';
  else h1.textContent='Nothing open';
  if(failing)h1.textContent+=(o.length?', and ':', but ')+plural(failing,'check')+(failing===1?' is':' are')+' failing';
  verdict.textContent='';
  verdict.append(h('span','chip '+(rules?'chip-danger':''),plural(rules,'rule finding')));
  verdict.append(h('span','chip '+(attn?'chip-attention':''),plural(attn,'attention flag')));
  const ci=h('button','chip '+(failing?'chip-danger':pending?'chip-attention':''));
  ci.type='button';
  ci.setAttribute('aria-expanded',String(!checksPanel.hidden));
  ci.textContent=verification.available&&checks.length?'CI '+checks.filter((c)=>c.status==='passed').length+'/'+checks.length+' passed':'CI not attached';
  ci.onclick=()=>{checksPanel.hidden=!checksPanel.hidden;ci.setAttribute('aria-expanded',String(!checksPanel.hidden));syncTop()};
  verdict.append(ci);
  {const n=items.filter((i)=>i.k==='note').length;verdict.append(h('span','chip'+(n?' chip-note':''),plural(n,'AI note')))}
}

/* ---- rail ---- */
const rail=h('aside','rail');rail.setAttribute('aria-label','Review navigation');
const queueSec=h('section');const queueHead=h('h2','eyebrow','Review queue ');const queueCount=h('span','count');queueHead.append(queueCount);
const queue=h('ul','queue');queueSec.append(queueHead,queue);
const filesSec=h('section');const filesHead=h('h2','eyebrow','Files ');
const seg=h('span','seg');seg.setAttribute('role','group');seg.setAttribute('aria-label','File filter');
const fAll=h('button',null,'All '+files.length),fFlag=h('button',null,'Flagged');
fAll.type=fFlag.type='button';seg.append(fAll,fFlag);filesHead.append(seg);
const fileList=h('ul','files');filesSec.append(filesHead,fileList);
rail.append(queueSec,filesSec);
let flaggedOnly=false;

const order={rule:0,attn:1,note:2};
function paintQueue(){
  queue.textContent='';
  queueCount.textContent=open().length+' open';
  if(!items.length){queue.append(h('p','empty','Nothing to review beyond the diff.'));return}
  [...items].sort((a,b)=>order[a.k]-order[b.k]).forEach((it)=>{
    const a=h('a','qitem'+(it.k!=='note'&&ack.has(it.ackId)?' done':''));a.href='#'+it.id;
    const row=h('div','row');row.append(chipFor(it.k),h('span','t',it.title));
    a.append(row,h('span','w',it.path+(it.line?':'+it.line:'')));
    const li=h('li');li.append(a);queue.append(li);
  });
}
const stats=files.map((f)=>{let a=0,d=0;for(const hk of f.hunks||[])for(const l of hk.lines||[]){if(l.kind==='added')a++;else if(l.kind==='removed')d++}return{a,d}});
function paintFiles(){
  fileList.textContent='';
  fAll.setAttribute('aria-pressed',String(!flaggedOnly));fFlag.setAttribute('aria-pressed',String(flaggedOnly));
  const flaggedCount=files.filter((f,i)=>items.some((x)=>x.fi===i)).length;
  fFlag.textContent='Flagged '+flaggedCount;
  files.forEach((f,i)=>{
    const mine=items.filter((x)=>x.fi===i);
    if(flaggedOnly&&!mine.length)return;
    const li=h('li'),link=h('a','file');link.href='#f'+i;
    const parts=f.path.split('/'),base=parts.pop(),p=h('span','p');
    if(parts.length)p.append(h('span',null,parts.join('/')+'/'));
    p.append(h('b',null,base));
    const m=h('span','m');
    for(const [kind,cls] of [['rule','r'],['attn','a'],['note','n']]){const n=mine.filter((x)=>x.k===kind).length;if(n)m.append(h('i','mark '+cls,n))}
    link.append(p,m,h('span','delta','+'+stats[i].a+' −'+stats[i].d+' · '+(STATUS[f.status]||f.status)));
    li.append(link);fileList.append(li);
  });
}
fAll.onclick=()=>{flaggedOnly=false;paintFiles()};
fFlag.onclick=()=>{flaggedOnly=true;paintFiles()};

/* ---- diff ---- */
function annotation(it,fileLevel){
  const a=h('div','ann '+it.k+(fileLevel?' filelevel':''));a.id=it.id;
  const head=h('div','ann-top');
  head.append(chipFor(it.k),h('span','ann-title',it.title));
  if(fileLevel&&it.line)head.append(h('span','src','line '+it.line));
  if(it.src)head.append(h('span','src',it.src));
  if(it.k!=='note'){
    const b=h('button','btn act');b.type='button';
    const paint=()=>{const on=ack.has(it.ackId);b.textContent=on?'Acknowledged':'Acknowledge';b.setAttribute('aria-pressed',String(on));a.classList.toggle('done',on)};
    b.onclick=()=>{ack.has(it.ackId)?ack.delete(it.ackId):ack.add(it.ackId);persist();paint();paintTop();paintQueue()};
    paint();head.append(b);
  }
  a.append(head);
  if(it.why)a.append(h('p',null,it.why));
  if(it.ev)a.append(h('code','ev',it.ev));
  return a;
}
/* An AI note is a slim strip under the last line it explains, collapsed until opened. */
const rangeLabel=(it)=>it.lineEnd>it.line?'Lines '+it.line+'–'+it.lineEnd:'Line '+it.line;
function noteStrip(it){
  const a=h('div','ann note');a.id=it.id;
  const head=h('button','note-head');head.type='button';head.setAttribute('aria-expanded','false');
  const glyph=h('span','note-glyph','✦');glyph.setAttribute('aria-hidden','true');
  head.append(glyph,h('span','note-title',it.title),h('span','note-range',rangeLabel(it)),h('span','note-caret'));
  const body=h('div','note-body');body.hidden=true;
  body.append(h('p',null,it.why),h('span','src','AI explanation · generated for this commit'));
  const set=(on)=>{head.setAttribute('aria-expanded',String(on));body.hidden=!on;a.classList.toggle('open',on)};
  head.onclick=()=>set(body.hidden);
  a.open=()=>set(true);
  a.append(head,body);
  return a;
}
const openNoteFromHash=()=>{const el=location.hash.length>1?document.getElementById(location.hash.slice(1)):null;if(el&&el.open)el.open()};
addEventListener('hashchange',openNoteFromHash);

const main=h('main','main');
files.forEach((f,i)=>{
  const sec=h('section','fsec');sec.id='f'+i;
  const head=h('div','fhead');
  head.append(h('span','path',f.path),h('span','eyebrow',STATUS[f.status]||f.status),h('span','spacer'),h('span','mono muted','+'+stats[i].a+' −'+stats[i].d));
  sec.append(head);
  const body=h('div','fbody');
  const mine=items.filter((x)=>x.fi===i);
  const placed=new Set();
  const hunks=Array.isArray(f.hunks)?f.hunks:[];
  /* An annotation sits under its line when that line is in the diff; otherwise it leads the file. */
  const lineOf=(it)=>{if(!it.line)return null;for(const hk of hunks)for(const l of hk.lines||[])if(l.newLine===it.line&&l.kind!=='removed')return l;return null};
  const spanOf=(it)=>{const out=[];for(const hk of hunks)for(const l of hk.lines||[])if(l.newLine>=it.line&&l.newLine<=it.lineEnd&&l.kind!=='removed')out.push(l);return out};
  const byLine=new Map(),noteAfter=new Map(),noteSpans=new Map();
  for(const it of mine){
    if(it.k==='note'){const span=spanOf(it);if(span.length){noteSpans.set(it,span);const last=span[span.length-1];if(!noteAfter.has(last))noteAfter.set(last,[]);noteAfter.get(last).push(it);placed.add(it)}continue}
    const l=lineOf(it);if(l){if(!byLine.has(l))byLine.set(l,[]);byLine.get(l).push(it);placed.add(it)}
  }
  for(const it of mine)if(!placed.has(it)){const card=annotation(it,true);if(it.k==='note'){card.querySelector('.ann-top').append(h('span','src',rangeLabel(it)))}body.append(card)}
  const rowOf=new Map(),strips=[];
  if(hunks.length){
    for(const hk of hunks){
      const hunk=h('div','hunk');hunk.id=hk.id||'';hunk.append(h('div','hh',hk.header));
      for(const l of hk.lines||[]){
        const marks=byLine.get(l)||[];
        const row=h('div','ln '+l.kind);
        row.append(h('span','g',l.oldLine||''),h('span','g',l.newLine||''),h('span','mk',l.kind==='added'?'+':l.kind==='removed'?'−':' '),h('span','c',l.text));
        rowOf.set(l,row);hunk.append(row);
        for(const it of marks)hunk.append(annotation(it,false));
        for(const it of noteAfter.get(l)||[])strips.push([it,hunk]);
      }
      body.append(hunk);
    }
    /* Strips are placed after their last explained line once every row exists. */
    for(const [it,hunk] of strips){
      const span=noteSpans.get(it);
      rowOf.get(span[span.length-1]).after(noteStrip(it));
    }
  }else if(f.diff){body.append(h('pre',null,f.diff))}
  else body.append(h('p','none','No textual diff available.'));
  sec.append(body);main.append(sec);
});
if(!files.length)main.append(h('p','muted','No changed files.'));

/* ---- spine: every annotation at its position on the page ---- */
const spine=h('div','spine');spine.setAttribute('aria-hidden','true');
const thumb=h('div','thumb');spine.append(thumb);
function paintSpine(){
  spine.querySelectorAll('a').forEach((a)=>a.remove());
  const total=document.documentElement.scrollHeight;
  for(const it of items){
    const el=document.getElementById(it.id);if(!el)continue;
    const a=h('a',it.k);a.href='#'+it.id;a.tabIndex=-1;
    a.style.top=((el.getBoundingClientRect().top+scrollY)/total*100)+'%';
    spine.append(a);
  }
  paintThumb();
}
function paintThumb(){const total=document.documentElement.scrollHeight;thumb.style.top=(scrollY/total*100)+'%';thumb.style.height=(innerHeight/total*100)+'%'}
function syncTop(){document.documentElement.style.setProperty('--top-h',top.offsetHeight+'px');paintSpine()}

const wrap=h('div','wrap');wrap.append(rail,main,spine);
/* The divider between the side panel and the diff is a drag handle. Width is remembered;
   double-click or Home resets it. Narrow screens stack the panel and hide the handle. */
const RAIL_DEFAULT=288,RAIL_MIN=200,RAIL_MAX=520,railKey='px1:rail-width';
const handle=h('div','resize-handle');
handle.setAttribute('role','separator');handle.setAttribute('aria-orientation','vertical');
handle.setAttribute('aria-label','Resize side panel');handle.tabIndex=0;
handle.append(h('span','grip'));
wrap.append(handle);
const clampRail=(w)=>Math.round(Math.min(RAIL_MAX,Math.max(RAIL_MIN,Math.min(w,wrap.clientWidth*0.45))));
function setRailWidth(w,remember){
  w=clampRail(w);
  wrap.style.setProperty('--rail-w',w+'px');
  handle.setAttribute('aria-valuenow',String(w));handle.setAttribute('aria-valuemin',String(RAIL_MIN));handle.setAttribute('aria-valuemax',String(RAIL_MAX));
  if(remember){try{localStorage.setItem(railKey,String(w))}catch{}}
  return w;
}
let savedWidth=RAIL_DEFAULT;
try{const n=parseInt(localStorage.getItem(railKey),10);if(n>0)savedWidth=n}catch{}
let frame=0;const settle=()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(syncTop)};
handle.addEventListener('pointerdown',(e)=>{
  if(e.button!==0)return;
  e.preventDefault();handle.setPointerCapture(e.pointerId);
  document.body.classList.add('resizing');handle.classList.add('active');
  const left=wrap.getBoundingClientRect().left+parseFloat(getComputedStyle(wrap).paddingLeft);
  const move=(ev)=>{setRailWidth(ev.clientX-left,false);settle()};
  const done=()=>{
    handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',done);handle.removeEventListener('pointercancel',done);
    document.body.classList.remove('resizing');handle.classList.remove('active');
    setRailWidth(parseFloat(wrap.style.getPropertyValue('--rail-w')),true);settle();
  };
  handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',done);handle.addEventListener('pointercancel',done);
});
handle.addEventListener('dblclick',()=>{setRailWidth(RAIL_DEFAULT,true);settle()});
handle.addEventListener('keydown',(e)=>{
  const now=parseFloat(wrap.style.getPropertyValue('--rail-w'))||RAIL_DEFAULT;
  let next=null;
  if(e.key==='ArrowLeft')next=now-16;else if(e.key==='ArrowRight')next=now+16;
  else if(e.key==='Home')next=RAIL_DEFAULT;
  if(next===null)return;
  e.preventDefault();setRailWidth(next,true);settle();
});
addEventListener('resize',()=>setRailWidth(parseFloat(wrap.style.getPropertyValue('--rail-w'))||savedWidth,false));
const foot=h('div','foot','Acknowledgements are saved in this browser only and apply to commit '+short(report.head)+'.');
app.textContent='';
app.append(top,wrap,foot);
setRailWidth(savedWidth,false);
paintTop();paintQueue();paintFiles();syncTop();
/* A deep link such as #ann-3 opens its note and scrolls to it once the page is built. */
openNoteFromHash();
if(location.hash.length>1)document.getElementById(location.hash.slice(1))?.scrollIntoView();
addEventListener('scroll',paintThumb,{passive:true});
addEventListener('resize',syncTop);
document.fonts?.ready.then(syncTop);
})();
</script></body></html>
