itle\"`\n+\tReason   string `json:\"reason\"`\n+\tPath     string `json:\"path\"`\n+\tLine     int    `json:\"line,omitempty\"`\n+\tEvidence string `json:\"evidence\"`\n+}\n+\n+type reviewAttention struct {\n+\tFlags     []reviewAttentionFlag `json:\"flags\"`\n+\tTruncated bool                  `json:\"truncated\"`\n+}\n+\n+type attentionCandidate struct {\n+\tPath              string\n+\tDeleted           bool\n+\tBaselineMode      fs.FileMode\n+\tCurrentMode       fs.FileMode\n+\tBaseline, Current []byte\n+\tContentAvailable  bool\n+}\n+\n+var publicAPIAddedLine = regexp.MustCompile(`(?i)(HandleFunc\\s*\\(|\\.(get|post|put|patch|delete)\\s*\\(|@(app|router)\\.(get|post|put|patch|delete)\\b|\\bexport\\s+(async\\s+)?(function|class|const|let|var)\\b|^\\s*func\\s+[A-Z][A-Za-z0-9_]*\\s*\\()`)\n+\n+func (m *reviewManager) Attention() (reviewAttention, error) {\n+\tm.mu.Lock()\n+\tdefer m.mu.Unlock()\n+\tif m.active == nil {\n+\t\treturn reviewAttention{}, errors.New(\"no active review session\")\n+\t}\n+\tcurrent, _, err := snapshotTree(m.root, \"\")\n+\tif err != nil {\n+\t\treturn reviewAttention{}, err\n+\t}\n+\tbaseline := make(map[string]reviewFile, len(m.active.Files))\n+\tnow := make(map[string]reviewFile, len(current))\n+\tfor _, file := range m.active.Files {\n+\t\tbaseline[file.Path] = file\n+\t}\n+\tfor _, file := range current {\n+\t\tnow[file.Path] = file\n+\t}\n+\tpaths := make([]string, 0)\n+\tfor path, old := range baseline {\n+\t\tif next, ok := now[path]; !ok || old.Hash != next.Hash || old.Mode != next.Mode {\n+\t\t\tpaths = append(paths, path)\n+\t\t}\n+\t}\n+\tfor path := range now {\n+\t\tif _, ok := baseline[path]; !ok {\n+\t\t\tpaths = append(paths, path)\n+\t\t}\n+\t}\n+\tsort.Strings(paths)\n+\ttruncated := len(paths) \u003e attentionMaxFiles\n+\tif truncated {\n+\t\tpaths = paths[:attentionMaxFiles]\n+\t}\n+\tcandidates := make([]attentionCandidate, 0, len(paths))\n+\tremaining := int64(attentionMaxContentBytes)\n+\tcontentTruncated := false\n+\tbaselineRoot := filepath.Join(m.sessionDir(m.active.ID), \"files\")\n+\tfor _, path := range paths {\n+\t\told, hadOld := baseline[path]\n+\t\tnext, hasNext := now[path]\n+\t\tcandidate := attentionCandidate{Path: path, Deleted: !hasNext}\n+\t\tif hadOld {\n+\t\t\tcandidate.BaselineMode = old.Mode\n+\t\t}\n+\t\tif hasNext {\n+\t\t\tcandidate.CurrentMode = next.Mode\n+\t\t}\n+\t\tbytesNeeded := old.Size + next.Size\n+\t\tif old.Size \u003c= attentionMaxFileBytes \u0026\u0026 next.Size \u003c= attentionMaxFileBytes \u0026\u0026 bytesNeeded \u003c= remaining {\n+\t\t\tvar readErr error\n+\t\t\tif hadOld {\n+\t\t\t\tcandidate.Baseline, readErr = os.ReadFile(filepath.Join(baselineRoot, filepath.FromSlash(path)))\n+\t\t\t}\n+\t\t\tif readErr == nil \u0026\u0026 hasNext {\n+\t\t\t\tcandidate.Current, readErr = os.ReadFile(filepath.Join(m.root, filepath.FromSlash(path)))\n+\t\t\t}\n+\t\t\tif readErr == nil \u0026\u0026 !containsNUL(candidate.Baseline) \u0026\u0026 !containsNUL(candidate.Current) {\n+\t\t\t\tcandidate.ContentAvailable = true\n+\t\t\t\tremaining -= bytesNeeded\n+\t\t\t}\n+\t\t} else {\n+\t\t\tcontentTruncated = true\n+\t\t}\n+\t\tcandidates = append(candidates, candidate)\n+\t}\n+\tdismissed := make(map[string]bool, len(m.active.DismissedAttention))\n+\tfor _, id := range m.active.DismissedAttention {\n+\t\tdismissed[id] = true\n+\t}\n+\tattention := detectReviewAttention(candidates, dismissed)\n+\tattention.Truncated = attention.Truncated || truncated || contentTruncated\n+\treturn attention, nil\n+}\n+\n+func (m *reviewManager) DismissAttention(id string) (reviewAttention, error) {\n+\tid = strings.TrimSpace(id)\n+\tif id == \"\" {\n+\t\treturn reviewAttention{}, errors.New(\"attention flag id is required\")\n+\t}\n+\tcurrent, err := m.Attention()\n+\tif err != nil {\n+\t\treturn reviewAttention{}, err\n+\t}\n+\tfound := false\n+\tfor _, flag := range current.Flags {\n+\t\tif flag.ID == id {\n+\t\t\tfound = true\n+\t\t\tbreak\n+\t\t}\n+\t}\n+\tif !found nd migration changes can affect stored data and deployment order.\", path, 0, path)\n+\t\t}\n+\t\tif isConfigurationFile(lower, base) {\n+\t\t\tadd(\"configuration\", \"Configuration change\", \"Configuration and environment files can change runtime behavior outside this diff.\", path, 0, path)\n+\t\t}\n+\t\tif candidate.Deleted \u0026\u0026 isTestFile(lower, base) {\n+\t\t\tadd(\"deleted-test\", \"Deleted test\", \"A test file was removed, which may reduce verification coverage.\", path, 0, path)\n+\t\t}\n+\t\tif isGeneratedFile(lower, base) {\n+\t\t\tadd(\"generated\", \"Generated file\", \"Generated output changed; review the source and regeneration path as well.\", path, 0, path)\n+\t\t}\n+\t\tif candidate.BaselineMode.Perm()\u00260o111 != candidate.CurrentMode.Perm()\u00260o111 {\n+\t\t\tevidence := fmt.Sprintf(\"mode %04o → %04o\", candidate.BaselineMode.Perm(), candidate.CurrentMode.Perm())\n+\t\t\tadd(\"executable-mode\", \"Executable permission changed\", \"Executable-bit changes affect how the file can be run.\", path, 0, evidence)\n+\t\t}\n+\t\tif !candidate.ContentAvailable {\n+\t\t\tcontinue\n+\t\t}\n+\t\tadded, removed := changedTextLines(candidate.Baseline, candidate.Current)\n+\t\tif len(added)+removed \u003e= attentionLargeLineDelta {\n+\t\t\tadd(\"large-diff\", \"Large diff\", \"A large textual change deserves an explicit review pass.\", path, 0, fmt.Sprintf(\"%d added, %d removed lines\", len(added), removed))\n+\t\t}\n+\t\tfor _, line := range added {\n+\t\t\ttext := strings.TrimSpace(line.Text)\n+\t\t\tif publicAPIAddedLine.MatchString(text) {\n+\t\t\t\tadd(\"public-api\", \"New endpoint or public API\", \"An added declaration looks externally callable or route-facing.\", path, line.Number, clip(text, 180))\n+\t\t\t\tbreak\n+\t\t\t}\n+\t\t}\n+\t}\n+\tsort.Slice(flags, func(i, j int) bool {\n+\t\tif flags[i].Path != flags[j].Path {\n+\t\t\treturn flags[i].Path \u003c flags[j].Path\n+\t\t}\n+\t\tif flags[i].Line != flags[j].Line {\n+\t\t\treturn flags[i].Line \u003c flags[j].Line\n+\t\t}\n+\t\treturn flags[i].Rule \u003c flags[j].Rule\n+\t})\n+\treturn reviewAttention{Flags: flags, Truncated: truncated}\n+}\n+\n+type attentionLine struct {\n+\tNumber int\n+\tText   string\n+}\n+\n+func changedTextLines(before, after []byte) ([]attentionLine, int) {\n+\toldLines := attentionTextLines(before)\n+\tnewLines := attentionTextLines(after)\n+\tcounts := map[string]int{}\n+\tfor _, line := range oldLines {\n+\t\tcounts[line]++\n+\t}\n+\tadded := make([]attentionLine, 0)\n+\tfor i, line := range newLines {\n+\t\tif counts[line] \u003e 0 {\n+\t\t\tcounts[line]--\n+\t\t\tcontinue\n+\t\t}\n+\t\tadded = append(added, attentionLine{Number: i + 1, Text: line})\n+\t}\n+\tremoved := 0\n+\tfor _, count := range counts {\n+\t\tremoved += count\n+\t}\n+\treturn added, removed\n+}\n+\n+func attentionTextLines(contents []byte) []string {\n+\ttext := strings.TrimSuffix(strings.ReplaceAll(string(contents), \"\\r\\n\", \"\\n\"), \"\\n\")\n+\tif text == \"\" {\n+\t\treturn nil\n+\t}\n+\treturn strings.Split(text, \"\\n\")\n+}\n+\n+func containsNUL(b []byte) bool { return bytes.IndexByte(b, 0) \u003e= 0 }\n+\n+func hasPathWord(path string, words ...string) bool {\n+\tparts := strings.FieldsFunc(path, func(r rune) bool { return r == '/' || r == '.' || r == '_' || r == '-' })\n+\tfor _, part := range parts {\n+\t\tfor _, word := range words {\n+\t\t\tif part == word {\n+\t\t\t\treturn true\n+\t\t\t}\n+\t\t}\n+\t}\n+\treturn false\n+}\n+\n+func isDependencyFile(base string) bool {\n+\tswitch base {\n+\tcase \"go.mod\", \"go.sum\", \"package.json\", \"package-lock.json\", \"yarn.lock\", \"pnpm-lock.yaml\", \"cargo.toml\", \"cargo.lock\", \"pyproject.toml\", \"poetry.lock\", \"requirements.txt\", \"gemfile\", \"gemfile.lock\", \"composer.json\", \"composer.lock\":\n+\t\treturn true\n+\t}\n+\treturn strings.HasPrefix(base, \"requirements-\") \u0026\u0026 strings.HasSuffix(base, \".txt\")\n+}\n+\n+func isConfigurationFile(path, base string) b const meta=text('div');meta.className='meta';meta.append(text('div','Base: '),code(report.base),text('div','Head: '),code(report.head),text('div','Generated: '+report.generatedAt));app.append(meta);
const openFindingCount=()=>report.ruleHits.filter((hit)=>!acknowledged.has(hit.key)).length;const stats=text('div');stats.className='stats';let openFindingValue;for(const [label,value] of [['Changed files',report.files.length],['Open findings',openFindingCount()],['AI explanations',report.explanations.length],['CI checks',report.verification.checks.length]]){const s=text('div');s.className='stat';const strong=text('strong',value);if(label==='Open findings')openFindingValue=strong;s.append(strong,text('span',label,'muted'));stats.append(s)}app.append(stats);
section('Team-rule findings');if(!report.ruleHits.length)app.append(text('p','No team-rule findings on added lines.','ok'));for(const hit of report.ruleHits){const n=text('div');const heading=text('div');heading.className='finding-head';const message=text('div',hit.message);const ack=text('button','','ack');ack.type='button';const paintAcknowledged=()=>{const active=acknowledged.has(hit.key);n.className='finding'+(active?' acknowledged':'');ack.className='ack'+(active?' active':'');ack.textContent=active?'Acknowledged':'Acknowledge';ack.setAttribute('aria-pressed',String(active));if(openFindingValue)openFindingValue.textContent=String(openFindingCount())};ack.addEventListener('click',()=>{if(acknowledged.has(hit.key))acknowledged.delete(hit.key);else acknowledged.add(hit.key);persistAcknowledged();paintAcknowledged()});heading.append(message,ack);n.append(heading,text('div',hit.path+':'+hit.line+' — '),code(hit.text));if(hit.context?.length){const lines=hit.context.map((line)=>{const marker=line.kind==='added'?'+':line.kind==='removed'?'-':' ';const number=line.number?String(line.number).padStart(4,' '):'    ';return marker+' '+number+' | '+line.text}).join('\n');n.append(text('pre',lines));}paintAcknowledged();app.append(n)}
section('AI explanations');if(!report.explanations.length)app.append(text('p','No AI explanations were supplied for this commit.','muted'));for(const item of report.explanations){const n=text('div');n.className='explanation';const chip=text('button',item.title,'chip');chip.type='button';chip.setAttribute('aria-expanded','false');const where=text('span',' '+item.path+':'+item.lineStart+(item.lineEnd!==item.lineStart?'-'+item.lineEnd:''),'muted');const detail=text('p',item.summary);detail.hidden=true;chip.addEventListener('click',()=>{detail.hidden=!detail.hidden;chip.setAttribute('aria-expanded',String(!detail.hidden))});n.append(chip,where,detail);app.append(n)}
section('Verification');const v=text('div');v.className='card';if(report.verification.available){v.append(text('div','Verified by '+report.verification.source+' for '+report.verification.revision,'ok'));for(const check of report.verification.checks){const row=text('div',check.name+': '+check.status);if(check.url){row.append(text('span',' '),code(check.url))}v.append(row)}}else{v.append(text('div',report.verification.error||'No verification report is attached.','muted'))}app.append(v);
section('Changed files');if(!report.files.length)app.append(text('p','No changed files.','muted'));for(const file of report.files){const d=document.createElement('details'),s=text('summary',file.status+' '+file.path);d.append(s);if(file.hunks?.length){const diff=text('div');diff.className='diff';for(const hunk of file.hunks){const block=text('div');block.className='hunk';block.id=hunk.id;block.append(text('div',hunk.header,'hunk-head'));for(const line of hunk.lines){const row=text('div');row.className='diff-line '+line.kind;const marker=line.kind==='added'?'+':line.kind==='removed'?'-':' ';row.append(text('span',line.oldLine||'','gutter'),text('span',line.newLine||'','gutter'),text('span',marker,'mark'),text('span',line.text,'line-code'));block.append(row)}diff.append(block)}d.append(diff)}else if(file.diff){d.append(text('pre',file.diff))}else d.append(text('p','No textual diff available.','muted'));app.append(d)}
</script></body></html>
