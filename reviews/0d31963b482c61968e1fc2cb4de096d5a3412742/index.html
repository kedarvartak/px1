ust be a full 40-character commit SHA\")\n+\t}\n+\treturn \u0026githubReviewTarget{\n+\t\tProvider:    \"github\",\n+\t\tOwner:       parts[1],\n+\t\tRepository:  parts[2],\n+\t\tPullRequest: pullRequest,\n+\t\tHead:        head,\n+\t}, nil\n+}\n+\n+func validGitHubOwner(owner string) bool {\n+\tif len(owner) == 0 || len(owner) \u003e 39 || owner[0] == '-' || owner[len(owner)-1] == '-' || strings.Contains(owner, \"--\") {\n+\t\treturn false\n+\t}\n+\tfor _, r := range owner {\n+\t\tif !asciiAlphaNumeric(r) \u0026\u0026 r != '-' {\n+\t\t\treturn false\n+\t\t}\n+\t}\n+\treturn true\n+}\n+\n+func validGitHubRepository(repository string) bool {\n+\tif len(repository) == 0 || len(repository) \u003e 100 || repository == \".\" || repository == \"..\" {\n+\t\treturn false\n+\t}\n+\tfor _, r := range repository {\n+\t\tif !asciiAlphaNumeric(r) \u0026\u0026 r != '-' \u0026\u0026 r != '_' \u0026\u0026 r != '.' {\n+\t\t\treturn false\n+\t\t}\n+\t}\n+\treturn true\n+}\n+\n+func asciiAlphaNumeric(r rune) bool {\n+\treturn r \u003e= 'a' \u0026\u0026 r \u003c= 'z' || r \u003e= 'A' \u0026\u0026 r \u003c= 'Z' || r \u003e= '0' \u0026\u0026 r \u003c= '9'\n+}\n+\n+func (s *Server) handleGitHubReview(w http.ResponseWriter, r *http.Request) {\n+\tif r.Method != http.MethodGet {\n+\t\tw.Header().Set(\"Allow\", http.MethodGet)\n+\t\tfail(w, http.StatusMethodNotAllowed, \"GET only\")\n+\t\treturn\n+\t}\n+\ttarget, err := parseGitHubReviewTarget(r.URL.Path, r.URL.Query())\n+\tif err != nil {\n+\t\tfail(w, http.StatusBadRequest, err.Error())\n+\t\treturn\n+\t}\n+\ts.serveIndex(w, target)\n+}\n+\n+func (s *Server) serveIndex(w http.ResponseWriter, target *githubReviewTarget) {\n+\tb, err := fs.ReadFile(assets, \"web/index.html\")\n+\tif err != nil {\n+\t\tfail(w, http.StatusInternalServerError, err.Error())\n+\t\treturn\n+\t}\n+\tif target != nil {\n+\t\tencoded, err := json.Marshal(target)\n+\t\tif err != nil {\n+\t\t\tfail(w, http.StatusInternalServerError, fmt.Sprintf(\"encode review target: %v\", err))\n+\t\t\treturn\n+\t\t}\n+\t\tmarker := []byte(\"\u003c/head\u003e\")\n+\t\tif !bytes.Contains(b, marker) {\n+\t\t\tfail(w, http.StatusInternalServerError, \"index is missing its closing head element\")\n+\t\t\treturn\n+\t\t}\n+\t\tscript := append([]byte(`\u003cscript type=\"application/json\" id=\"`+reviewTargetElementID+`\"\u003e`), encoded...)\n+\t\tscript = append(script, []byte(\"\u003c/script\u003e\\n\u003c/head\u003e\")...)\n+\t\tb = bytes.Replace(b, marker, script, 1)\n+\t}\n+\tw.Header().Set(\"Content-Type\", \"text/html; charset=utf-8\")\n+\t_, _ = w.Write(b)\n+}\n","hunks":[{"id":"diff-0162e54153e3d6b4","header":"@@ -0,0 +1,128 @@","lines":[{"newLine":1,"kind":"added","text":"package main"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"added","text":"\t\"bytes\""},{"newLine":5,"kind":"added","text":"\t\"encoding/json\""},{"newLine":6,"kind":"added","text":"\t\"errors\""},{"newLine":7,"kind":"added","text":"\t\"fmt\""},{"newLine":8,"kind":"added","text":"\t\"io/fs\""},{"newLine":9,"kind":"added","text":"\t\"net/http\""},{"newLine":10,"kind":"added","text":"\t\"net/url\""},{"newLine":11,"kind":"added","text":"\t\"strconv\""},{"newLine":12,"kind":"added","text":"\t\"strings\""},{"newLine":13,"kind":"added","text":")"},{"newLine":14,"kind":"added","text":""},{"newLine":15,"kind":"added","text":"const reviewTargetElementID = \"px1-review-target\""},{"newLine":16,"kind":"added","text":""},{"newLine":17,"kind":"added","text":"// githubReviewTarget is the immutable identity carried by an external review"},{"newLine":18,"kind":"added","text":"// link. The eventual snapshot importer can use the same fields without making"},{"newLine":19,"kind":"added","text":"// routing depend on mutable server state."},{"newLine":20,"kind":"added","text":"type githubReviewTarget struct {"},{"newLine":21,"kind":"added","text":"\tProvider    string `json:\"provider\"`"},{"newLine":22,"kind":"added","text":"\tO next\": {\"1\"}}},\n+\t}\n+\tfor _, tt := range tests {\n+\t\tt.Run(tt.name, func(t *testing.T) {\n+\t\t\tif _, err := parseGitHubReviewTarget(tt.path, tt.query); err == nil {\n+\t\t\t\tt.Fatal(\"expected link to be rejected\")\n+\t\t\t}\n+\t\t})\n+\t}\n+}\n+\n+func TestGitHubReviewRouteEmbedsImmutableTarget(t *testing.T) {\n+\ts, _ := newTestServer(t)\n+\tr := httptest.NewRequest(http.MethodGet, \"/github/acme/widgets/pull/42?sha=\"+testReviewSHA, nil)\n+\tw := httptest.NewRecorder()\n+\ts.ServeHTTP(w, r)\n+\tif w.Code != http.StatusOK {\n+\t\tt.Fatalf(\"status = %d, body = %s\", w.Code, w.Body.String())\n+\t}\n+\tbody := w.Body.String()\n+\tprefix := `\u003cscript type=\"application/json\" id=\"` + reviewTargetElementID + `\"\u003e`\n+\tstart := strings.Index(body, prefix)\n+\tif start \u003c 0 {\n+\t\tt.Fatalf(\"review target metadata missing from response: %s\", body)\n+\t}\n+\tstart += len(prefix)\n+\tend := strings.Index(body[start:], \"\u003c/script\u003e\")\n+\tif end \u003c 0 {\n+\t\tt.Fatal(\"review target metadata is not terminated\")\n+\t}\n+\tvar target githubReviewTarget\n+\tif err := json.Unmarshal([]byte(body[start:start+end]), \u0026target); err != nil {\n+\t\tt.Fatal(err)\n+\t}\n+\tif target.Owner != \"acme\" || target.Repository != \"widgets\" || target.PullRequest != 42 || target.Head != testReviewSHA {\n+\t\tt.Fatalf(\"unexpected embedded target: %#v\", target)\n+\t}\n+}\n+\n+func TestGitHubReviewRouteRejectsInvalidRequests(t *testing.T) {\n+\ts, _ := newTestServer(t)\n+\tfor _, tt := range []struct {\n+\t\tmethod string\n+\t\turl    string\n+\t\tcode   int\n+\t}{\n+\t\t{http.MethodGet, \"/github/acme/widgets/pull/42\", http.StatusBadRequest},\n+\t\t{http.MethodGet, \"/github/acme/widgets/pull/42?sha=abc\", http.StatusBadRequest},\n+\t\t{http.MethodPost, \"/github/acme/widgets/pull/42?sha=\" + testReviewSHA, http.StatusMethodNotAllowed},\n+\t} {\n+\t\tr := httptest.NewRequest(tt.method, tt.url, nil)\n+\t\tw := httptest.NewRecorder()\n+\t\ts.ServeHTTP(w, r)\n+\t\tif w.Code != tt.code {\n+\t\t\tt.Errorf(\"%s %s: status = %d, want %d\", tt.method, tt.url, w.Code, tt.code)\n+\t\t}\n+\t}\n+}\n+\n+func TestRootDoesNotEmbedReviewTarget(t *testing.T) {\n+\ts, _ := newTestServer(t)\n+\tr := httptest.NewRequest(http.MethodGet, \"/\", nil)\n+\tw := httptest.NewRecorder()\n+\ts.ServeHTTP(w, r)\n+\tif strings.Contains(w.Body.String(), reviewTargetElementID) {\n+\t\tt.Fatal(\"ordinary workspace route unexpectedly contains a review target\")\n+\t}\n+}\n","hunks":[{"id":"diff-3b54a5ce6b448229","header":"@@ -0,0 +1,108 @@","lines":[{"newLine":1,"kind":"added","text":"package main"},{"newLine":2,"kind":"added","text":""},{"newLine":3,"kind":"added","text":"import ("},{"newLine":4,"kind":"added","text":"\t\"encoding/json\""},{"newLine":5,"kind":"added","text":"\t\"net/http\""},{"newLine":6,"kind":"added","text":"\t\"net/http/httptest\""},{"newLine":7,"kind":"added","text":"\t\"net/url\""},{"newLine":8,"kind":"added","text":"\t\"strings\""},{"newLine":9,"kind":"added","text":"\t\"testing\""},{"newLine":10,"kind":"added","text":")"},{"newLine":11,"kind":"added","text":""},{"newLine":12,"kind":"added","text":"const testReviewSHA = \"0123456789abcdef0123456789abcdef01234567\""},{"newLine":13,"kind":"added","text":""},{"newLine":14,"kind":"added","text":"func TestParseGitHubReviewTarget(t *testing.T) {"},{"newLine":15,"kind":"added","text":"\ttarget, err := parseGitHubReviewTarget(\"/github/Acme/widgets.go/pull/42\", url.Values{\"sha\": {strings.ToUpper(testReviewSHA)}})"},{"newLine":16,"kind":"added","text":"\tif err != nil {"},{"newLine":17,"kind":"added","text":"\t\tt.Fatal(err)"},{"newLine":18,"kind":"added","text":"\t}"},{"newLine":19,"kind":"added","text":"\twant := githubReviewTarget{Provider: \"github\", Owner: \"Acme\", Repository: \"widgets.go\", PullRequest: 42, Head: testReviewSHA}"},{"newLine":20,"kind":"added","text":"\tif *target != want {"},{"newLine":21,"kind":"added","text":"\t\tt.Fatalf(\"target = %#v, want %#v const report=JSON.parse(document.getElementById('report-data').textContent), app=document.getElementById('app');
const esc=(value)=>String(value??''); const text=(tag,value,cls)=>{const n=document.createElement(tag);n.textContent=esc(value);if(cls)n.className=cls;return n};
const code=(value)=>text('code',value); const section=(title)=>{const n=text('h2',title);app.append(n);return n};
const ackStorageKey='px1:ack:'+report.repository+':'+report.head;let acknowledged=new Set();try{const saved=JSON.parse(localStorage.getItem(ackStorageKey)||'[]');if(Array.isArray(saved))acknowledged=new Set(saved.filter((key)=>typeof key==='string'))}catch{}const persistAcknowledged=()=>{try{localStorage.setItem(ackStorageKey,JSON.stringify([...acknowledged].sort()))}catch{}};
const header=text('h1','px1 static review');app.append(header);const repo=text('div',report.repository,'muted');app.append(repo);
const meta=text('div');meta.className='meta';meta.append(text('div','Base: '),code(report.base),text('div','Head: '),code(report.head),text('div','Generated: '+report.generatedAt));app.append(meta);
const openFindingCount=()=>report.ruleHits.filter((hit)=>!acknowledged.has(hit.key)).length;const stats=text('div');stats.className='stats';let openFindingValue;for(const [label,value] of [['Changed files',report.files.length],['Open findings',openFindingCount()],['AI explanations',report.explanations.length],['CI checks',report.verification.checks.length]]){const s=text('div');s.className='stat';const strong=text('strong',value);if(label==='Open findings')openFindingValue=strong;s.append(strong,text('span',label,'muted'));stats.append(s)}app.append(stats);
section('Team-rule findings');if(!report.ruleHits.length)app.append(text('p','No team-rule findings on added lines.','ok'));for(const hit of report.ruleHits){const n=text('div');const heading=text('div');heading.className='finding-head';const message=text('div',hit.message);const ack=text('button','','ack');ack.type='button';const paintAcknowledged=()=>{const active=acknowledged.has(hit.key);n.className='finding'+(active?' acknowledged':'');ack.className='ack'+(active?' active':'');ack.textContent=active?'Acknowledged':'Acknowledge';ack.setAttribute('aria-pressed',String(active));if(openFindingValue)openFindingValue.textContent=String(openFindingCount())};ack.addEventListener('click',()=>{if(acknowledged.has(hit.key))acknowledged.delete(hit.key);else acknowledged.add(hit.key);persistAcknowledged();paintAcknowledged()});heading.append(message,ack);n.append(heading,text('div',hit.path+':'+hit.line+' — '),code(hit.text));if(hit.context?.length){const lines=hit.context.map((line)=>{const marker=line.kind==='added'?'+':line.kind==='removed'?'-':' ';const number=line.number?String(line.number).padStart(4,' '):'    ';return marker+' '+number+' | '+line.text}).join('\n');n.append(text('pre',lines));}paintAcknowledged();app.append(n)}
section('AI explanations');if(!report.explanations.length)app.append(text('p','No AI explanations were supplied for this commit.','muted'));for(const item of report.explanations){const n=text('div');n.className='explanation';const chip=text('button',item.title,'chip');chip.type='button';chip.setAttribute('aria-expanded','false');const where=text('span',' '+item.path+':'+item.lineStart+(item.lineEnd!==item.lineStart?'-'+item.lineEnd:''),'muted');const detail=text('p',item.summary);detail.hidden=true;chip.addEventListener('click',()=>{detail.hidden=!detail.hidden;chip.setAttribute('aria-expanded',String(!detail.hidden))});n.append(chip,where,detail);app.append(n)}
section('Verification');const v=text('div');v.className='card';if(report.verification.available){v.append(text('div','Verified by '+report.verification.source+' for '+report.verification.revision,'ok'));for(const check of report.verification.checks){const row=text('div',check.name+': '+check.status);if(check.url){row.append(text('span',' '),code(check.url))}v.append(row)}}else{v.append(text('div',report.verification.error||'No verification report is attached.','muted'))}app.append(v);
section('Changed files');if(!report.files.length)app.append(text('p','No changed files.','muted'));for(const file of report.files){const d=document.createElement('details'),s=text('summary',file.status+' '+file.path);d.append(s);if(file.hunks?.length){const diff=text('div');diff.className='diff';for(const hunk of file.hunks){const block=text('div');block.className='hunk';block.id=hunk.id;block.append(text('div',hunk.header,'hunk-head'));for(const line of hunk.lines){const row=text('div');row.className='diff-line '+line.kind;const marker=line.kind==='added'?'+':line.kind==='removed'?'-':' ';row.append(text('span',line.oldLine||'','gutter'),text('span',line.newLine||'','gutter'),text('span',marker,'mark'),text('span',line.text,'line-code'));block.append(row)}diff.append(block)}d.append(diff)}else if(file.diff){d.append(text('pre',file.diff))}else d.append(text('p','No textual diff available.','muted'));app.append(d)}
