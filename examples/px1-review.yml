name: px1 review artifact

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  checks: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: px1-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head as data
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/px1-pr-head"
          test "$(git rev-parse refs/remotes/origin/px1-pr-head)" = "$HEAD_SHA"

      - name: Collect exact-head GitHub checks
        uses: actions/github-script@v7
        env:
          VERIFICATION_FILE: .px1/verification.json
        with:
          script: |
            const fs = require('fs');
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.HEAD_SHA,
              per_page: 100,
            });
            const names = new Map();
            const checks = runs.map((run) => {
              const baseName = run.name || run.app?.name || 'GitHub check';
              const count = (names.get(baseName) || 0) + 1;
              names.set(baseName, count);
              const name = count === 1 ? baseName : `${baseName} (${count})`;
              let status = 'cancelled';
              if (run.status === 'queued') status = 'queued';
              else if (run.status !== 'completed') status = 'running';
              else if (run.conclusion === 'success' || run.conclusion === 'neutral') status = 'passed';
              else if (['failure', 'timed_out', 'action_required'].includes(run.conclusion)) status = 'failed';
              return {
                name,
                status,
                summary: run.output?.summary || '',
                url: run.html_url || '',
                startedAt: run.started_at || undefined,
                finishedAt: run.completed_at || undefined,
              };
            });
            fs.mkdirSync('.px1', { recursive: true });
            fs.writeFileSync(process.env.VERIFICATION_FILE, `${JSON.stringify({
              source: 'github-actions',
              revision: process.env.HEAD_SHA,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              checks,
            }, null, 2)}\n`);

      - name: Restore immutable report history
        uses: kedarvartak/px1/history@v1
        with:
          mode: restore
          site: site

      - name: Generate commit-pinned report
        uses: kedarvartak/px1@v1
        with:
          base: ${{ env.BASE_SHA }}
          head: ${{ env.HEAD_SHA }}
          root: ${{ github.workspace }}
          verification-file: .px1/verification.json
          out: site/reviews/${{ env.HEAD_SHA }}

      - name: Preserve immutable report history
        uses: kedarvartak/px1/history@v1
        with:
          mode: publish
          site: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update sticky PR comment
        uses: actions/github-script@v7
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- px1-static-review -->';
            const base = process.env.PAGES_URL.endsWith('/')
              ? process.env.PAGES_URL
              : `${process.env.PAGES_URL}/`;
            const report = `${base}reviews/${process.env.HEAD_SHA}/`;
            const body = [
              marker,
              '## px1 review artifact',
              '',
              `Review for commit \`${process.env.HEAD_SHA}\`.`,
              '',
              `[Open the commit-pinned report](${report})`,
            ].join('\n');
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: issue.owner,
                repo: issue.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
