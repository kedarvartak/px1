name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write
  # npm provenance links each published package to this workflow run.
  id-token: write

jobs:
  build-and-release:
    name: Build & Release px1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Bundle Web Assets
        run: |
          node ./scripts/build-web.js

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          # Ensure VERSION file matches the release version
          echo "$VER" > VERSION

      - name: Build Cross-Platform Binaries
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: ./build.sh

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum px1-* > checksums.txt
          cat checksums.txt

      - name: Build npm packages
        run: node scripts/build-npm.js --version ${{ steps.get_version.outputs.version }}

      # Platform packages first: the wrapper lists them as optional dependencies
      # and npm rejects a version whose dependencies do not exist yet. A version
      # already on the registry is skipped, so re-running a release is safe.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish"
            exit 0
          fi
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
              return 0
            fi
            npm publish "$1" --access public --provenance
          }
          for dir in dist-npm/px1-cli-*; do publish "$dir"; done
          publish dist-npm/px1-cli

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/px1-*
            dist/checksums.txt
