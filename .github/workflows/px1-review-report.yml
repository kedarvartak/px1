name: px1 review report

# This workflow intentionally runs on pull_request_target. It checks out the
# trusted base commit and fetches the PR head only as Git objects; it never
# executes source code from the PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  checks: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: px1-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head object
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/px1-pr-head"
          test "$(git rev-parse refs/remotes/origin/px1-pr-head)" = "$HEAD_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Collect GitHub check-run verification
        uses: actions/github-script@v7
        env:
          VERIFICATION_FILE: .px1/verification.json
        with:
          script: |
            const fs = require('fs');
            const runs = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.HEAD_SHA,
                per_page: 100,
              },
            );
            const names = new Map();
            const checks = runs.map((run) => {
              const baseName = run.name || run.app?.name || 'GitHub check';
              const count = (names.get(baseName) || 0) + 1;
              names.set(baseName, count);
              const name = count === 1 ? baseName : `${baseName} (${count})`;
              let status = 'cancelled';
              if (run.status === 'queued') status = 'queued';
              else if (run.status !== 'completed') status = 'running';
              else if (run.conclusion === 'success' || run.conclusion === 'neutral') status = 'passed';
              else if (run.conclusion === 'failure' || run.conclusion === 'timed_out' || run.conclusion === 'action_required') status = 'failed';
              return {
                name,
                status,
                summary: run.output?.summary || '',
                url: run.html_url || '',
                startedAt: run.started_at || undefined,
                finishedAt: run.completed_at || undefined,
              };
            });
            const report = {
              source: 'github-actions',
              revision: process.env.HEAD_SHA,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              checks,
            };
            fs.mkdirSync('.px1', { recursive: true });
            fs.writeFileSync(process.env.VERIFICATION_FILE, `${JSON.stringify(report, null, 2)}\n`);

      - name: Restore historical review reports
        uses: ./history
        with:
          mode: restore
          site: site

      - name: Export commit-pinned report
        uses: ./
        env:
          # Keep the documented name canonical, but accept the repository's
          # existing legacy name so model-backed reports do not fail closed
          # while the secret is being renamed.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API__KEY }}
        with:
          root: .
          base: ${{ env.BASE_SHA }}
          head: ${{ env.HEAD_SHA }}
          verification-file: .px1/verification.json
          explanation-model: gpt-6-luna
          privacy-check: true
          out: site/reviews/${{ env.HEAD_SHA }}

      - name: Preserve historical review reports
        uses: ./history
        with:
          mode: publish
          site: site

      # The documentation site and the impact report are built by the trusted
      # base checkout. The pull request's files are checked out only as data:
      # px1 docs reads Markdown and parses source, and never builds or runs it.
      # This step runs after the report history is validated, and it must
      # never stop the report from being published.
      - name: Build the documentation site
        id: docs
        continue-on-error: true
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          DOCS_COMMENT_FILE: ${{ runner.temp }}/px1-docs-impact.md
        run: |
          set -euo pipefail
          # Until the base commit has the docs command there is nothing to run.
          if ! grep -q 'os.Args\[1\] == "docs"' main.go; then
            echo "::notice title=px1 docs skipped::the base commit has no docs command yet"
            exit 0
          fi
          head_tree="${RUNNER_TEMP}/px1-docs-head"
          build="${RUNNER_TEMP}/px1-docs-build"
          impact="${RUNNER_TEMP}/px1-docs-impact.json"
          git worktree add --detach "$head_tree" "$HEAD_SHA" >/dev/null
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          go build -o "${RUNNER_TEMP}/px1-docs-tool" .
          tool="${RUNNER_TEMP}/px1-docs-tool"
          "$tool" docs impact --root "$head_tree" --base "$merge_base" --head "$HEAD_SHA" --out "$DOCS_COMMENT_FILE"
          "$tool" docs impact --root "$head_tree" --base "$merge_base" --head "$HEAD_SHA" --json --out "$impact"
          "$tool" docs site --root . --out "${build}/docs" \
            --source-url "${REPO_URL}/blob/${BASE_SHA}" --commit "${BASE_SHA:0:7}"
          "$tool" docs site --root "$head_tree" --out "${build}/preview" --impact "$impact" \
            --source-url "${REPO_URL}/blob/${HEAD_SHA}" --commit "${HEAD_SHA:0:7}"
          # Move into the site only when everything was built.
          mkdir -p site/docs-preview
          mv "${build}/docs" site/docs
          mv "${build}/preview" "site/docs-preview/${HEAD_SHA}"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Generate PR summary comment
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          COMMENT_FILE: ${{ runner.temp }}/px1-pr-comment.md
        run: |
          set -euo pipefail
          report_url="${PAGES_URL%/}/reviews/${HEAD_SHA}/"
          go run . summary-comment \
            --review-file "site/reviews/${HEAD_SHA}/review.json" \
            --artifact-url "$report_url" \
            --out "$COMMENT_FILE"

      - name: Update sticky PR comment
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: ${{ runner.temp }}/px1-pr-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- px1-static-review -->';
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
            if (!body.startsWith(marker)) {
              core.setFailed('px1 summary comment is missing its marker');
              return;
            }
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            };
            const comments = await github.paginate(
              github.rest.issues.listComments,
              params,
            );
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: params.owner,
                repo: params.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                body,
              });
            }

      - name: Update the documentation impact comment
        if: steps.docs.outputs.built == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: ${{ runner.temp }}/px1-docs-impact.md
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- px1-docs-impact -->';
            let body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
            if (!body.startsWith(marker)) {
              core.setFailed('px1 docs impact comment is missing its marker');
              return;
            }
            const pages = (process.env.PAGES_URL || '').replace(/\/$/, '');
            if (pages) {
              body += `\n[Preview the documentation for this pull request](${pages}/docs-preview/${process.env.HEAD_SHA}/). The preview is replaced when another pull request is published.\n`;
            }
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: params.owner,
                repo: params.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }
