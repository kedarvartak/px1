name: px1 review report

# This workflow intentionally runs on pull_request_target. It checks out the
# trusted base commit and fetches the PR head only as Git objects; it never
# executes source code from the PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: px1-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head object
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/px1-pr-head"
          test "$(git rev-parse refs/remotes/origin/px1-pr-head)" = "$HEAD_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Export commit-pinned report
        shell: bash
        run: |
          set -euo pipefail
          report_dir="site/reviews/${HEAD_SHA}"
          go run . export-review \
            --root . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --out "$report_dir"
          test -s "$report_dir/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update sticky PR comment
        uses: actions/github-script@v7
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- px1-static-review -->';
            const pagesURL = process.env.PAGES_URL.endsWith('/')
              ? process.env.PAGES_URL
              : `${process.env.PAGES_URL}/`;
            const reportURL = `${pagesURL}reviews/${process.env.HEAD_SHA}/`;
            const body = [
              marker,
              '## px1 review report',
              '',
              `Static review for commit \`${process.env.HEAD_SHA}\`.`,
              '',
              `[Open the commit-pinned report](${reportURL})`,
              '',
              '_Generated by px1; this link changes when the PR head changes._',
            ].join('\n');
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            };
            const comments = await github.paginate(
              github.rest.issues.listComments,
              params,
            );
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: params.owner,
                repo: params.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                body,
              });
            }
