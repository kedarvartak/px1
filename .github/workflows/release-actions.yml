name: Release px1 Actions

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable semantic version tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: px1-action-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate source and Action contracts
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Validate release identity
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like v1.2.3" >&2
            exit 1
          fi
          source_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "v${source_version}" != "$RELEASE_VERSION" ]]; then
            echo "VERSION contains ${source_version}; expected ${RELEASE_VERSION#v}" >&2
            exit 1
          fi
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_VERSION}"; then
            echo "immutable tag ${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          echo "tag=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${RELEASE_VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Publish immutable and major tags
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MAJOR_TAG: ${{ steps.release.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "px1 Actions ${RELEASE_TAG}"
          git tag -fa "$MAJOR_TAG" -m "px1 Actions ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          git push --force origin "refs/tags/${MAJOR_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
