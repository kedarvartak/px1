name: px1 PR review artifact
description: Understand the code your agent wrote before you merge it, with a static report for human review.
author: px1

inputs:
  base:
    description: Full base commit SHA.
    required: true
  head:
    description: Full pull-request head commit SHA.
    required: true
  root:
    description: Repository checkout to inspect.
    required: false
    default: ${{ github.workspace }}
  out:
    description: Directory where the static report is written.
    required: false
    default: .px1-review
  verification-file:
    description: Optional exact-revision verification JSON file.
    required: false
    default: ''
  explanations-file:
    description: Optional commit-pinned explanation JSON file.
    required: false
    default: ''
  explanation-model:
    description: Optional OpenAI model used to generate explanations. Sends bounded, non-excluded diff content to the configured endpoint and requires OPENAI_API_KEY in the caller environment.
    required: false
    default: ''
  explanation-endpoint:
    description: Responses API endpoint used when explanation-model is set.
    required: false
    default: https://api.openai.com/v1/responses
  explanation-exclude-globs:
    description: Optional newline-separated repository globs omitted from AI input. Exclusion is not redaction.
    required: false
    default: ''
  privacy-check:
    description: Fail when the generated report contains high-confidence secret signatures or sensitive paths. This check is not redaction or access control.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Generate px1 review artifact
      shell: bash
      env:
        PX1_BASE: ${{ inputs.base }}
        PX1_HEAD: ${{ inputs.head }}
        PX1_ROOT: ${{ inputs.root }}
        PX1_OUT: ${{ inputs.out }}
        PX1_VERIFICATION_FILE: ${{ inputs.verification-file }}
        PX1_EXPLANATIONS_FILE: ${{ inputs.explanations-file }}
        PX1_EXPLANATION_MODEL: ${{ inputs.explanation-model }}
        PX1_EXPLANATION_ENDPOINT: ${{ inputs.explanation-endpoint }}
        PX1_EXPLANATION_EXCLUDE_GLOBS: ${{ inputs.explanation-exclude-globs }}
        PX1_PRIVACY_CHECK: ${{ inputs.privacy-check }}
      run: |
        set -euo pipefail
        if [[ -n "$PX1_EXPLANATIONS_FILE" && -n "$PX1_EXPLANATION_MODEL" ]]; then
          echo "px1: use explanations-file or explanation-model, not both" >&2
          exit 2
        fi
        if [[ -n "$PX1_EXPLANATION_MODEL" ]]; then
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "px1: explanation-model requires OPENAI_API_KEY" >&2
            exit 2
          fi
          echo "::warning title=px1 model transfer::AI explanations send bounded, non-excluded pull-request diff content to the configured model endpoint. Exclusion globs are not redaction."
          PX1_EXPLANATIONS_FILE="${RUNNER_TEMP:-/tmp}/px1-explanations-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}.json"
          explanation_args=(
            generate-explanations
            --base "$PX1_BASE"
            --head "$PX1_HEAD"
            --root "$PX1_ROOT"
            --out "$PX1_EXPLANATIONS_FILE"
            --model "$PX1_EXPLANATION_MODEL"
            --endpoint "$PX1_EXPLANATION_ENDPOINT"
          )
          while IFS= read -r pattern || [[ -n "$pattern" ]]; do
            [[ -z "$pattern" ]] || explanation_args+=(--exclude-glob "$pattern")
          done <<< "$PX1_EXPLANATION_EXCLUDE_GLOBS"
          (cd "$GITHUB_ACTION_PATH" && go run . "${explanation_args[@]}")
        fi
        args=(
          export-review
          --base "$PX1_BASE"
          --head "$PX1_HEAD"
          --root "$PX1_ROOT"
          --out "$PX1_OUT"
        )
        if [[ -n "$PX1_VERIFICATION_FILE" ]]; then
          args+=(--verification-file "$PX1_VERIFICATION_FILE")
        fi
        if [[ -n "$PX1_EXPLANATIONS_FILE" ]]; then
          args+=(--explanations-file "$PX1_EXPLANATIONS_FILE")
        fi
        (cd "$GITHUB_ACTION_PATH" && go run . "${args[@]}")
        case "$PX1_PRIVACY_CHECK" in
          true)
            (cd "$GITHUB_ACTION_PATH" && go run . privacy-check --review-file "$PX1_OUT/review.json")
            ;;
          false)
            echo "::warning title=px1 privacy check disabled::The report was not checked for likely secret signatures or sensitive paths. Delivery visibility remains your responsibility."
            ;;
          *)
            echo "px1: privacy-check must be true or false" >&2
            exit 2
            ;;
        esac
        (cd "$GITHUB_ACTION_PATH" && cd "$PX1_OUT" && sha256sum --check checksums.sha256)
        test -s "$PX1_OUT/index.html"
        test -s "$PX1_OUT/review.json"
        test -s "$PX1_OUT/checksums.sha256"

branding:
  icon: eye
  color: orange
